# lychee link-checker config (auto-read from repo root on every run).
# Publishers (DOIs, journals) return 403/429 to non-browser clients even though
# the links work fine for readers. Accept those; genuine dead links still 404/410.
# PubMed answers 203 ("Non Authoritative Information") to the same clients; the
# pages are fine, so 203 is accepted too.
accept = [200, 203, 206, 403, 429]
user_agent = "Mozilla/5.0 (compatible; lychee)"

# The tables in _generated/ are included into pages in the repo root, so their
# internal links are relative to that page, not to _generated/. lychee resolves
# them from _generated/ and reports them as missing files. check-guide checks
# those internal links properly, so skip only them here; the external links in
# the generated tables are still checked.
exclude = ['^file://.*/_generated/']
