# Search synonyms for "Search the guide".
#
# The problem this solves: the built-in search matches literal text, so a reader
# who types what they are trying to do finds nothing, because the guide uses the
# register's word for it. "Moves abroad" is emigration. "Dropped out" is an
# interrupted education. And the readers are Danish while the guide is English,
# so half the words they reach for are the wrong language.
#
# How it works: every term on a line is treated as the same term. Type any one
# of them and the search looks for all of them. It expands single words, not
# whole sentences, so word order and phrasing do not matter.
#
# How to add one: put the words on one line, separated by commas, and say in a
# comment why. Add a synonym when a search that should have worked did not - the
# feedback box at the bottom of each page is where those show up.
#
# Keep the Danish word first where there is one: that is the word a reader
# types, and the English one is what the guide actually says.
#
# Write the STEM, not the full word, where Danish inflects: "censur" reaches
# censurering, censurerer and censureret. Matching is by prefix in either
# direction, with a floor of four characters, so a stem shorter than that stays
# literal.
#
# Keep groups tight. Every term expands to every other term in its group, so a
# group that mixes two concepts makes both of them harder to find.

groups:
  # --- Error messages -------------------------------------------------------
  # People paste the error they just got. These point at the pitfalls page and
  # the troubleshooting tables rather than at whatever page happens to contain
  # the same English words.
  - [column not found, object not found, findes ikke, not found, unknown column, rename_with, tolower]
  - [could not find function, kunne ikke finde, function not found, library, package not loaded]
  - [non-numeric argument, binary operator, character, as.date, date format, datoformat]
  - [closure is not subsettable, closure, overwrote, overskrevet, magic numbers]
  - [cannot allocate, allocate vector, out of memory, memory, hukommelse, ram, for stor, too large]
  - [differing number of rows, arguments imply, row mismatch, flere raekker, duplicate rows]
  - [bang-bang, "!!", lazy, lazy evaluation, dbplyr, collect, not evaluated]
  - [zero rows, ingen raekker, empty result, tomt resultat, no rows returned]
  - [error, fejl, fejlbesked, error message, troubleshooting, does not work, virker ikke]

  # --- Migration and residence ----------------------------------------------
  - [udvandr, udland, emigration, emigrate, moved abroad, leaves denmark, vnds]
  - [indvandr, immigration, immigrate, moved to denmark, indud_kode]
  - [flytn, flytte, moving, moved, address change, adresseskift]
  - [bopæl, bopel, residence, resident, living in denmark, address, adresse]

  # --- Follow-up and time ---------------------------------------------------
  - [censur, censoring, censor, lost to follow-up, end of follow-up]
  - [opfølgning, followup, follow-up, at risk, risk time, person-years, persontid]
  - [indeksdato, index date, baseline, study entry, start of follow-up, studiestart]
  - [immortal time, immortal time bias, udoedelig, guarantee time]
  - [washout, wash-out, lag time, run-in, karensperiode, new user, incident user]
  - [tidsvarierende, time-varying, time varying, changes over time, tidsafhaengig]

