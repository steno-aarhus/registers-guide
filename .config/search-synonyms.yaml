  # so anything about death should reach that pitfall.
  - [død, doed, dod, death, died, mortality, doddato, afdød, dodsdato]
  - [dødsårsag, doedsaarsag, cause of death, dodsaars, dodsaasg, dodsaarsager, underlying cause]

