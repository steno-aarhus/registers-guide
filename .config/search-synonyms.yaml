# Search synonyms for "Search the guide".
#
# The problem this solves: the built-in search matches literal text, so a reader
# who types what they are trying to do finds nothing, because the guide uses the
# register's word for it. "Moves abroad" is emigration. "Dropped out" is an
# interrupted education. And the readers are Danish while the guide is English,
# so half the words they reach for are the wrong language.
#
# How it works: every term on a line is treated as the same term. Type any one
# of them and the search looks for all of them. It expands single words, not
# whole sentences, so word order and phrasing do not matter.
#
# How to add one: put the words on one line, separated by commas, and say in a
# comment why. Add a synonym when a search that should have worked did not - the
# feedback box at the bottom of each page is where those show up.
#
# Keep the Danish word first where there is one: that is the word a reader
# types, and the English one is what the guide actually says.
#
# Write the STEM, not the full word, where Danish inflects: "censur" reaches
# censurering, censurerer and censureret. Matching is by prefix in either
# direction, with a floor of four characters, so a stem shorter than that stays
# literal.

groups:
  # Migration and residence
  - [udvandr, udland, emigration, emigrate, moved abroad, leaves denmark, vnds]
  - [indvandr, immigration, immigrate, moved to denmark, indud_kode]
  - [bopæl, bopel, residence, resident, living in denmark, address]

  # Follow-up and time
  - [censur, censoring, censor, lost to follow-up, end of follow-up]
  - [opfølgning, followup, follow-up, at risk, risk time, person-years]
  - [indeksdato, index date, baseline, study entry, start of follow-up]
  - [død, doed, dod, death, died, mortality, doddato]

  # Study design
  - [kohorte, cohort, study population, studiepopulation]
  - [match, matching, matched, comparison cohort, sammenligningskohorte, kontrolgruppe]
  - [case-kontrol, case control, nested case-control, kontrolgruppe]
  - [konfounder, confounder, confounding, adjustment, adjust for]

  # Exposure and outcome
  - [medicin, lægemiddel, laegemiddel, medication, drug, prescription, recept, lmdb, atc]
  - [diagnose, diagnosis, icd, icd-10, sygdom, disease, lpr]
  - [operation, procedure, surgery, kirurgi, sks, c_opr]
  - [komorbiditet, comorbidity, charlson, multimorbidity, baseline disease]
  - [laboratorie, blodprøve, blodproeve, lab, laboratory, blood test, npu, analysiscode]

  # Socioeconomic
  - [uddannelse, education, hfaudd, disced, udda, skolegang]
  - [indkomst, income, faik, disponibel, salary, løn, loen]
  - [beskæftigelse, beskaeftigelse, employment, job, work, socio, socio13, akm]
  - [civilstand, marital status, civst, married, gift]

  # Data work
  - [kobl, join, merge, sammenkobling, left_join, flet]
  - [lang, bred, long, wide, pivot, reshape, transponer]
  - [manglende, missing, na, imputation, imputering]
  - [dublet, duplicate, duplikat, distinct, deduplicate]
  - [dato, date, datoformat, as.date, date format]
  - [hukommelse, memory, ram, too large, for stor, out of memory, collect]

  # Analysis
  - [overlevelse, survival, cox, time-to-event, hazard, kaplan-meier]
  - [konkurrerende risiko, competing risk, competing risks, cumulative incidence]
  - [rate, incidens, incidence, poisson, person-time]
  - [regression, model, logistic, linear, odds ratio, estimat]
  - [tabel 1, table 1, baseline table, deskriptiv, descriptive, tableone]

  # Practicalities
  - [udtræk, udtraek, extraction, extract, order data, bestille data]
  - [eksport, export, repatriation, take data out, hjemtagelse]
  - [pakke, package, install, installere, library]
  - [parquet, sas, sas7bdat, file format, filformat, convert]
