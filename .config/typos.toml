[files]
extend-exclude = [
  "*.html",
  "*.css",
  ".quarto/*",
  "_site/*",
  "*.svg",
  "tools/*.R",   # same reason: scripts with Danish comments (blok, komma, funktion ...)
  ".config/*.txt"
]

[default.extend-words]
# Danish words and technical terms, plus code tokens from the guide (variable
# names, anchor ids, filenames, DST format tables, ATC codes, quoted example
# values). None of these are misspellings.
alle = "alle"
objekt = "objekt"
registre = "registre"
tekst = "tekst"
formater = "formater"
Fase = "Fase"
fase = "fase"
Fane = "Fane"
titel = "titel"
tabel = "tabel"
som = "som"
separat = "separat"
selv = "selv"
holdes = "holdes"
foldes = "foldes"
negativ = "negativ"
sav = "sav"        # .sav (SPSS-filendelse) og read_sav()
BA = "BA"          # ATC-kode-fragment, fx A10BA02 (metformin)
PN = "PN"          # fra "PNRs"
adresse = "adresse"  # DST variable name adresse_id (VNDS), not the English word
mor = "mor"          # DST variable name mor_id (BEF): moderens person id
familier = "familier"  # Danish plural in the BEF label "Antal E-familier i husstanden"
periode = "periode"  # from the BEF label "Referencetidspunkt eller -periode"
Branche = "Branche"  # Danish for industry, in DST labels like "Branche for vaesentligste beskaeftigelse"
