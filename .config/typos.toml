[files]
extend-exclude = [
  "*.html",
  "*.css",
  ".quarto/*",
  "_site/*",
  "*.svg",
  "tools/*.R",   # same reason: scripts with Danish comments (blok, komma, funktion ...)
  ".config/*.txt",
  # Generated from the guide itself, which is already spell-checked. It holds
  # truncated snippets and the Danish stems from search-synonyms.yaml.
  "assets/search-index.json"
]

[default.extend-words]
# Danish words and technical terms, plus code tokens from the guide (variable
# names, anchor ids, filenames, DST format tables, ATC codes, quoted example
# values). None of these are misspellings.
alle = "alle"
objekt = "objekt"
registre = "registre"
tekst = "tekst"
formater = "formater"
Fase = "Fase"
fase = "fase"
Fane = "Fane"
titel = "titel"
tabel = "tabel"
som = "som"
separat = "separat"
selv = "selv"
holdes = "holdes"
foldes = "foldes"
negativ = "negativ"
sav = "sav"        # .sav (SPSS-filendelse) og read_sav()
BA = "BA"          # ATC-kode-fragment, fx A10BA02 (metformin)
PN = "PN"          # fra "PNRs"
adresse = "adresse"  # DST variable name adresse_id (VNDS), not the English word
mor = "mor"          # DST variable name mor_id (BEF): moderens person id
familier = "familier"  # Danish plural in the BEF label "Antal E-familier i husstanden"
periode = "periode"  # from the BEF label "Referencetidspunkt eller -periode"
Branche = "Branche"  # Danish for industry, in DST labels like "Branche for vaesentligste beskaeftigelse"
Lokale = "Lokale"    # Danish, from esundhed's format vocabulary "Lokale Koder"
# Danish words in DST's own variable labels, copied verbatim from the order list
Variabel = "Variabel"
blok = "blok"
operatio = "operatio"   # from the variable name C_OPERATIO (DODSAARS)
Patientens = "Patientens"      # Danish, from the cancer register's labels
Medicinske = "Medicinske"      # "Det Medicinske Foedselsregister"
medicinske = "medicinske"
MEDICINSKE = "MEDICINSKE"      # MFR variable name MARKOER_MEDICINSKE_SYGDOMME
POSITIV = "POSITIV"            # a literal value in the laboratory register
# Danish stems in .config/search-synonyms.yaml. They are deliberately not whole
# words: the search matches by prefix so "censur" reaches censurering.
censur = "censur"
doed = "doed"
# Danish search terms in .config/search-synonyms.yaml
finde = "finde"
funktion = "funktion"
makro = "makro"
