project:
  type: website
  output-dir: _site

website:
  site-url: "https://steno-aarhus.github.io/registers-guide"
  repo-url: "https://github.com/steno-aarhus/registers-guide"
  title: "Register-based research at Statistics Denmark"
  description: "Guide to register-based cohort studies at Statistics Denmark (DST)"
  search: true
  page-navigation: true
  back-to-top-navigation: true
  bread-crumbs: true
  repo-actions: ["edit", "source", "issue"]

  announcement:
    content: "Guide under active development - content is continuously added and revised."
    type: light
    dismissable: true
    position: below-navbar

  navbar:
    # Brand-titlen linker selv til forsiden, så et separat Home-punkt er overflødigt.
    right:
      - icon: globe
        text: "Steno Aarhus"
        href: "https://steno-aarhus.github.io"
        aria-label: "Steno Aarhus: project overview"
    tools:
      - icon: github
        href: "https://github.com/steno-aarhus/registers-guide"
        aria-label: "GitHub: source code"

  sidebar:
    - title: "Contents"
      style: "floating"
      # 2 = the five stages start expanded; the phase sub-lists inside them
      # (9, 10, 11, 12, 13, Algorithms) start folded. All of them can be
      # folded and unfolded by the reader.
      collapse-level: 2
      contents:
        - text: "Overview"
          href: index.qmd

        - section: "Get started · 1-3"
          contents:
            - text: "1 - Plan your study"
              href: 01_plan-your-study.qmd
            - text: "2 - R: the bare essentials"
              href: 02_r-intro.qmd
            - text: "3 - Log in to DST"
              href: 03_log-in-dst.qmd

        - section: "Get your data · 4-8"
          contents:
            - text: "4 - File types and loading"
              href: 04_file-formats.qmd
            - text: "5 - Extracting data step by step"
              href: 05_extraction-step-by-step.qmd
            - text: "6 - First extraction"
              href: 06_first-extraction.qmd
            - text: "7 - Inspect your data"
              href: 07_inspect-data.qmd
            - text: "8 - Find your registers"
              href: 08_find-your-registers.qmd

        - section: "Build the study · 9-10"
          contents:
            - section: "9 - Hospital contacts (LPR)"
              href: 09a_understand-lpr.qmd
              contents:
                - 09b_extract-from-lpr.qmd

            - section: "10 - Build your study population"
              href: 10_build-study-population.qmd
              contents:
                - 10a_comparison-cohort.qmd
                - 10b_case-control.qmd
                - 10c_special-designs.qmd

        - section: "Variables and dataset · 11-12"
          contents:
            - section: "11 - Extract variables"
              href: 11_extract-variables.qmd
              contents:
                - 11a_outcomes.qmd
                - 11b_socioeconomic-variables.qmd
                - 11c_comorbidity.qmd
                - 11d_medication.qmd

            - section: "12 - Assemble and prepare the dataset"
              href: 12_data-manipulation.qmd
              contents:
                - 12a_long-wide.qmd
                - 12b_joins.qmd
                - 12c_missing-data.qmd
                - 12d_time-varying.qmd

        - section: "Analyse and finish · 13-14"
          contents:
            - section: "13 - Analysis"
              href: 13_analysis.qmd
              contents:
                - 13a_choosing-analysis.qmd
                - 13b_descriptive-tables.qmd
                - 13c_figures.qmd
                - 13d_regression.qmd
                - 13e_time-to-event.qmd
                - 13f_rates-poisson.qmd
                - 13g_weighting-iptw.qmd
                - 13h_sensitivity-analyses.qmd
                - 13i_substitution.qmd

            - text: "14 - Export and repatriation"
              href: 14_export.qmd

        - section: "Look-ups"
          contents:
            - text: "Functions: overview"
              href: function-guide.qmd
            - text: "Format tables"
              href: formatting-tables.qmd
            - text: "DST pitfalls"
              href: dst-pitfalls.qmd
            - text: "Overview of registers"
              href: register-reference.qmd
            - text: "Good coding practice"
              href: good-coding-practice.qmd

            - section: "Algorithms & special packages"
              href: packages-overview.qmd
              contents:
                - osdc.qmd
                - nmi.qmd

            - text: "Learning resources"
              href: learning-resources.qmd

        - section: "DARTER - Project 708421"
          href: darter/00_index.qmd
          contents:
            - darter/01_register-paths-datastores.qmd
            - darter/02_darter-pitfalls.qmd

        - text: "Want to help?"
          href: contribute.qmd

  page-footer:
    left: "Steno Diabetes Center Aarhus · Sara Schwartz · [saras@clin.au.dk](mailto:saras@clin.au.dk)"
    right: "[Errors or suggestions?](mailto:saras@clin.au.dk)"

format:
  html:
    # Besøgsstatistik via GoatCounter
    # Dashboard: https://dsthelp.goatcounter.com
    include-in-header:
      - text: |
          <script data-goatcounter="https://dsthelp.goatcounter.com/count"
                  async src="//gc.zgo.at/count.js"></script>
    # Feedback-widget → Cloudflare Worker + D1.
    # Markup/JS i assets/_feedback.html, styling i assets/custom.scss.
    include-after-body:
      - file: assets/_feedback.html
      - file: assets/_open-details.html
    theme:
      - flatly
      - assets/custom.scss
    smooth-scroll: true
    toc: true
    toc-depth: 3
    toc-title: "On this page"
    highlight-style: github
    code-fold: false
    callout-appearance: simple

    lightbox: true
    mermaid:
      theme: neutral
