project:
  type: website
  output-dir: _site
  # Render everything EXCEPT the schema. Those files are source material for the
  # generated tables, not pages. Without this, schema/README.md and
  # schema/REVIEW.md become public pages on the guide - which is exactly how
  # HELP-WANTED.md ended up live, in Danish and out of date, with nothing
  # linking to it. Any loose .md in the repo is published by default.
  render:
    - "**/*.qmd"
    - "**/*.md"
    - "!schema/"
    - "!_ignore/"

  resources:
    # CNAME tells GitHub Pages to serve the site on registerguide.org. quarto
    # publish wipes gh-pages on every publish, so CNAME has to be copied in on
    # every build or the custom domain is dropped.
    - "CNAME"
    # Fetched by the browser on the "Find a variable" page, so it has to be
    # copied into _site even though nothing links to it as a page.
    - "assets/variables.json"
    - "assets/search-index.json"
    # Larger favicons, linked from the page header (see format: html: below).
    - "assets/favicon-192.png"
    - "assets/apple-touch-icon.png"

# The built-in search matches literal text. These two say so, and point at the
# page that does not, exactly when a reader needs to hear it.
language:
  # The date under each title is the page's last commit (set in
  # build-website.yml), so call it that instead of "Published".
  title-block-published: "Last modified"
  search-text-placeholder: "Search exact words"
  search-no-results-text: "No results. Try Search by meaning in the top bar: it also looks for synonyms and Danish words."

website:
  site-url: "https://registerguide.org"
  repo-url: "https://github.com/steno-aarhus/registers-guide"
  # Short site name. Quarto adds it after every page title in Google and the
  # browser tab ("Understand LPR - Register Guide"). The long name pushed the
  # useful words out of Google results, which cut titles at about 60 characters.
  title: "Register Guide"
  description: "Guide to register-based cohort studies at Statistics Denmark (DST)"
  # Quarto's own search (the magnifying glass). Many sections have the same
  # heading on different pages ("Next steps", "Step 1 - ..."), so each result
  # shows the sidebar section its page sits in, to tell them apart.
  search:
    show-item-context: parent
  page-navigation: true
  back-to-top-navigation: true
  bread-crumbs: true
  repo-actions: ["edit", "source", "issue"]
  # Adds og: tags, so a link shared in Teams, Slack or email shows the page
  # title and its description instead of a bare URL.
  open-graph: true
  # Browser-tab icon, also the icon Google shows next to the site in search
  # results (without one it shows a grey globe). Kept in the repo root because
  # browsers and crawlers ask for /favicon.ico even when no page links to it.
  # The file holds three sizes (16, 32, 48 px); the 16 px one is drawn pixel by
  # pixel so it stays sharp, and the browser picks the size it needs.
  favicon: favicon.ico

  # A dated line reads as a maintained guide; "under active development" read
  # as unfinished. Change the month when the guide is reviewed again.
  announcement:
    content: "Last reviewed November 2026. Found something wrong or out of date? Use the feedback box on the page."
    type: light
    dismissable: true
    position: below-navbar

  navbar:
    # The full name stays in the navbar, where there is room for it.
    title: "Register-based research at Statistics Denmark"
    # The brand title already links to the front page, so a separate Home entry
    # would be redundant.
    right:
      # Deliberately NOT icon: search. It sits next to Quarto's own search box,
      # and two magnifying glasses side by side read as two ways to do the same
      # thing. This one is the fallback for when you do not know the word.
      # No aria-label: a screen reader should announce the same name the
      # reader sees ("Search by meaning"), which is what voice control
      # users will say to click it.
      - icon: lightbulb
        text: "Search by meaning"
        href: search.qmd
      - icon: globe
        text: "Steno Aarhus"
        href: "https://steno-aarhus.github.io"
        aria-label: "Steno Aarhus: project overview"
    tools:
      - icon: github
        href: "https://github.com/steno-aarhus/registers-guide"
        aria-label: "GitHub: source code"

  sidebar:
    - title: "Contents"
      style: "floating"
      # 2 = the five stages start expanded; the phase sub-lists inside them
      # (9, 10, 11, 12, 13, Algorithms) start folded. All of them can be
      # folded and unfolded by the reader.
      collapse-level: 2
      contents:
        - text: "Overview"
          href: index.qmd

        - section: "Get started · 1-3"
          contents:
            - text: "1 - Plan your study"
              href: plan-your-study.qmd
            - text: "2 - R: the bare essentials"
              href: r-intro.qmd
            - text: "3 - Log in to DST"
              href: log-in-dst.qmd

        - section: "Get your data · 4-8"
          contents:
            - text: "4 - File types and loading"
              href: file-formats.qmd
            - text: "5 - Extracting data step by step"
              href: extraction-step-by-step.qmd
            - text: "6 - First extraction"
              href: first-extraction.qmd
            - text: "7 - Inspect your data"
              href: inspect-data.qmd
            - text: "7b - Check your delivery"
              href: delivery-check.qmd
            - text: "8 - Find your registers"
              href: find-your-registers.qmd

        - section: "Build the study · 9-10"
          contents:
            - section: "9 - Hospital contacts (LPR)"
              href: understand-lpr.qmd
              contents:
                - extract-from-lpr.qmd

            - section: "10 - Build your study population"
              href: build-study-population.qmd
              contents:
                - comparison-cohort.qmd
                - case-control.qmd
                - special-designs.qmd
                - family-links.qmd

        - section: "Variables and dataset · 11-12"
          contents:
            - section: "11 - Extract variables"
              href: extract-variables.qmd
              contents:
                - outcomes.qmd
                - socioeconomic-variables.qmd
                - immigrants-and-descendants.qmd
                - comorbidity.qmd
                - medication.qmd
                - hospital-medication.qmd
                - healthcare-costs.qmd
                - laboratory-results.qmd

            - section: "12 - Assemble and prepare the dataset"
              href: data-manipulation.qmd
              contents:
                - long-wide.qmd
                - joins.qmd
                - missing-data.qmd
                - time-varying.qmd

        - section: "Analyse and finish · 13-14"
          contents:
            - section: "13 - Analysis"
              href: analysis.qmd
              contents:
                - choosing-analysis.qmd
                - descriptive-tables.qmd
                - figures.qmd
                - regression.qmd
                - time-to-event.qmd
                - rates-poisson.qmd
                - weighting-iptw.qmd
                # TODO(Sara): placement
                - analysing-costs.qmd
                - sensitivity-analyses.qmd

            - text: "14 - Export and repatriation"
              href: export.qmd

        # Ordered by how a reader reaches for them: search first, then the
        # register pages, which cross-link to each other and to the format
        # tables (what a code means is the question right after finding it).
        - section: "Look-ups"
          contents:
            - text: "Search by meaning"
              href: search.qmd
            - text: "Overview of registers"
              href: register-reference.qmd
            - text: "Find a variable"
              href: find-a-variable.qmd
            - text: "Format tables"
              href: formatting-tables.qmd
            # Setup, not analysis: done once per project, often by one person.
            # Off the numbered path so phase 4 stays about opening files.
            - text: "Parquet and fastreg"
              href: parquet-and-fastreg.qmd
            - text: "Functions: overview"
              href: function-guide.qmd
            - text: "Good coding practice"
              href: good-coding-practice.qmd
            # Two different situations, deliberately two pages: pitfalls is
            # "the code ran and the answer is wrong", troubleshooting is
            # "the code stopped, or gave me nothing".
            - text: "DST pitfalls"
              href: dst-pitfalls.qmd
            - text: "Troubleshooting"
              href: troubleshooting.qmd

            - section: "Algorithms & special packages"
              href: packages-overview.qmd
              contents:
                - osdc.qmd
                - nmi.qmd

            - text: "Learning resources"
              href: learning-resources.qmd

        - section: "DARTER - Project 708421"
          href: darter-index.qmd
          contents:
            - darter-register-paths-datastores.qmd
            - darter-pitfalls.qmd

        - text: "Want to help?"
          href: contribute.qmd

  page-footer:
    left: "Steno Diabetes Center Aarhus · Sara Schwartz · [saras@clin.au.dk](mailto:saras@clin.au.dk)"
    # Says openly that visits are counted. GoatCounter sets no cookies, so no
    # consent banner is needed, but readers should still be able to see it.
    center: "Visits are counted with [GoatCounter](https://www.goatcounter.com), without cookies."
    right: "[Errors or suggestions?](mailto:saras@clin.au.dk)"

format:
  html:
    # Visitor statistics via GoatCounter
    # Dashboard: https://dsthelp.goatcounter.com
    include-in-header:
      - text: |
          <script data-goatcounter="https://dsthelp.goatcounter.com/count"
                  async src="//gc.zgo.at/count.js"></script>
      # Larger versions of the favicon: 192 px for Google and Android, and a
      # square 180 px icon for iPhone/iPad home screens (iOS rounds the corners
      # itself, so this one has none). Both files are listed under resources.
      - text: |
          <link rel="icon" type="image/png" sizes="192x192" href="/assets/favicon-192.png">
          <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
    # Feedback widget -> Cloudflare Worker + D1.
    # Markup/JS in assets/_feedback.html, styling in assets/custom.scss.
    include-after-body:
      - file: assets/_feedback.html
      - file: assets/_open-details.html
    theme:
      - flatly
      - assets/custom.scss
    smooth-scroll: true
    toc: true
    toc-depth: 3
    toc-title: "On this page"
    highlight-style: github
    code-fold: false
    callout-appearance: simple

    lightbox: true
    mermaid:
      theme: neutral
