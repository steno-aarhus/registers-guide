project:
  type: website
  output-dir: _site
  # Render everything EXCEPT the schema. Those files are source material for the
  # generated tables, not pages. Without this, schema/README.md and
  # schema/REVIEW.md become public pages on the guide - which is exactly how
  # HELP-WANTED.md ended up live, in Danish and out of date, with nothing
  # linking to it. Any loose .md in the repo is published by default.
  render:
    - "**/*.qmd"
    - "**/*.md"
    - "!schema/"
    - "!_ignore/"

  # Fetched by the browser on the "Find a variable" page, so it has to be copied
  # into _site even though nothing links to it as a page.
  resources:
    - "assets/variables.json"
    - "assets/search-index.json"

# The built-in search matches literal text. These two say so, and point at the
# page that does not, exactly when a reader needs to hear it.
language:
  search-text-placeholder: "Search exact words"
  search-no-results-text: "No results. Try Search the guide, which also matches meaning and Danish."

website:
  site-url: "https://steno-aarhus.github.io/registers-guide"
  repo-url: "https://github.com/steno-aarhus/registers-guide"
  title: "Register-based research at Statistics Denmark"
  description: "Guide to register-based cohort studies at Statistics Denmark (DST)"
  search: true
  page-navigation: true
  back-to-top-navigation: true
  bread-crumbs: true
  repo-actions: ["edit", "source", "issue"]

  announcement:
    content: "Guide under active development - content is continuously added and revised."
    type: light
    dismissable: true
    position: below-navbar

  navbar:
    # The brand title already links to the front page, so a separate Home entry
    # would be redundant.
    right:
      - icon: search
        text: "Search the guide"
        href: search.qmd
        aria-label: "Search the guide by meaning"
      - icon: globe
        text: "Steno Aarhus"
        href: "https://steno-aarhus.github.io"
        aria-label: "Steno Aarhus: project overview"
    tools:
      - icon: github
        href: "https://github.com/steno-aarhus/registers-guide"
        aria-label: "GitHub: source code"

  sidebar:
    - title: "Contents"
      style: "floating"
      # 2 = the five stages start expanded; the phase sub-lists inside them
      # (9, 10, 11, 12, 13, Algorithms) start folded. All of them can be
      # folded and unfolded by the reader.
      collapse-level: 2
      contents:
        - text: "Overview"
          href: index.qmd

        - section: "Get started · 1-3"
          contents:
            - text: "1 - Plan your study"
              href: plan-your-study.qmd
            - text: "2 - R: the bare essentials"
              href: r-intro.qmd
            - text: "3 - Log in to DST"
              href: log-in-dst.qmd

        - section: "Get your data · 4-8"
          contents:
            - text: "4 - File types and loading"
              href: file-formats.qmd
            - text: "5 - Extracting data step by step"
              href: extraction-step-by-step.qmd
            - text: "6 - First extraction"
              href: first-extraction.qmd
            - text: "7 - Inspect your data"
              href: inspect-data.qmd
            - text: "8 - Find your registers"
              href: find-your-registers.qmd

        - section: "Build the study · 9-10"
          contents:
            - section: "9 - Hospital contacts (LPR)"
              href: understand-lpr.qmd
              contents:
                - extract-from-lpr.qmd

            - section: "10 - Build your study population"
              href: build-study-population.qmd
              contents:
                - comparison-cohort.qmd
                - case-control.qmd
                - special-designs.qmd

        - section: "Variables and dataset · 11-12"
          contents:
            - section: "11 - Extract variables"
              href: extract-variables.qmd
              contents:
                - outcomes.qmd
                - socioeconomic-variables.qmd
                - comorbidity.qmd
                - medication.qmd

            - section: "12 - Assemble and prepare the dataset"
              href: data-manipulation.qmd
              contents:
                - long-wide.qmd
                - joins.qmd
                - missing-data.qmd
                - time-varying.qmd

        - section: "Analyse and finish · 13-14"
          contents:
            - section: "13 - Analysis"
              href: analysis.qmd
              contents:
                - choosing-analysis.qmd
                - descriptive-tables.qmd
                - figures.qmd
                - regression.qmd
                - time-to-event.qmd
                - rates-poisson.qmd
                - weighting-iptw.qmd
                - sensitivity-analyses.qmd
                - substitution.qmd

            - text: "14 - Export and repatriation"
              href: export.qmd

        # Ordered by how a reader reaches for them: search first, then the
        # register pages, which cross-link to each other and to the format
        # tables (what a code means is the question right after finding it).
        - section: "Look-ups"
          contents:
            - text: "Search the guide"
              href: search.qmd
            - text: "Overview of registers"
              href: register-reference.qmd
            - text: "Find a variable"
              href: find-a-variable.qmd
            - text: "Format tables"
              href: formatting-tables.qmd
            - text: "Functions: overview"
              href: function-guide.qmd
            - text: "Good coding practice"
              href: good-coding-practice.qmd
            - text: "DST pitfalls"
              href: dst-pitfalls.qmd

            - section: "Algorithms & special packages"
              href: packages-overview.qmd
              contents:
                - osdc.qmd
                - nmi.qmd

            - text: "Learning resources"
              href: learning-resources.qmd

        - section: "DARTER - Project 708421"
          href: darter-index.qmd
          contents:
            - darter-register-paths-datastores.qmd
            - darter-pitfalls.qmd

        - text: "Want to help?"
          href: contribute.qmd

  page-footer:
    left: "Steno Diabetes Center Aarhus · Sara Schwartz · [saras@clin.au.dk](mailto:saras@clin.au.dk)"
    right: "[Errors or suggestions?](mailto:saras@clin.au.dk)"

format:
  html:
    # Visitor statistics via GoatCounter
    # Dashboard: https://dsthelp.goatcounter.com
    include-in-header:
      - text: |
          <script data-goatcounter="https://dsthelp.goatcounter.com/count"
                  async src="//gc.zgo.at/count.js"></script>
    # Feedback widget -> Cloudflare Worker + D1.
    # Markup/JS in assets/_feedback.html, styling in assets/custom.scss.
    include-after-body:
      - file: assets/_feedback.html
      - file: assets/_open-details.html
    theme:
      - flatly
      - assets/custom.scss
    smooth-scroll: true
    toc: true
    toc-depth: 3
    toc-title: "On this page"
    highlight-style: github
    code-fold: false
    callout-appearance: simple

    lightbox: true
    mermaid:
      theme: neutral
