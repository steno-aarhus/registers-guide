<!-- Auto-open a <details> fold-out when an in-page anchor inside it is navigated to,
     so deep links (e.g. #konkurrerende-risici) still reveal collapsed content. -->
<script>
(function () {
  function openTarget() {
    if (!location.hash) return;
    var id;
    try { id = decodeURIComponent(location.hash.slice(1)); }
    catch (e) { id = location.hash.slice(1); }
    var el = document.getElementById(id);
    if (!el || !el.closest) return;
    var d = el.closest('details');
    while (d) {
      d.open = true;
      d = d.parentElement ? d.parentElement.closest('details') : null;
    }
    if (el.scrollIntoView) el.scrollIntoView();
  }
  window.addEventListener('DOMContentLoaded', openTarget);
  window.addEventListener('hashchange', openTarget);
})();
</script>

<!-- Keyboard access to code and to collapsed callouts.
     1. A code block whose lines are wider than the box scrolls sideways, but
        only with a mouse or touch: the box cannot get keyboard focus, so a
        keyboard user cannot read the end of a long line. tabindex="0" lets
        them tab to it and scroll with the arrow keys.
     2. Quarto makes the header of a collapsed callout clickable, but not
        focusable, and labels it "Toggle callout", so a screen reader hears
        that instead of the title. Here it becomes a button that Tab reaches
        and Enter or Space opens, named by its own title. -->
<script>
(function () {
  function keyboardAccess() {
    document.querySelectorAll("div.sourceCode pre").forEach(function (pre) {
      if (pre.scrollWidth > pre.clientWidth) pre.setAttribute("tabindex", "0");
    });
    document.querySelectorAll('.callout-header[data-bs-toggle="collapse"]').forEach(function (h) {
      h.setAttribute("role", "button");
      h.setAttribute("tabindex", "0");
      h.removeAttribute("aria-label");
      h.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); h.click(); }
      });
    });
  }
  if (document.readyState === "loading") {
    window.addEventListener("DOMContentLoaded", keyboardAccess);
  } else {
    keyboardAccess();
  }
})();
</script>
