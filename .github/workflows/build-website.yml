name: Build website

on:
  push:
    branches:
      - main

# Limit token permissions for security
permissions: read-all

jobs:
  build-website:
    runs-on: ubuntu-latest
    # Stop builds from running more than one at a time, to save resources and also
    # to limit conflicts when uploading to the hosting provider.
    concurrency:
      group: build-website-group
      cancel-in-progress: true
    # Needs these permissions to publish to GitHub Pages.
    permissions:
      contents: write
      pages: write
    steps:
      # This is a useful security step to check for unexpected outbound calls from the runner,
      # which could indicate a compromised token or runner.
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      # fetch-depth: 0 gets the full history, which the next step needs.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Every page has `date: last-modified`, which Quarto reads from the
      # file's modification time. A fresh checkout gives every file the
      # checkout time, so every page showed the build date. This sets each
      # page's file time to its last commit, so the date shown is when the
      # page itself last changed.
      - name: Date each page by its last commit
        run: |
          git ls-files '*.qmd' | while read -r f; do
            touch -d "@$(git log -1 --format=%ct -- "$f")" "$f"
          done

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0

      # The next three steps build assets/search-index.json, the file the
      # "Search by meaning" page reads. It is built here, from the pages that
      # are about to be published, and it is not committed. That way the
      # published index cannot be out of date, and a pull request never needs
      # a manual rebuild. If one of these steps fails, the whole job stops
      # before publishing, so the site stays as it was instead of going out
      # without a search index.

      # The index builder is an R script. Same action and version as in
      # check-guide.yml.
      - name: Set up R
        uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0

      # The only package the builder needs beyond base R: it reads the page
      # titles and .config/search-synonyms.yaml. Same line as in
      # check-guide.yml.
      - name: Install the yaml package
        run: Rscript -e 'install.packages("yaml", repos = "https://cloud.r-project.org")'

      # Must run BEFORE the render step below: Quarto copies the file into the
      # site while rendering (it is listed under resources in _quarto.yml).
      # The second line stops the job if no file was written.
      - name: Build the search index
        run: |
          Rscript tools/build-search-index.R
          test -s assets/search-index.json

      # NOTE: Needs the contents and pages write permissions (used above).
      - name: Render and publish to GitHub Pages
        uses: quarto-dev/quarto-actions/publish@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
