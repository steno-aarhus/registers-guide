# Shared facts for the LPR2 psychiatric datasets (t_psyk_adm, t_psyk_diag).
#
# Kept apart from lpr2_somatic on purpose. The two families end on the same date
# and both key on recnum, but the psychiatric registers use their own column
# names for the person and the contact (v_cpr, k_recnum, v_recnum), so a shared
# family would say something false about the columns.
#
# Unlike lpr2_somatic, reference_timing IS shared here: DST classifies both as
# Forloeb.

id: lpr2_psychiatric
name: "Det Psykiatriske Centralregister (LPR2)"
description: >-
  The psychiatric part of the second-generation National Patient Register.
  Separate from somatic LPR2 for the whole period it covers, and folded into
  LPR3 from March 2019. Every dataset in the family is keyed on recnum, and
  only t_psyk_adm carries the person.

update_cadence: none
reference_timing: course
coverage:
  from: 1995
  to: 2019

deprecated: true
superseded_by: [lpr_a_kontakt, lpr_a_diagnose]

provenance:
  source_url: https://www.dst.dk/extranet/forskningvariabellister/Oversigt%20over%20registre.html
  source_type: dst_documentation
  verified_on: 2026-09-04
  verified_against: "DST register overview - both datasets marked Luk"
