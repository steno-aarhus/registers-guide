# Shared facts for the LPR3 datasets.
#
# Even smaller than lpr2_somatic. Neither coverage nor reference_timing belongs
# here: DST gives lpr_a_kontakt 2017-2025 and lpr_a_diagnose 2019-2025, so the
# start differs by two years, and both are classified Forløb while the LPR2
# datasets are not. Only the cadence and the key convention are genuinely shared.

id: lpr3
name: "Landspatientregistret 3"
description: >-
  The third-generation National Patient Register. Keyed on dw_ek_kontakt, the
  contact identifier, with dw_ek_forloeb one level above it for a course of
  treatment.

update_cadence: annual
deprecated: false
superseded_by: null
