# Shared facts for the 2019+ Medical Birth Register (Nyfoedte + its ten
# satellite tables). Same reasoning as families/lpr3.yaml: coverage does not
# belong here even though all eleven tables currently share "2019-" per
# Sundhedsdatastyrelsen's own Tabeller sheet, because that is a fact about
# this specific documented snapshot, not a structural guarantee the way the
# key convention and update cadence are.

id: mfr2019
name: "Medicinsk Foedselsregister 2019+"
description: >-
  The current, LPR3-style Medical Birth Register: one main table (Nyfoedte)
  plus ten satellite tables (Barn_*/Mor_* course elements, contacts,
  diagnoses, procedures, results). Keyed on DW_EK_Nyfoedt (child satellite
  tables) or DW_EK_Foedsel (mother satellite tables, and Nyfoedte itself).

# The real, sourced fact is weekly ("Registeret opdateres ugentligt", per
# Sundhedsdatastyrelsen's own documentation), which is not one of this
# schema's five allowed update_cadence values (annual/quarterly/monthly/
# continuous/none). "continuous" is the closest fit, not a literal claim of
# real-time streaming.
update_cadence: continuous
deprecated: false
superseded_by: null
