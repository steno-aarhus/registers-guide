# Shared facts for the LPR2 somatic datasets (lpr_adm, lpr_diag).
#
# Deliberately small. reference_timing is NOT here: DST classifies lpr_adm as
# Hændelse and lpr_diag as Statusperiode, so the datasets in this family do not
# share it. Putting it at family level would have asserted something false about
# one of them.

id: lpr2_somatic
name: "Landspatientregistret 2, somatik"
description: >-
  The somatic part of the second-generation National Patient Register. Every
  dataset in the family is keyed on recnum, the contact identifier, and only
  lpr_adm carries pnr.

update_cadence: none
coverage:
  from: 1977
  to: 2019-03

deprecated: true
superseded_by: [lpr_a_kontakt, lpr_a_diagnose]

provenance:
  source_url: https://www.dst.dk/extranet/forskningvariabellister/Oversigt%20over%20registre.html
  source_type: dst_documentation
  verified_on: 2026-09-01
  verified_against: "DST register overview - both datasets end 31/03/2019, marked Luk"
