# Shared facts for the 20 MFR "marker" sub-cuts (1997-2018 era). mfr.yaml's
# own MARKOER_* columns each flag whether a specific complication/procedure/
# finding occurred for a birth; each flag is backed by one of these 20
# separate, narrow supplementary datasets giving the actual SKS code(s)
# behind the flag - same relationship as MFRHJMFO (already in this schema)
# has to mfr.yaml's MARKOER_HJEMMEFOEDSEL_BEREGNET, just one sub-cut per
# complication type instead of one for home births.
#
# DST's Bestillingsliste and each register's own dedicated variable-list
# page agree, and both are equally thin: bare variable names, no
# descriptions, no value/code definitions anywhere for any of these 20.

id: mfr_markers
name: "MFR marker sub-cuts (1997-2018)"
description: >-
  One row per SKS-coded finding within a specific complication/procedure
  category, joined to mfr.yaml via FK_MFR. A birth with no finding in that
  category simply has no row here, rather than an explicit "no" row.

update_cadence: none
deprecated: true
superseded_by: null
