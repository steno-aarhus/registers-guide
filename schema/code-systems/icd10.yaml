id: icd10
name: "ICD-10 (Danish edition)"
description: >-
  Diagnosis codes. The Danish edition prefixes the WHO code with the letter D,
  so WHO's E11 appears as DE11 in LPR.
source_url: https://medinfo.dk/sks/brows.php
source_name: "SKS browser (medinfo.dk)"

enumerated: false
values_complete: false
labels_complete: false
values_from:
  # Not published as a downloadable list by Sundhedsdatastyrelsen: medinfo.dk is
  # a browser. The packages named here are on CRAN and are the candidates
  # fiktive's own plan lists; neither has been verified to carry the Danish
  # SKS-prefixed form (D-prefix), so a consumer must check before trusting it.
  kind: package
  candidates: [decoder, codeCollection]
  verified: false

lookup: null

structure:
  pattern: "D + letter + 2 digits, optionally followed by more digits"
  example: "DE11 = type 2 diabetes"

provenance:
  source_url: https://medinfo.dk/sks/brows.php
  source_type: nomenclature
  verified_on: 2026-09-01
  verified_against: "SKS browser"

reader_note: >-
  The D prefix is a Danish addition, not part of the WHO code. Matching WHO codes
  directly against LPR without allowing for it returns nothing.
