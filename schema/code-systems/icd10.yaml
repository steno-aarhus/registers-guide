# ICD-10 as WHO publishes it, with no Danish prefix. The patient registers do
# NOT use this form: they use icd10_sks. Keeping the two apart is the point of
# this file, because "icd10" on its own reads as if the D were universal, and it
# is not.

id: icd10
name: "ICD-10 (WHO form)"
description: >-
  Diagnosis codes in the plain WHO form, letter followed by digits, with no
  prefix: E119 rather than DE119. This is what the cause-of-death registers
  hold. The patient registers hold the D-prefixed SKS form instead, which is
  `icd10_sks`.
source_url: https://icd.who.int/browse10/
source_name: "WHO ICD-10 browser"

enumerated: false
values_complete: false
labels_complete: false
values_from:
  # codeCollection (CRAN) carries ICD-10 in exactly this form. Not sksr: its
  # diagnosis branch is the D-prefixed SKS variant, which is the other system.
  kind: package
  candidates: [codeCollection]
  dataset: ICD10Koodit
  verified: true
  verified_on: 2026-09-06
  verified_against: >-
    codeCollection 0.1.3: E119 and E11 resolve in ICD10Koodit, DE119 and DE11
    do not.

lookup: null

structure:
  pattern: "letter + 2 digits, optionally followed by more digits"
  example: "E119 = type 2 diabetes without complications"

provenance:
  source_type: nomenclature
  verified_on: 2026-09-06
  verified_against: >-
    Observed in a DST delivery: dodsaasg c_dod_1a and the ICD-10 rows of
    dodsaars c_dod1 are both letter plus three digits with no leading D.

reader_note: >-
  Do not strip a leading D from these codes. The habit comes from LPR, where the
  D is really there, and applying it here removes the first character of a real
  code: E119 becomes 119, which matches nothing and raises no error. The danger
  is worst where a code genuinely begins with D. ICD-10 chapter D covers in-situ
  and benign neoplasms, so D46 is myelodysplastic syndrome, a whole code. Strip
  its "prefix" and you get 46, which looks like a code and is not one.
