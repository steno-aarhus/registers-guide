# Manner of death in the SECOND cause-of-death table, t_dodsaarsag_2, which is
# what dodsaasg holds. The codes are NOT the ones in c_dodsmaade: 1 is
# Voldshandling here and Naturlig doed there. See both reader_notes.

id: c_dodsmaade_2002
name: "Doedsmaade, 2002 onwards (DAR t_dodsaarsag_2)"
description: >-
  How the person died, as coded from 2002. A different set of numbers from the
  one used until 2001, for the same five concepts. Nothing marks the change in
  the data itself: the column has the same name in both registers.
source_url: https://www.esundhed.dk/-/media/Files/Dokumentation/Doedsaarsagsregisteret/17_Kodeark_DAR---pdf.ashx
source_page: https://www.esundhed.dk/Dokumentation/DocumentationExtended?id=17
source_name: "Kodeark for Doedsaarsagsregisteret"

enumerated: true
values_complete: true
labels_complete: true

lookup:
  "0": {da: "Ulykke", en: "Accident"}
  "1": {da: "Voldshandling", en: "Act of violence"}
  "2": {da: "Selvmord", en: "Suicide"}
  "4": {da: "Uoplyst", en: "Not stated"}
  "5": {da: "Naturlig død", en: "Natural death"}

periods:
  - {code: "blank", da: "Fejlregistrering", valid_from: 2002-01-01, valid_to: null}
  - {code: "0", da: "Ulykke",        valid_from: 2002-01-01, valid_to: null}
  - {code: "1", da: "Voldshandling", valid_from: 2002-01-01, valid_to: null}
  - {code: "2", da: "Selvmord",      valid_from: 2002-01-01, valid_to: null}
  - {code: "4", da: "Uoplyst",       valid_from: 2002-01-01, valid_to: null}
  - {code: "5", da: "Naturlig død",  valid_from: 2002-01-01, valid_to: null}

provenance:
  source_url: https://www.esundhed.dk/-/media/Files/Dokumentation/Doedsaarsagsregisteret/17_Kodeark_DAR---pdf.ashx
  source_page: https://www.esundhed.dk/Dokumentation/DocumentationExtended?id=17
  source_type: esundhed_kodeark
  verified_on: 2026-09-07
  verified_against: >-
    Kodeark for Doedsaarsagsregisteret, table t_dodsaarsag_2, variable
    c_dodsmaade, read directly from the PDF. A blank value means Fejlregistrering.

reader_note: >-
  This is the set behind the `c_dodsmaade` column in dodsaasg, and the numbers
  do not mean what the same numbers mean in `dodsaars`. There,
  under `c_dodsmaade`, 1 is Naturlig død, 2 is Ulykke and 5 is Uoplyst. Here 1 is
  Voldshandling, 2 is Selvmord and 5 is Naturlig død. A study that spans 2001 and
  2002 is reading two different code sets out of two columns with the same name,
  and every value maps to something plausible in the other set, so nothing looks
  wrong. A blank is a registration error, not a missing manner of death.
