# Retired pre-2010 DISCO. Checked 2026-09-09: no usable source found. DST's own
# high-quality variable pages for disco_alle_indk_13 and discoalle_indk list
# 794 codes each but give NO text for any of them - the Vaerdisaet table has an
# empty label column throughout. The "disco" nomenklaturer URL that might have
# held the old classification instead redirects to DISCO-08, the CURRENT one
# (see disco08_alle_indk.yaml), so there is no live download of the old scheme
# either. Genuinely closed, not just unlinked: see reader_note.

id: disco_old
name: "DISCO fagklassifikation, foer 2010"
description: >-
  Occupation code before the 2010 switch to DISCO-08. Shares the general shape
  of DISCO-08 (a hierarchical numeric code) but not its published value list:
  DST's nomenklaturer page for "disco" now serves DISCO-08 itself, and no
  archived version of the pre-2010 code list has been found.
source_url: https://www.dst.dk/da/TilSalg/data-til-forskning/generelt-om-data/dokumentation-af-data/hoejkvalitetsvariable/Personers-tilknytning-til-arbejdsmarkedet-set-over-hele-aaret--AKM-/DISCOALLE-INDK
