reader_note: >-
  Do not read a code here against DISCO-08's published list (disco08.yaml):
  the two classifications share the general numeric shape but DST revised the
  detail at the 2010 switch, and a code that means one occupation in DISCO-08
  is not guaranteed to mean the same thing, or to exist at all, in the pre-2010
  scheme.
