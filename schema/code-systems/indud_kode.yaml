id: indud_kode
name: "Indud_kode (migration direction)"
description: "Whether a migration event is an immigration or an emigration."
source_url: https://www.dst.dk/extranet/ForskningVariabellister/VNDS%20-%20Historiske%20vandringer.html
source_name: "DST's variable list for VNDS"
values_complete: false
labels_complete: true
lookup:
  I: {da: "Indvandring", en: "Immigration"}
  U: {da: "Udvandring", en: "Emigration"}
provenance:
  source_type: unverified
  guide_page: register-reference.qmd
  verified_on: 2026-08-31
  verified_against: null
reader_note: >-
  Use `U` for censoring at emigration. People who never emigrated have no `U`
  event at all, so they are simply absent rather than carrying a missing date.
  Two caveats from the guide: CPR only has complete immigration and emigration
  data from 1971, so someone who immigrated before that has no event and looks
  resident since birth; and a move to Greenland is a status of its own in CPR
  rather than an emigration. Confirm the values on your own delivery.
