provenance:
  source_url: https://medinfo.dk/sks/brows.php
  source_type: dst_documentation
  verified_on: 2026-09-12
  verified_against: >-
    Two separate claims, verified separately, do not read this as one
    citation covering both. (1) The VALUES below (18 labels) come from
    sksr::SKS_labels filtered to Kode matching ^DUT or ^RGAB: 9
    diagnosis-prefixed codes (DUT00/10/11/20/21/22/23/29/99) and 9
    result-prefixed codes (RGAB00/10/11/20/21/22/23/29/99), pairwise
    identical (e.g. DUT20 and RGAB20 both "moder ryger op til 5 cigaretter
    dagligt"). I did not independently browse medinfo.dk/sks/brows.php for
    this specific classification myself; sksr is a CRAN package mirroring
    that data, not a first-hand read of the live site. (2) That Nyfoedte's
    Tobaksforbrug column actually USES these two code families, and the
    LPR3 cutover date, is confirmed separately by Sundhedsdatastyrelsen's
    own MFR 2019+ documentation (Dokumentation_Foedselsregisteret_2019_og_frem.xlsx,
    Kolonner sheet, row Tobaksforbrug) - which names the prefixes and the
    cutover but does NOT itself give any per-code label.

reader_note: >-
  Bliddal et al. 2018 (mined earlier for this guide) reports smoking status
  as 100% missing before late 1997 and notes the field is otherwise reliably
  recorded once it exists. That predates both DUT and RGAB: an analysis
  spanning multiple decades needs to know smoking status went through at
  least two encodings (pre-1997: absent; 1997 to the LPR3 cutover: DUT*;
  LPR3 cutover onwards: RGAB*), not one stable variable. When multiple
  smoking-status sources exist for the same birth, Sundhedsdatastyrelsen
  resolves them in a fixed order (result/add-on tied to the primary birth
  record over other records, "komplet" over "inkomplet" reporting status,
  then the heaviest smoking category over lighter ones) - see the MFR 2019+
  documentation for the exact tie-break rules if you need to reproduce
  Tobaksforbrug from the underlying satellite tables yourself.
