# What changes at the LPR3 cutover (Feb/March 2019) is the CODE PREFIX
# (DUT* diagnosis add-on code -> RGAB* result code), not the meaning of the
# categories: the nine categories and their labels are identical under both
# prefixes, confirmed against sksr below.
#
# Two different facts here, two different sources - do not conflate them:
# 1. WHICH classification a value belongs to, and what it means: SKS itself
#    (Sundhedsvæsenets Klassifikationssystem), a Sundhedsdatastyrelsen
#    classification named "Klassifikation: tobaksforbrug u. graviditet
#    [res.tobaksgrav]" for the RGAB codes. Browsable at
#    medinfo.dk/sks/brows.php, the same authority kont_type.yaml cites. THAT
#    is what defines what "RGAB20" means, not the MFR documentation.
# 2. That THIS column (Nyfoedte.Tobaksforbrug) uses that classification, via
#    two prefixes either side of the LPR3 cutover: confirmed separately by
#    Sundhedsdatastyrelsen's MFR 2019+ documentation (see provenance below),
#    which does NOT itself define any per-code label.

id: tobaksforbrug
name: "Tobaksforbrug / rygestatus (MFR, mother's smoking status in pregnancy)"
description: >-
  The mother's tobacco use during pregnancy, as coded in the Medical Birth
  Register (Nyfoedte.Tobaksforbrug, and the Mor satellite tables). Two SKS
  code families cover the exact same nine categories: DUT* is a diagnosis
  add-on code, used for rows reported before the LPR3 cutover in Feb/March
  2019; RGAB* is a result code (result type RDA25), used from that cutover
  on. The numeric suffix is identical across both (DUT20 and RGAB20 mean the
  same thing), only the prefix and reporting mechanism changed.
source_url: https://medinfo.dk/sks/brows.php
source_name: "Sundhedsdatastyrelsen: SKS Browser, classification res.tobaksgrav / dia DUT (tobaksforbrug)"

enumerated: true
values_complete: true
labels_complete: true
# I could not browse medinfo.dk/sks/brows.php interactively to pull the
# res.tobaksgrav/dia DUT classification's entries myself (it is a search
# form, not a linkable page per classification). sksr::SKS_labels is a CRAN
# package that mirrors SKS's own export and is the actual mechanism used to
# read these 18 labels below - it is not itself the authority, SKS is, but
# it is the only access this file's values actually rest on. If a specific
# label matters for a real analysis, verify it directly against the SKS
# Browser rather than trusting this file alone.
values_from:
  kind: package
  candidates: [sksr]
  dataset: SKS_labels
  # Not a single column/value match like kont_type.yaml's: reproduce with
  # SKS_labels %>% filter(grepl("^DUT", Kode) | grepl("^RGAB", Kode)).
  filter: {column: Kode, value: "^DUT|^RGAB"}
  verified: true
  verified_on: 2026-09-12
  verified_against: >-
    sksr 0.1.0, SKS_labels filtered to Kode matching ^DUT or ^RGAB: 9
    diagnosis-prefixed codes (DUT00/10/11/20/21/22/23/29/99) and 9
    result-prefixed codes (RGAB00/10/11/20/21/22/23/29/99), labels identical
    pairwise (e.g. DUT20 and RGAB20 both "moder ryger op til 5 cigaretter
    dagligt"). This confirms the LABEL TEXT only; the fact that these two
    code families are what Tobaksforbrug actually uses comes from
    Sundhedsdatastyrelsen's own documentation (source_url above), not sksr.
lookup:
  "DUT00": {da: "Moder ryger ikke", en: "Mother does not smoke"}
  "RGAB00": {da: "moder ryger ikke", en: "Mother does not smoke"}
  "DUT10": {da: "Moder ophørt med rygning i 1. trimester", en: "Mother stopped smoking in the 1st trimester"}
  "RGAB10": {da: "moder ophørt med rygning i 1. trimester", en: "Mother stopped smoking in the 1st trimester"}
  "DUT11": {da: "Moder ophørt med rygning efter 1. trimester", en: "Mother stopped smoking after the 1st trimester"}
  "RGAB11": {da: "moder ophørt med rygning efter 1. trimester", en: "Mother stopped smoking after the 1st trimester"}
  "DUT20": {da: "Moder ryger op til 5 cigaretter dagligt", en: "Mother smokes up to 5 cigarettes daily"}
  "RGAB20": {da: "moder ryger op til 5 cigaretter dagligt", en: "Mother smokes up to 5 cigarettes daily"}
  "DUT21": {da: "Moder ryger fra 6-10 cigaretter dagligt", en: "Mother smokes 6-10 cigarettes daily"}
  "RGAB21": {da: "moder ryger fra 6-10 cigaretter dagligt", en: "Mother smokes 6-10 cigarettes daily"}
  "DUT22": {da: "Moder ryger fra 11-20 cigaretter dagligt", en: "Mother smokes 11-20 cigarettes daily"}
  "RGAB22": {da: "moder ryger fra 11-20 cigaretter dagligt", en: "Mother smokes 11-20 cigarettes daily"}
  "DUT23": {da: "Moder ryger over 20 cigaretter dagligt", en: "Mother smokes more than 20 cigarettes daily"}
