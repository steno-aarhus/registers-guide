id: diagtype
name: "Diagnosetype (LPR2 c_diagtype)"
description: >-
  Whether a diagnosis is the reason for the contact, an additional condition,
  or something else. Six codes, three of which were discontinued.
source_url: https://www.esundhed.dk/-/media/Files/Dokumentation/Landspatientregisteret/5_Kodeark_LPR---pdf.ashx
source_page: https://www.esundhed.dk/Dokumentation/DocumentationExtended?id=5
source_name: "Kodeark for Landspatientregisteret"

enumerated: true
values_complete: true
labels_complete: true
lookup:
  A: {da: "Aktionsdiagnose", en: "Action diagnosis - the reason for the contact"}
  B: {da: "Bidiagnose", en: "Secondary diagnosis"}
  G: {da: "Grundmorbus, naar forskellig fra aktionsdiagnose", en: "Underlying condition, where different from the action diagnosis"}
  H: {da: "Henvisningsdiagnose", en: "Referral diagnosis"}
  M: {da: "Midlertidig diagnose, kun for aabne somatisk ambulante besoeg", en: "Provisional diagnosis, open somatic outpatient visits only"}
  C: {da: "Komplikation", en: "Complication"}

provenance:
  source_url: https://www.esundhed.dk/-/media/Files/Dokumentation/Landspatientregisteret/5_Kodeark_LPR---pdf.ashx
  source_page: https://www.esundhed.dk/Dokumentation/DocumentationExtended?id=5
  source_type: dst_documentation
  verified_on: 2026-09-02
  verified_against: >-
    Kodeark for Landspatientregisteret (Sundhedsdatastyrelsen), table t_adm,
    variable c_diagtype, with validity dates per code.

reader_note: >-
  The guide long described this as an A/B/G column. There are six codes, and
  three of them stop: **G runs 1995-2003 only**, M 1998-2013 and C 2002-2013. A
  and B run the whole period, H from 1995. So a comorbidity definition built on
  G silently covers nine years and nothing else, and filtering to A/B/G drops
  referral diagnoses entirely. Which types to keep is a case definition, not a
  technicality: outcomes usually use A and B. Carry the type column into the
  extract so the definition can be varied later.
