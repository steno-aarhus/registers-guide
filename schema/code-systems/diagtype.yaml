id: diagtype
name: "Diagnosetype (diagnosis type)"
description: >-
  Whether a diagnosis is the reason for the contact, an additional condition
  present, or background comorbidity.
source_url: https://www.dst.dk/extranet/ForskningVariabellister/LPR_DIAG%20-%20Landspatientregistret%20-%20diagnoser.html
values_complete: false
labels_complete: true
lookup:
  A: {da: null, en: "Action diagnosis - the primary reason for the contact"}
  B: {da: null, en: "Secondary diagnosis - an additional condition present"}
  G: {da: null, en: "Underlying condition - background comorbidity"}
provenance:
  source_type: guide_prose
  guide_page: 09a_understand-lpr.qmd
  verified_on: 2026-09-01
  verified_against: null
reader_note: >-
  Which types to keep is a case definition, not a technicality. Outcomes and
  exclusion diagnoses normally use A and B; baseline comorbidity also uses G.
  Keeping only A drops secondary diagnoses and will undercount conditions.
  Carry the type column into the extract so the definition can be varied later.
  The set is taken from the guide and may not be complete.
