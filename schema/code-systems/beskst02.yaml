reader_note: >-
  Not comparable with beskst (see beskst's own reader_note): DST states this
  directly, not just a difference of degree. Comparable with beskst13 with
  named exceptions: self-employment income is measured net of capital income
  in beskst13 rather than gross, and beskst13's amount thresholds are
  price-adjusted where beskst02's are not. A study spanning both should read
  DST's own change note before treating them as one continuous series.
