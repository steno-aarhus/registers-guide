# Employment status, 2002 onwards. beskst13 reuses this exact code list; DST
# describes it as a methodology change (net vs gross self-employment income,
# price-adjusted thresholds), not a code change. See both reader_notes.

id: beskst02
name: "Beskaeftigelsesstatus, 2002 onwards (AKM/Indkomst)"
description: >-
  A person's main labour-market position during the year. Longer and finer
  than the 1976-2001 predecessor (beskst): it splits out efterløn, dagpenge and
  kontanthjælp recipients as their own categories instead of folding them into
  broader ones. Shared by beskst02 and beskst13, which use the same codes.
