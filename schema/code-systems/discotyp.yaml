id: discotyp
name: "Kilde til DISCO-koden (AKM)"
description: >-
  Which source register supplied a person's DISCO occupation code, and how it
  was obtained: reported directly, carried over from the year before, or
  imputed. Not the occupation itself, only where that code came from, which
  matters because DST states code quality is best when this is 1, 2, 4 or 10,
  and worse for the other, imputation-based values.
