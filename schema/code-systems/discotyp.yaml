reader_note: >-
  A different question from the DISCO occupation code itself: this says where
  that code came from, not what the job was. DST's own page states that DISCO
  code quality is best when discotyp is 1, 2, 4 or 10, and that the remaining
  codes mean the DISCO code was set by imputation.
