name: "Dansk branchekode, 1977-1993 (AKM)"
description: >-
  A five-digit industry code used before NACE/DB07. The classification's own
  validity window (1977-1993) is narrower than the AKM column's coverage
  (1980-1999): DST kept issuing values under it for several years after the
  underlying classification was retired.
