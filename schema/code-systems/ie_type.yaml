id: ie_type
name: "IE-type (herkomst)"
description: >-
  Whether a person is of Danish origin, an immigrant or a descendant.
source_url: https://www.dst.dk/da/Statistik/dokumentation/nomenklaturer/herkomst
source_csv: https://www.dst.dk/klassifikationsbilag/948ef1c3-072c-4d76-ba2b-ce7d34691593csv_da
source_name: "DST's herkomst classification"

enumerated: true
values_complete: true
labels_complete: true

lookup:
  "0": {da: "Uoplyst", en: "Not stated"}
  "1": {da: "Personer med dansk oprindelse", en: "Persons of Danish origin"}
  "2": {da: "Indvandrere", en: "Immigrant"}
  "3": {da: "Efterkommere", en: "Descendant"}
  "9": {da: "Uoplyst", en: "Not stated"}

provenance:
  source_url: https://www.dst.dk/da/Statistik/dokumentation/nomenklaturer/herkomst
  source_type: dst_documentation
  verified_on: 2026-11-23
  verified_against: "DST's published classification, downloaded as CSV"

reader_note: >-
  DST documents two value sets for IE_TYPE. The herkomst classification gives
  1 "Personer med dansk oprindelse", 2 "Indvandrere", 3 "Efterkommere" and
  9 "Uoplyst". DST's high-quality page for IE_TYPE
  (https://www.dst.dk/da/TilSalg/data-til-forskning/generelt-om-data/dokumentation-af-data/hoejkvalitetsvariable/Udlaendinge/IE-TYPE)
  gives 0 "Uoplyst", 1 "Dansker", 2 "Indvandrer" and 3 "Efterkommer", valid
  from 1 January 2000. Code 0 is listed here for that reason. Check which code
  your delivery uses for unknown with count(ie_type).
