# DISCO-08, current from 2010. DST publishes the full classification as a CSV,
# unlike the retired predecessor (see disco_old.yaml). But the AKM columns that
# use it (disco08_alle_indk, disco08_alle_indk_13) do not draw purely from this
# file: see reader_note before treating this as a complete lookup.

id: disco08
name: "DISCO-08 fagklassifikation (occupation)"
description: >-
  Danmarks Statistiks Fagklassifikation (DISCO-08), the occupation
  classification current from 2010. Hierarchical: level 1 is 10 broad groups,
  level 5 the full six-digit code.
source_url: https://www.dst.dk/da/Statistik/dokumentation/nomenklaturer/disco08
source_csv: https://www.dst.dk/klassifikationsbilag/27573556-f064-4660-946b-53ab7938ee2bcsv_da
source_name: "DST's DISCO-08 classification"

enumerated: false
values_complete: false
labels_complete: false
values_from:
  # DST's own classification, downloadable as CSV. 1,171 codes across 5 levels;
  # level 5 (six digits) is the finest grain and the one AKM's columns hold.
  kind: csv
  url: https://www.dst.dk/klassifikationsbilag/27573556-f064-4660-946b-53ab7938ee2bcsv_da
  delimiter: ";"
  encoding: UTF-8-BOM
  code_column: KODE
  label_column: TITEL
  level_column: NIVEAU
  level: 5
  verified: true
  verified_on: 2026-09-09
  verified_against: >-
    Downloaded: 1,171 rows, by NIVEAU 10 at level 1, 42 at 2, 126 at 3, 429 at
    4, 564 at 5, columns SEKVENS;KODE;NIVEAU;TITEL and six more, semicolon
    separated.

lookup: null

provenance:
  source_url: https://www.dst.dk/da/Statistik/dokumentation/nomenklaturer/disco08
  source_type: nomenclature
  verified_on: 2026-09-09
  verified_against: "DST classification DISCO-08 v1:2010"

reader_note: >-
  The AKM columns do not draw purely from this file. Checked against
  disco08_alle_indk's own value list on DST's high-quality variable page: only
  564 of its 790 distinct codes appear in this CSV's 564 level-5 codes.
  disco_typ (see discotyp.yaml) explains why: the occupation code for a given
  person-year can come from several source registers of varying vintage and
  quality, including imputation, so a study will see codes this file's current
  edition does not carry. Do not treat a code missing from this CSV as an
  error in the data before checking discotyp.
