id: pattype
name: "Patienttype (LPR2 c_pattype)"
description: >-
  The patient's administrative relationship to the hospital. LPR2 only: LPR3 has
  no equivalent, and the type has to be derived from contact duration plus an
  acute marker.
source_url: https://www.esundhed.dk/-/media/Files/Dokumentation/Landspatientregisteret/5_Kodeark_LPR---pdf.ashx
source_page: https://www.esundhed.dk/Dokumentation/DocumentationExtended?id=5
source_name: "Kodeark for Landspatientregisteret"

enumerated: true
values_complete: true
labels_complete: true
lookup:
  "0": {da: "Heldoegnspatient (to 2001), Indlagt patient (2002-)", en: "Inpatient"}
  "1": {da: "Dagpatient (to 1986), Deldoegnspatient (1987-2001)", en: "Day patient, then part-day inpatient"}
  "2": {da: "Natpatient (to 1986), Ambulant patient (1987-)", en: "Night patient, then outpatient"}
  "3": {da: "Skadestuepatient", en: "Emergency room"}

# From the LPR code sheet, which publishes Gyldig fra dato and Gyldig til dato
# per code. Three codes appear twice and cannot be keyed twice in `lookup`.
periods:
  - {code: "0", da: "Heldoegnspatient",  valid_from: 1977-01-01, valid_to: 2001-12-31}
  - {code: "0", da: "Indlagt patient",   valid_from: 2002-01-01, valid_to: null}
  - {code: "1", da: "Dagpatient",        valid_from: 1977-01-01, valid_to: 1986-12-31}
  - {code: "1", da: "Deldoegnspatient",  valid_from: 1987-01-01, valid_to: 2001-12-31}
  - {code: "2", da: "Natpatient",        valid_from: 1977-01-01, valid_to: 1986-12-31}
  - {code: "2", da: "Ambulant patient",  valid_from: 1987-01-01, valid_to: null}
  - {code: "3", da: "Skadestuepatient",  valid_from: 1987-01-01, valid_to: 2013-12-31}

provenance:
  source_url: https://www.esundhed.dk/-/media/Files/Dokumentation/Landspatientregisteret/5_Kodeark_LPR---pdf.ashx
  source_page: https://www.esundhed.dk/Dokumentation/DocumentationExtended?id=5
  source_type: dst_documentation
  verified_on: 2026-09-02
  verified_against: >-
    Kodeark for Landspatientregisteret (Sundhedsdatastyrelsen), table t_adm,
