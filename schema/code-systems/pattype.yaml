reader_note: >-
  There are four codes, not six, and three of them changed meaning. Code `1` was
  Dagpatient until 1986 and Deldoegnspatient from 1987, and then stops entirely
  at the end of 2001. Code `2` was Natpatient until 1986 and Ambulant from 1987.
  Code `0` was Heldoegnspatient until 2001 and Indlagt patient from 2002. The register only started using `1`, `2`
  and `3` in 1994, so before that essentially every contact is `0`. Code `3` was
  discontinued at the end of 2013, and from 2014 an emergency-room visit arrives
  as `2` with an acute admission mode in `c_indm`. Reading `2` as outpatient
  across the whole register therefore mislabels night patients before 1987 and
  emergency visits after 2013.
