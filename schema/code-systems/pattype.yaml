id: pattype
name: "Patient type (LPR2 c_pattype)"
description: >-
  Whether a contact was an admission, an outpatient visit or an emergency-room
  visit. LPR2 only: LPR3 has no direct equivalent and the type has to be derived
  from contact duration plus an acute marker.
source_url: https://sundhedsdatastyrelsen.dk/data-og-registre/nationale-sundhedsregistre/landspatientregisteret

enumerated: true
values_complete: false
labels_complete: false
lookup:
  "0": {da: "Heldoegns indlaeggelse", en: "Inpatient, full day"}
  "1": {da: "Deldoegns indlaeggelse", en: "Inpatient, part day"}
  "2": {da: "Ambulant", en: "Outpatient"}
  "3": {da: "Skadestue", en: "Emergency room"}
  "4": {da: "Dagpatient", en: "Day patient"}
  "5": {da: "Natpatient", en: "Night patient"}

provenance:
  source_type: guide_prose
  verified_on: 2026-09-01
  verified_against: "the extraction chapter, which follows the Plana-Ripoll group's published code"

reader_note: >-
  Do not read this as a simple three-way split. The emergency-room coding
  changed around 2014: before then an ER visit is mostly `"3"`, afterwards it
  usually arrives as `"2"` with an acute admission mode in `c_indm`. Classifying
  on `c_pattype` alone therefore counts ER visits as outpatient for the later
  years. The extraction chapter has the full rule.
