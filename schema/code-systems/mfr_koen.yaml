id: mfr_koen
name: "Koen (MFR 2019+, letter code)"
description: >-
  Sex as coded in the 2019+ Medical Birth Register (Nyfoedte.Koen_Barn,
  Koen_Mor, Koen_Far). Not the same encoding as `koen`: that is DST's
  numeric KOEN_V1_1980 classification (1/2/9), this is Sundhedsdatastyrelsen's
  own letter code for this register family. Same concept, different
  authority, different literal values - do not assume a column typed against
  one resolves against the other.
source_url: https://sundhedsdatastyrelsen.dk/Media/638650989728109987/Dokumentation_Foedselsregisteret_2019_og_frem.xlsx
source_name: "Sundhedsdatastyrelsen: Dokumentation af Fødselsregisteret 2019 og frem, sheet Kolonner"

enumerated: true
values_complete: true
labels_complete: true
lookup:
  "K": {da: "Kvinde", en: "Female"}
  "M": {da: "Mand", en: "Male"}
  "Ukendt": {da: "Ukendt", en: "Unknown"}

provenance:
  source_url: https://sundhedsdatastyrelsen.dk/Media/638650989728109987/Dokumentation_Foedselsregisteret_2019_og_frem.xlsx
  source_type: dst_documentation
  verified_on: 2026-09-12
  verified_against: >-
    Kolonner sheet, rows for Koen_Barn/Koen_Mor/Koen_Far: "K = Kvinde, M =
    Mand, Ukendt" verbatim for all three columns.

reader_note: >-
  For the child, this is derived from Dim.Borger.KoenID plus, for stillbirths
  reported on paper, the stillbirth form or the CPR-like number itself - not
  purely a CPR lookup, since a stillborn child may never receive one. For the
  mother and father, it is a straight lookup on their own CPR-derived sex, so
  Koen_Far being "Ukendt" or missing does not imply anything about the birth
  itself, only that paternal identity was not established.
