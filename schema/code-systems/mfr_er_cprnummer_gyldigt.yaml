id: mfr_er_cprnummer_gyldigt
name: "ErCPRnummerGyldigt (MFR 2019+, CPR-number validity type)"
description: >-
  What kind of number sits in CPRnummer_Barn / CPRnummer_Mor / CPRnummer_Far
  in the 2019+ Medical Birth Register: a real, currently active CPR-number,
  one that used to be valid, a stand-in issued for someone the CPR system
  cannot yet or can no longer resolve, a known test number, or something
  else. Shared code across all three person columns.
source_url: https://sundhedsdatastyrelsen.dk/Media/638650989728109987/Dokumentation_Foedselsregisteret_2019_og_frem.xlsx
source_name: "Sundhedsdatastyrelsen: Dokumentation af Fødselsregisteret 2019 og frem, sheet Kolonner"

enumerated: true
values_complete: true
labels_complete: true
lookup:
  "Gyldig hos CPR": {da: "Gyldig hos CPR", en: "Valid at CPR"}
  "Udgået hos CPR": {da: "Udgået hos CPR", en: "Expired at CPR"}
  "Erstatnings CPR": {da: "Erstatnings CPR", en: "Substitute CPR-like number"}
  "Fiktivt": {da: "Fiktivt", en: "Fictitious (known test number)"}
  "Andet CPR": {da: "Andet CPR", en: "Other, uncategorised"}

provenance:
  source_url: https://sundhedsdatastyrelsen.dk/Media/638650989728109987/Dokumentation_Foedselsregisteret_2019_og_frem.xlsx
  source_type: dst_documentation
  verified_on: 2026-09-12
  verified_against: >-
    Kolonner sheet, rows ErCPRnummerGyldigt_Barn/_Mor/_Far, identical text.
    "Gyldig hos CPR" = CPR status codes 01/03/05/07 (active, incl. Greenland
    and special road codes), 20 (inactive, kept for tax purposes), 70
    (disappeared), 80 (emigrated), 90 (dead). "Udgået hos CPR" = status codes
    30 (annulled), 50 (deleted as a duplicate), 60 (changed on a birth-date/
    sex correction). "Erstatnings CPR" = a 7-digit date-plus-century string
    followed by 2 letters and 1 digit, or the CPR office's own substitute-
    number format. "Fiktivt" = appears on MedCom's list of test CPR-numbers.
    "Andet CPR" = none of the above.

reader_note: >-
  Only "Gyldig hos CPR" is guaranteed to resolve when joining to `bef` or any
  other CPR-keyed register: an "Udgået hos CPR" number identifies a real
  person but under a number CPR itself has since retired (e.g. after a
  birth-date correction), while "Erstatnings CPR" and "Fiktivt" numbers were
  never real CPR-numbers at all and will join to nothing. Check this column
  before joining CPRnummer_Barn, _Mor, or _Far onwards, rather than assuming
  every value in those columns is a working key.
