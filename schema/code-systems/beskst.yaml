reader_note: >-
  Not comparable with beskst02, in DST's own words, not just a difference of
  degree: people with an unemployment share over 50 percent, and people on
  efterløn (early retirement pay), get their own codes under beskst02 that this
  code list does not have, and the rules for who counts as self-employed also
  changed. See beskst02's reader_note.
