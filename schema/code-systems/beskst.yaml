id: beskst
name: "Beskaeftigelsesstatus, 1976-2001 (AKM/Indkomst)"
description: >-
  A person's main labour-market position during the year: self-employed, an
  employee, a pensioner, or one of a few other categories. The predecessor to
  beskst02, with a shorter, coarser code list.
