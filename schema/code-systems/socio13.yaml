reader_note: >-
  Two codes are easy to misread. `410` is **Andre** (other), not unemployed:
  the unemployed are `210`. And `420` is **children under 15**, a known
  category rather than a missing value, so it appearing in an adult cohort
  means the index date is wrong rather than the data being incomplete.
