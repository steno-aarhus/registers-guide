# Reason for the hospital contact. Code 4 changed meaning in 1994, so read the
# reader_note before counting anything self-harm related.

id: c_kontaars
name: "Kontaktaarsag (LPR2 c_kontaars)"
description: >-
  Why the contact happened: disease, accident, violence, self-harm or a late
  effect. It is the variable an injury or self-harm study filters on, and code 4
  does not mean the same thing across the register.
source_url: https://www.esundhed.dk/-/media/Files/Dokumentation/Landspatientregisteret/5_Kodeark_LPR---pdf.ashx
source_page: https://www.esundhed.dk/Dokumentation/DocumentationExtended?id=5
source_name: "Kodeark for Landspatientregisteret"

enumerated: true
values_complete: true
labels_complete: true

lookup:
  "1": {da: "Sygdom og tilstand uden direkte sammenhæng med udefra påført læsion", en: "Disease or condition with no direct link to an external injury"}
  "2": {da: "Ulykke", en: "Accident"}
  "3": {da: "Voldshandling", en: "Act of violence"}
  "4": {da: "Selvmord/selvmordsforsøg", en: "Suicide or attempted suicide"}
  "5": {da: "Senfølge", en: "Late effect"}
  "6": {da: "Komplet skaderegistrering foretages på efterfølgende kontakt", en: "Full injury registration will be made at a later contact"}
  "7": {da: "Komplet skaderegistrering foretaget på tidligere kontakt", en: "Full injury registration was made at an earlier contact"}
  "8": {da: "Andet", en: "Other"}
  "9": {da: "Uoplyst", en: "Not stated"}

# From the code sheet, which publishes Gyldig fra dato and Gyldig til dato per
# code. Code 4 appears twice and cannot be keyed twice in `lookup`.
periods:
  - {code: "1", da: "Sygdom og tilstand uden direkte sammenhæng med udefra påført læsion", valid_from: 1987-01-01, valid_to: null}
  - {code: "2", da: "Ulykke",                    valid_from: 1987-01-01, valid_to: null}
  - {code: "3", da: "Voldshandling",             valid_from: 1987-01-01, valid_to: null}
  - {code: "4", da: "Selvtilføjet skade",        valid_from: 1987-01-01, valid_to: 1993-12-31}
  - {code: "4", da: "Selvmord/selvmordsforsøg",  valid_from: 1994-01-01, valid_to: null}
  - {code: "5", da: "Senfølge",                  valid_from: 1987-01-01, valid_to: 2013-12-31}
  - {code: "6", da: "Komplet skaderegistrering foretages på efterfølgende kontakt", valid_from: 2014-01-01, valid_to: null}
  - {code: "7", da: "Komplet skaderegistrering foretaget på tidligere kontakt",     valid_from: 2011-01-01, valid_to: null}
  - {code: "8", da: "Andet",                     valid_from: 1987-01-01, valid_to: null}
  - {code: "9", da: "Uoplyst",                   valid_from: 1987-01-01, valid_to: 2013-12-31}

