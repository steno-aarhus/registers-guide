reader_note: >-
  Code 4 was Selvtilføjet skade until the end of 1993 and Selvmord/selvmordsforsøg
  from 1994. Those are not the same population: self-inflicted injury is wider
  than an attempt at suicide, so a series that spans 1994 changes definition
  rather than changing level. Codes 5 and 9 stop at the end of 2013. Code 7 only
  starts in 2011 and code 6 only in 2014, so neither says anything about earlier
  contacts.
