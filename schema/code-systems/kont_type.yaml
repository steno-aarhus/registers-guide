id: kont_type
name: "Contact type (LPR3 kont_type)"
description: >-
  The LPR3 contact type. Documented as SKS codes rather than the single digits
  LPR2 used, so the values look nothing like LPR2's c_pattype and cannot be
  mapped across one to one. In practice the column holds BOTH, and which one a
  row holds is decided by `lprindberetningssystem`, not by the year: rows
  reported through LPR3 carry the SKS codes, rows reported through MiniPAS carry
  LPR2 patient types (`0` and `2`, see the `pattype` code system). Both were
  present as late as 2024 in a delivery checked in 2026.
source_url: https://cdn1.gopublic.dk/sundhedsdatastyrelsen/media/15700/LPR_indberetningsvejledning_v.1.2.pdf
source_name: "Vejledning til indberetning til LPR3"
source_page: https://medinfo.dk/sks/brows.php

enumerated: false
values_complete: false
labels_complete: false
values_from:
  # The reporting guidance is a PDF, but the codes themselves are SKS
  # administrative codes, and those are published: sksr (CRAN) resolves ALCA00
  # under Prefix 'adm'. So there is a machine-readable source after all, and a
  # consumer has no reason to fall back to invented values.
  kind: package
  candidates: [sksr]
  dataset: SKS_labels
  filter: {column: Prefix, value: adm}
  verified: true
  verified_on: 2026-09-06
  verified_against: "sksr 0.1.0: ALCA00 resolves to 'fysisk fremmøde' under Prefix 'adm'."

lookup: null

structure:
  pattern: "SKS administrative code, six characters"
  example: "ALCA00 = physical attendance"

provenance:
  source_type: dst_documentation
  verified_on: 2026-09-01
  verified_against: "Sundhedsdatastyrelsen's LPR3 reporting guidance, which names ALCA00 as physical attendance. The full code list is in SKS, not here."

reader_note: >-
  `ALCA00` means physical attendance, which is the closest LPR3 gets to LPR2's
  inpatient flag. It marks attendance, not admission, so a study that treats it
  as "was admitted" will include outpatient visits. Check what your own delivery
  holds before filtering: single digits and SKS codes have been seen side by
  side in the same year, so `kont_type == "ALCA00"` can silently drop rows that
  are the same kind of contact recorded in the other form. Cross-tabulate it
  against `lprindberetningssystem` first. MiniPAS was the route private
  providers reported through, so the two forms are not only two notations, they
  are also two different parts of the health service.
