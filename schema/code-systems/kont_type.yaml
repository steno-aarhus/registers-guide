id: kont_type
name: "Contact type (LPR3 kont_type)"
description: >-
  The LPR3 contact type. Coded in SKS rather than as single digits, so the
  values look nothing like LPR2's c_pattype and cannot be mapped across
  one to one.
source_url: https://medinfo.dk/sks/brows.php

enumerated: false
values_complete: false
labels_complete: false
lookup: null

structure:
  pattern: "SKS administrative code, six characters"
  example: "ALCA00 = physical attendance"

provenance:
  source_type: guide_prose
  verified_on: 2026-09-01
  verified_against: "the LPR chapters"

reader_note: >-
  `ALCA00` means physical attendance, which is the closest LPR3 gets to LPR2's
  inpatient flag. It marks attendance, not admission, so a study that treats it
  as "was admitted" will include outpatient visits.
