id: lprindberetningssystem
name: "Reporting system (LPR_A lprindberetningssystem)"
description: >-
  Which historical reporting-system generation a lpr_a_kontakt,
  lpr_a_diagnose or lpr_a_procregistrering row was originally reported
  through. Do not confuse this with LPR_F vs LPR_A: that is a choice of
  DELIVERY FORMAT (which files you even read, kontakter/diagnoser/forloeb
  vs lpr_a_kontakt/lpr_a_diagnose), decided before you open a file. This
  column is a value INSIDE the LPR_A files, telling you which of several
  older reporting systems' migrated history a given row within LPR_A came
  from, since lpr_a_kontakt is a single consolidated table holding
  migrated history as well as current LPR3 reporting. See [LPR_A vs LPR_F
  ->](understand-lpr.qmd#lpr-a-format).
source_url: darter-pitfalls.qmd#lpr3-lprindberetningssystem
source_name: "No DST/Sundhedsdatastyrelsen kodeark for this column exists; the value set below is reconstructed from DARTER-team-confirmed facts already established elsewhere in this guide (this pitfalls page, and kont_type.yaml), not from a published code list."

# Not a formal DST/SDS code list like pattype or kont_type: nobody publishes
# a kodeark for this column. "LPR3" is the only value confirmed with an
# actual code snippet (it is used in a working filter, confirmed by Anders
# Aasted Isaksen, DARTER team). The other three are named in this guide's
# own existing pages, not invented here, but at a lower confidence level -
# see provenance below for exactly which claim rests on what.
enumerated: true
values_complete: false
labels_complete: true
lookup:
  "LPR3": {da: null, en: "Reported through the current LPR3 system (from March 2019)"}
  "MiniPAS": {da: null, en: "Reported through MiniPAS, the route private providers used"}
  "LPR2": {da: null, en: "Migrated history from LPR2, before the March 2019 cutover"}
  "LPR1": {da: null, en: "Migrated history from LPR1"}

provenance:
  source_type: darter_team_confirmation
  verified_on: 2026-09-12
  verified_against: >-
    "LPR3" is used directly in a working filter (`lprindberetningssystem ==
    "LPR3"`), confirmed by Anders Aasted Isaksen, DARTER team 2026 - see
    darter-pitfalls.qmd pitfall 5. "MiniPAS" is independently required by
    kont_type.yaml's own reader_note, which distinguishes rows "reported
    through LPR3" from rows "reported through MiniPAS" on this exact
    column. "LPR2" and "LPR1" come from dst-pitfalls.qmd pitfall 11, which
    names all four systems specifically for lpr_a_kontakt's migrated
    history, but their exact literal string form (case, spelling) has not
    been confirmed with a code snippet the way "LPR3" has.

reader_note: >-
  Confirm the exact strings with `count(lprindberetningssystem)` before
  relying on "LPR2" or "LPR1" in a filter: they are well-established as
  concepts in this guide, but nobody has pasted the literal value back from
  DARTER the way pitfall 5 did for "LPR3". "MiniPAS" is safe to rely on,
  since kont_type.yaml's coalescing logic already depends on it being
  exactly that string. This column is unrelated to LPR_F vs LPR_A: that
  choice is made before you open a file, this one lives inside the file you
  already chose.
