id: mfr_levendefoedt_doedfoedt
name: "LevendefoedtDoedfoedt (MFR 2019+, live birth vs stillbirth)"
description: >-
  Whether the row in the 2019+ Medical Birth Register is a live birth or a
  stillbirth. The DST 1997-2018 "Levendefødte" table (`mfr.yaml`) only ever
  held live births, so this column is new: the 2019+ Nyfoedte table unifies
  both outcomes into one table for the first time.
source_url: https://sundhedsdatastyrelsen.dk/Media/638650989728109987/Dokumentation_Foedselsregisteret_2019_og_frem.xlsx
source_name: "Sundhedsdatastyrelsen: Dokumentation af Fødselsregisteret 2019 og frem, sheet Kolonner"

enumerated: true
values_complete: true
labels_complete: true
lookup:
  "1": {da: "Levendefødt", en: "Live birth"}
  "2": {da: "Dødfødt", en: "Stillbirth"}

provenance:
  source_url: https://sundhedsdatastyrelsen.dk/Media/638650989728109987/Dokumentation_Foedselsregisteret_2019_og_frem.xlsx
  source_type: dst_documentation
  verified_on: 2026-09-12
  verified_against: >-
    Kolonner sheet, row LevendefoedtDoedfoedt: "Om barnet er levendefødt
    eller dødfødt (1 = Levendefødt, 2 = Dødfødt)" verbatim.

reader_note: >-
  A query written against the old 1997-2018 "Levendefødte" table implicitly
  filtered to live births by construction. The same query pointed at
  `mfr_nyfoedte` without `LevendefoedtDoedfoedt == 1` will silently pull in
  stillbirths too. Apgarscore is set to 0 for every stillbirth rather than
  left missing, which will also distort a naive mean/summary of Apgar scores
  computed without this filter.
