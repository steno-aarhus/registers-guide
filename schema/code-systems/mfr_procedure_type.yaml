# Same trap as pattype.yaml/c_dodsmaade.yaml: code "P" is reused with a
# different meaning across the LPR3 cutover (Feb/March 2019). Before it, "P"
# means specifically "the main operation in a surgical procedure" (one of
# three operation roles: D/P/V). After it, "P" is just the generic word
# "Procedure" - LPR3 dropped the three-way D/P/V distinction entirely and
# replaced it with a two-way Indikation/Procedure split instead.

id: mfr_procedure_type
name: "ProcedureType (MFR 2019+ satellite tables)"
description: >-
  What role a procedure code plays on a Barn_Procedurer/Mor_Procedurer row.
  Reorganised at the LPR3 cutover: before it, a three-way split of surgical
  operation roles (partial/main-in-procedure/main-in-contact); after it, a
  two-way split of indication vs procedure. Code "P" survives the cutover
  but changes meaning, the same trap as `pattype` and `c_dodsmaade`.
source_url: https://sundhedsdatastyrelsen.dk/Media/638650989728109987/Dokumentation_Foedselsregisteret_2019_og_frem.xlsx
source_name: "Sundhedsdatastyrelsen: Dokumentation af Fødselsregisteret 2019 og frem, sheet Kolonner"

enumerated: true
values_complete: true
labels_complete: true
lookup:
  "I": {da: "Indikation", en: "Indication (post-LPR3 only)"}
  "P": {da: "Procedure (efter LPR3) / Vigtigste operation i et operativt indgreb (før LPR3)", en: "Procedure (post-LPR3) / Main operation within a surgical procedure (pre-LPR3)"}
  "D": {da: "Deloperation, anden operation(er) i et operativt indgreb", en: "Partial operation, other operation(s) within a surgical procedure (pre-LPR3 only)"}
  "V": {da: "Vigtigste operation i en afsluttet kontakt", en: "Main operation within a completed contact (pre-LPR3 only)"}
  "+": {da: "Tillægskode, Samhørende operation eller Sideangivelse (før LPR3) / Tillægskode, Anvendt kontrast, Handlingsspecifikation, Personalekategori eller Sideangivelse (efter LPR3)", en: "Add-on code (contrast used, staff category, laterality, and more - the exact add-on categories differ pre/post LPR3 too)"}

# Not a `periods:` block like pattype's, because the boundary isn't a date a
# consumer applies to a single flat lookup: it is which OTHER values exist
# alongside "P" in the same delivery. Use IndberetningsSystem (this table)
# or lprindberetningssystem (LPR3 tables) to tell the two apart, not the
# date alone - a delivery can hold both eras' rows side by side.
provenance:
  source_url: https://sundhedsdatastyrelsen.dk/Media/638650989728109987/Dokumentation_Foedselsregisteret_2019_og_frem.xlsx
  source_type: dst_documentation
  verified_on: 2026-09-12
  verified_against: >-
    Kolonner sheet, row ProcedureType (Barn_Procedurer and Mor_Procedurer,
    identical text), which spells out both eras' code sets explicitly in
    one cell rather than as separate documented periods.

reader_note: >-
  Reading "P" as one stable category across the whole table conflates "the
  main operation" (pre-LPR3, one of three specific operation roles) with
  "any procedure at all" (post-LPR3, the default value for most rows). This
  will inflate counts of "main operations" for LPR3-era rows if not checked
  against IndberetningsSystem first. See ProcedureType_Parent for the
  narrower set of types (post-LPR3: only "P"; pre-LPR3: D/P/V) that a "+"
  add-on can actually attach to.
