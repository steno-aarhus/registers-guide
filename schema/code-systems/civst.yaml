id: civst
name: "Civilstand (marital status)"
description: "Marital status in the CPR data behind BEF. Single-letter codes."
source_url: https://www.dst.dk/da/Statistik/dokumentation/Times/cpr-oplysninger/civst
values_complete: true
labels_complete: true
lookup:
  U: {da: "Ugift", en: "Never married"}
  G: {da: "Gift (+ separeret)", en: "Married (including separated)"}
  F: {da: "Skilt", en: "Divorced"}
  E: {da: "Enke/Enkemand", en: "Widowed"}
  P: {da: "Registreret partnerskab", en: "Registered partnership"}
  O: {da: "Ophævet partnerskab", en: "Dissolved partnership"}
  L: {da: "Længstlevende af 2 partnere", en: "Surviving partner of two"}
  D: {da: "Død", en: "Deceased"}
  9: {da: "Uoplyst civilstand", en: "Unknown marital status"}
provenance:
  source_url: https://www.dst.dk/da/Statistik/dokumentation/Times/cpr-oplysninger/civst
  source_type: dst_documentation
  verified_on: 2026-08-31
  verified_against: "DST Metadatabank (TIMES) variable page for CIVST"
note: >-
  P, O and L were introduced with the registered-partnership act of 1 October
  1989; before that date the set was smaller. Registered partnerships could no
  longer be entered into from 15 June 2012.
  Codes U, E, F, P, L, O, G, D were observed in the DARTER delivery on
  2026-08-31; code 9 was not, but it belongs to the register's value domain.
