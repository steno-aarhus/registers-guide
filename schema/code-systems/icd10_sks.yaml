id: icd10_sks
name: "ICD-10, Danish SKS form (D-prefixed)"
description: >-
  Diagnosis codes as the patient registers store them: the WHO code with the
  letter D in front, so WHO's E11 appears as DE11. This is an LPR form, not a
  property of Danish ICD-10 in general. The cause-of-death registers store the
  plain WHO code and use `icd10` instead.
source_url: https://medinfo.dk/sks/brows.php
source_name: "SKS browser (medinfo.dk)"

enumerated: false
values_complete: false
labels_complete: false
values_from:
  # sksr (CRAN) ships the published SKS, and its diagnosis branch carries the
  # D-prefixed form this system describes. An international source is the wrong
  # one here: it publishes the plain code (E119), which matches nothing in a
  # Danish diagnosis column.
  kind: package
  candidates: [sksr]
  dataset: SKS_labels
  filter: {column: Prefix, value: dia}
  verified: true
  verified_on: 2026-09-06
  verified_against: >-
    sksr 0.1.0: DE119 and DC509 resolve under Prefix 'dia'. Checked against
    codeCollection 0.1.3, which has E119 but not DE119.

lookup: null

structure:
  pattern: "D + letter + 2 digits, optionally followed by more digits"
  example: "DE11 = type 2 diabetes"

provenance:
  source_url: https://medinfo.dk/sks/brows.php
  source_type: nomenclature
  verified_on: 2026-09-01
  verified_against: "SKS browser"

reader_note: >-
  The D prefix is a Danish addition, not part of the WHO code. Matching WHO codes
  directly against LPR without allowing for it returns nothing. Do not carry the
  habit across to the cause-of-death registers: they hold the plain code, so
  stripping a D there removes the first real character instead.
