# Manner of death until 2001. Read the reader_note before using this: the codes
# are not the ones in c_dodsmaade_2002, and one code changed meaning on
# 1 January 1991, which is a date dodsaars spans.
#
# Two different fixes in this pair of files, not one: the 1991 date is handled
# WITHIN this file via `periods:` below (same mechanism as pattype.yaml,
# c_kontaars.yaml - one column, one register, meaning drifts over its own
# lifetime). The split into a SEPARATE c_dodsmaade_2002.yaml file exists for a
# different reason: dodsaars and dodsaasg are two different DST tables
# (t_dodsaarsag_1 vs t_dodsaarsag_2) with unrelated renumbered codes that only
# happen to share a column name - a single YAML `lookup:` cannot hold code "1"
# meaning both "Naturlig død" and "Voldshandling" at once, so two registers
# needing incompatible meanings for the same code forces two files. Use a
# `periods:` block for drift within one register/column; split files only when
# two different registers genuinely collide like this one does.

id: c_dodsmaade
name: "Doedsmaade, to 2001 (DAR t_dodsaarsag_1)"
description: >-
  How the person died, as coded in the FIRST cause-of-death table, which is what
  dodsaars holds. The set was reorganised on 1 January 1991, and the lookup below
  is the one in force from that date. A second, different set of numbers is used
  from 2002: see `c_dodsmaade_2002`.
source_url: https://www.esundhed.dk/-/media/Files/Dokumentation/Doedsaarsagsregisteret/17_Kodeark_DAR---pdf.ashx
source_page: https://www.esundhed.dk/Dokumentation/DocumentationExtended?id=17
source_name: "Kodeark for Doedsaarsagsregisteret"

enumerated: true
values_complete: true
labels_complete: true

lookup:
  "1": {da: "Naturlig død", en: "Natural death"}
  "2": {da: "Ulykke", en: "Accident"}
  "3": {da: "Selvmord", en: "Suicide"}
  "4": {da: "Drab/vold", en: "Homicide or violence"}
  "5": {da: "Uoplyst", en: "Not stated"}

# The full periodised table, straight from the DAR code sheet. YAML cannot hold
# the same key twice, so code 4 cannot appear in `lookup` under both meanings.
# This block keeps the fact machine-readable until the schema has a way to carry
# a value set that changes over time.
periods:
  - {code: "1", da: "Naturlig død",  valid_from: 1971-01-01, valid_to: null}
  - {code: "2", da: "Ulykke",        valid_from: 1971-01-01, valid_to: null}
  - {code: "3", da: "Selvmord",      valid_from: 1991-01-01, valid_to: null}
  - {code: "4", da: "Selvmord",      valid_from: 1977-01-01, valid_to: 1990-12-31}
  - {code: "4", da: "Drab/vold",     valid_from: 1991-01-01, valid_to: null}
  - {code: "5", da: "Uoplyst",       valid_from: 1991-01-01, valid_to: null}
  - {code: "6", da: "Drab/vold",     valid_from: 1971-01-01, valid_to: 1990-12-31}
  - {code: "9", da: "Uoplyst",       valid_from: 1971-01-01, valid_to: 1990-12-31}

provenance:
  source_url: https://www.esundhed.dk/-/media/Files/Dokumentation/Doedsaarsagsregisteret/17_Kodeark_DAR---pdf.ashx
  source_type: esundhed_kodeark
  verified_on: 2026-09-07
  verified_against: >-
    Kodeark for Doedsaarsagsregisteret, table t_dodsaarsag_1, variable
    c_dodsmaade, with Gyldig fra dato and Gyldig til dato per code.

reader_note: >-
  Two separate traps. First, this code set is NOT the one used from 2002: in
  dodsaasg the same column holds `c_dodsmaade_2002`, where 1 is Voldshandling
  rather than Naturlig død. Second, code 4 changed meaning. It was Selvmord
  until 31 December 1990 and Drab/vold from 1 January 1991. dodsaars runs from
  1970 to 2001 and so contains both, in one column, with nothing to tell them
  apart except the date of death. Reading code 4 as one thing across the whole
  register counts homicides as suicides or the reverse. Codes 6 (Drab/vold) and
  9 (Uoplyst) belong only to the old set and stop at the end of 1990; codes 3
  and 5 only start in 1991.
