# Tax-liability scope. Read this before filtering an income analysis: most
# published income statistics implicitly restrict to omfang=1.

id: omfang
name: "Omfang af skattepligt (AKM/Indkomst)"
description: >-
  How fully a person's tax and income data cover the year: fully liable both
  1 January and 31 December, moved during the year, died during the year, a
  child with no income, or one of a few edge cases the tax and settlement
  registers cannot reconcile. Not a demographic fact about the person, an
  administrative fact about how complete their income record is.
source_url: https://www.dst.dk/da/TilSalg/data-til-forskning/generelt-om-data/dokumentation-af-data/hoejkvalitetsvariable/Personers-tilknytning-til-arbejdsmarkedet-set-over-hele-aaret--AKM-/OMFANG
source_name: "DST high-quality variable documentation: OMFANG"

enumerated: true
values_complete: true
labels_complete: true
lookup:
  "0": {da: "Børn under 15 år og uden indkomst og formue (1998-2001)", en: null}
  "1": {da: "Fuldt skattepligtig og har bopæl både primo og ultimo året", en: null}
  "2": {da: "Har ikke boet i Danmark hele året, eller er død i løbet af året", en: null}
  "3": {da: "Findes i oplysningsseddelregisteret men ikke i slutligningsregisteret (fra 2002)", en: null}
  "4": {da: "Personer under 15 år uden indkomst, samt personer der ikke er skattepligtige", en: null}
  "5": {da: "Er død (bobehandlingskode) og ingen indkomst i slutligningsregisteret", en: null}
  "6": {da: "Indkomst usandsynlig for mindst en person i familien, kan ikke rettes konsistent", en: null}

provenance:
  source_url: https://www.dst.dk/da/TilSalg/data-til-forskning/generelt-om-data/dokumentation-af-data/hoejkvalitetsvariable/Personers-tilknytning-til-arbejdsmarkedet-set-over-hele-aaret--AKM-/OMFANG
  source_type: dst_documentation
  verified_on: 2026-09-09
  verified_against: "DST's Vaerdisaet table for OMFANG, all 7 codes"

reader_note: >-
  Code 2 changed meaning at the 2002 boundary: before 2002 (and again
  2002-2009) it also absorbed children under 15 with no income or wealth, a
  group that codes 0 and 4 cover separately in other years. Code 5 (died, not
  settled) only exists from 2002; before that, a death with no settled income
  was coded 2 instead. DST's own publications and statistikbanktabeller are
  restricted to omfang=1: an analysis that does not filter on it silently
  includes partial-year residents, the newly dead, and unsettled records
  alongside ordinary full-year taxpayers.
