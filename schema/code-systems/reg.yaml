provenance:
  source_url: https://www.dst.dk/da/Statistik/dokumentation/nomenklaturer/nuts
  source_type: nomenclature
  verified_on: 2026-11-23
  verified_against: >-
    DST's published classification, downloaded as CSV (level 1 of 'Regioner,
    landsdele og kommuner, v1:2007-'). Codes 81-85 and the Danish labels are DST's;
    DST writes the codes with a leading zero (081-085). Code 0 is not in that
    classification and has no public DST source, so it is unverified.
reader_note: >-
  DST's classification has no code for unknown. Code 0 is kept as a working
  assumption.

  Do not confuse these with AMT, the pre-2007 counties, which has 16 codes in
  the ranges 11-14, 21-24, 31-37 and 88. Different geography, different era.
