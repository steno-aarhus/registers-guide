note: >-
  Read from the format table in Geokoder/ on the DST server. The English labels
  are the Danish proper nouns unchanged, which is how the regions are normally
  referred to in English-language register research.
  Codes 81-85 were observed in the DARTER delivery on 2026-08-31; code 0 was
  not, but it belongs to the value domain.
  Do NOT confuse this with AMT (the pre-2007 counties), which has 16 codes in
  the ranges 11-14, 21-24, 31-37 and 88. Different geography, different era.
