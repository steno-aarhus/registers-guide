# Family type in BEF. The classification was reorganised in December 2015.

id: familie_type
name: "Familietype (BEF)"
description: >-
  The type of family a person belongs to, under the E-family concept used from
  1986. Four codes were added in December 2015 when married couples were split
  by sex and "Enlig" was separated from children not living at home.
source_url: https://www.dst.dk/da/TilSalg/data-til-forskning/generelt-om-data/dokumentation-af-data/hoejkvalitetsvariable/familier/familie-type
source_name: "DST high-quality variable documentation: familie-type"

enumerated: true
values_complete: true
labels_complete: true

lookup:
  "1": {da: "Ægtepar", en: "Married couple"}
  "2": {da: "Registreret partnerskab", en: "Registered partnership"}
  "3": {da: "Samlevende par", en: "Cohabiting couple"}
  "4": {da: "Samboende par", en: "Couple living together"}
  "5": {da: "Enlig (herunder også ikke hjemmeboende børn)", en: "Single, including children not living at home"}
  "7": {da: "Ægtepar forskellig køn", en: "Married couple, different sex"}
  "8": {da: "Ægtepar samme køn", en: "Married couple, same sex"}
  "9": {da: "Enlig", en: "Single"}
  "10": {da: "Ikke hjemmeboende børn", en: "Children not living at home"}

provenance:
  source_url: https://www.dst.dk/da/TilSalg/data-til-forskning/generelt-om-data/dokumentation-af-data/hoejkvalitetsvariable/familier/familie-type
  source_type: dst_documentation
  verified_on: 2026-09-07
  verified_against: "DST's own page for familie-type, nine codes with validity dates per code"

reader_note: >-
  There is no code 6, and the set changed in December 2015. Codes 7 and 8 split
  the old "Ægtepar" by sex, and codes 9 and 10 split the old "Enlig", which had
  included children not living at home. A series that crosses 2015 therefore
  changes composition without any code going missing: 1 and 5 stop being used
  and four new codes appear. The exact switch-over dates are on DST's page and
  should be read there before a study is dated around them.
