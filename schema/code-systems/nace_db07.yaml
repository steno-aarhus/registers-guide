# DB07/NACE Rev.2, current from 2007-2008. DST publishes the full
# classification as a CSV, but its codes are dotted (01.11.00) while AKM's
# columns hold them plain (011100), and even after stripping the dots the
# columns only partly overlap this file. Read reader_note before trusting a
# lookup against it.

id: nace_db07
name: "DB07 brancheklassifikation (industry, NACE Rev.2)"
description: >-
  Danish industry classification DB07, aligned with EU NACE Rev.2, current from
  2007-2008. Hierarchical: level 1 is a small set of broad sections, level 2
  the detailed code.
source_url: https://www.dst.dk/da/Statistik/dokumentation/nomenklaturer/db07
source_csv: https://www.dst.dk/klassifikationsbilag/5ccbf808-48a1-48ce-86b3-749115087feccsv_da
source_name: "DST's DB07 classification"

enumerated: false
values_complete: false
labels_complete: false
values_from:
  # DST's own classification, downloadable as CSV. 823 codes across 2 levels.
  # The CSV writes the detailed code with dots (01.11.00); AKM's columns hold
  # it plain (011100). Strip the dots before matching.
  kind: csv
  url: https://www.dst.dk/klassifikationsbilag/5ccbf808-48a1-48ce-86b3-749115087feccsv_da
  delimiter: ";"
  encoding: UTF-8-BOM
  code_column: KODE
  label_column: TITEL
  level_column: NIVEAU
  level: 2
  verified: true
  verified_on: 2026-09-09
  verified_against: >-
    Downloaded: 823 rows, 85 at NIVEAU 1 and 738 at NIVEAU 2, columns
    SEKVENS;KODE;NIVEAU;TITEL and six more, semicolon separated. Level-2 codes
    are written with dots (01.11.00), AKM's own columns hold the same code
    without them (011100).

lookup: null

provenance:
  source_url: https://www.dst.dk/da/Statistik/dokumentation/nomenklaturer/db07
  source_type: nomenclature
  verified_on: 2026-09-09
  verified_against: "DST classification DB07, downloaded as CSV"

reader_note: >-
  Two things to check before using this as a lookup. First, format: this file
  writes the detailed code with dots (01.11.00); nace_db07 and nace_db07_13
  hold it without them (011100). Second, coverage: checked against
  nace_db07's own value list on DST's high-quality variable page, only 490 of
  its 743 distinct codes match this file's 738 level-2 codes even after
  stripping dots. As with DISCO-08 (see disco08.yaml), the industry code for a
  given person-year can be sourced from more than one register, so a code
  absent from this CSV is not necessarily an error.
