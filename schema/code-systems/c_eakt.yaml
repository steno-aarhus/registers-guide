reader_note: >-
  2 of the 7 codes were REUSED with a different meaning, so the same number
  does not mean the same thing across the register. The lookup above gives the
  current meaning; the periods block gives both.
  Code 1: arbejdsulykke, then idræt, sport og motion from 01.01.1995.
  Code 2: ikke arbejdsulykke, then leg, hobby og and fritidsvirksomhed from 01.01.1995.
  Every code in this variable stops by 31.12.2003, so it says nothing about later
  contacts.
