id: mfr_rygerstatus
name: "Rygerstatus moder (MFR 1997-2018, two-digit code)"
description: >-
  The mother's smoking status in pregnancy as it arrives in DST's MFR
  (Levendefoedte) column rygerstatus_moder: a bare two-digit code. The nine
  categories are the same as in the tobaksforbrug code system, which keys them
  with the SKS prefix (DUT20, RGAB20). Here the prefix is absent, so a lookup
  against tobaksforbrug matches nothing unless the prefix is added or removed
  first.
source_url: https://static1.squarespace.com/static/5467abcce4b056d72594db79/t/5ebe7e6216f2563dd8fa85fb/1589542505453/DSOG-kodeliste+april_2020-1.pdf
source_name: "DSOG (Danish Society of Obstetrics and Gynaecology): kodeliste, April 2020"

enumerated: true
values_complete: true
labels_complete: true
lookup:
  "00": {da: "Moder ryger ikke", en: "Mother does not smoke"}
  "10": {da: "Moder ophørt med rygning i 1. trimester", en: "Mother stopped smoking in the 1st trimester"}
  "11": {da: "Moder ophørt med rygning efter 1. trimester", en: "Mother stopped smoking after the 1st trimester"}
  "20": {da: "Moder ryger op til 5 cigaretter dagligt", en: "Mother smokes up to 5 cigarettes daily"}
  "21": {da: "Moder ryger fra 6-10 cigaretter dagligt", en: "Mother smokes 6-10 cigarettes daily"}
  "22": {da: "Moder ryger fra 11-20 cigaretter dagligt", en: "Mother smokes 11-20 cigarettes daily"}
  "23": {da: "Moder ryger over 20 cigaretter dagligt", en: "Mother smokes more than 20 cigarettes daily"}
  "29": {da: "Moder ryger, mængde ikke oplyst", en: "Mother smokes, amount not stated"}
  "99": {da: "Moders rygestatus uoplyst", en: "Mother's smoking status not stated"}

provenance:
  source_url: https://static1.squarespace.com/static/5467abcce4b056d72594db79/t/5ebe7e6216f2563dd8fa85fb/1589542505453/DSOG-kodeliste+april_2020-1.pdf
  source_type: nomenclature
  verified_on: 2026-10-02
  verified_against: >-
    Three sources, read separately. (1) The nine codes and their meaning: the
    DSOG code list, April 2020, row "Rygestatus ved afslutning af graviditet"
    ("RGAB*: 00 ryger ikke, 10 ophørt 1. trim, 11 ophørt efter 1. trim, 20 < 5
    dgl, 21 6-10, 22 11-20, 23 >20, 29 ryger, mængde uoplyst, 99 rygestatus
    uoplyst"). (2) The label text: copied from the tobaksforbrug code system,
    whose labels come from SKS (res.tobaksgrav). SKS says "op til 5" for 20,
    which includes 5; DSOG's "< 5" is looser shorthand. (3) The categories in
    use from 1997: Lindbo et al. 2022, Clin Epidemiol 14:901-910,
    doi:10.2147/CLEP.S368826 (read in full via Europe PMC, PMC9329573). That
    the column holds the codes without a prefix, plus empty strings, is an
    observation from a delivery (September 2026), not something DST documents:
    DST's variable list gives only the variable name.

reader_note: >-
  Two kinds of missing, and R only sees one of them. 99 means the status was
  reported as unknown. An empty string ("") means nothing was recorded at all.
  is.na("") is FALSE, so empty strings pass every filter(!is.na(...)) and end
  up as their own category: convert them first with na_if(rygerstatus_moder,
  ""). Whether 99 and "" should be one missing category or two is a choice for
  the analysis.
