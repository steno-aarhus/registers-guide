id: atc
name: "ATC (Anatomical Therapeutic Chemical)"
description: >-
  The WHO classification of medicines. Five cumulative levels: 1 character
  (anatomical main group), 3 (therapeutic subgroup), 4 (pharmacological
  subgroup), 5 (chemical subgroup), 7 (chemical substance). Each level repeats
  the levels above it and adds characters, so C09AA05 contains C, C09, C09A and
  C09AA.
source_url: https://atcddd.fhi.no/atc/structure_and_principles/

enumerated: false
values_complete: false
labels_complete: false
lookup: null

structure:
  levels:
    - {level: 1, characters: 1, example: "C",       en: "anatomical main group"}
    - {level: 2, characters: 3, example: "C09",     en: "therapeutic subgroup"}
    - {level: 3, characters: 4, example: "C09A",    en: "pharmacological subgroup"}
    - {level: 4, characters: 5, example: "C09AA",   en: "chemical subgroup"}
    - {level: 5, characters: 7, example: "C09AA05", en: "chemical substance"}
  pattern: "letter, 2 digits, letter, letter, 2 digits"

provenance:
  source_url: https://atcddd.fhi.no/atc/structure_and_principles/
  source_type: nomenclature
  verified_on: 2026-08-31
  verified_against: "WHO Collaborating Centre for Drug Statistics Methodology"

reader_note: >-
  Filter on the full 7-character code, not on the level columns. `atc2` holds
  three characters, so a longer pattern matched against it can never match and
  returns nothing at all, with no error. The level columns are for grouping.
