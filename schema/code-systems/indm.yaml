reader_note: >-
  From 2014 this is what separates an emergency-room visit from an ordinary
  outpatient one, because `c_pattype` code `3` was discontinued and both arrive
  as `2`. Code `9` (Uoplyst) stops at the end of 2003, so a missing value after
  that is genuinely missing rather than coded as unknown.
