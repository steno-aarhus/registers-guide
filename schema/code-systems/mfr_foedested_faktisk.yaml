id: mfr_foedested_faktisk
name: "Foedested_Faktisk (MFR 2019+, actual place of birth)"
description: >-
  Where the child was actually born (as opposed to which institution
  reported the birth). A DST-local derived classification, not a raw SKS
  code: Sundhedsdatastyrelsen computes it from a mix of the SKS result code
  RGAE* (rows reported through LPR3) and the birth diagnosis code
  (FoedselsDiagnose_Barn, DZ38*/DZ381*/etc, for older or paper-reported
  rows), with several source-specific rules layered on top. See provenance
  for the exact derivation, which changes at the LPR3 cutover (Feb/March
  2019) and again at a 2012 boundary within the pre-LPR3 period.
source_url: https://sundhedsdatastyrelsen.dk/Media/638650989728109987/Dokumentation_Foedselsregisteret_2019_og_frem.xlsx
source_name: "Sundhedsdatastyrelsen: Dokumentation af Fødselsregisteret 2019 og frem, sheet Kolonner"

enumerated: true
values_complete: true
labels_complete: true
lookup:
  "1": {da: "Hospital", en: "Hospital"}
  "2": {da: "Fødeklinik", en: "Birth clinic"}
  "3": {da: "Hjem", en: "Home"}
  "4": {da: "Uden for hospital, fødeklinik og hjem", en: "Outside hospital, birth clinic and home"}
  "9": {da: "Uoplyst", en: "Not stated"}

provenance:
  source_url: https://sundhedsdatastyrelsen.dk/Media/638650989728109987/Dokumentation_Foedselsregisteret_2019_og_frem.xlsx
  source_type: dst_documentation
  verified_on: 2026-09-12
  verified_against: >-
    Kolonner sheet, row Foedested_Faktisk, full derivation text verbatim.
    Hospital: result RGAE01, or birth diagnosis DZ380*/DZ383*/DZ386*, or any
    stillbirth reported on the paper stillbirth form, or a stillbirth
    identifiable only from the mother's LPR birth contact (pre-LPR3 only).
    Fødeklinik: result RGAE05, or birth diagnosis DZ381Q. Hjem: result
    RGAE04, or (LPR-reported from 2012 on) diagnosis DZ381B*/DZ384B*/DZ387B*,
    or a home-birth paper form with a birth diagnosis other than DZ381Q.
    Uden for hospital/fødeklinik/hjem: result RGAE02, or (LPR-reported
    before 2012) diagnosis DZ381*/DZ384*/DZ387*, or (LPR-reported 2012 to
    the LPR3 cutover) diagnosis DZ381/DZ381A/DZ384/DZ384A/DZ387/DZ387A.
    Uoplyst: everything else, including result RGAE99 and diagnosis
    DZ382*/DZ385*/DZ388*.

reader_note: >-
  Do not try to derive this yourself from FoedselsDiagnose_Barn alone: the
  mapping from birth-diagnosis code to actual birthplace changed at two
  different boundaries (2012, and the LPR3 cutover in Feb/March 2019), and
  Sundhedsdatastyrelsen has already resolved that history into this single
  column. Recomputing it from the diagnosis code with only the current
  (post-2019) mapping will misclassify pre-2012 home births as "outside
  hospital, birth clinic and home".
