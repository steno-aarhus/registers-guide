# How the contact ended. Same shape as c_henm, and the same 2003 break: the
# codes for "discharged to a hospital unit" were replaced wholesale.

id: c_udm
name: "Udskrivningsmaade (LPR2 c_udm)"
description: >-
  How the contact ended and where the patient went. Only four codes cover the
  whole register; the rest each have their own window, and the way a discharge
  to another hospital unit is coded changes completely at the end of 2003.
