reader_note: >-
  Only codes 1, 8 and 9 reach back to 1987, and 9 stops in 2003. Discharge to
  another hospital unit is the trap: it was 3, 5, B or C until 2003 or 2004 and
  becomes F, G, K or L from 2004 onwards. Counting "discharged onwards to
  hospital" across the whole register therefore needs both sets, and either set
  alone gives a series with a hole in it. Codes 2, 4, 7 and A only begin in
  1995, E in 2002, and K and L in 2006.
