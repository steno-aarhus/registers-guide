reader_note: >-
  Only four codes cover the whole register: 0, 1, 2 and 8. Everything else has a
  window. Codes 3, 5, 9, B, C and D stop at the end of 2003 and 6 stops at the
  end of 1998, while F and G only begin in 2004, A in 1995 and E in 2002. The
  end of 2003 is a break: referrals from a hospital unit were coded 3, 5, B, C
  or D before it and F or G after it. Counting any of those across the whole
  period gives a number that changes for administrative reasons alone.
