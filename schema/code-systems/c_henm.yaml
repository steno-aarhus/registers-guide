# Referral source in LPR2. Read the reader_note: the coding was reorganised at
# the end of 2003, and seven codes stop there or earlier while two only start
# afterwards.

id: c_henm
name: "Henvisningsmaade (LPR2 c_henm)"
description: >-
  Where the patient was referred from. Almost every code carries its own
  validity window, and the set was restructured at the end of 2003, so the
  answer to "who referred this patient" is coded one way before 2004 and
  another way after.
source_url: https://www.esundhed.dk/-/media/Files/Dokumentation/Landspatientregisteret/5_Kodeark_LPR---pdf.ashx
source_page: https://www.esundhed.dk/Dokumentation/DocumentationExtended?id=5
source_name: "Kodeark for Landspatientregisteret"

enumerated: true
values_complete: true
labels_complete: true

lookup:
  "0": {da: "Ingen henvisning", en: "No referral"}
  "1": {da: "Henvist fra alment praktiserende læge", en: "Referred by a general practitioner"}
  "2": {da: "Henvist fra praktiserende speciallæge", en: "Referred by a practising specialist"}
  "3": {da: "Henvist fra eget heldøgnsafsnit eller eget deldøgnsafsnit", en: "Referred from the hospital's own inpatient or part-day unit"}
  "5": {da: "Henvist fra andet heldøgnsafsnit eller andet deldøgnsafsnit", en: "Referred from another inpatient or part-day unit"}
  "6": {da: "Henvist fra skadestue eller ambulatorium", en: "Referred from an emergency department or outpatient clinic"}
  "8": {da: "Herfødt", en: "Born at this hospital"}
  "9": {da: "Uoplyst", en: "Not stated"}
  "A": {da: "Andet", en: "Other"}
  "B": {da: "Eget ambulatorium", en: "The hospital's own outpatient clinic"}
  "C": {da: "Andet ambulatorium", en: "Another outpatient clinic"}
  "D": {da: "Skadestue", en: "Emergency department"}
  "E": {da: "Udlandet (kun direkte henvisninger)", en: "Abroad, direct referrals only"}
  "F": {da: "Henvist fra sygehusafsnit", en: "Referred from a hospital department"}
  "G": {da: "Henvist fra sygehusafsnit, venteforløb", en: "Referred from a hospital department, waiting course"}

