id: mfr_kilde_forael
name: "Kilde_Mor / Kilde_Far (MFR 2019+, source of the parent's record)"
description: >-
  Which data source a parent's information came from in the 2019+ Medical
  Birth Register (Nyfoedte.Kilde_Mor, Kilde_Far). Shared code between mother
  and father: both columns document the identical five values. Wider than
  the child's own Kilde_Barn code, which lacks "from CPR" and "not stated"
  since a birth always has a determinable source but a parent's identity
  sometimes does not.
source_url: https://sundhedsdatastyrelsen.dk/Media/638650989728109987/Dokumentation_Foedselsregisteret_2019_og_frem.xlsx
source_name: "Sundhedsdatastyrelsen: Dokumentation af Fødselsregisteret 2019 og frem, sheet Kolonner"

enumerated: true
values_complete: true
labels_complete: true
lookup:
  "1": {da: "Landspatientregisteret (LPR)", en: "National Patient Register (LPR)"}
  "2": {da: "Hjemmefødselsblanket", en: "Home/clinic birth paper form"}
  "3": {da: "Dødfødselsblanket", en: "Stillbirth paper form"}
  "4": {da: "CPR", en: "Civil Registration System (CPR)"}
  "9": {da: "Uoplyst", en: "Not stated"}

provenance:
  source_url: https://sundhedsdatastyrelsen.dk/Media/638650989728109987/Dokumentation_Foedselsregisteret_2019_og_frem.xlsx
  source_type: dst_documentation
  verified_on: 2026-09-12
  verified_against: >-
    Kolonner sheet, rows Kilde_Mor and Kilde_Far, identical text: "Kilde til
    oplysning om moren/faren (1 = LPR, 2 = Hjemmefødselsblanket, 3 =
    Dødfødselsblanket, 4 = CPR, 9 = Uoplyst)" verbatim for both.

reader_note: >-
  "9 = Uoplyst" exists for a parent (most often the father) but has no
  counterpart on the child's own Kilde_Barn: a birth with no determinable
  source simply is not in the register at all. Treat Kilde_Far == "9" as a
  real, common case (unknown paternity), not a data-quality flag to filter
  out.
