reader_note: >-
  All codes are valid from 1 January 2005. Only code 10 has an end date, 31
  December 2006. General practice appears as 80 and as the subdivided codes 70
  to 79 (daytime or evening, consultation, telephone, e-mail, home visit). DST
  says it makes that subdivision itself for its published contact tables, and
  that SSSY has the same split in spec80 from 2023, so check which of 70 to 80
  your delivery holds before you filter on general practice. From 2021 DST no
  longer registers after-hours doctor contacts under 83, and the group 03
  (diagnostic radiology, Copenhagen) is placed under diagnostic radiology (DST,
  Lægebesøg, comparability over time). Laboratory contacts fall sharply from
  2015 to 2016 because general practitioners' blood tests in the Capital Region
  moved to Region Hovedstaden's hospitals on 1 January 2016 (DST, SPEC2).
