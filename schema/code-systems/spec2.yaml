id: spec2
name: "2-cifret speciale (SPEC2)"
description: >-
  The two-digit specialty of the provider in the Health Insurance Register:
  general practice, specialists, dentists, physiotherapy, laboratories and so
  on. It is the first two digits of the six-digit speciale. Danish labels are
  DST's own wording and are kept as published, including abbreviations and
  internal names. The English labels are translations of that text, not of the
  specialty itself.
source_url: https://www.dst.dk/da/Statistik/dokumentation/Times/sygesikringsstatistik/spec2
source_name: "DST's TIMES page for SPEC2 (value set D280450.TXT_SPEC2)"

enumerated: true
values_complete: true
labels_complete: true

