id: sks
name: "SKS procedure codes"
description: >-
  Sundhedsvaesenets Klassifikations System. The procedure branch of the same
  classification that supplies diagnosis codes, used in LPR_SKSOPR and
  LPR_SKSUBE. Surgical procedures sit under K, examinations and other
  non-surgical procedures under the remaining letters.
source_url: https://medinfo.dk/sks/brows.php
source_name: "SKS browser (medinfo.dk)"

enumerated: false
values_complete: false
labels_complete: false
values_from:
  # sksr (CRAN) ships the published SKS. The procedure branch is Prefix 'opr'
  # and keeps the leading K, which is the form the columns hold.
  kind: package
  candidates: [sksr]
  dataset: SKS_labels
  filter: {column: Prefix, value: opr}
  verified: true
  verified_on: 2026-09-06
  verified_against: "sksr 0.1.0: KJEA00 resolves to Appendectomia under Prefix 'opr'."

lookup: null

structure:
  pattern: "letter + 3 or more alphanumeric characters, hierarchical from the left"
  example: "KJEA00 = appendectomy"

provenance:
  source_url: https://medinfo.dk/sks/brows.php
  source_type: nomenclature
  verified_on: 2026-09-01
  verified_against: "SKS browser"

reader_note: >-
  The codes are hierarchical, so a prefix match selects a whole branch. That also
  makes it easy to select more than you meant: check how many characters your
  intended group actually needs before filtering with starts_with().
