# ICD-8, the classification the patient registers used BEFORE ICD-10. It has no
# entry of its own in the guide's sources because it is retired, but it is still
# sitting in the data: LPR2 reaches back to 1977 and Denmark did not change over
# until 1994.

id: icd8
name: "ICD-8"
description: >-
  Diagnosis codes as the patient registers stored them before 1994. Pure digits,
  no letter and no decimal point, so 446.30 is written 44630. Nothing about them
  looks like ICD-10, which is what makes them easy to mistake for a broken
  column rather than a different classification.
source_url: https://www.dst.dk/da/Statistik/dokumentation/nomenklaturer
source_name: "Retired classification, no current DST page"

enumerated: false
values_complete: false
labels_complete: false
values_from:
  # Not published anywhere machine readable that has been found. sksr carries
  # current SKS, which no longer includes the retired ICD-8 diagnosis codes.
  kind: none

lookup: null

structure:
  pattern: "3 digits, optionally followed by 2 more, no letter and no decimal point"
  example: "44630 = 446.30, polyarteritis nodosa"

provenance:
  source_type: nomenclature
  verified_on: 2026-09-06
  verified_against: >-
    Observed in a DST delivery: lpr_diag c_diag is pure digits in 1990 and 1993
    and D-prefixed ICD-10 in 1994, so the changeover is 1994.

reader_note: >-
  A study whose period starts before 1994 is reading two classifications out of
  one column. ICD-10 codes match nothing in the early years, and the usual
  substr(c_diag, 2, 4) returns a meaningless fragment of an ICD-8 code rather
  than failing, so nothing tells you it went wrong.
