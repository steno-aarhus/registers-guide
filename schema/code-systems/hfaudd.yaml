id: hfaudd
name: "DISCED-15 AUDD (completed education)"
description: >-
  The code for a completed education under DISCED-15. Four digits identifying
  which education, not how long or how high it is. DISCED-15 has a separate code
  for an ongoing or interrupted education (UDD).
source_url: https://www.dst.dk/da/Statistik/dokumentation/nomenklaturer/disced15-audd
source_name: "DST's DISCED-15 classification"

enumerated: false
values_complete: false
labels_complete: false
values_from:
  # DISCED-15 has 4,621 codes. DST publishes it under nomenklaturer, but the
  # per-code list has not been located as a single downloadable file. A value
  # table does exist for this variable specifically, on DST's high-quality
  # variable page below: 3,545 codes, 2,966 with a Danish label, none with a
  # Fra/Til dato despite the column headers, and no English text at all. This
  # is a source to browse, not a file this loader can read, so kind
  # stays `none` (checked 2026-09-09: not transcribed here, by choice).
  kind: none
  note: "Browse the values by hand at the URL below."
  url: https://www.dst.dk/da/TilSalg/data-til-forskning/generelt-om-data/dokumentation-af-data/hoejkvalitetsvariable/Hoejst-fuldfoerte-uddannelse/HFAUDD

lookup: null

provenance:
  source_url: https://www.dst.dk/da/Statistik/dokumentation/nomenklaturer/disced15-audd
  source_type: nomenclature
  verified_on: 2026-08-31
  verified_against: "DST classification DISCED-15 AUDD"

reader_note: >-
  This is an identifier, not a scale. The level (short, medium, long) has to be
  looked up in a separate table, and cannot be read off the digits: 4112 is an
  electrician, and taking the first two digits as a level code makes it a long
  higher education. DST documents the ongoing-education codes separately as
  DISCED-15 UDD.
