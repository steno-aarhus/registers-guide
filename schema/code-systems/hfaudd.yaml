id: hfaudd
name: "DISCED-15 AUDD (completed education)"
description: >-
  The code for a completed education under DISCED-15. Four digits identifying
  which education, not how long or how high it is. DISCED-15 has a separate code
  for an ongoing or interrupted education (UDD).
source_url: https://www.dst.dk/da/Statistik/dokumentation/nomenklaturer/disced15-audd
source_name: "DST's DISCED-15 classification"

enumerated: false
values_complete: false
labels_complete: false
values_from:
  # DISCED-15 has 4,621 codes. DST publishes it under nomenklaturer, but the
  # per-code list has not been located as a single downloadable file.
  kind: none
  note: "No machine-readable source found. See source_url for the human one."

lookup: null

