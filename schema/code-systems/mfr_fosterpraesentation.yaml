# Two different facts here, two different sources - do not conflate them:
# 1. WHICH classification a value belongs to, and what it means: SKS itself
#    (Sundhedsvæsenets Klassifikationssystem), a Sundhedsdatastyrelsen
#    classification named "Klassifikation: fosterpræsentation [res.praesent]"
#    for the RGAD codes. Browsable at medinfo.dk/sks/brows.php, the same
#    authority kont_type.yaml cites. THAT is what defines what "RGAD07"
#    means, not the MFR documentation.
# 2. That THIS column (Nyfoedte.Fosterpraesentation) uses that
#    classification, via two prefixes either side of the LPR3 cutover:
#    confirmed separately by Sundhedsdatastyrelsen's MFR 2019+
#    documentation (see provenance below), which does NOT itself define any
#    per-code label.

id: mfr_fosterpraesentation
name: "Fosterpraesentation (MFR, fetal presentation at birth)"
description: >-
  The child's position in the uterus during birth, as coded in the Medical
  Birth Register (Nyfoedte.Fosterpraesentation, and the Barn satellite
  tables). Same dual-prefix pattern as `tobaksforbrug`: DUP* is a diagnosis
  add-on code used before the LPR3 cutover (Feb/March 2019), RGAD* is a
  result code (result type RDA34) used from that cutover on. The numeric
  suffix is identical across both, only the prefix changed.
source_url: https://medinfo.dk/sks/brows.php
source_name: "Sundhedsdatastyrelsen: SKS Browser, classification res.praesent / dia DUP (fosterpræsentation)"

enumerated: true
values_complete: true
labels_complete: true
# I could not browse medinfo.dk/sks/brows.php interactively to pull the
# res.praesent/dia DUP classification's entries myself (it is a search
# form, not a linkable page per classification). sksr::SKS_labels is a CRAN
# package that mirrors SKS's own export and is the actual mechanism used to
# read these 34 labels below - it is not itself the authority, SKS is, but
# it is the only access this file's values actually rest on. If a specific
# label matters for a real analysis, verify it directly against the SKS
# Browser rather than trusting this file alone.
values_from:
  kind: package
  candidates: [sksr]
  dataset: SKS_labels
  # Not a single column/value match like kont_type.yaml's: reproduce with
  # SKS_labels %>% filter(grepl("^DUP", Kode) | grepl("^RGAD", Kode)).
  filter: {column: Kode, value: "^DUP|^RGAD"}
  verified: true
  verified_on: 2026-09-12
  verified_against: >-
    sksr 0.1.0, SKS_labels filtered to Kode matching ^DUP or ^RGAD: 17
    DUP-prefixed labels (01-16, 99) under both Prefix "dia" and "til", and
    17 RGAD-prefixed labels (01-16, 99) under Prefix "res", pairwise
    identical (e.g. DUP07 and RGAD07 both "ren sædepræsentation"). DUP99 is
    labelled "fosterpræsentation uden specifikation" versus RGAD99's
    "fosterpræsentation uoplyst" - the only pair that is not word-for-word
    identical, though both plainly mean "not stated/specified".
lookup:
  "DUP01": {da: "regelmæssig baghovedstilling", en: "Regular occiput presentation"}
  "RGAD01": {da: "regelmæssig baghovedstilling", en: "Regular occiput presentation"}
  "DUP02": {da: "uregelmæssig baghovedstilling", en: "Irregular occiput presentation"}
  "RGAD02": {da: "uregelmæssig baghovedstilling", en: "Irregular occiput presentation"}
  "DUP03": {da: "dyb tværstand", en: "Deep transverse arrest"}
  "RGAD03": {da: "dyb tværstand", en: "Deep transverse arrest"}
  "DUP04": {da: "forissepræsentation", en: "Brow presentation (anterior fontanelle)"}
  "RGAD04": {da: "forissepræsentation", en: "Brow presentation (anterior fontanelle)"}
  "DUP05": {da: "pandepræsentation", en: "Brow presentation"}
  "RGAD05": {da: "pandepræsentation", en: "Brow presentation"}
  "DUP06": {da: "ansigtspræsentation", en: "Face presentation"}
  "RGAD06": {da: "ansigtspræsentation", en: "Face presentation"}
  "DUP07": {da: "ren sædepræsentation", en: "Frank breech presentation"}
  "RGAD07": {da: "ren sædepræsentation", en: "Frank breech presentation"}
  "DUP08": {da: "fuldstændig sæde-fod-præsentation", en: "Complete breech presentation"}
  "RGAD08": {da: "fuldstændig sæde-fod-præsentation", en: "Complete breech presentation"}
  "DUP09": {da: "ufuldstændig sæde-fod-præsentation", en: "Incomplete breech presentation"}
  "RGAD09": {da: "ufuldstændig sæde-fod-præsentation", en: "Incomplete breech presentation"}
  "DUP10": {da: "fodpræsentation", en: "Footling presentation"}
  "RGAD10": {da: "fodpræsentation", en: "Footling presentation"}
  "DUP11": {da: "anden underkropspræsentation", en: "Other breech presentation"}
  "RGAD11": {da: "anden underkropspræsentation", en: "Other breech presentation"}
  "DUP12": {da: "tværleje/skråleje", en: "Transverse/oblique lie"}
  "RGAD12": {da: "tværleje/skråleje", en: "Transverse/oblique lie"}
  "DUP13": {da: "høj lige stand", en: "High direct occiput position"}
  "RGAD13": {da: "høj lige stand", en: "High direct occiput position"}
  "DUP14": {da: "asynklitisk hovedpræsentation", en: "Asynclitic vertex presentation"}
  "RGAD14": {da: "asynklitisk hovedpræsentation", en: "Asynclitic vertex presentation"}
  "DUP15": {da: "uspecificeret hovedpræsentation", en: "Unspecified vertex presentation"}
  "RGAD15": {da: "uspecificeret hovedpræsentation", en: "Unspecified vertex presentation"}
  "DUP16": {da: "uspecificeret underkropspræsentation", en: "Unspecified breech presentation"}
  "RGAD16": {da: "uspecificeret underkropspræsentation", en: "Unspecified breech presentation"}
  "DUP99": {da: "fosterpræsentation uden specifikation", en: "Fetal presentation, not specified"}
  "RGAD99": {da: "fosterpræsentation uoplyst", en: "Fetal presentation, not stated"}

provenance:
  source_url: https://medinfo.dk/sks/brows.php
  source_type: dst_documentation
  verified_on: 2026-09-12
  verified_against: >-
    Two separate claims, verified separately, do not read this as one
    citation covering both. (1) The VALUES below (34 labels) come from
    sksr::SKS_labels filtered to Kode matching ^DUP or ^RGAD: 17
    DUP-prefixed labels (01-16, 99) under Prefix "dia"/"til", and 17
    RGAD-prefixed labels (01-16, 99) under Prefix "res", pairwise identical
    bar DUP99/RGAD99's wording (both "not specified/stated" in substance).
    I did not independently browse medinfo.dk/sks/brows.php for this
    specific classification myself; sksr is a CRAN package mirroring that
    data, not a first-hand read of the live site. (2) That Nyfoedte's
    Fosterpraesentation column actually USES these two code families, and
    the LPR3 cutover date, is confirmed separately by Sundhedsdatastyrelsen's
    own MFR 2019+ documentation (Dokumentation_Foedselsregisteret_2019_og_frem.xlsx,
    Kolonner sheet, row Fosterpraesentation) - which names the prefixes and
    the cutover but does NOT itself give any per-code label.

reader_note: >-
  Recorded on the child's own fødselskontakt (or as an add-on to it before
  LPR3), not the mother's, even though fetal presentation is clinically a
  fact about the pregnancy and delivery. Join through DW_EK_Nyfoedt if
  cross-referencing against Barn_* satellite tables, not DW_EK_Foedsel.
