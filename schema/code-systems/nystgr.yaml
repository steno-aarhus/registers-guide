reader_note: >-
  Retired in 1995 and replaced by DISCO. A code's meaning can shift within the
  window a study covers: DST's own page notes that code 5100 changed meaning
  in 1992 (the group it now names used code 5500 before that year), so a
  series spanning 1992 needs the year-by-year note on the source page, not
  just the current label.
