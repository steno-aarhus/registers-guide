name: "Stillingsgruppering, 1980-1995 (AKM)"
description: >-
  A four-digit occupation/position grouping used before DISCO. The first digit
  marks the broad labour-market position (self-employed, employee, out of the
  labour force and so on), the rest the specific occupation within it.
