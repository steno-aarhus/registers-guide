reader_note: >-
  4 of the 10 codes were REUSED with a different meaning, so the same number
  does not mean the same thing across the register. The lookup above gives the
  current meaning; the periods block gives both.
  Code 1: anden afdeling, then hjemmet ekskl. døgnistitution from 01.01.1995.
  Code 2: andet sygehus, then psykiatrisk hospital/sygehusafdeling from 01.01.1995.
  Code 3: alderdoms- eller plejehjem, then psykiatrisk dag/nathospital from 01.01.1995.
  Code 5: skadestue, then plejehjem/institution from 01.01.1995.
  Every code in this variable stops by 31.12.2000, so it says nothing about later
  contacts.
