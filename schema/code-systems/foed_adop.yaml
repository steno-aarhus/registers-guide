id: foed_adop
name: "Forælderrelation (MOR_FOED_ADOP, FAR_FOED_ADOP)"
description: >-
  Whether the registers point to an adoptive or other non-biological relation
  between a child and its first mother (mor1) or first father (far1) in the
  fertility database. One value set is shared by the mother and father columns.
source_url: https://www.dst.dk/da/Statistik/dokumentation/Times/fertilitetsdatabasen/mor-foed-adop
source_name: "DST TIMES documentation: MOR_FOED_ADOP (value set D101500.TXT_FER_FOED_ADOP)"

enumerated: true
values_complete: true
labels_complete: true
lookup:
  "0": {da: "Ingen forælder på pladsen", en: "No parent in that slot"}
  "11": {da: "Adoptivrelation iflg. Adoptionsregister", en: "Adoptive relation according to the Adoption Register"}
  "12": {da: "Barn i Adoptionsregister, men adoptivrelationen kan være med anden forælder", en: "Child in the Adoption Register, but the adoptive relation may be to the other parent"}
  "14": {da: "Forælder har andet køn (far er kvinde eller mor er mand)", en: "Parent has the other sex (father is a woman or mother is a man)"}
  "15": {da: "Adoptionsmarkering i CPR", en: "Adoption marker in CPR"}
  "16": {da: "Kun mødre: CPR-relation er først gældende fra efter barnet er 30 dage gammelt", en: "Mothers only: the CPR relation is valid only from after the child is 30 days old"}
  "17": {da: "Kun mødre: Adoptionsmarkering i tidligere FTDB", en: "Mothers only: adoption marker in the earlier fertility database (FTDB)"}
  "18": {da: "Kun mødre til børn født efter 1. januar 1991: Barnet er fødselsregistreret i udlandet, mens mor er bosiddende i DK", en: "Mothers of children born after 1 January 1991 only: the child's birth is registered abroad while the mother lives in Denmark"}
  "21": {da: "Forælder registreret kort efter fødsel", en: "Parent registered shortly after birth"}
  "22": {da: "Forælder registreret kort efter fødsel, barnet adopteret efterfølgende", en: "Parent registered shortly after birth, child adopted afterwards"}
  "23": {da: "Forælder registreret kort efter fødsel, barnet adopteret efterfølgende, adoption ophævet", en: "Parent registered shortly after birth, child adopted afterwards, adoption annulled"}
  "31": {da: "Barn er indvandrer", en: "Child is an immigrant"}
  "32": {da: "Barn er fødselsregistreret i udlandet", en: "Child's birth is registered abroad"}
  "33": {da: "Barn født før 1973", en: "Child born before 1973"}
  "35": {da: "Barn født i udlandet eller før 1973 og efterfølgende adopteret", en: "Child born abroad or before 1973 and adopted afterwards"}
  "39": {da: "Øvrige forælderrelationer", en: "Other parent relations"}

provenance:
  source_url: https://www.dst.dk/da/Statistik/dokumentation/Times/fertilitetsdatabasen/mor-foed-adop
  source_type: dst_documentation
  verified_on: 2026-11-23
  verified_against: >-
    DST's value set on the MOR_FOED_ADOP and FAR_FOED_ADOP pages, read directly.
    Both pages list the same 16 codes.
  guide_page: family-links.qmd

reader_note: >-
  DST groups the codes: 11-18 presumed non-biological, 21-23 presumed
  biological, 30-39 other (born abroad, born before 1973, or no sign of adoption
  or early registration). The relation is presumed, since DST says a biological
  relation can only be determined with a DNA test. The variable cannot be used to
  count adoptions. In version 2 of the tables for reference years 2019-2023 both
  columns are set to unknown (99), a value that is not in DST's list. The
  grouping text for the father column gives 1991 instead of 1973 as the cut-off
  for the group 30-39.
