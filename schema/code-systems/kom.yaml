id: kom
name: "Kommunekode (municipality code)"
description: >-
  Municipality of residence. Three-digit codes. 98 municipalities since the 2007
  reform, which replaced the previous 271. Christiansø (411) is not under a
  municipality but administered directly by the state.
source_url: https://www.dst.dk/da/Statistik/dokumentation/nomenklaturer/nuts

# Large enumerated system: linked out rather than transcribed. See note.
enumerated: false
values_complete: false
labels_complete: false
lookup: null

