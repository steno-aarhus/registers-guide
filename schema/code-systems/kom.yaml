id: kom
name: "Kommunekode (municipality code)"
description: >-
  Municipality of residence. Three-digit codes. 98 municipalities since the 2007
  reform, which replaced the previous 271. Christiansø (411) is not under a
  municipality but administered directly by the state.
source_url: https://www.dst.dk/da/Statistik/dokumentation/nomenklaturer/amt-kom
source_csv: https://www.dst.dk/klassifikationsbilag/e6e3c1d3-df3b-4e69-bc2b-c5d3f343833ccsv_da
source_name: "DST's municipality classification"

# Large system spanning two eras: the full classification is linked out rather
# than transcribed (see note under values_from). The current, post-2007 subset
# is transcribed below in `lookup:`, so a consumer can sample an era-safe
# municipality without reading the mixed-era CSV at all.
#
# This is the same idea as `periods:` (see pattype.yaml, c_kontaars.yaml) -
# one code_system, values keyed to a validity window - just deliberately
# incomplete: only the current period is filled in, because the ~180 pre-2007
# codes would need their own full transcription to do properly, and nothing
# has needed that yet. Extend with a `periods:` block if a pre-2007 kom value
# is ever actually needed, rather than reaching for a second file - the
# pattype/c_dodsmaade split is for genuinely different classifications
# sharing a column name, not for "haven't gotten to the old data yet".
enumerated: false
values_complete: false
labels_complete: false
values_from:
  # DST's own classification, downloadable as CSV. Level 2 is the municipalities;
  # level 1 is the old counties. 278 codes, covering both sides of the 2007
  # reform, which is what a register reaching back to 1985 needs.
  kind: csv
  url: https://www.dst.dk/klassifikationsbilag/e6e3c1d3-df3b-4e69-bc2b-c5d3f343833ccsv_da
  delimiter: ";"
  encoding: UTF-8-BOM
  code_column: KODE
  label_column: TITEL
  level_column: NIVEAU
  level: 2
  verified: true
  verified_on: 2026-09-06
  verified_against: >-
    Downloaded: 293 rows, 278 at NIVEAU 2 and 15 at NIVEAU 1, columns
    SEKVENS;KODE;NIVEAU;TITEL and five more, semicolon separated.
  # But the 278 are NOT one era. Pre-reform municipalities sit beside current
  # ones with nothing to tell them apart: 849 Aabybro and 861 Aars were
  # abolished in 2007 and appear next to 851 Aalborg, and GENERELLE_NOTER is
  # empty on all three. There is no validity column in the file. A consumer that
  # draws from all 278 will emit municipalities that stopped existing in 2007.
  mixes_eras: true

# The 98 current municipalities plus Christiansø (411). Current-only by
# construction: DST Statbank's FOLK1A table, variable OMRÅDE, only lists valid
# present-day areas - it cannot contain an abolished pre-2007 code, unlike the
# values_from CSV above. Fetched 2026-09-09 from
# https://api.statbank.dk/v1/tableinfo/FOLK1A?lang=da and ?lang=en (99 rows
# each, da/en code sets identical). Cross-checked by name against
# da.wikipedia.org/wiki/Danmarks_kommuner: all 98 municipality names matched:
# https://api.statbank.dk/v1/tableinfo/FOLK1A?lang=en
# https://api.statbank.dk/v1/tableinfo/FOLK1A?lang=da
#
# 707 and 849 are reused codes (see values_from note above): confirmed here as
# their CURRENT meaning, Norddjurs and Jammerbugt, not the pre-2007
# municipality the bilag CSV also attaches to that number.
#
# Christiansø (411) is not a municipality (see description above), but it is a
# real value a kom column can hold, and OMRÅDE lists it as its own area code
# alongside the 98. Included here so a consumer sampling from this lookup gets
# a label instead of hitting an unhandled code.
