id: kom
name: "Kommunekode (municipality code)"
description: >-
  Municipality of residence. Three-digit codes. 98 municipalities since the 2007
  reform, which replaced the previous 271. Christiansø (411) is not under a
  municipality but administered directly by the state.
source_url: https://www.dst.dk/da/Statistik/dokumentation/nomenklaturer/amt-kom
source_csv: https://www.dst.dk/klassifikationsbilag/e6e3c1d3-df3b-4e69-bc2b-c5d3f343833ccsv_da
source_name: "DST's municipality classification"

# Large enumerated system: linked out rather than transcribed. See note.
enumerated: false
values_complete: false
labels_complete: false
values_from:
  # DST's own classification, downloadable as CSV. Level 2 is the municipalities;
  # level 1 is the old counties. 278 codes, covering both sides of the 2007
  # reform, which is what a register reaching back to 1985 needs.
  kind: csv
  url: https://www.dst.dk/klassifikationsbilag/e6e3c1d3-df3b-4e69-bc2b-c5d3f343833ccsv_da
  delimiter: ";"
  encoding: UTF-8-BOM
  code_column: KODE
  label_column: TITEL
  level_column: NIVEAU
  level: 2
  verified: true
  verified_on: 2026-09-06
  verified_against: >-
    Downloaded: 293 rows, 278 at NIVEAU 2 and 15 at NIVEAU 1, columns
    SEKVENS;KODE;NIVEAU;TITEL and five more, semicolon separated.
  # But the 278 are NOT one era. Pre-reform municipalities sit beside current
  # ones with nothing to tell them apart: 849 Aabybro and 861 Aars were
  # abolished in 2007 and appear next to 851 Aalborg, and GENERELLE_NOTER is
  # empty on all three. There is no validity column in the file. A consumer that
  # draws from all 278 will emit municipalities that stopped existing in 2007.
  mixes_eras: true

lookup: null

provenance:
  source_url: https://www.dst.dk/da/Statistik/dokumentation/nomenklaturer/amt-kom
  source_type: nomenclature
  verified_on: 2026-08-31
  verified_against: "DST classification 'Regioner, landsdele og kommuner, v1:2007-'"
reader_note: >-
  These codes are valid from 1 January 2007. A study reaching further back needs
  the pre-reform classification, where the same number can mean a different
  municipality.
