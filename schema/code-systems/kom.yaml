provenance:
  source_url: https://www.dst.dk/da/Statistik/dokumentation/nomenklaturer/amt-kom
  source_type: nomenclature
  verified_on: 2026-09-09
  verified_against: >-
    DST classification 'Regioner, landsdele og kommuner, v1:2007-' (general
    source, unchanged). The `lookup:` values were separately verified against
    DST Statbank's FOLK1A table, variable OMRÅDE (da+en, 99 rows each,
    inherently current-only) and cross-checked by name against
    da.wikipedia.org/wiki/Danmarks_kommuner (all 98 municipality names
    matched).
reader_note: >-
  These codes are valid from 1 January 2007. A study reaching further back needs
  the pre-reform classification, where the same number can mean a different
  municipality - confirmed for two reused codes against a current-only DST
  source: 707 is Norddjurs today, not its pre-2007 meaning, and likewise 849 is
  Jammerbugt. `lookup:` below covers only this post-2007 set (99 entries), not
  the full 278-code `values_from` file.

  Christiansø (411) is included in `lookup:` even though it is not a
  municipality (see description above): it is a real value a `kom` column can
  hold, and DST's own current-only classification lists it as its own area
  code alongside the 98 municipalities. Excluding it would just move the
  "unhandled code" problem this fix is meant to solve onto that one value.
