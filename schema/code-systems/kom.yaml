note: >-
  The full list is NOT reproduced here, deliberately. DST publishes it as an
  official classification with a CSV download, and 98 codes transcribed by hand
  or through a fetched summary is 98 chances to introduce an error that nobody
  would ever notice. Follow source_url.
  If a consumer needs the codes inline later, add them FROM THE CSV, not from
  prose.
  Version matters: these codes are valid from 1 January 2007. A study reaching
  further back needs the pre-reform classification
  (https://www.dst.dk/da/Statistik/dokumentation/nomenklaturer/amt-kom), where
  the same number can mean a different municipality. This is the same trap as
  AMT versus REG.
  On the DST server the format table is named in the guide as
  Geokoder/c_kom_v4_t.sas7bdat, with columns START and KOM_V4_T.
