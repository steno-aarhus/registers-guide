id: mfr_diagnose_type
name: "DiagnoseType (MFR 2019+ satellite tables)"
description: >-
  What role a diagnosis code plays on a Barn_Diagnoser/Mor_Diagnoser row: the
  action diagnosis for the contact, a secondary diagnosis, a contact reason,
  or one of several add-on/qualifier roles. Stable across the LPR3 cutover,
  unlike ProcedureType (see mfr_procedure_type.yaml).
source_url: https://sundhedsdatastyrelsen.dk/Media/638650989728109987/Dokumentation_Foedselsregisteret_2019_og_frem.xlsx
source_name: "Sundhedsdatastyrelsen: Dokumentation af Fødselsregisteret 2019 og frem, sheet Kolonner"

enumerated: true
values_complete: true
labels_complete: true
lookup:
  "A": {da: "Aktionsdiagnose", en: "Action diagnosis"}
  "B": {da: "Bidiagnose", en: "Secondary diagnosis"}
  "C": {da: "Komplikation", en: "Complication"}
  "G": {da: "Grundmorbus", en: "Underlying disease"}
  "H": {da: "Henvisningsdiagnose", en: "Referral diagnosis"}
  "K": {da: "Kontaktårsag", en: "Contact reason"}
  "M": {da: "Midlertidig diagnose", en: "Temporary diagnosis"}
  "+": {da: "Tillægskode, Lokal recidiv, Metastase eller Sideangivelse", en: "Add-on code, local recurrence, metastasis, or laterality"}

provenance:
  source_url: https://sundhedsdatastyrelsen.dk/Media/638650989728109987/Dokumentation_Foedselsregisteret_2019_og_frem.xlsx
  source_type: dst_documentation
  verified_on: 2026-09-12
  verified_against: >-
    Kolonner sheet, row DiagnoseType (Barn_Diagnoser and Mor_Diagnoser,
    identical text) verbatim.

reader_note: >-
  When DiagnoseType is "+", DiagnoseKode is an add-on that only makes sense
  attached to another diagnosis: that parent diagnosis, its own type, and
  whether it was later disproven live in DiagnoseKode_Parent,
  DiagnoseType_Parent and SenereAfkraeftet_Parent on the same row, not in
  DiagnoseKode itself. `tobaksforbrug`'s DUT* codes and `mfr_fosterpraesentation`'s
  DUP* codes are exactly this kind of "+" add-on code before the LPR3
  cutover.
