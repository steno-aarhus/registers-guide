id: lpr3_diagtype
name: "Diagnosis type (LPR3 diag_kode_type)"
description: >-
  Whether an LPR3 diagnosis row is the action diagnosis for the contact, a
  secondary diagnosis, or an add-on code attached to another diagnosis. Not
  the LPR2 c_diagtype set (see diagtype.yaml): LPR3 has no grundmorbus (G).
source_url: https://sundhedsdatastyrelsen.dk/media/16364/Vejledning%20til%20LPR3_F.pdf
source_name: "Vejledning til LPR3_F (Sundhedsdatastyrelsen), section 3.3"

# Only the two values this guide can support are listed. The literal string
# used for add-on code rows has not been confirmed from a delivery, so it is
# described in the reader_note instead of being listed as a code.
enumerated: true
values_complete: false
labels_complete: true
lookup:
  A: {da: "Aktionsdiagnose", en: "Action diagnosis - the main reason for the contact"}
  B: {da: "Bidiagnose", en: "Secondary diagnosis"}

provenance:
  source_url: https://sundhedsdatastyrelsen.dk/media/16364/Vejledning%20til%20LPR3_F.pdf
  source_type: dst_documentation
  verified_on: 2026-10-08
  verified_against: >-
    A and B as named elsewhere in this guide for LPR3; add-on code rows from
    Vejledning til LPR3_F, section 3.3. The full LPR3 value list has not been
    checked against a delivery.

reader_note: >-
  A (main) and B (secondary), plus add-on codes, which get their own rows and
  point to their diagnosis through diag_parent_kode and diag_parent_kode_type.
  G (grundmorbus) is LPR2 only and does not occur here. Run
  `count(diag_kode_type)` on your own delivery to see the exact strings before
  filtering.
