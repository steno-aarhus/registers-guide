id: mfr_kilde_barn
name: "Kilde_Barn (MFR 2019+, source of the child's birth record)"
description: >-
  Which of the three data sources produced this newborn's row in the 2019+
  Medical Birth Register (Nyfoedte.Kilde_Barn): the hospital reporting system,
  or one of two paper forms for cases the reporting system does not reach.
  Narrower than the parents' Kilde_Mor/Kilde_Far code, which has two extra
  values ("from CPR" and "not stated") that do not apply to the child's own
  birth record - see `mfr_kilde_forael` for those.
source_url: https://sundhedsdatastyrelsen.dk/Media/638650989728109987/Dokumentation_Foedselsregisteret_2019_og_frem.xlsx
source_name: "Sundhedsdatastyrelsen: Dokumentation af Fødselsregisteret 2019 og frem, sheet Kolonner"

enumerated: true
values_complete: true
labels_complete: true
lookup:
  "1": {da: "Landspatientregisteret (LPR)", en: "National Patient Register (LPR)"}
  "2": {da: "Hjemmefødselsblanket", en: "Home/clinic birth paper form"}
  "3": {da: "Dødfødselsblanket", en: "Stillbirth paper form"}

provenance:
  source_url: https://sundhedsdatastyrelsen.dk/Media/638650989728109987/Dokumentation_Foedselsregisteret_2019_og_frem.xlsx
  source_type: dst_documentation
  verified_on: 2026-09-12
  verified_against: >-
    Kolonner sheet, row Kilde_Barn: "Kilde til oplysning om fødslen af barnet
    (1 = LPR, 2 = Hjemmefødselsblanket, 3 = Dødfødselsblanket)" verbatim.

reader_note: >-
  This value gates which other columns are populated at all. `DW_EK_Kontakt_Barn`
  is only set when this is "1"; `DW_ID_Hjem_Barn` only when this is "2"; and
  `DW_ID_Doed_Barn` when this is "3" (or when a paper stillbirth form
  supplements an LPR3 birth record). A join to `Barn_Kontakter` or any other
  LPR-sourced satellite table will silently return nothing for rows where
  Kilde_Barn is "2" or "3", since those children have no LPR contact at all.
