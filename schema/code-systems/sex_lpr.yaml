id: sex_lpr
name: "Koen in LPR2 (c_sex)"
description: >-
  Sex as recorded on a hospital contact. Not the same coding as BEF's `koen`,
  and not the same coding across the register's own lifetime.
source_url: https://www.esundhed.dk/-/media/Files/Dokumentation/Landspatientregisteret/5_Kodeark_LPR---pdf.ashx
source_page: https://www.esundhed.dk/Dokumentation/DocumentationExtended?id=5
source_name: "Kodeark for Landspatientregisteret"

enumerated: true
values_complete: true
labels_complete: true
lookup:
  "1": {da: "Mand (to 2004)", en: "Male, up to 2004"}
  "2": {da: "Kvinde (to 2004)", en: "Female, up to 2004"}
  "M": {da: "Mand (2005-)", en: "Male, from 2005"}
  "K": {da: "Kvinde (2005-)", en: "Female, from 2005"}

provenance:
  source_url: https://www.esundhed.dk/-/media/Files/Dokumentation/Landspatientregisteret/5_Kodeark_LPR---pdf.ashx
  source_page: https://www.esundhed.dk/Dokumentation/DocumentationExtended?id=5
  source_type: dst_documentation
  verified_on: 2026-09-02
  verified_against: >-
    Kodeark for Landspatientregisteret (Sundhedsdatastyrelsen), table t_adm,
    variable c_sex, with validity dates per code.

reader_note: >-
  The coding changed at the start of 2005: `1`/`2` until the end of 2004, `M`/`K`
  from 2005. A study spanning that year that filters on `c_sex == "2"` keeps only
  the women seen before 2005 and silently drops the rest, with no error and no
  empty result to warn you. Take sex from BEF instead, where it is `koen` coded
  `1`/`2` throughout, unless you specifically need what the hospital recorded.
