# VNDS - migrations. Bootstrapped from DST's variable list.
#
# DST split this register in three in February 2026. VNDS itself is now the
# historical part; see `deprecated` and `superseded_by` below.

id: vnds
name: "Historiske vandringer (historical migrations)"
family: null
scope: dst
description: >-
  One row per migration event per person: an immigration to or an emigration
  from Denmark, with the date it happened. Holds only events, so a person born
  in Denmark who never left has no rows at all - absence is the normal case, not
  missing data. Known to contain duplicates, which is why DST replaced it. Closed by DST and replaced by three registers: VNDS_IND and
  VNDS_UD from 2005, and VNDS_HIST for 1973-2004. VNDS itself runs to 2024, so
  its coverage overlaps both successors for 2005-2024.
  Closed by DST in February 2026 and split into VNDS_IND, VNDS_UD and
  VNDS_HIST. Still documented as a current register because deliveries made
  before the split contain only this one, which is the case for many projects.
source_url: https://www.dst.dk/extranet/ForskningVariabellister/VNDS%20-%20Historiske%20vandringer.html

update_cadence: annual
reference_timing: event
coverage:
  from: 1973
  to: 2024

# Closed by DST ("Luk" in the register overview, checked 2026-08-31) and split
# into three. superseded_by is a list because there is no single successor.
deprecated: true
superseded_by: [vnds_ind, vnds_ud, vnds_hist]

overlap_note: >-
  Coverage overlaps the successors for 2005-2024, but they must not be combined.
  DST states that migration data over the years came from different sources and
  that this produced a number of duplicates, and that freezing the earliest data
  in a historical register reduces the problem. The three successors are
  therefore a correction of this register, not a reorganisation of it. Use
  either VNDS on its own, accepting the duplicates it is known to contain, or
  VNDS_HIST together with VNDS_IND and VNDS_UD - never a mixture.
join_keys: [pnr]
relationships: []

columns:
  - id: pnr
    name: pnr
    label: {da: "Personnummer", en: "Personal identifier"}
    type: character
    role: join_key
    coverage: {from: 2024, to: 2024}
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/VNDS%20-%20Historiske%20vandringer.html
      source_type: dst_variable_list
      verified_on: 2026-08-31
      verified_against: "DST variable list VNDS"
      type_inferred: true
  - id: indud_kode
    name: indud_kode
    label:
      da: "Kode for indvandring eller udvandring"
      en: "Immigration or emigration"
    type: character
    role: code
    coverage: {from: 2024, to: 2024}
    key: true
    origin: dst
    code_system: indud_kode
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/VNDS%20-%20Historiske%20vandringer.html
      source_type: dst_variable_list
      verified_on: 2026-08-31
      verified_against: "DST variable list VNDS"
      type_inferred: true
      guide_page: register-reference.qmd

  - id: haend_dato
    name: haend_dato
    label:
      da: "Dato for indvandring eller udvandring"
      en: "Date of the migration event"
    type: date
    role: date
