# FAIK - family income. Bootstrapped from DST's variable list.
# Only the subset the guide references is structured; DST lists many more
# income variables (FAMDISPONIBEL, FAMAEKVIVAINDKNETTO and so on).

id: faik
name: "Familieindkomster (family income)"
family: null
scope: dst
description: >-
  Household income per year, keyed on the household rather than the person.
  Reaching it from a person means going through BEF for the familie_id.
source_url: https://www.dst.dk/extranet/ForskningVariabellister/FAIK%20-%20Familieindkomster.html

update_cadence: annual
reference_timing: event
coverage:
  from: 1987
  to: 2024

deprecated: false
superseded_by: null
join_keys: [familie_id]

relationships:
  - to: bef
    key: familie_id
    cardinality: one_to_many
    provenance:
      source_type: guide_prose
      guide_page: 11b_socioeconomic-variables.qmd
      verified_on: 2026-08-31

columns:
  - id: familie_id
    name: familie_id
    label: {da: "Familiens identificerende nummer", en: "Household key"}
    type: character
    role: join_key
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/FAIK%20-%20Familieindkomster.html
      source_type: dst_variable_list
      verified_on: 2026-08-31
      verified_against: "DST variable list FAIK"
      guide_page: register-reference.qmd
    reader_note: >-
      There is no person identifier here. Fetch familie_id from BEF for the
      relevant year, then join on it.

  - id: famaekvivadisp_13
    name: famaekvivadisp_13
    label:
      da: "Ækvivaleret disponibel indkomst for familien"
      en: "Household-equivalised disposable income"
    type: numeric
    role: value
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/FAIK%20-%20Familieindkomster.html
      source_type: dst_variable_list
      verified_on: 2026-08-31
      verified_against: "DST variable list FAIK"
      guide_page: register-reference.qmd
    derivation: >-
      FAMDISPONIBEL_13 / (1 + 0.5 * (people over 14 - 1) + 0.3 * (people under 15)),
      i.e. the OECD-modified equivalence scale.
    reader_note: >-
      This is the family's disposable income divided by an equivalence factor, so
      that families of different sizes can be compared: the first adult counts
      1.0, each further person over 14 counts 0.5, and each child under 15 counts
      0.3. `FAMDISPONIBEL_13` is the same money before that division, and
      `FAMAEKVIVAINDKNETTO` is a different income concept (total income with net
      interest), so check which one your analysis plan means.
      The `_13` suffix marks the definition that replaced the older variables
      from 2013: DST says of `FAMDISPONIBEL` that it "udgår 2013 og erstattes af
      FAMDISPONIBEL_13". A study spanning 2013 has to know which side it is on.

  - id: aar
    name: aar
    label: {da: null, en: "Register year"}
    type: integer
    role: date
    provenance:
      source_type: guide_prose
      guide_page: register-reference.qmd
      verified_on: 2026-08-31
      verified_against: null
    reader_note: >-
      Not confirmed against DST's variable list, which shows no AAR. Very likely
      the partition column from the parquet conversion, as `aar` in BEF was
      confirmed to be. Treat it as such until checked.
