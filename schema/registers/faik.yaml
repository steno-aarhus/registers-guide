# FAIK - family income. Bootstrapped from DST's variable list.
# Only the subset the guide references is structured; DST lists many more
# income variables (FAMDISPONIBEL, FAMAEKVIVAINDKNETTO and so on).

id: faik
name: "Familieindkomster (family income)"
family: null
scope: dst
description: >-
  Household income per year, keyed on the household rather than the person.
  Reaching it from a person means going through BEF for the familie_id.
source_url: https://www.dst.dk/extranet/ForskningVariabellister/FAIK%20-%20Familieindkomster.html

# All 87 columns DST publishes for FAIK are listed here, not just the ones this
# guide uses. A project receives only the variables it ordered, so the list is
# what you can ASK for, and colnames() is what you actually have.

update_cadence: annual
reference_timing: event
coverage:
  from: 1987
  to: 2024

deprecated: false
superseded_by: null
join_keys: [familie_id]

relationships:
  - to: bef
    key: familie_id
    cardinality: one_to_many
    provenance:
      source_type: guide_prose
      guide_page: 11b_socioeconomic-variables.qmd
      verified_on: 2026-08-31

columns:
  - id: pnr
    name: pnr
    label: {da: null, en: "Personal identifier"}
    type: character
    role: join_key
    key: true
    provenance:
      source_type: server_verified
      verified_on: 2026-09-01
      verified_by: "Sara Schwartz"
      verified_against: "colnames() on the FAIK parquet"
    reader_note: >-
      Not in DST's variable list for FAIK, which documents the register as keyed
      on the household. Where it is present, the household's row is repeated
      once per family member, so joining on familie_id alone multiplies rows.

  - id: familie_id
    name: familie_id
    label: {da: "Familiens identificerende nummer", en: "Household key"}
    type: character
    role: join_key
    key: true
    origin: dst
    coverage: {from: 1987, to: 2024}
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/FAIK%20-%20Familieindkomster.html
      source_type: dst_variable_list
      verified_on: 2026-08-31
      verified_against: "DST variable list FAIK"
      guide_page: register-reference.qmd
    reader_note: >-
      There is no person identifier here. Fetch familie_id from BEF for the
      relevant year, then join on it.

  - id: famaekvivadisp_13
    name: famaekvivadisp_13
    label:
      da: "Ækvivaleret disponibel indkomst for familien"
      en: "Household-equivalised disposable income"
    type: numeric
    role: value
    key: true
    origin: dst
    coverage: {from: 1987, to: 2024}
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/FAIK%20-%20Familieindkomster.html
      source_type: dst_variable_list
      verified_on: 2026-08-31
      verified_against: "DST variable list FAIK"
      guide_page: register-reference.qmd
    derivation: >-
      FAMAEKVIVADISP_13 = FAMDISPONIBEL_13 / (1 + (0.5 * (number of people over
      14 in the family - 1)) + (0.3 * number of people under 15 in the family))
    derivation_source: https://www.dst.dk/da/Statistik/dokumentation/Times/familieindkomst/famaekvivadisp-13
    reader_note: >-
      This is the family's disposable income divided by an equivalence factor, so
      that families of different sizes can be compared. The factor counts the
      first adult as 1.0, each further person over 14 as 0.5, and each child
      under 15 as 0.3: a couple with two young children comes to
      1 + 0.5 + 0.6 = 2.1, so a family income of 420,000 is recorded as 200,000
      for each of the four. `FAMDISPONIBEL_13` is the same money before that division, and
      `FAMAEKVIVAINDKNETTO` is a different income concept (total income with net
      interest), so check which one your analysis plan means.
      The `_13` suffix marks the definition that replaced the older variables
      from 2013: DST states that FAMDISPONIBEL was discontinued in 2013 and
      replaced by FAMDISPONIBEL_13. A study spanning 2013 has to know which side
      of that change it is on.
      DST's year ranges settle the relationship with the sister column
      FAMAEKVIVADISP, which has no _13: the old one runs 1990-2012, this one
      runs 1987-2024. The _13 definition was applied backwards as well as
      forwards, so it is not a newer variable covering later years only. A study
      spanning the 2013 changeover should use _13 for the whole period rather
      than splicing the two, which would mix two definitions in one series.

