      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST variable list: name only, no Danish label, no Format/Laengde."
      type_inferred: true
    reader_note: >-
      By its name, a foreign key back to mfr.yaml's own row for this birth.
