# MFRHJMFO - Hjemmefødsler fra det medicinske fødselsregister. Same 1997-2018
# era as mfr.yaml (the DST "Levendefødte" table), NOT a separate population:
# mfr.yaml's own FOEDESTED and MARKOER_HJEMMEFOEDSEL_BEREGNET columns show
# home births are already IN that table. This is a SUPPLEMENTARY dataset
# with extra clinical detail specific to the home-birth subset
# (EPISIOTOMI, RISIKOFAKTORER, NORMAL_GRAVIDITET, and more), joined onto
# mfr.yaml via FK_MFR rather than replacing part of it.
#
# This is the DST-native counterpart to NCRR's own internal "MFR2 split into
# home and not-home" data-management label - not a separate delivery of
# the same underlying population, a detail table for one subset of it.
#
# DST's own variable-list page for this register gives only the variable
# name and no further Danish label at all for every single column, thinner
# even than ftbarn/ftforael/ftnaevn (which at least labelled some columns).
# No `code_system` is attached to any coded column below for that reason.

id: mfrhjmfo
hide_from_overview: true
name: "MFRHJMFO - Hjemmefødsler fra det medicinske fødselsregister"
scope: dst
reference_timing: event
one_row_per: event_from_person
description: >-
  Supplementary clinical detail for home births within the 1997-2018
  Medical Birth Register era, joined to mfr.yaml via FK_MFR. Not a
  standalone population: every row here also has a row in mfr.yaml, which
  already flags home births via FOEDESTED/MARKOER_HJEMMEFOEDSEL_BEREGNET.
source_url: https://www.dst.dk/extranet/ForskningVariabellister/MFRHJMFO%20-%20Hjemmef%C3%B8dsler%20fra%20det%20medicinske%20f%C3%B8dselsregister.html
coverage: {from: 1997, to: 2018}

deprecated: true
superseded_by: null

join_keys: [FK_MFR]
relationships:
  - to: mfr
    key: FK_MFR
    to_key: cpr_barn
    cardinality: one_to_one
    provenance:
      source_type: inferred
      verified_on: 2026-09-12
  - to: bef
    key: CPR_MODER
    to_key: pnr
    cardinality: many_to_one
    provenance:
      source_type: inferred
      verified_on: 2026-09-12

columns:
