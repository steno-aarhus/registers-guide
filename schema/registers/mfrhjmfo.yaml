reader_note: >-
  DST's variable-list page for this register gives literally no Danish
  label text beyond the variable name for any column - thinner
  documentation than any other register in this schema. Every field name
  above is read at face value (Danish administrative/clinical vocabulary),
  not confirmed by DST's own description text, which does not exist here
  beyond the bare name. Treat every reader_note above as an informed guess
  from the name alone, not a sourced fact, and confirm on real data before
  relying on any of it.
