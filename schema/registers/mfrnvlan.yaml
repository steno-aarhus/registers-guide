# MFRNVLAN - richer than the 16 simple marker sub-cuts. Backs mfr.yaml's
# markoer_navlesnorsblod_analyse flag (navlesnorsblod = umbilical cord blood).
# See schema/families/mfr_markers.yaml for what this family shares.

id: mfrnvlan
hide_from_overview: true
name: "MFRNVLAN - MFR marker sub-cut, umbilical cord blood analysis"
family: mfr_markers
scope: dst
reference_timing: event
one_row_per: event_from_person
description: >-
  One row per umbilical cord blood analysis result for a birth in
  mfr.yaml, joined via FK_MFR, with pH and base excess values alongside the
  SKS code. Backs mfr.yaml's markoer_navlesnorsblod_analyse flag. Coverage
  starts 2003, several years later than most of the other marker sub-cuts.
source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
coverage: {from: 2003, to: 2018}

join_keys: [FK_MFR]
relationships:
  - to: mfr
    key: FK_MFR
    to_key: cpr_barn
    cardinality: many_to_one
    provenance:
      source_type: inferred
      verified_on: 2026-09-12

columns:
  - id: fk_mfr
    name: FK_MFR
    label: {da: null, en: null}
    type: character
    role: join_key
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST order list (Bestillingsliste.xlsx): name only, no label."
      type_inferred: true
    reader_note: "Foreign key back to mfr.yaml, same pattern as mfrhjmfo.yaml - not confirmed to match mfr's own cpr_barn specifically."
  - id: kodetype
    name: KODETYPE
    label: {da: null, en: null}
    type: character
    role: code
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST order list: name only, no label, no value definitions."
      type_inferred: true
  - id: skskode
    name: SKSKODE
    label: {da: null, en: null}
    type: character
    role: code
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST order list: name only, no label."
      type_inferred: true
    reader_note: >-
      No `code_system` attached: an open SKS code space restricted to
      cord-blood-analysis-related codes by this register's own scope, not
      documented as a specific list anywhere DST publishes.
  - id: tillaegskode
    name: TILLAEGSKODE
    label: {da: null, en: null}
    type: character
    role: code
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST order list: name only, no label."
      type_inferred: true
    reader_note: "An SKS add-on code to SKSKODE, by the variable name (tillæg = addition) - the same +-type concept as mfr_diagnose_type.yaml's add-on codes, not confirmed to share that exact mechanism."
  - id: ph_vaerdi
    name: PH_VAERDI
    label: {da: null, en: null}
    type: numeric
    role: value
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST order list: name only, no label."
      type_inferred: true
    reader_note: "Cord blood pH value, by the variable name."
  - id: base_excess
    name: BASE_EXCESS
    label: {da: null, en: null}
    type: numeric
    role: value
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST order list: name only, no label."
      type_inferred: true
    reader_note: "A standard blood-gas measurement, alongside PH_VAERDI for interpreting cord blood acid-base status."

reader_note: >-
  DST's variable-list page for this register gives no label or value
  definition for any column. A birth with no cord blood analysis has no
  row here at all, not an explicit "no" row.
