      verified_on: 2026-09-12
      verified_against: "Kolonner sheet: primary key of Nyfoedte, also the join key into every Barn_* satellite table."
    reader_note: >-
      One row per newborn, not per birth: a twin birth produces two rows
      sharing one DW_EK_Foedsel but each with its own DW_EK_Nyfoedt. Use
      DW_EK_Nyfoedt to join Barn_* satellite tables, DW_EK_Foedsel to join
