      source_type: dst_documentation
      verified_on: 2026-09-12
      verified_against: >-
        Kolonner sheet: -1 = not stated. When the reported parity is not
        stated or is lower than the mother's number of births already on
        record in MFR, Sundhedsdatastyrelsen substitutes the count of her
        births in MFR (only births from 2005 onwards count towards this).
    reader_note: >-
      -1 means not stated. Also note the substitution rule above: this
      column is not always a direct report, it can be a computed fallback
      that only sees MFR's own 2005+ history, undercounting a mother's true
      parity if she had earlier children before 2005 or outside Denmark.
