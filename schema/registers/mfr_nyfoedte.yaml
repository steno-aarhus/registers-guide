    reader_note: >-
      -1 means not stated, not a real score - exclude or recode before
      computing a mean. Every stillbirth is set to 0 by definition, not -1:
      a naive "average Apgar score" across LevendefoedtDoedfoedt values will
      be pulled down by stillbirths unless filtered first.
