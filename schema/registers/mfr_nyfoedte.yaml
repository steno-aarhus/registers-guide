# Nyfoedte - the main table of the 2019+ Medical Birth Register, a complete
# restructuring of MFR that mirrors LPR3's own contact/diagnosis/procedure
# model. Not delivered by DST: apply through Sundhedsdatastyrelsen's
# Forskerservice, the same route as lpr_a_kontakt and kont_type.
#
# This is the THIRD of three MFR eras, each with its own data model:
# 1973-1996 (paper forms; the ORIGINAL source rows are not a digital MFR
# table, but DST's own ftbarn/ftforael/ftnaevn datasets, coverage 1973-2023
# per DST's register overview, incorporate MFR content back through this
# whole period - see the note under `mfr.yaml`), 1997-2018 (DST's wide
# "Levendefødte" table, see mfr.yaml, deprecated, plus mfrhjmfo.yaml for the
# home-birth subset's extra detail), and 2019+ (this file, plus ten
# satellite tables: mfr_barn_forloeb/kontakter/diagnoser/procedurer/
# resultater.yaml and the same five mfr_mor_*.yaml). mfr.yaml's
# `superseded_by: null` predates this file: DST's own register overview
# never named a successor because the successor is an SDS, not a DST,
# delivery.
#
# Two structural changes from the old wide table, not just a rename:
# 1. Population: 1973-2018 required the MOTHER to have a Danish CPR-number.
#    2019+ drops that requirement - any birth reported to Sundhedsdatastyrelsen
#    counts, regardless of the mother's CPR status. A study spanning this
#    boundary is comparing two different populations, not just two table
#    shapes.
# 2. Live births and stillbirths are unified in one table for the first time
#    (LevendefoedtDoedfoedt), where 1997-2018's "Levendefødte" table held
#    only live births by construction. Filter explicitly.

id: mfr_nyfoedte
name: "Nyfoedte - Medicinsk Foedselsregister 2019+"
scope: sds
family: mfr2019
reference_timing: event
one_row_per: event_from_person
description: >-
  One row per newborn (live-born or stillborn) in Denmark from 1 January
  2019 onwards. Carries basic facts about the child, mother and father plus
  a curated set of medical facts (birth diagnosis, weight, Apgar score,
  smoking status, and more) resolved from LPR3 contacts within 42 days of
  birth (or, for the mother, from the start of pregnancy). Detailed
  diagnosis/procedure/result history sits in ten satellite tables (family
  mfr2019) joined via DW_EK_Nyfoedt (child) or DW_EK_Foedsel (mother).
source_url: https://sundhedsdatastyrelsen.dk/data-og-registre/nationale-sundhedsregistre/foedselsregisteret
coverage: {from: 2019, to: 2026}

join_keys: [CPRnummer_Barn]
relationships:
  - to: bef
    key: CPRnummer_Barn
    to_key: pnr
    cardinality: many_to_one
    provenance:
      source_type: inferred
      verified_on: 2026-09-12
  - to: lpr_a_kontakt
    key: DW_EK_Kontakt_Barn
    to_key: dw_ek_kontakt
    cardinality: many_to_one
    provenance:
      source_type: unverified
      verified_on: 2026-09-12
      guide_page: register-reference.qmd

columns:
