      source_type: dst_documentation
      verified_on: 2026-09-12
      verified_against: >-
        Kolonner sheet: a KMCA* SKS procedure code, with a documented
        priority order across 15 specific KMCA* variants when more than one
        is reported within +/-90 days of the birth date.
    reader_note: >-
      An open SKS procedure code space, not a small enumerated set: no
      `code_system` is attached here because the underlying classification
      is the general SKS procedure catalogue (see kont_type.yaml's own
      reader_note on the same issue), not a birth-specific value list. A
      non-missing value means a caesarean happened; treat the specific
      KMCA* variant as a procedure detail, not a category to enumerate.
