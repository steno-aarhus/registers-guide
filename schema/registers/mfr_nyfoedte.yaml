reader_note: >-
  This table alone does not give you the mother's or child's diagnoses,
  procedures or contact history in any detail: those live in the ten
  satellite tables (mfr_barn_forloeb, mfr_barn_kontakter, mfr_barn_diagnoser,
  mfr_barn_procedurer, mfr_barn_resultater, and the matching five mfr_mor_*
  files). Nyfoedte only carries a curated subset that Sundhedsdatastyrelsen
  has already resolved into single columns (birth weight, Apgar score,
  smoking status, and so on) using the priority rules documented column by
  column above.
