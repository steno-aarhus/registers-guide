    reader_note: >-
      Ends December 2003 and is replaced by foerste_indvandring and
      seneste_indvandring. A study spanning 2003 has to read both, or it
      silently loses immigration dates on one side of the break.

      A move to Denmark is only registered in CPR when the stay is meant to
      last more than 3 months, or more than 6 months for Nordic and EU/EEA
      citizens. Shorter stays never reach BEF.
