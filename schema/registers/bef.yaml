# BEF - the population register.
#
# Bootstrapped from DST's own variable list (see source_url), NOT from the
# guide's prose. Where the guide and DST disagree, DST wins and the guide's
# version is recorded in a note.
#
# All columns present in a verified delivery are structured here, matched
# against DST's variable list. Two DST variables are not in that delivery and
# are therefore absent: BETALINGSKOM and TIMES.

id: bef
name: "Befolkningen (population register)"
family: null
scope: dst
description: >-
  Status register with one snapshot per person per reference time point.
  Delivered quarterly since 2008 (March, June, September, December); December
  only before that, so the cadence is not constant across the coverage.
source_url: https://www.dst.dk/extranet/ForskningVariabellister/BEF%20-%20Befolkningen.html

update_cadence: quarterly
reference_timing: ultimo
coverage:
  from: 1985-12
  to: 2026-06

deprecated: false
superseded_by: null
join_keys: [pnr]

relationships:
  - to: faik
    key: familie_id
    cardinality: many_to_one
    provenance:
      source_type: guide_prose
      guide_page: 11b_socioeconomic-variables.qmd
      verified_on: 2026-08-31

columns:
  - id: pnr
    name: pnr
    label: {da: "Personnummer", en: "Personal identifier"}
    type: character
    role: join_key
    key: true
    origin: dst
    reader_note: >-
      A person appears once per snapshot, not once in total. Taking a single
      year loses people who were resident but not in that particular snapshot,
      so a population is built from the union of all snapshots in the window.
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/BEF%20-%20Befolkningen.html
      source_type: dst_variable_list
      verified_on: 2026-08-31
      verified_against: "DST variable list BEF"
      guide_page: register-reference.qmd

  - id: koen
    name: koen
    label: {da: "Køn", en: "Sex"}
