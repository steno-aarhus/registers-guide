      source_type: server_verified
      verified_on: 2026-08-31
      verified_by: "Sara Schwartz"
      verified_against: "colnames() on the BEF parquet, via both fastreg's read_register() and DARTER's load_database() - the two agree"
      guide_page: register-reference.qmd
    reader_note: >-
      Not a DST variable. It comes from the parquet conversion, which
      concatenates the yearly deliveries, so it exists in the data you read but
      not in DST's own documentation of BEF. Because it is made rather than
      delivered, the name is not guaranteed: check colnames() rather than
      assuming.
