# BEF - the population register.
#
# Bootstrapped from DST's own variable list (see source_url), NOT from the
# guide's prose. Where the guide and DST disagree, DST wins and the guide's
# version is recorded in a note.
#
# Only the subset of columns the guide actually references is structured here.
# The full list has 40+ variables; follow source_url for those.

id: bef
name: "Befolkningen (population register)"
family: null
scope: dst
description: >-
  Status register with one snapshot per person per reference time point.
  Delivered quarterly since 2008 (March, June, September, December); December
  only before that.
source_url: https://www.dst.dk/extranet/ForskningVariabellister/BEF%20-%20Befolkningen.html

update_cadence: quarterly
reference_timing: ultimo
coverage:
  from: 1985-12
  to: null
  note: >-
    Starts December 1985. Confirmed against DST's variable list and by Sara on
    the server, 2026-08-31. The end is deliberately null: how recent the data is
    depends on the project and on when the registers were last updated, so no
    single end date is true for everyone. DST's list showed 202606 on 2026-08-31.

deprecated: false
superseded_by: null
join_keys: [pnr]

relationships:
  - to: faik
    key: familie_id
    cardinality: many_to_one
    note: >-
      BEF is the bridge from person to household: fetch familie_id here, then
      join FAIK on familie_id.
    provenance:
      source_type: guide_prose
      guide_page: 11b_socioeconomic-variables.qmd
      verified_on: 2026-08-31

columns:
  - id: pnr
    name: pnr
    label: {da: "Personnummer", en: "Personal identifier"}
    type: character
    role: join_key
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/BEF%20-%20Befolkningen.html
      source_type: dst_variable_list
      verified_on: 2026-08-31
      verified_against: "DST variable list BEF"
      guide_page: register-reference.qmd

  - id: koen
    name: koen
    label: {da: "Køn", en: "Sex"}
    type: integer
    role: code
    code_system: koen
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/BEF%20-%20Befolkningen.html
      source_type: dst_variable_list
      verified_on: 2026-08-31
      verified_against: "DST variable list BEF"
      guide_page: register-reference.qmd
    note: >-
      Name and label from DST. The value set (1 = male, 2 = female) comes from
      the guide, not from DST's variable list - see code-systems/koen.yaml.

  - id: foed_dag
    name: foed_dag
    label: {da: "Fødselsdato", en: "Date of birth"}
    type: date
    role: date
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/BEF%20-%20Befolkningen.html
      source_type: dst_variable_list
      verified_on: 2026-08-31
      verified_against: "DST variable list BEF"
      guide_page: register-reference.qmd

  - id: familie_id
    name: familie_id
    label: {da: "Familiens identificerende nummer", en: "Household key"}
    type: character
    role: join_key
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/BEF%20-%20Befolkningen.html
      source_type: dst_variable_list
      verified_on: 2026-08-31
      verified_against: "DST variable list BEF"
      guide_page: register-reference.qmd

  - id: reg
    name: reg
    label: {da: "Region", en: "Region"}
    type: character
    role: code
    code_system: reg
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/BEF%20-%20Befolkningen.html
      source_type: dst_variable_list
      verified_on: 2026-08-31
      verified_against: "DST variable list BEF"
      guide_page: register-reference.qmd

  - id: civst
    name: civst
    label: {da: "Civilstand", en: "Marital status"}
    type: character
    role: code
    code_system: civst
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/BEF%20-%20Befolkningen.html
      source_type: dst_variable_list
      verified_on: 2026-08-31
      verified_against: "DST variable list BEF"
      guide_page: register-reference.qmd

  - id: kom
    name: kom
    label: {da: "Kommunekode", en: "Municipality code"}
    type: character
    role: code
    origin: dst
    code_system: kom
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/BEF%20-%20Befolkningen.html
      source_type: server_verified
      verified_on: 2026-08-31
      verified_by: "Sara Schwartz"
      verified_against: "colnames() on the BEF parquet, plus DST's variable list"
    note: >-
      The guide previously joined BEF on `bopkom`, which does not exist here.
      `c_bopkom` exists, but in DODSAARS.

  - id: aar
    name: aar
    label: {da: null, en: "Register year"}
    type: integer
    role: date
    origin: tooling
    added_by: fastreg
    provenance:
      source_type: server_verified
      verified_on: 2026-08-31
      verified_by: "Sara Schwartz"
      verified_against: "fastreg's BEF parquet conversion"
      guide_page: register-reference.qmd
    note: >-
      NOT a DST variable. It comes from fastreg's handling of the BEF parquet
      conversion, where the yearly deliveries are concatenated. DST's own list
      has REFERENCETID and VERSION instead. Kept in the schema because anyone
      reading BEF through fastreg will see this column, but `origin: tooling`
      marks it as an artefact of how the data is loaded, not of the register.

note: >-
  BEF cannot on its own answer whether a person was resident in Denmark on a
  given date, and it does not contain date of death. Both of those are reasoning
  that stays in the guide's prose, not in this schema.
