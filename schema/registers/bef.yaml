# BEF - the population register.
#
# Bootstrapped from DST's own variable list (see source_url), NOT from the
# guide's prose. Where the guide and DST disagree, DST wins and the guide's
# version is recorded in a note.
#
# Only the subset of columns the guide actually references is structured here.
# The full list has 40+ variables; follow source_url for those.

id: bef
name: "Befolkningen (population register)"
family: null
scope: dst
description: >-
  Status register with one snapshot per person per reference time point.
  Delivered quarterly since 2008 (March, June, September, December); December
  only before that, so the cadence is not constant across the coverage.
source_url: https://www.dst.dk/extranet/ForskningVariabellister/BEF%20-%20Befolkningen.html

update_cadence: quarterly
reference_timing: ultimo
coverage:
  from: 1985-12
  to: 2026-06

deprecated: false
superseded_by: null
join_keys: [pnr]

relationships:
  - to: faik
    key: familie_id
    cardinality: many_to_one
    provenance:
      source_type: guide_prose
      guide_page: 11b_socioeconomic-variables.qmd
      verified_on: 2026-08-31

columns:
  - id: pnr
    name: pnr
    label: {da: "Personnummer", en: "Personal identifier"}
    type: character
    role: join_key
    origin: dst
    reader_note: >-
      A person appears once per snapshot, not once in total. Taking a single
      year loses people who were resident but not in that particular snapshot,
      so a population is built from the union of all snapshots in the window.
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/BEF%20-%20Befolkningen.html
      source_type: dst_variable_list
      verified_on: 2026-08-31
      verified_against: "DST variable list BEF"
      guide_page: register-reference.qmd

  - id: koen
    name: koen
    label: {da: "Køn", en: "Sex"}
    type: integer
    role: code
    code_system: koen
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/BEF%20-%20Befolkningen.html
      source_type: dst_variable_list
      verified_on: 2026-08-31
      verified_against: "DST variable list BEF"
      guide_page: register-reference.qmd

  - id: foed_dag
    name: foed_dag
    label: {da: "Fødselsdato", en: "Date of birth"}
    type: date
    role: date
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/BEF%20-%20Befolkningen.html
      source_type: dst_variable_list
      verified_on: 2026-08-31
      verified_against: "DST variable list BEF"
      guide_page: register-reference.qmd

  - id: familie_id
    name: familie_id
    label: {da: "Familiens identificerende nummer", en: "Household key"}
    type: character
    role: join_key
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/BEF%20-%20Befolkningen.html
      source_type: dst_variable_list
      verified_on: 2026-08-31
      verified_against: "DST variable list BEF"
      guide_page: register-reference.qmd

  - id: reg
    name: reg
    label: {da: "Region", en: "Region"}
    type: character
    role: code
    code_system: reg
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/BEF%20-%20Befolkningen.html
      source_type: dst_variable_list
      verified_on: 2026-08-31
      verified_against: "DST variable list BEF"
      guide_page: register-reference.qmd

  - id: civst
    name: civst
    label: {da: "Civilstand", en: "Marital status"}
    type: character
    role: code
    code_system: civst
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/BEF%20-%20Befolkningen.html
      source_type: dst_variable_list
      verified_on: 2026-08-31
      verified_against: "DST variable list BEF"
      guide_page: register-reference.qmd

  - id: kom
    name: kom
    label: {da: "Kommunekode", en: "Municipality code"}
    type: character
    role: code
    origin: dst
    code_system: kom
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/BEF%20-%20Befolkningen.html
      source_type: server_verified
      verified_on: 2026-08-31
      verified_by: "Sara Schwartz"
      verified_against: "colnames() on the BEF parquet, plus DST's variable list"

  - id: aar
    name: aar
    label: {da: null, en: "Register year"}
    type: integer
    role: date
    origin: tooling
    added_by: fastreg
    provenance:
      source_type: server_verified
      verified_on: 2026-08-31
      verified_by: "Sara Schwartz"
      verified_against: "fastreg's BEF parquet conversion"
      guide_page: register-reference.qmd
    reader_note: >-
      Not a DST variable. It comes from fastreg's parquet conversion, which
      concatenates the yearly deliveries, so it exists in the data you read but
      not in DST's own documentation of BEF.
