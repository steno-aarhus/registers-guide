      verified_on: 2026-09-01
      verified_against: "DST variable list, cross-checked against colnames() on the parquet"
    reader_note: >-
      A pnr-like identifier for the mother, so BEF can be turned into a family
      structure without a separate register. It is only filled where the link
      is registered, which is not the case for everyone born before CPR.
