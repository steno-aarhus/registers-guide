# BEF - the population register.
#
# Bootstrapped from DST's own variable list (see source_url), NOT from the
# guide's prose. Where the guide and DST disagree, DST wins and the guide's
# version is recorded in a note.
#
# All columns present in a verified delivery are structured here, matched
# against DST's variable list. Two DST variables are not in that delivery and
# are therefore absent: BETALINGSKOM and TIMES.

id: bef
name: "Befolkningen (population register)"
family: null
scope: dst
description: >-
  Status register with one snapshot per person per reference time point.
  Delivered quarterly since 2008 (March, June, September, December); December
  only before that, so the cadence is not constant across the coverage.
source_url: https://www.dst.dk/extranet/ForskningVariabellister/BEF%20-%20Befolkningen.html

update_cadence: quarterly
reference_timing: status
one_row_per: person_reference_date
coverage:
  from: 1985-12
  to: 2026-06

deprecated: false
superseded_by: null
join_keys: [pnr]

relationships:
  - to: faik
    key: familie_id
    cardinality: many_to_one
    provenance:
      source_type: unverified
      guide_page: socioeconomic-variables.qmd
      verified_on: 2026-08-31

columns:
  - id: pnr
    name: pnr
    label: {da: "Personnummer", en: "Personal identifier"}
    type: character
    role: join_key
    coverage: {from: 1985, to: 2026}
    key: true
    origin: dst
    reader_note: >-
      A person appears once per snapshot, not once in total. Taking a single
      year loses people who were resident but not in that particular snapshot,
      so a population is built from the union of all snapshots in the window.

      A CPR number is never reused. But a person who was given a number with
      the wrong birth date or sex gets a new one, and CPR keeps a reference
      between the old and the new number. So in rare cases one person has
      two numbers over time. DST's page does not say whether that reference
      reaches a research delivery.
    provenance:
      source_url: https://www.dst.dk/da/TilSalg/data-til-forskning/generelt-om-data/dokumentation-af-data/hoejkvalitetsvariable/Folketal/PNR
      source_type: dst_documentation
      verified_on: 2026-10-01
      verified_against: "DST's high-quality variable page: no data break, CPR number assignment rules"
      guide_page: register-reference.qmd

  - id: koen
    name: koen
    label: {da: "Køn", en: "Sex"}
    type: numeric
    role: code
    coverage: {from: 1985, to: 2026}
    key: true
    code_system: koen
    origin: dst
    provenance:
      source_url: https://www.dst.dk/da/TilSalg/data-til-forskning/generelt-om-data/dokumentation-af-data/hoejkvalitetsvariable/Folketal/KOEN
      source_type: dst_documentation
      verified_on: 2026-10-01
      verified_against: "DST's high-quality variable page: no data break, derived from the 10th digit of PNR"
      guide_page: register-reference.qmd

  - id: foed_dag
    name: foed_dag
    label: {da: "Fødselsdato", en: "Date of birth"}
    type: date
    role: date
    coverage: {from: 1985, to: 2026}
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/da/TilSalg/data-til-forskning/generelt-om-data/dokumentation-af-data/hoejkvalitetsvariable/Folketal/FOED-DAG
      source_type: dst_documentation
      verified_on: 2026-10-01
      verified_against: "DST's high-quality variable page: no data break, derived from PNR"
      guide_page: register-reference.qmd
    reader_note: >-
      Derived from the CPR number (format YYYYMMDD), not reported on its
      own. It is as reliable as the CPR number it comes from.

  - id: familie_id
    name: familie_id
    label: {da: "Familiens identificerende nummer", en: "Household key"}
    type: character
    role: join_key
    coverage: {from: 1985, to: 2026}
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/da/TilSalg/data-til-forskning/generelt-om-data/dokumentation-af-data/hoejkvalitetsvariable/Familier/FAMILIE-ID
      source_type: dst_documentation
      verified_on: 2026-10-01
      verified_against: "DST's high-quality variable page: no data break, valid from 1986, rules for when the id changes"
      guide_page: register-reference.qmd
    reader_note: >-
      Identifies an E-family from 1986: a single person or a couple, with
      any children living at home. It is not a stable key over time. A
      couple that splits up gets two new values, two people who move in
      together get a new shared value, and when one partner dies the
      survivor and their joint children living at home get a new value. A
      child who moves out gets a new value, while the parents keep theirs.
      Family data are formed quarterly, so a new familie_id first appears in
      the following quarter.

      A child counts as living at home only if under 25, never married,
      without children of their own in CPR, and not part of a couple. The
      older C-families (1980-2007) use c_familie_id instead.

  - id: reg
    name: reg
    label: {da: "Region", en: "Region"}
    type: character
    role: code
    coverage: {from: 1985, to: 2026}
    key: true
    code_system: reg
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/BEF%20-%20Befolkningen.html
      source_type: dst_variable_list
      verified_on: 2026-08-31
      verified_against: "DST variable list BEF"
      guide_page: register-reference.qmd

  - id: civst
    name: civst
    label: {da: "Civilstand", en: "Marital status"}
    type: character
    role: code
    coverage: {from: 1985, to: 2026}
    key: true
    code_system: civst
    origin: dst
    provenance:
      source_url: https://www.dst.dk/da/TilSalg/data-til-forskning/generelt-om-data/dokumentation-af-data/hoejkvalitetsvariable/Folketal/CIVST
      source_type: dst_documentation
      verified_on: 2026-10-01
      verified_against: "DST's high-quality variable page: no data break, 2012 conversion of partnerships to marriage"
      guide_page: register-reference.qmd
    reader_note: >-
      Code G includes people who are separated but not divorced. From 15
      June 2012 a registered partnership entered into in Denmark could be
      converted into a marriage. CPR then undoes the partnership and records
      a marriage dated back to the day of the partnership, so a person's
      history can change from P to G after the fact, and a G with a civ_vfra
      before 2012 can be a converted partnership.

  - id: kom
    name: kom
    label: {da: "Kommunekode", en: "Municipality code"}
    type: character
    role: code
    coverage: {from: 1985, to: 2026}
    key: true
    origin: dst
    code_system: kom
    provenance:
      source_url: https://www.dst.dk/da/TilSalg/data-til-forskning/generelt-om-data/dokumentation-af-data/hoejkvalitetsvariable/Folketal/KOM
      source_type: dst_documentation
      verified_on: 2026-10-01
      verified_against: "DST's high-quality variable page: no data break flagged, but a minor break at the 2007 reform described in the text"
    reader_note: >-
      Taken from the CPR address and covers Danish municipalities only. The
      2007 reform merged 271 municipalities into 98. CPR has converted old
      addresses to the 98 new municipalities, and DST keeps the new codes
      for 1986-2007 in a separate table (MODULSTATUS_1986_2007). That
      suggests kom itself keeps the old codes before 2007: check which codes
      your early years contain before grouping by municipality. Thirteen old
      municipalities were split between new ones, so even the converted
      series has a small break at 2007.

  - id: year
    name: year
    label: {da: null, en: "Register year"}
    type: integer
    role: date
    key: true
    origin: tooling
    added_by: fastreg
    provenance:
      source_type: unverified
      verified_on: 2026-08-31
      verified_against: null
      guide_page: register-reference.qmd
    reader_note: >-
      Not a DST variable. It comes from the parquet conversion, which
      concatenates the yearly deliveries, so it exists in the data you read but
      not in DST's own documentation of BEF. Because it is made rather than
      delivered, the name is not guaranteed: check colnames() rather than
      assuming.
  - id: mor_id
    name: mor_id
    label: {da: "Moderens Person Id", en: "Mother's person id"}
    type: character
    role: identifier
    coverage: {from: 1985, to: 2026}
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/BEF%20-%20Befolkningen.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list"
    reader_note: >-
      A pnr-like identifier for the mother, so BEF can be turned into a family
      structure without a separate register. It is only filled where the link
      is registered, which is not the case for everyone born before CPR.
  - id: far_id
    name: far_id
    label: {da: "Faderens Person Id", en: "Father's person id"}
    type: character
    role: identifier
    coverage: {from: 1985, to: 2026}
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/BEF%20-%20Befolkningen.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list"
  - id: aegte_id
    name: aegte_id
    label: {da: "AEgtefaelle ID", en: "Spouse id"}
    type: character
    role: identifier
    coverage: {from: 1985, to: 2026}
    origin: dst
    provenance:
      source_url: https://www.dst.dk/da/TilSalg/data-til-forskning/generelt-om-data/dokumentation-af-data/hoejkvalitetsvariable/Folketal/AEGTE-ID
      source_type: dst_documentation
      verified_on: 2026-10-01
      verified_against: "DST's high-quality variable page: no data break, meaning depends on civst"
    reader_note: >-
      Not proof of a current marriage. What it points to depends on civst:
      the current spouse if married (G), the former spouse if divorced (F),
      the deceased spouse if widowed (E), and the same for registered
      partnerships (P, O, L). Read it together with civst before treating it
      as a living partner.
  - id: e_faelle_id
    name: e_faelle_id
    label: {da: "E_faelle", en: "Cohabiting partner id"}
    type: character
    role: identifier
    coverage: {from: 1985, to: 2026}
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/BEF%20-%20Befolkningen.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list"
  - id: fdato
    name: fdato
    label: {da: "Foedselsdato (CPR)", en: "Date of birth, CPR form"}
    type: date
    role: date
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/BEF%20-%20Befolkningen.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list"
    reader_note: >-
      Not on DST's variable list for BEF, which documents foed_dag instead.
      Present in this delivery. Prefer foed_dag unless you have checked what
      yours contains.
  - id: alder
    name: alder
    label: {da: "Alder paa referencetidspunktet", en: "Age at the reference time point"}
    type: numeric
    role: value
    coverage: {from: 1985, to: 2026}
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/BEF%20-%20Befolkningen.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list"
    reader_note: >-
      Age at the snapshot, not at any date you choose. Recompute from foed_dag
      and your own index date rather than reusing it.
  - id: antboernf
    name: antboernf
    label: {da: "Antal boern i familien", en: "Number of children in the family"}
    type: numeric
    role: value
    coverage: {from: 1985, to: 2026}
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/BEF%20-%20Befolkningen.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list"
  - id: antboernh
    name: antboernh
    label: {da: "Antal boern i husstanden", en: "Number of children in the household"}
    type: numeric
    role: value
    coverage: {from: 1985, to: 2026}
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/BEF%20-%20Befolkningen.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list"
  - id: antpersf
    name: antpersf
    label: {da: "Antal personer i familien", en: "Number of people in the family"}
    type: numeric
    role: value
    coverage: {from: 1985, to: 2026}
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/BEF%20-%20Befolkningen.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list"
  - id: antpersh
    name: antpersh
    label: {da: "Antal personer i husstanden", en: "Number of people in the household"}
    type: numeric
    role: value
    coverage: {from: 1985, to: 2026}
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/BEF%20-%20Befolkningen.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list"
  - id: antefam
    name: antefam
    label: {da: "Antal E-familier i husstanden", en: "Number of E-families in the household"}
    type: numeric
    role: value
    coverage: {from: 1985, to: 2026}
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/BEF%20-%20Befolkningen.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list"
    reader_note: >-
      A household can hold several families. That is why the family counts and
      the household counts differ, and why FAIK's household income cannot be
      read as one family's income without checking this.
  - id: familie_type
    name: familie_type
    label: {da: "Familietype", en: "Family type"}
    type: numeric
    role: code
    code_system: familie_type
    coverage: {from: 1985, to: 2026}
    origin: dst
    provenance:
      source_url: https://www.dst.dk/da/TilSalg/data-til-forskning/generelt-om-data/dokumentation-af-data/hoejkvalitetsvariable/Familier/FAMILIE-TYPE
      source_type: dst_documentation
      verified_on: 2026-10-01
      verified_against: "DST's high-quality variable page: data break across variables (C_TYPE), couple definitions"
    reader_note: >-
      DST flags a data break across variables: the older C-family series
      (C_TYPE, 1980-2007) uses other definitions, so do not join the two
      into one series. The December 2015 reorganisation within familie_type
      is in the code system.

      A couple without joint children and without a marriage or partnership
      (samboende par) is defined by the register, not by the people: two
      adults of different sex, less than 15 years apart in age, not closely
      related as far as CPR shows, and the only two adults at the address.
  - id: fam_koen
    name: fam_koen
    label: {da: "Koen for hovedpersonen i familien", en: "Sex of the family's reference person"}
    type: numeric
    role: code
    coverage: {from: 1985, to: 2026}
    origin: dst
    code_system: koen
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/BEF%20-%20Befolkningen.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list"
  - id: plads
    name: plads
    label: {da: "Familiestatus", en: "Position in the family"}
    type: numeric
    role: code
    code_system: plads
    coverage: {from: 1985, to: 2026}
    origin: dst
    provenance:
      source_url: https://www.dst.dk/da/TilSalg/data-til-forskning/generelt-om-data/dokumentation-af-data/hoejkvalitetsvariable/Familier/PLADS
      source_type: dst_documentation
      verified_on: 2026-10-01
      verified_against: "DST's high-quality variable page: data break across variables (C_STATUS), definition of the reference person"
    reader_note: >-
      Code 1 is not a head of household. In a couple of a man and a woman it
      is always the woman; in every other family it is the oldest person.
      DST flags a data break across variables: the older C-families
      (1980-2007) use C_STATUS instead.
  - id: hustype
    name: hustype
    label: {da: "Husstandstype", en: "Household type"}
    type: numeric
    role: code
    code_system: hustype
    coverage: {from: 1985, to: 2026}
    origin: dst
    provenance:
      source_url: https://www.dst.dk/da/TilSalg/data-til-forskning/generelt-om-data/dokumentation-af-data/hoejkvalitetsvariable/Husstande/HUSTYPE
      source_type: dst_documentation
      verified_on: 2026-10-01
      verified_against: "DST's high-quality variable page: no data break, valid from 1986, address households"
    reader_note: >-
      A household is everyone registered in CPR at the same address, so one
      household can hold several families (code 6). The variable starts in
      1986. The older H_TYPE (1980-2007) uses different codes.
  - id: fm_mark
    name: fm_mark
    label: {da: "Foraeldremarkering", en: "Parent marker"}
    type: numeric
    role: code
    code_system: fm_mark
    coverage: {from: 1985, to: 2026}
    origin: dst
    provenance:
      source_url: https://www.dst.dk/da/TilSalg/data-til-forskning/generelt-om-data/dokumentation-af-data/hoejkvalitetsvariable/Folketal/FMMARK
      source_type: dst_documentation
      verified_on: 2026-10-01
      verified_against: "DST's high-quality variable page for FMMARK (the C-family version), which names FM_MARK as its counterpart from 1986"
    reader_note: >-
      DST's high-quality page documents FMMARK, the C-family version
      (1980-2007), and says fm_mark is its counterpart in the family data
      from 1986, filled in for children aged 0-24. The marker is built from
      the parent references in CPR. Where those are missing, the value is 6
      (does not live with parents), even if the person does. The references
      are almost complete for people born after about 1960 and almost absent
      for people born before 1950. So code 6 mixes "lives apart from
      parents" with "parents unknown to CPR". DST writes this for FMMARK,
      but both are built from the same parent references.
  - id: civ_vfra
    name: civ_vfra
    label: {da: "Civilstandsdato", en: "Date the marital status took effect"}
    type: date
    role: date
    coverage: {from: 1985, to: 2026}
    origin: dst
    provenance:
      source_url: https://www.dst.dk/da/TilSalg/data-til-forskning/generelt-om-data/dokumentation-af-data/hoejkvalitetsvariable/Folketal/CIV-VFRA
      source_type: dst_documentation
      verified_on: 2026-10-01
      verified_against: "DST's high-quality variable page: no data break, set to date of birth for never-married"
    reader_note: >-
      The date of the most recent change in marital status (marriage,
      divorce, death of spouse), not necessarily the wedding date. For
      people who have never married (civst U), DST sets it to the date of
      birth (the page says this applies "back to 2004"), so a filled-in
      civ_vfra is not an event. For immigrants it is only registered when
      the date is known and recognised by Danish authorities.
  - id: bop_vfra
    name: bop_vfra
    label: {da: "Dato for tilflytning/indvandring", en: "Date of moving in or immigrating"}
    type: date
    role: date
    coverage: {from: 1985, to: 2026}
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/BEF%20-%20Befolkningen.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list"
  - id: ie_type
    name: ie_type
    label: {da: "Indvandrere, efterkommere , personer med dansk oprindelse", en: "Immigrant, descendant or Danish origin"}
    type: numeric
    role: code
    coverage: {from: 1985, to: 2026}
    origin: dst
    code_system: herkomst
    provenance:
      source_url: https://www.dst.dk/da/TilSalg/data-til-forskning/generelt-om-data/dokumentation-af-data/hoejkvalitetsvariable/Udlaendinge/IE-TYPE
      source_type: dst_documentation
      verified_on: 2026-10-01
      verified_against: "DST's high-quality variable page: no data break, definitions incl. reclassification on a parent's naturalisation"
    reader_note: >-
      Can change for the same person over time. A child born in Denmark
      whose parents were born in Denmark but kept a foreign citizenship is a
      descendant. If one of those parents becomes a Danish citizen, the
      child is reclassified as Danish origin. When no parent is known, a
      person born abroad is an immigrant, a person with a foreign
      citizenship is a descendant, and a person born in Denmark is of Danish
      origin.
  - id: opr_land
    name: opr_land
    label: {da: "Oprindelsesland", en: "Country of origin"}
    type: numeric
    role: code
    coverage: {from: 1985, to: 2026}
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/da/TilSalg/data-til-forskning/generelt-om-data/dokumentation-af-data/hoejkvalitetsvariable/Udlaendinge/OPR-LAND
      source_type: dst_documentation
      verified_on: 2026-10-01
      verified_against: "DST's high-quality variable page: data break within variable (former Soviet and Yugoslav republics, country codes retired 1990)"
    reader_note: >-
      DST flags a data break within this variable. The former Soviet and
      Yugoslav republics only have their own codes from the date they became
      separate countries, and a number of country codes were retired in 1990
      and folded into others (East Germany 5184 into Germany 5180, for
      example). Czechoslovakia (5162) was split in 1993. Grouping by country
      over time needs a mapping that handles these.

      How the country is chosen: persons of Danish origin always have
      Denmark. If no parent is known, an immigrant gets the country of birth
      and a descendant the country of citizenship. If parents are known, it
      follows the parent's country of birth (the mother's when both are
      known), or their citizenship if that parent was born in Denmark. Codes
      5157, 5223, 5393 and 5437 are areas (Palestine, Gaza, West Bank, East
      Jerusalem), not countries.
  - id: foedreg_kode
    name: foedreg_kode
    label: {da: "Kode for personens foedselsregistreringssted", en: "Place of birth registration"}
    type: numeric
    role: code
    coverage: {from: 1985, to: 2026}
    origin: dst
    provenance:
      source_url: https://www.dst.dk/da/TilSalg/data-til-forskning/generelt-om-data/dokumentation-af-data/hoejkvalitetsvariable/Folketal/FOEDREG-KODE
      source_type: dst_documentation
      verified_on: 2026-10-01
      verified_against: "DST's high-quality variable page: no data break, meaning changed for births from 1978"
    reader_note: >-
      Not the place of birth for everyone. It is the authority that
      registered the birth: for births before 1 January 1978 the parish
      where the birth took place, and from 1978 the mother's parish of
      residence. For immigrants it is a country code (5104-5902, 5999
      unknown abroad). Danish code ranges include 0101-0961 for
      municipalities, 7001-9348 for parishes, 4601-4687 for recognised
      religious communities and 4999 for totally unknown. A blank or 0000 is
      replaced by the most recent known citizenship, and DST warns that some
      old, undocumented codes occur. This delivery stores the column as a
      number, which drops the leading zero of codes like 0101.
  - id: statsb
    name: statsb
    label: {da: "Statsborgerskab", en: "Citizenship"}
    type: numeric
    role: code
    coverage: {from: 1985, to: 2026}
    origin: dst
    provenance:
