# PSYK_ADM - LPR2 psychiatric contacts. The register id is the name the loader
# uses, which differs from DST's page title.

id: t_psyk_adm
name: "Landspatientregistret psykiatri - administrative oplysninger"
scope: dst
reference_timing: status_period
deprecated: true
superseded_by: [lpr_a_kontakt]
description: >-
  One row per psychiatric hospital contact, up to March 2019. The psychiatric
  counterpart of lpr_adm, and separate from it: a study covering both somatic and
  psychiatric care has to read both registers and stack them.
source_url: https://www.dst.dk/extranet/ForskningVariabellister/PSYK_ADM%20-%20Landspatientregistret%20psykiatri%20-%20administrative%20oplysninger.html
coverage: {from: 1995, to: 2019}

join_keys: [recnum]
relationships:
  - to: t_psyk_diag
    key: recnum
    cardinality: one_to_many

columns:
  - id: pnr
    name: pnr
    label: {da: "Personnummer", en: "Personal identifier"}
    type: character
    role: join_key
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/PSYK_ADM%20-%20Landspatientregistret%20psykiatri%20-%20administrative%20oplysninger.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list, cross-checked against colnames() on the parquet"
    reader_note: >-
      DST's variable list calls this column PNR. Some deliveries rename it: in
      DARTER it arrives as `v_cpr`. The name is a product of the data
      processing, not of the register, so check colnames() and rename to pnr.
  - id: recnum
    name: recnum
    label: {da: "LPR-identnummer", en: "Contact identifier"}
    type: character
    role: join_key
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/PSYK_ADM%20-%20Landspatientregistret%20psykiatri%20-%20administrative%20oplysninger.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list, cross-checked against colnames() on the parquet"
    reader_note: >-
      DST's variable list calls this column RECNUM, the same name the somatic
      lpr_adm uses. Some deliveries rename it: in DARTER the contact table has
      `k_recnum` and the diagnosis table has `v_recnum`, two names for one key.
      Rename both to recnum before joining.
  - id: c_pattype
    name: c_pattype
    label: {da: "Patienttype", en: "Contact type"}
    type: character
    role: code
    code_system: pattype
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/PSYK_ADM%20-%20Landspatientregistret%20psykiatri%20-%20administrative%20oplysninger.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list, cross-checked against colnames() on the parquet"
    reader_note: >-
      Present here even where the somatic lpr_adm extract leaves it out, so
      the psychiatric side of a study can be classified when the somatic side
      cannot. Do not assume symmetry between the two extracts.
  - id: c_adiag
    name: c_adiag
    label: {da: "Aktionsdiagnose", en: "Primary diagnosis"}
    type: character
    role: code
    key: true
    origin: dst
    code_system: icd10
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/PSYK_ADM%20-%20Landspatientregistret%20psykiatri%20-%20administrative%20oplysninger.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list, cross-checked against colnames() on the parquet"
