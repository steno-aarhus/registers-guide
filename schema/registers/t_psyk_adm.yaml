# PSYK_ADM - LPR2 psychiatric contacts. The register id is the name the loader
# uses, which differs from DST's page title.

id: t_psyk_adm
family: lpr2_psychiatric
name: "Landspatientregistret psykiatri - administrative oplysninger"
scope: dst
reference_timing: course
one_row_per: event_from_person
deprecated: true
superseded_by: [lpr_a_kontakt]
description: >-
  One row per psychiatric hospital contact, up to March 2019. The psychiatric
  counterpart of lpr_adm, and separate from it: a study covering both somatic and
  psychiatric care has to read both registers and stack them.
source_url: https://www.dst.dk/extranet/ForskningVariabellister/PSYK_ADM%20-%20Landspatientregistret%20psykiatri%20-%20administrative%20oplysninger.html
coverage: {from: 1995, to: 2019}

join_keys: [recnum]
relationships:
  - to: t_psyk_diag
    key: recnum
    cardinality: one_to_many

columns:
  - id: pnr
    name: pnr
    label: {da: "Personnummer", en: "Personal identifier"}
    type: character
    role: join_key
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/PSYK_ADM%20-%20Landspatientregistret%20psykiatri%20-%20administrative%20oplysninger.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list"
      type_source: "https://www.esundhed.dk/Dokumentation/DocumentationExtended?id=5, Format Numerisk, Laengde 10"
    reader_note: >-
      DST's variable list calls this column PNR. Some deliveries rename it: some
      deliveries hand it over as `v_cpr`. The name is a product of the data
      processing, not of the register, so check your own columns and rename.
  - id: recnum
    name: recnum
    label: {da: "LPR-identnummer", en: "Contact identifier"}
    type: character
    role: join_key
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/PSYK_ADM%20-%20Landspatientregistret%20psykiatri%20-%20administrative%20oplysninger.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list"
      type_source: "https://www.esundhed.dk/Dokumentation/DocumentationExtended?id=5, Format Lokale Koder, Laengde 0"
    reader_note: >-
      DST's variable list calls this column RECNUM, the same name the somatic
      lpr_adm uses. Some deliveries rename it, and not consistently: the contact
      table can arrive as `k_recnum` and the diagnosis table as `v_recnum`.
      Rename both to recnum before joining.
  - id: c_pattype
    name: c_pattype
    label: {da: "Patienttype", en: "Contact type"}
    type: character
    role: code
    code_system: pattype
    key: true
    origin: dst
    provenance:
      source_url: https://www.esundhed.dk/Dokumentation/DocumentationExtended?id=5
      source_type: esundhed_kodeark
      verified_on: 2026-09-30
      verified_against: "Sundhedsdatastyrelsen's documentation of Landspatientregisteret (DocumentationExtended?id=5, PDF export), matched to this DST column on name and label"
      type_source: "https://www.esundhed.dk/Dokumentation/DocumentationExtended?id=5, Format Lokale Koder, Laengde 1"
    reader_note: >-
      Present here even where the somatic lpr_adm extract leaves it out,
      so the psychiatric side of a study can be classified when the
      somatic side cannot. Do not assume symmetry between the two
      extracts. Until 1993 only patient type 0 (inpatient) was recorded.
      Day patient (1) was discontinued in 2002, and hospitals then
      recorded those patients differently (some as outpatients, some as
      inpatients). Emergency room patient (3) was discontinued in 2014 and
      replaced by outpatient (2) with acute admission (c_indm = 1).
