# LPR_AFL - LPR2's cancelled-procedure table: the direct ancestor of LPR3's
# lpr_a_procregistrering_aflys, confirmed by Sundhedsdatastyrelsen's own
# LPR documentation (esundhed.dk, table t_afl): "procedurer der har vaeret
# planlagt, men som aldrig blev udfoert pga. aflysning" (procedures that
# were planned but never carried out due to cancellation), with a reason
# and the procedure code. Missed when lpr_adm/lpr_diag/lpr_sksopr were
# first built; found by cross-checking DST's full order list
# (Bestillingsliste.xlsx) against the schema on 2026-09-12.

id: lpr_afl
hide_from_overview: true
name: "Landspatientregistret - aflyste operationer"
family: lpr2_somatic
scope: dst
reference_timing: event
one_row_per: expand_from_parent
description: >-
  One row per operation that was planned and then cancelled, so it was
  never actually carried out. Carries no pnr: join to lpr_adm on recnum to
  reach the person.
source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
coverage: {from: 1999, to: 2019}

join_keys: [recnum]
relationships:
  - to: lpr_adm
    key: recnum
    cardinality: many_to_one

columns:
  - id: recnum
    name: recnum
    label: {da: "LPR-identnummer", en: "Contact identifier"}
    type: character
    role: join_key
    key: true
    origin: dst
    provenance:
      source_url: https://www.esundhed.dk/Dokumentation/DocumentationExtended?id=5
      source_type: dst_documentation
      verified_on: 2026-09-12
      verified_against: "esundhed.dk LPR documentation, table t_afl."
  - id: c_oafd
    name: c_oafd
    label: {da: null, en: "Operating department code"}
    type: character
    role: code
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "Read off the identically-named column on lpr_opr.yaml's own C_OAFD, confirmed there as 'Operationsafdeling'."
      type_inferred: true
  - id: c_opr
    name: c_opr
    label: {da: null, en: "Planned operation code"}
    type: character
    role: code
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "Read off the identically-named column on lpr_opr.yaml's own C_OPR, confirmed there as 'Operationskode'."
      type_inferred: true
    reader_note: "The operation that was cancelled - not a completed operation, so this table's rows should not be added to lpr_opr's or lpr_sksopr's counts."
  - id: c_oprart
    name: c_oprart
    label: {da: null, en: "Operation code type"}
    type: character
    role: code
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: >-
        Web search on DST's own published operations documentation: when
        c_oprart is "+", c_opr does not describe the operation itself but
        only flags that a supplementary code exists in c_tilopr.
      type_inferred: true
  - id: c_osgh
    name: c_osgh
    label: {da: null, en: "Operating hospital code"}
    type: character
    role: code
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "Read off the identically-named column on lpr_opr.yaml's own C_OSGH, confirmed there as 'Operationssygehus'."
      type_inferred: true
  - id: c_tilopr
    name: c_tilopr
    label: {da: null, en: "Supplementary operation code"}
    type: character
    role: code
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "Same add-on mechanism as c_oprart/c_opr above: populated when c_oprart is '+'."
      type_inferred: true
  - id: d_odto
    name: d_odto
    label: {da: null, en: "Planned operation date"}
    type: date
    role: date
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST order list (Bestillingsliste.xlsx): name only, no label."
      type_inferred: true
  - id: v_ominut
    name: v_ominut
    label: {da: null, en: "Planned operation time, minutes"}
    type: numeric
    role: value
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST order list: name only, no label."
      type_inferred: true
  - id: v_otime
    name: v_otime
    label: {da: null, en: "Planned operation time, hour"}
    type: numeric
    role: value
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST order list: name only, no label."
      type_inferred: true

reader_note: >-
  This table has no reason-for-cancellation column despite esundhed.dk's
  own description promising one ("med aarsag og operationskode") - only the
  planned operation, department, hospital and timing are actually present
  in DST's delivered columns. LPR3's lpr_a_procregistrering_aflys.yaml is
  this table's structural successor: neither table has any documented
  institutional guidance beyond the cancelled-procedure concept itself, and
  DST gives no column labels for either.
