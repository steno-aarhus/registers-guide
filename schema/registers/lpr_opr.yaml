# LPR_OPR - LPR2's pre-1996 operations table, coded under the classification
# used before the Nordic (NCSP/SKS) system was adopted. Confirmed by
# Sundhedsdatastyrelsen's own LPR documentation (esundhed.dk, table t_opr):
# "operationer kodet under det gamle klassifikationssystem foer den
# nordiske standard fra 1996 blev indfoert" (operations coded under the old
# classification system before the 1996 Nordic standard was introduced),
# 1977-1995. DST's own order list still carries this table through 2019,
# so later years likely hold legacy/reprocessed rows rather than newly
# ICD8-coded activity - see reader_note. Missed when lpr_adm/lpr_diag/
# lpr_sksopr were first built; found by cross-checking DST's full order
# list (Bestillingsliste.xlsx) against the schema on 2026-09-12.

id: lpr_opr
hide_from_overview: true
name: "LPR_OPR - Landspatientregistret - operationer efter ICD8 klassifikationen"
family: lpr2_somatic
scope: dst
reference_timing: event
one_row_per: expand_from_parent
description: >-
  One row per operation coded under the pre-1996 (ICD8-era) classification.
  Carries no pnr: join to lpr_adm on recnum to reach the person. Use
  lpr_sksopr.yaml instead for operations under the modern SKS coding used
  from 1996 onwards.
source_url: https://www.dst.dk/extranet/ForskningVariabellister/LPR_OPR%20-%20Landspatientregistret%20-%20operationer%20efter%20ICD8%20klassifikationen.html
coverage: {from: 1977, to: 1995}

join_keys: [recnum]
relationships:
  - to: lpr_adm
    key: recnum
    cardinality: many_to_one

columns:
  - id: recnum
    name: recnum
    label: {da: "LPR-identnummer", en: "Contact identifier"}
    type: character
    role: join_key
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/LPR_OPR%20-%20Landspatientregistret%20-%20operationer%20efter%20ICD8%20klassifikationen.html
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST's dedicated page for this register, confirmed by direct fetch on 2026-09-12."
  - id: c_komb
    name: c_komb
    label: {da: "Kombination", en: "Combination code"}
    type: character
    role: code
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/LPR_OPR%20-%20Landspatientregistret%20-%20operationer%20efter%20ICD8%20klassifikationen.html
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST's dedicated page: label 'Kombination', confirmed by direct fetch on 2026-09-12."
    reader_note: "DST's own label is bare ('Kombination') with no further definition of what is being combined - not confirmed beyond the label itself."
  - id: c_oafd
    name: c_oafd
    label: {da: "Operationsafdeling", en: "Operating department"}
    type: character
    role: code
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/LPR_OPR%20-%20Landspatientregistret%20-%20operationer%20efter%20ICD8%20klassifikationen.html
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST's dedicated page: label 'Operationsafdeling', confirmed by direct fetch on 2026-09-12."
  - id: c_opr
    name: c_opr
    label: {da: "Operationskode", en: "Operation code"}
    type: character
    role: code
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/LPR_OPR%20-%20Landspatientregistret%20-%20operationer%20efter%20ICD8%20klassifikationen.html
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST's dedicated page: label 'Operationskode', confirmed by direct fetch on 2026-09-12."
    reader_note: "ICD8-era operation code, not comparable to lpr_sksopr.yaml's SKS codes without a crosswalk - the two schemes are not simply renamed versions of each other."
  - id: c_osgh
    name: c_osgh
    label: {da: "Operationssygehus", en: "Operating hospital"}
    type: character
    role: code
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/LPR_OPR%20-%20Landspatientregistret%20-%20operationer%20efter%20ICD8%20klassifikationen.html
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST's dedicated page: label 'Operationssygehus', confirmed by direct fetch on 2026-09-12."

reader_note: >-
  Sundhedsdatastyrelsen's own LPR documentation dates this table's real
  content to 1977-1995, before the Nordic (NCSP/SKS) classification
  replaced ICD8-based operation coding in 1996 - lpr_sksopr.yaml picks up
  from there. DST's order list nonetheless lists coverage through 2019:
  treat any rows after 1995 as a documentation gap to verify against real
  data before relying on them, not as confirmed ongoing ICD8 coding.
