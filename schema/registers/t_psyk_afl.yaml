# PSYK_AFL - the psychiatric counterpart of lpr_afl.yaml: cancelled
# procedures. Structurally identical column set to the somatic table.
# Register id uses the t_psyk_ prefix, matching t_psyk_adm.yaml/
# t_psyk_diag.yaml's own established convention (the loader id differs
# from DST's page title). Missed when t_psyk_adm/t_psyk_diag were first
# built; found by cross-checking DST's full order list
# (Bestillingsliste.xlsx) against the schema on 2026-09-12.

id: t_psyk_afl
hide_from_overview: true
name: "PSYK_AFL - Landspatientregistret psykiatri - aflyste procedurer"
family: lpr2_psychiatric
scope: dst
reference_timing: course
one_row_per: expand_from_parent
description: >-
  One row per psychiatric operation/procedure that was planned and then
  cancelled. Carries no pnr: join to t_psyk_adm on recnum to reach the
  person. Structurally identical to lpr_afl.yaml, its somatic counterpart.
source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
coverage: {from: 1995, to: 2019}

join_keys: [recnum]
relationships:
  - to: t_psyk_adm
    key: recnum
    cardinality: many_to_one

columns:
  - id: recnum
    name: recnum
    label: {da: "LPR-identnummer", en: "Contact identifier"}
    type: character
    role: join_key
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST order list: name only, no label. Label follows t_psyk_adm.yaml/lpr_opr.yaml's own confirmed recnum label."
      type_inferred: true
  - id: c_oafd
    name: c_oafd
    label: {da: "Operationsafdeling", en: "Operating department"}
    type: character
    role: code
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "Label follows the confirmed label on lpr_opr.yaml's identically-named C_OAFD (DST's LPR_OPR page)."
      type_inferred: true
  - id: c_opr
    name: c_opr
    label: {da: "Operationskode", en: "Planned operation code"}
    type: character
    role: code
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "Label follows the confirmed label on lpr_opr.yaml's identically-named C_OPR (DST's LPR_OPR page)."
      type_inferred: true
    reader_note: "The operation that was cancelled - not a completed one, so these rows should not be added to psychiatric operations counts elsewhere."
  - id: c_oprart
    name: c_oprart
    label: {da: null, en: "Operation code type"}
    type: character
    role: code
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST order list: name only, no label. Same add-on mechanism as lpr_afl.yaml's c_oprart ('+' flags a supplementary code in c_tilopr)."
      type_inferred: true
  - id: c_osgh
    name: c_osgh
    label: {da: "Operationssygehus", en: "Operating hospital"}
    type: character
    role: code
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "Label follows the confirmed label on lpr_opr.yaml's identically-named C_OSGH (DST's LPR_OPR page)."
      type_inferred: true
  - id: c_tilopr
    name: c_tilopr
    label: {da: null, en: "Supplementary operation code"}
    type: character
    role: code
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST order list: name only, no label."
      type_inferred: true
  - id: d_odto
    name: d_odto
    label: {da: null, en: "Planned operation date"}
    type: date
    role: date
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST order list: name only, no label."
      type_inferred: true
  - id: v_ominut
    name: v_ominut
    label: {da: null, en: "Planned operation time, minutes"}
    type: numeric
    role: value
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST order list: name only, no label."
      type_inferred: true
  - id: v_otime
    name: v_otime
    label: {da: null, en: "Planned operation time, hour"}
    type: numeric
    role: value
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST order list: name only, no label."
      type_inferred: true

reader_note: >-
  DST's order list gives this table's own coverage as 2019 only, but that
  almost certainly reflects the order list's snapshot behaviour rather than
  genuine content: the family's confirmed real span (t_psyk_adm.yaml/
  t_psyk_diag.yaml, and the somatic counterpart lpr_afl.yaml) is 1995-2019.
  Verify against actual delivered data before assuming this table has no
  rows before 2019.
