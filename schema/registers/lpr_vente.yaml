# LPR_VENTE - LPR2's waiting-time table, by the column names: a waiting
# period's status and start/end dates. No institutional description was
# found for this specific table (not covered by Sundhedsdatastyrelsen's
# published LPR documentation checked for this schema), though DST does
# publish general information elsewhere about waiting-time monitoring for
# somatic/psychiatric treatment split by public/private facility (see
# reader_note). Missed when lpr_adm/lpr_diag/lpr_sksopr were first built;
# found by cross-checking DST's full order list (Bestillingsliste.xlsx)
# against the schema on 2026-09-12.

id: lpr_vente
hide_from_overview: true
name: "Landspatientregistret - ventetid"
family: lpr2_somatic
scope: dst
reference_timing: event
one_row_per: expand_from_parent
description: >-
  One row per waiting-time period tied to a contact, with a status and a
  start/end date. Carries no pnr: join to lpr_adm on recnum to reach the
  person. This concept and table name are read from the column names
  alone; no institutional description was found.
source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
coverage: {from: 2004, to: 2019}

join_keys: [recnum]
relationships:
  - to: lpr_adm
    key: recnum
    cardinality: many_to_one

columns:
  - id: recnum
    name: recnum
    label: {da: "LPR-identnummer", en: "Contact identifier"}
    type: character
    role: join_key
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST order list (Bestillingsliste.xlsx): name only, no label. Label given here follows lpr_adm.yaml/lpr_diag.yaml's own confirmed recnum label."
      type_inferred: true
  - id: c_vstatus
    name: c_vstatus
    label: {da: null, en: "Waiting period status code"}
    type: character
    role: code
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST order list: name only, no label."
      type_inferred: true
  - id: d_vsldto
    name: d_vsldto
    label: {da: null, en: "Waiting period end date"}
    type: date
    role: date
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST order list: name only, no label."
      type_inferred: true
    reader_note: "Read as the END date, following LPR2's own SLDTO=slut(end) naming convention - not independently labelled by DST for this column."
  - id: d_vstdto
    name: d_vstdto
    label: {da: null, en: "Waiting period start date"}
    type: date
    role: date
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST order list: name only, no label."
      type_inferred: true
    reader_note: "Read as the START date under the same SLDTO/STDTO convention as d_vsldto above."

reader_note: >-
  No DST or Sundhedsdatastyrelsen documentation describing this specific
  table's purpose was found. DST does publish general documentation on
  waiting-time monitoring split by somatic/psychiatric treatment and
  public/private facility from 2012 onward, but that documentation was not
  confirmed to describe this exact table - treat the column meanings above
  as read off the names, not institutionally confirmed. LPR3's own
  forloebsmarkoerer concept (lpr_a_forloebsmarkoer.yaml) is the modern-era
  mechanism for wait-time tracking; the two are not confirmed structurally
  equivalent.
