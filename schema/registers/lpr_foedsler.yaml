# LPR_FOEDSLER - LPR2's own birth-detail table, distinct from the MFR
# family (mfr.yaml/ftbarn.yaml etc.): a birth reported through the hospital
# contact system rather than the dedicated birth register. Missed when
# lpr_adm/lpr_diag/lpr_sksopr were first built; found by cross-checking
# DST's full order list (Bestillingsliste.xlsx) against the schema on
# 2026-09-12. Do not confuse with LPRMFRDF/LPRMFRLF ("stillbirths/
# live-births ud fra LPR"), separate DST registers deriving birth outcome
# from LPR contacts generally - not modelled in this schema.

id: lpr_foedsler
hide_from_overview: true
name: "LPR_FOEDSLER - Landspatientregistret - foedsler"
family: lpr2_somatic
scope: dst
reference_timing: event
one_row_per: event_from_person
description: >-
  One row per birth-related contact, with maternity-specific facts (parity,
  antenatal visit counts, the newborn's weight and length). Carries no
  pnr: join to lpr_adm on recnum to reach the person - the mother, since
  the newborn is not necessarily a person with their own contact here.
source_url: https://www.dst.dk/extranet/ForskningVariabellister/LPR_FOEDSLER%20-%20Landspatientregistret%20-%20f%C3%B8dsler.html
coverage: {from: 1995, to: 2019}

join_keys: [recnum]
relationships:
  - to: lpr_adm
    key: recnum
    cardinality: many_to_one

columns:
  - id: recnum
    name: recnum
    label: {da: "LPR-identnummer", en: "Contact identifier"}
    type: character
    role: join_key
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/LPR_FOEDSLER%20-%20Landspatientregistret%20-%20f%C3%B8dsler.html
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST's dedicated page for this register, confirmed by direct fetch on 2026-09-12."
    reader_note: "Joins to the MOTHER's contact in lpr_adm - the newborn is not assumed to have its own recnum here."
  - id: d_smendto
    name: d_smendto
    label: {da: null, en: "Last menstruation date"}
    type: date
    role: date
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/LPR_FOEDSLER%20-%20Landspatientregistret%20-%20f%C3%B8dsler.html
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST's dedicated page: 'Last menstruation date', confirmed by direct fetch on 2026-09-12."
    reader_note: "Used to estimate gestational age - a self-reported/clinically-estimated date, not confirmed against any independent source in this schema."
  - id: v_flernr
    name: v_flernr
    label: {da: null, en: "Child number in a multiple birth (a-f)"}
    type: character
    role: value
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/LPR_FOEDSLER%20-%20Landspatientregistret%20-%20f%C3%B8dsler.html
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST's dedicated page: 'Child number (a-f)', confirmed by direct fetch on 2026-09-12."
    reader_note: "Letter-coded (a-f), not numeric - the same multiple-birth concept as mfrhjmfo.yaml/mfrdfoed.yaml's own BARNSNUMMER_FLERFOLDSFOEDSEL, but with a different value encoding."
  - id: v_jmbes
    name: v_jmbes
    label: {da: null, en: "Number of midwife visits"}
    type: numeric
    role: value
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/LPR_FOEDSLER%20-%20Landspatientregistret%20-%20f%C3%B8dsler.html
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST's dedicated page: 'Number of midwife visits', confirmed by direct fetch on 2026-09-12."
  - id: v_langde
    name: v_langde
    label: {da: null, en: "Newborn length, cm"}
    type: numeric
    role: value
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/LPR_FOEDSLER%20-%20Landspatientregistret%20-%20f%C3%B8dsler.html
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST's dedicated page: 'Length in cm', confirmed by direct fetch on 2026-09-12."
  - id: v_lbes
    name: v_lbes
    label: {da: null, en: "Number of doctor visits"}
    type: numeric
    role: value
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/LPR_FOEDSLER%20-%20Landspatientregistret%20-%20f%C3%B8dsler.html
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST's dedicated page: 'Number of doctor visits', confirmed by direct fetch on 2026-09-12."
  - id: v_paritet
    name: v_paritet
    label: {da: null, en: "Parity (completed pregnancies, including stillbirths and this birth)"}
    type: numeric
    role: value
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/LPR_FOEDSLER%20-%20Landspatientregistret%20-%20f%C3%B8dsler.html
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST's dedicated page: 'Number of completed pregnancies (including stillbirths and current birth)', confirmed by direct fetch on 2026-09-12."
  - id: v_spbes
    name: v_spbes
    label: {da: null, en: "Number of specialist doctor visits"}
    type: numeric
    role: value
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/LPR_FOEDSLER%20-%20Landspatientregistret%20-%20f%C3%B8dsler.html
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST's dedicated page: 'Number of specialist doctor visits', confirmed by direct fetch on 2026-09-12."
  - id: v_vagt
    name: v_vagt
    label: {da: null, en: "Newborn weight, grams"}
    type: numeric
    role: value
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/LPR_FOEDSLER%20-%20Landspatientregistret%20-%20f%C3%B8dsler.html
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST's dedicated page: 'Weight in grams', confirmed by direct fetch on 2026-09-12."

reader_note: >-
  A separate, older source of birth facts alongside the MFR family
  (mfr.yaml for 1997-2018, ftbarn.yaml/ftforael.yaml/ftnaevn.yaml for
  1973-1996, mfr_nyfoedte.yaml for 2019+): this table comes from the
  hospital contact system rather than the dedicated birth register, so its
  population and exact variable definitions are not confirmed to line up
  with any MFR-family table. Cross-tabulate rather than assume equivalence
  if a study needs both.
