# VNDS_UD - one of the three registers that replaced VNDS.
#
# Note the shape change: this is not just a filtered VNDS. There is no
# indud_kode - the direction is the register you are in - and it carries a
# demographic snapshot of the person at the event, which is why DST classifies
# it as a Status register rather than an event one.

id: vnds_ud
name: "Udvandringer (emigrations)"
family: null
scope: dst
description: >-
  One row per emigration from 2005 onwards, with the person's demographics as at
  the event.
source_url: https://www.dst.dk/extranet/ForskningVariabellister/VNDS_UD%20-%20Udvandringer.html

update_cadence: annual
reference_timing: status
coverage:
  from: 2005
  to: 2025

deprecated: false
superseded_by: null
join_keys: [pnr]
relationships: []

