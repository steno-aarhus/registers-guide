# MFRKJSNT - one of 20 MFR "marker" sub-cuts backing a mfr.yaml MARKOER_* flag.
# See schema/families/mfr_markers.yaml for what this family of files shares.
# Corresponds to mfr.yaml's markoer_kejsersnit (caesarean section) - inferred from the variable and
# register naming, not stated outright by DST anywhere.

id: mfrkjsnt
hide_from_overview: true
name: "MFRKJSNT - MFR marker sub-cut"
family: mfr_markers
scope: dst
reference_timing: event
one_row_per: event_from_person
description: >-
  One row per SKS-coded finding of caesarean section for a birth in mfr.yaml,
  joined via FK_MFR. Backs mfr.yaml's markoer_kejsersnit flag.
source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
coverage: {from: 1997, to: 2018}

join_keys: [FK_MFR]
relationships:
  - to: mfr
    key: FK_MFR
    to_key: cpr_barn
    cardinality: many_to_one
    provenance:
      source_type: inferred
      verified_on: 2026-09-12

columns:
  - id: fk_mfr
    name: FK_MFR
    label: {da: null, en: null}
    type: character
    role: join_key
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST order list (Bestillingsliste.xlsx): name only, no label."
      type_inferred: true
    reader_note: "By its name, a foreign key back to mfr.yaml, the same pattern as mfrhjmfo.yaml's own FK_MFR - not confirmed to match the same column on mfr's side (assumed cpr_barn)."
  - id: kodetype
    name: KODETYPE
    label: {da: null, en: null}
    type: character
    role: code
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST order list (Bestillingsliste.xlsx): name only, no label, no value definitions."
      type_inferred: true
    reader_note: "Type of the SKSKODE value on this row (e.g. diagnosis vs procedure), by the variable name. No values documented anywhere DST publishes."

  - id: skskode
    name: SKSKODE
    label: {da: null, en: null}
    type: character
    role: code
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST order list (Bestillingsliste.xlsx): name only, no label."
      type_inferred: true
    reader_note: >-
      No `code_system` attached: an open SKS code space restricted (by the
      register's own name and its correspondence to mfr.yaml's markoer_kejsersnit) to codes
      relevant to caesarean section, but the exact restriction is not documented by DST -
      same reasoning as mfr_nyfoedte.yaml's Kejsersnit column.

reader_note: >-
  DST's variable-list page for this register gives no label or value
  definition for any column, the same thinness as mfrhjmfo.yaml. A birth
  with no finding in this category has no row here at all, rather than an
  explicit "no" row - do not read an anti-join against mfr.yaml as "0
  occurrences confirmed absent" versus "not checked".
