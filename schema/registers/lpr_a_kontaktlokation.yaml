# LPR_A_KONTAKTLOKATION - where the citizen was officially located at a
# given point during a physical-attendance contact. Missed when
# lpr_a_kontakt/diagnose/procregistrering were first built; found by
# cross-checking DST's full order list (Bestillingsliste.xlsx) against the
# schema on 2026-09-12.
#
# Sundhedsdatastyrelsen's own LPR3_F guidance describes this concept in
# detail (section 3.2, "Kontaktlokationer") - a related but not confirmed-
# identical sibling of this LPR_A_* register: no DST page for
# LPR_A_KONTAKTLOKATION specifically was found, only the master order list.

id: lpr_a_kontaktlokation
hide_from_overview: true
name: "LPR_A_KONTAKTLOKATION - Landspatientregistret (LPR3) - Kontaktlokationer"
family: lpr3
scope: dst
reference_timing: event
one_row_per: event_from_person
description: >-
  One row per contact location: where the citizen officially stayed at a
  given time during a physical-attendance contact (kontakttype ALCA00).
  Reporting a contact location is mandatory for physical-attendance
  contacts. A contact can have several locations if the citizen is moved
  during it while responsibility stays with the same SOR unit, and a
  location can also carry an absence/leave code when the citizen holds a
  bed but is not physically present. No unique key: a row hangs on the
  contact it was registered on.
source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
coverage: {from: 2025, to: 2025}

join_keys: [DW_EK_KONTAKT]
relationships:
  - to: lpr_a_kontakt
    key: DW_EK_KONTAKT
    to_key: dw_ek_kontakt
    cardinality: many_to_one
    provenance:
      source_type: inferred
      verified_on: 2026-09-12

columns:
  - id: dw_ek_kontakt
    name: DW_EK_KONTAKT
    label: {da: null, en: "Contact identifier"}
    type: character
    role: join_key
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST order list (Bestillingsliste.xlsx): name only, no label. DST's own dedicated pages for sibling LPR_A_* tables explicitly say 'Ingen label' rather than simply omitting one."
      type_inferred: true
  - id: dw_ek_kontaktlokation
    name: DW_EK_KONTAKTLOKATION
    label: {da: null, en: "Contact location identifier"}
    type: character
    role: identifier
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST order list: name only, no label."
      type_inferred: true
  - id: flag_fravaer
    name: FLAG_FRAVAER
    label: {da: null, en: "Absence flag"}
    type: character
    role: code
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST order list: name only, no label."
      type_inferred: true
    reader_note: "Whether this location row represents an absence/leave rather than a physical stay - see kont_lok_fravaer for the specific absence code."
  - id: kont_lok_enh
    name: KONT_LOK_ENH
    label: {da: null, en: "Location SOR unit code"}
    type: character
    role: code
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST order list: name only, no label."
      type_inferred: true
    reader_note: >-
      The specific SOR (Sundhedsvaesenets Organisationsregister) unit the
      citizen physically stayed at. If only the RESPONSIBLE unit for the
      whole contact is needed rather than the physical location, use
      sorenhed_ans on lpr_a_kontakt/lpr_a_forloeb instead (LPR3_F guidance,
      section 3.2) - this table is not needed for that simpler question.
  - id: kont_lok_enh_hovedspec
    name: KONT_LOK_ENH_HOVEDSPEC
    label: {da: null, en: "Location unit main specialty code"}
    type: character
    role: code
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST order list: name only, no label."
      type_inferred: true
  - id: kont_lok_fravaer
    name: KONT_LOK_FRAVAER
    label: {da: null, en: "Location absence/leave code"}
    type: character
    role: code
    origin: dst
    provenance:
      source_url: https://sundhedsdatastyrelsen.dk/media/16364/Vejledning%20til%20LPR3_F.pdf
      source_type: dst_documentation
      verified_on: 2026-09-12
      verified_against: >-
        LPR3_F guidance, section 3.2: absence/leave codes are "ALCF*".
        ALCF01 (orlov/leave) is used in both somatic and psychiatric care;
        ALCF02-ALCF06 (specific absence reasons) should only be used in
        psychiatry. Individual code meanings beyond this were not
        independently browsed for this schema.
  - id: kont_lok_fravaer_tekst
    name: KONT_LOK_FRAVAER_TEKST
    label: {da: null, en: "Location absence/leave, text"}
    type: character
    role: derived
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST order list: name only, no label."
      type_inferred: true
  - id: kont_lok_indb_tidspunkt
    name: KONT_LOK_INDB_TIDSPUNKT
    label: {da: null, en: "Location reporting time"}
    type: datetime
    role: date
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST order list: name only, no label."
      type_inferred: true
  - id: kont_lok_inst
    name: KONT_LOK_INST
    label: {da: null, en: "Location institution code"}
    type: character
    role: code
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST order list: name only, no label."
      type_inferred: true
  - id: kont_lok_sluttidspunkt
    name: KONT_LOK_SLUTTIDSPUNKT
    label: {da: null, en: "Location end"}
    type: datetime
    role: date
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST order list: name only, no label."
      type_inferred: true
  - id: kont_lok_starttidspunkt
    name: KONT_LOK_STARTTIDSPUNKT
    label: {da: null, en: "Location start"}
    type: datetime
    role: date
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST order list: name only, no label."
      type_inferred: true

reader_note: >-
  This concept did not exist before LPR3 (Sundhedsdatastyrelsen's LPR3_F
  guidance, section 3.2): there is no historical equivalent in LPR2, so a
  study spanning the LPR2/LPR3 boundary cannot use contact location before
  the cutover regardless of which table it reads from. A contact can
  legitimately have several location rows if the citizen was moved during
  it while one SOR unit stayed responsible throughout - do not assume one
  row per contact. That guidance documents LPR3_F's "kontaktlokationer"
  table, a related but not confirmed-identical sibling of this LPR_A_*
  register.
