reader_note: >-
  A procedure attaches EITHER to a contact (AktionsDiagnose/StartDato_Kontakt/
  DW_EK_Kontakt populated) OR directly to a course element
  ("forloebsprocedurer": those contact-level columns are blank instead).
  Grouping by AktionsDiagnose or joining on DW_EK_Kontakt alone silently
  drops every course-element procedure.
