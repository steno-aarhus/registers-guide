# Satellite table for the child, one row per procedure/indication/add-on
# code attached to a birth-related contact or course element. Join to
# mfr_nyfoedte via DW_EK_Nyfoedt. See mfr_barn_forloeb.yaml's header for the
# shared organisational-column note.

id: mfr_barn_procedurer
name: "Barn_Procedurer - MFR 2019+ satellite table"
scope: sds
family: mfr2019
reference_timing: event
one_row_per: event_from_person
description: >-
  One row per procedure, indication, or procedure add-on code for the
  child, tied to a contact or course element within 42 days of birth.
  Structurally the same idea as lpr_a_procregistrering. `Kejsersnit`
  (on mfr_nyfoedte) is derived from KMCA* rows in this exact table.
source_url: https://sundhedsdatastyrelsen.dk/data-og-registre/nationale-sundhedsregistre/foedselsregisteret
coverage: {from: 2019, to: 2026}

join_keys: [DW_EK_Nyfoedt]
relationships:
  - to: mfr_nyfoedte
    key: DW_EK_Nyfoedt
    to_key: DW_EK_Nyfoedt
    cardinality: many_to_one
  - to: mfr_barn_kontakter
    key: DW_EK_Kontakt
    to_key: DW_EK_Kontakt
    cardinality: many_to_one
  - to: mfr_barn_forloeb
    key: DW_EK_Forloeb
    to_key: DW_EK_Forloeb
    cardinality: many_to_one

