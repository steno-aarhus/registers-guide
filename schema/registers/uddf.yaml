# UDDF - highest completed education as dated spells. Bootstrapped from DST's
# variable list.
#
# Checked 2026-11-23: the variable list gives only Aar, Variabel and Label, no
# Format or Laengde, and UDDF does not appear in esundhed's documentation index
# (see schema/README.md, Types). The variable list and DST's order list give a
# single period, 2025-09, for every column: DST keeps UDDF as one dataset that
# holds the whole history, not one file per year. Column coverage is therefore
# left out, since 2025 to 2025 would read as data for one year only. DST's
# register overview gives the register 1974 to 2025-09 and
# reference type "Forloeb". hfaudd and hf_kilde are documented in udda.yaml
# and use the same code systems.

id: uddf
name: "Hoejeste fuldfoerte uddannelse, forloeb (highest completed education, history)"
family: null
scope: dst
description: >-
  The history register behind UDDA. It gives each person's highest completed
  education as spells, each with the date it was reached and the date it
  stopped being the highest, so education can be read at an exact date.
source_url: https://www.dst.dk/extranet/ForskningVariabellister/UDDF%20-%20H%C3%B8jeste%20fuldf%C3%B8rte%20uddannelse%20%28forl%C3%B8b%29.html

update_cadence: annual
reference_timing: course
one_row_per: unknown
coverage:
  from: 1974-01
  to: 2025-09

deprecated: false
superseded_by: null
join_keys: [pnr]
relationships:
  - to: bef
    key: pnr
    cardinality: many_to_one

columns:
  - id: pnr
    name: pnr
    label: {da: "Personnummer", en: "Personal identifier"}
    type: character
    role: join_key
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/UDDF%20-%20H%C3%B8jeste%20fuldf%C3%B8rte%20uddannelse%20%28forl%C3%B8b%29.html
      source_type: dst_variable_list
      verified_on: 2026-11-23
      verified_against: "DST variable list UDDF and DST's order list (one period, 2025-09)"
      type_inferred: true

  - id: cprtjek
    name: cprtjek
    label: {da: "CPR-tjek", en: "CPR check"}
    type: character
    role: value
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/UDDF%20-%20H%C3%B8jeste%20fuldf%C3%B8rte%20uddannelse%20%28forl%C3%B8b%29.html
      source_type: dst_variable_list
      verified_on: 2026-11-23
      verified_against: "DST variable list UDDF and DST's order list (one period, 2025-09)"
      type_inferred: true
  - id: cprtype
    name: cprtype
    label: {da: "CPR-type", en: "CPR type"}
    type: character
    role: value
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/UDDF%20-%20H%C3%B8jeste%20fuldf%C3%B8rte%20uddannelse%20%28forl%C3%B8b%29.html
      source_type: dst_variable_list
      verified_on: 2026-11-23
      verified_against: "DST variable list UDDF and DST's order list (one period, 2025-09)"
      type_inferred: true
  - id: hfaudd
    name: hfaudd
    label: {da: "Højest fuldførte uddannelse", en: "Highest completed education"}
    type: character
    role: code
    key: true
    origin: dst
    code_system: hfaudd
    provenance:
      source_url: https://www.dst.dk/da/Statistik/dokumentation/Times/uddannelsesdata/hoejest-fuldfoerte-uddannelse---forloeb
      source_type: dst_documentation
      verified_on: 2026-11-23
      verified_against: "DST's TIMES page for the history register and its statistics documentation, Hojest fuldfoert uddannelse (production, re-runs); register history UDDF"
      type_inferred: true
    reader_note: >-
      DST builds UDDA once a year from UDDF: UDDA is the education register for the
      population at 30 September, and UDDF holds the dated spells it is built from.
      Because each spell has a start and an end date, the education can be
      read at any date, not only at 30 September.

      DST can run earlier years again. It states that the status registers for all
      years are re-run if production changes materially, and that late reports from
      the institutions change earlier years, most of all the latest one. DST's
      register history for UDDF has an update of 4 October 2017 with new information
      on immigrants' brought-along education for 2005 to 2016. Two extractions made
      at different times can therefore differ for the same year, so record the date
      of yours.
  - id: hf_kilde
    name: hf_kilde
    label: {da: "Kilde til uddannelsesoplysningen", en: "Source of the education record"}
    type: character
    role: code
    origin: dst
    provenance:
      source_url: https://www.dst.dk/da/TilSalg/data-til-forskning/generelt-om-data/dokumentation-af-data/hoejkvalitetsvariable/Hoejst-fuldfoerte-uddannelse/HF-KILDE
      source_type: dst_documentation
      verified_on: 2026-11-23
      verified_against: "DST's high-quality variable page: same variable as in UDDA, see hf_kilde in udda.yaml"
      type_inferred: true
    reader_note: >-
      Same variable and value set as hf_kilde in UDDA, see there for the source priorities and the codes for imputed immigrant education.
  - id: hf_vfra
    name: hf_vfra
    label: {da: "Tidspunkt for opnået højst fuldførte uddannelse", en: "Date the education was reached"}
    type: date
    role: date
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/da/Statistik/dokumentation/Times/uddannelsesdata/hoejest-fuldfoerte-uddannelse---forloeb/hf-vfra
      source_type: dst_documentation
      verified_on: 2026-11-23
      verified_against: "DST's TIMES page for HF_VFRA"
      type_inferred: true
    reader_note: >-
      DST gives both dates as Oracle dates of the form 31jun2004:00:00:00. hf_vfra
      is when the education was reached. hf_vtil is when it stops being the highest
      education because a new education then becomes the highest. DST writes no
      value set for either.
  - id: hf_vtil
    name: hf_vtil
    label: {da: "Tidspunkt for, hvornår uddannelse mister sin gyldighed som højeste uddannelse", en: "Date the education stops being the highest"}
    type: date
    role: date
    origin: dst
    provenance:
      source_url: https://www.dst.dk/da/Statistik/dokumentation/Times/uddannelsesdata/hoejest-fuldfoerte-uddannelse---forloeb/hf-vtil
      source_type: dst_documentation
      verified_on: 2026-11-23
      verified_against: "DST's TIMES page for HF_VTIL"
      type_inferred: true
  - id: instnr
    name: instnr
    label: {da: "Institutionsnummer", en: "Institution number"}
    type: character
    role: code
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/UDDF%20-%20H%C3%B8jeste%20fuldf%C3%B8rte%20uddannelse%20%28forl%C3%B8b%29.html
      source_type: dst_variable_list
      verified_on: 2026-11-23
      verified_against: "DST variable list UDDF and DST's order list (one period, 2025-09)"
      type_inferred: true
  - id: version
    name: version
    label: {da: "Version", en: "Version"}
    type: character
    role: value
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/UDDF%20-%20H%C3%B8jeste%20fuldf%C3%B8rte%20uddannelse%20%28forl%C3%B8b%29.html
      source_type: dst_variable_list
      verified_on: 2026-11-23
      verified_against: "DST variable list UDDF and DST's order list (one period, 2025-09)"
      type_inferred: true
