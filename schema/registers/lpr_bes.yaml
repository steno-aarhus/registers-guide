# LPR_BES - LPR2's somatic outpatient visit-date table (ambulante
# besoegsdatoer). The psychiatric equivalent is documented separately by
# Sundhedsdatastyrelsen under table t_pers (esundhed.dk), which from 2003
# also covers home visits - not the same table, do not conflate the two.
# Missed when lpr_adm/lpr_diag/lpr_sksopr were first built; found by
# cross-checking DST's full order list (Bestillingsliste.xlsx) against the
# schema on 2026-09-12.

id: lpr_bes
hide_from_overview: true
name: "LPR_BES - Landspatientregistret - ambulante besoegsdatoer"
family: lpr2_somatic
scope: dst
reference_timing: event
one_row_per: expand_from_parent
description: >-
  One row per outpatient (ambulant) visit date. A single contact
  (lpr_adm/recnum) can have several outpatient visits over its course, each
  with its own row here. Carries no pnr: join to lpr_adm on recnum to reach
  the person.
source_url: https://www.dst.dk/extranet/ForskningVariabellister/LPR_BES%20-%20Landspatientregistret%20-%20ambulante%20bes%C3%B8gsdatoer.html
coverage: {from: 1994, to: 2019}

join_keys: [recnum]
relationships:
  - to: lpr_adm
    key: recnum
    cardinality: many_to_one

columns:
  - id: recnum
    name: recnum
    label: {da: "LPR-identnummer", en: "Contact identifier"}
    type: character
    role: join_key
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/LPR_BES%20-%20Landspatientregistret%20-%20ambulante%20bes%C3%B8gsdatoer.html
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST's dedicated page for this register, confirmed by direct fetch on 2026-09-12."
  - id: d_ambdto
    name: d_ambdto
    label: {da: null, en: "Date of outpatient visit"}
    type: date
    role: date
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/LPR_BES%20-%20Landspatientregistret%20-%20ambulante%20bes%C3%B8gsdatoer.html
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST's dedicated page: 'Date for ambulatory visit', confirmed by direct fetch on 2026-09-12."

reader_note: >-
  Counting rows in this table, not distinct dates, overcounts visits if any
  duplicate dates were reported for the same contact - not confirmed
  either way by DST's documentation, which gives no further definition
  beyond the plain date. This table's psychiatric counterpart is a
  different table entirely (Sundhedsdatastyrelsen's own t_pers, covering
  psychiatric ambulatory and, from 2003, home visits), not modelled in
  this schema.
