# LPR_SKSOPR - LPR2 surgical procedures. Column set confirmed against DST's
# variable list.

id: lpr_sksopr
name: "Landspatientregistret - operationer"
family: lpr2_somatic
scope: dst
reference_timing: status_period
one_row_per: expand_from_parent
description: >-
  One row per surgical procedure. Carries no pnr and no admission date: join to
  lpr_adm on recnum to reach the person.
source_url: https://www.dst.dk/extranet/ForskningVariabellister/LPR_SKSOPR%20-%20Landspatientregistret%20-%20operationer.html
coverage: {from: 1996, to: 2019}

join_keys: [recnum]
relationships:
  - to: lpr_adm
    key: recnum
    cardinality: many_to_one

columns:
  - id: recnum
    name: recnum
    label: {da: "LPR-identnummer", en: "Contact identifier"}
    type: character
    role: join_key
    coverage: {from: 1996, to: 2019}
    key: true
    origin: dst
    provenance:
      source_url: https://www.esundhed.dk/Dokumentation/DocumentationExtended?id=5
      source_type: esundhed_kodeark
      verified_on: 2026-10-01
      verified_against: "Sundhedsdatastyrelsen's documentation of Landspatientregisteret (DocumentationExtended?id=5), table t_sksopr, variable v_recnum"
      type_source: "https://www.esundhed.dk/Dokumentation/DocumentationExtended?id=5, Format Lokale Koder, Laengde 0"
    reader_note: >-
      Sundhedsdatastyrelsen states that recnum is unique only within one
      update of the register. A contact can get a new recnum when the
      register is updated, and a recnum can be reused for a different
      contact. Join tables only within the same delivery, and never store
      recnum as a lasting id for a contact.
  - id: c_opr
    name: c_opr
    label: {da: "Procedurekodenummer (operation)", en: "Procedure code"}
    type: character
    role: code
    coverage: {from: 1996, to: 2019}
    key: true
    origin: dst
    code_system: sks
    provenance:
      source_url: https://www.esundhed.dk/Dokumentation/DocumentationExtended?id=5
      source_type: esundhed_kodeark
      verified_on: 2026-10-01
      verified_against: "Sundhedsdatastyrelsen's documentation of Landspatientregisteret (DocumentationExtended?id=5), table t_sksopr, variable c_opr"
      type_source: "https://www.esundhed.dk/Dokumentation/DocumentationExtended?id=5, Format Klassificerede koder, Laengde 10"
    reader_note: >-
      The SKS procedure code. Surgical codes start with K.

      Operations from 1 January 1996 only, in the Nordic classification
      (NCSP). Operations before that date are in lpr_opr under the old
      classification, and the split is by operation date, not by contact. So
      a contact that runs across New Year 1995/1996 can have operations in
      both tables: read both for those contacts. Look up the code text valid
      on d_odto.
  - id: c_oprart
    name: c_oprart
    label: {da: "Procedureart (operation)", en: "Procedure type"}
    type: character
    role: code
    coverage: {from: 1996, to: 2019}
    key: true
    origin: dst
    code_system: oprart
    provenance:
      source_url: https://www.esundhed.dk/Dokumentation/DocumentationExtended?id=5
      source_type: esundhed_kodeark
      verified_on: 2026-10-01
      verified_against: "Sundhedsdatastyrelsen's documentation of Landspatientregisteret (DocumentationExtended?id=5), table t_sksopr, variable c_oprart"
      type_source: "https://www.esundhed.dk/Dokumentation/DocumentationExtended?id=5, Format Lokale Koder, Laengde 1"
    reader_note: >-
      A '+' row is not an operation. It only marks that the operation in
      c_opr has an add-on code in c_tilopr; the operation's own type is on
      the row above with the same recnum and c_opr. Sundhedsdatastyrelsen
      also notes that V (main operation of the contact) was no longer
      mandatory for contacts completed in 2004, so filtering on V does not
      give one operation per contact across all years.
  - id: c_osgh
    name: c_osgh
    label: {da: "Procedurende sygehus (operation)", en: "Hospital performing the procedure"}
    type: character
    role: code
    coverage: {from: 1996, to: 2019}
    key: true
    origin: dst
    provenance:
      source_url: https://www.esundhed.dk/Dokumentation/DocumentationExtended?id=5
      source_type: esundhed_kodeark
      verified_on: 2026-10-01
      verified_against: "Sundhedsdatastyrelsen's documentation of Landspatientregisteret (DocumentationExtended?id=5), table t_sksopr, variable c_osgh"
      type_inferred: true
    reader_note: >-
      Hospital code from the SHAK classification. Names change over time, so
      look up the name valid on d_odto.
  - id: c_tilopr
    name: c_tilopr
    label: {da: "Tillaegskode (operation)", en: "Supplementary code"}
    type: character
    role: code
    coverage: {from: 1996, to: 2019}
    key: true
    origin: dst
    code_system: sks
    provenance:
      source_url: https://www.esundhed.dk/Dokumentation/DocumentationExtended?id=5
      source_type: esundhed_kodeark
      verified_on: 2026-10-01
      verified_against: "Sundhedsdatastyrelsen's documentation of Landspatientregisteret (DocumentationExtended?id=5), table t_sksopr, variable c_tilopr"
      type_inferred: true
    reader_note: >-
      Add-on code to the operation in c_opr on the same row (marked by
      c_oprart '+'). Almost any SKS code can be used as an add-on.
  - id: d_odto
    name: d_odto
    label: {da: "Proceduredato (operation)", en: "Procedure date"}
    type: date
    role: date
    coverage: {from: 1996, to: 2019}
    key: true
    origin: dst
    provenance:
      source_url: https://www.esundhed.dk/Dokumentation/DocumentationExtended?id=5
      source_type: esundhed_kodeark
      verified_on: 2026-10-01
      verified_against: "Sundhedsdatastyrelsen's documentation of Landspatientregisteret (DocumentationExtended?id=5), table t_sksopr, variable d_odto"
      type_inferred: true
    reader_note: >-
      The date the operation started. Unlike lpr_diag, this table has its
      own date, so the operation date does not have to be taken from the
      contact.
  - id: year
    name: year
    label: {da: null, en: "Register year"}
    type: integer
    role: date
    key: true
    origin: tooling
    added_by: parquet conversion
    provenance:
      source_type: unverified
      verified_on: 2026-09-01
      verified_against: null
    reader_note: >-
      Not a DST variable. It is the partition the yearly deliveries were written
      into, so filtering on it stops the other years being read at all. Use it to
      limit how much is read, not to decide when something happened: for that,
      use the register's own date column.
  - id: c_oafd
    name: c_oafd
    label: {da: "Procedurende afdeling (operation)", en: "Department performing the procedure"}
    type: character
    role: code
    origin: dst
    coverage: {from: 1996, to: 2019}
    provenance:
      source_url: https://www.esundhed.dk/Dokumentation/DocumentationExtended?id=5
      source_type: esundhed_kodeark
      verified_on: 2026-10-01
      verified_against: "Sundhedsdatastyrelsen's documentation of Landspatientregisteret (DocumentationExtended?id=5), table t_sksopr, variable c_oafd"
      type_inferred: true
    reader_note: >-
      Not unique on its own: combine it with c_osgh to get the 7-character
      hospital-department code (SHAK). Department names change over time, so
      look up the name valid on d_odto.
  - id: leverancedato
    name: leverancedato
    label: {da: null, en: "Delivery date"}
    type: date
    role: date
    origin: dst
    coverage: {from: 1996, to: 2019}
    provenance:
      source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
      source_type: dst_variable_list
      verified_on: 2026-09-02
      verified_against: "DST order list (Bestillingsliste.xlsx): name, Danish label and period"
      type_inferred: true
  - id: version
    name: version
    label: {da: "Version", en: "Version"}
    type: character
    role: code
    origin: dst
    coverage: {from: 1996, to: 2019}
    provenance:
      source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
      source_type: dst_variable_list
      verified_on: 2026-09-02
      verified_against: "DST order list (Bestillingsliste.xlsx): name, Danish label and period"
      type_inferred: true
  - id: v_ominut
    name: v_ominut
    label: {da: "Procedureminut (operation)", en: "Procedure start, minute"}
    type: numeric
    role: value
    origin: dst
    coverage: {from: 1996, to: 2019}
    provenance:
      source_url: https://www.esundhed.dk/Dokumentation/DocumentationExtended?id=5
      source_type: esundhed_kodeark
      verified_on: 2026-10-01
      verified_against: "Sundhedsdatastyrelsen's documentation of Landspatientregisteret (DocumentationExtended?id=5), table t_sksopr, variable v_ominut"
      type_inferred: true
    reader_note: >-
      Minute (0-59) of the start time, from 1998. Combine with v_otime;
      before 1998 only the date exists.
  - id: v_otime
    name: v_otime
    label: {da: "Proceduretime (operation)", en: "Procedure start, hour"}
    type: numeric
    role: value
    origin: dst
    coverage: {from: 1996, to: 2019}
    provenance:
      source_url: https://www.esundhed.dk/Dokumentation/DocumentationExtended?id=5
      source_type: esundhed_kodeark
      verified_on: 2026-10-01
      verified_against: "Sundhedsdatastyrelsen's documentation of Landspatientregisteret (DocumentationExtended?id=5), table t_sksopr, variable v_otime"
      type_inferred: true
    reader_note: >-
      Hour (0-23) of the start time, from 1998.
