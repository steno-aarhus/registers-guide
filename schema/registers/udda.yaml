# UDDA - highest completed education. Bootstrapped from DST's variable list.

id: udda
name: "Uddannelser (BUE) (education register)"
family: null
scope: dst
description: >-
  One record per person per year, updated when the education changes. Holds the
  code for the education a person completed, not its level.
source_url: https://www.dst.dk/extranet/ForskningVariabellister/UDDA%20-%20Uddannelser%20%28BUE%29.html

update_cadence: annual
reference_timing: event
coverage:
  from: 1980-12
  to: 2025-09

deprecated: false
superseded_by: null
join_keys: [pnr]
relationships: []

columns:
  - id: pnr
    name: pnr
    label: {da: "Personnummer", en: "Personal identifier"}
    type: character
    role: join_key
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/UDDA%20-%20Uddannelser%20%28BUE%29.html
      source_type: dst_variable_list
      verified_on: 2026-08-31
      verified_against: "DST variable list UDDA"

  - id: hfaudd
    name: hfaudd
    label: {da: "Højest fuldførte uddannelse", en: "Highest completed education"}
    type: character
    role: code
    origin: dst
    code_system: hfaudd
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/UDDA%20-%20Uddannelser%20%28BUE%29.html
      source_type: dst_variable_list
      verified_on: 2026-08-31
      verified_against: "DST variable list UDDA"
      guide_page: register-reference.qmd
    reader_note: >-
      A code for which education, not for its level. UDDA carries no level
      column at all, so the level has to come from a lookup table.

  - id: udd
    name: udd
    label: {da: "Uddannelseskode", en: "Education code"}
    type: character
    role: code
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/UDDA%20-%20Uddannelser%20%28BUE%29.html
      source_type: dst_variable_list
      verified_on: 2026-08-31
      verified_against: "DST variable list UDDA"
    reader_note: >-
      Not the same code system as hfaudd. Under DISCED-15, AUDD codes describe a
      completed education and UDD codes one that is ongoing or was interrupted,
      so a lookup table built for one will not fit the other.

  - id: hf_kilde
    name: hf_kilde
    label:
      da: "Kilde til uddannelsesoplysningen"
      en: "Source of the education record"
    type: character
    role: code
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/UDDA%20-%20Uddannelser%20%28BUE%29.html
      source_type: dst_variable_list
      verified_on: 2026-08-31
      verified_against: "DST variable list UDDA"

  - id: hf_vfra
    name: hf_vfra
    label:
      da: "Tidspunkt for opnået højst fuldførte uddannelse"
      en: "Date the education was completed"
    type: date
    role: date
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/UDDA%20-%20Uddannelser%20%28BUE%29.html
      source_type: dst_variable_list
      verified_on: 2026-08-31
      verified_against: "DST variable list UDDA"

  - id: hfinstnr
    name: hfinstnr
    label:
      da: "Institutionsnummer, højst fuldført uddannelse"
      en: "Institution that awarded the education"
    type: character
    role: code
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/UDDA%20-%20Uddannelser%20%28BUE%29.html
      source_type: dst_variable_list
      verified_on: 2026-08-31
      verified_against: "DST variable list UDDA"
    reader_note: >-
      The guide previously referred to this column as `INSTNR`. DST's list has
      no INSTNR; the institution columns are HFINSTNR, ALMINSTNR, ERHINSTNR and
      IGINSTNR, one per kind of education.
