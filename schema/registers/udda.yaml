# UDDA - highest completed education. Bootstrapped from DST's variable list.

id: udda
name: "Uddannelser (BUE) (education register)"
family: null
scope: dst
description: >-
  One record per person per year, updated when the education changes. Holds the
  code for the education a person completed, not its level.
source_url: https://www.dst.dk/extranet/ForskningVariabellister/UDDA%20-%20Uddannelser%20%28BUE%29.html

update_cadence: annual
reference_timing: event
coverage:
  from: 1980-12
  to: 2025-09

deprecated: false
superseded_by: null
join_keys: [pnr]
relationships: []

columns:
  - id: pnr
    name: pnr
    label: {da: "Personnummer", en: "Personal identifier"}
    type: character
    role: join_key
    key: true
    origin: dst
    coverage: {from: 1980, to: 2025}
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/UDDA%20-%20Uddannelser%20%28BUE%29.html
      source_type: dst_variable_list
      verified_on: 2026-08-31
      verified_against: "DST variable list UDDA"
      type_inferred: true
  - id: hfaudd
    name: hfaudd
    label: {da: "Højest fuldførte uddannelse", en: "Highest completed education"}
    type: character
    role: code
    key: true
    origin: dst
    code_system: hfaudd
    coverage: {from: 1980, to: 2025}
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/UDDA%20-%20Uddannelser%20%28BUE%29.html
      source_type: dst_variable_list
      verified_on: 2026-08-31
      verified_against: "DST variable list UDDA"
      type_inferred: true
      guide_page: register-reference.qmd
    reader_note: >-
      A code for which education, not for its level. UDDA carries no level
      column at all, so the level has to come from a lookup table.

  - id: udd
    name: udd
    label: {da: "Uddannelseskode", en: "Education code"}
    type: character
    role: code
    key: true
    origin: dst
    coverage: {from: 1980, to: 2025}
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/UDDA%20-%20Uddannelser%20%28BUE%29.html
      source_type: dst_variable_list
      verified_on: 2026-08-31
      verified_against: "DST variable list UDDA"
      type_inferred: true
    reader_note: >-
      Not the same code system as hfaudd. Under DISCED-15, AUDD codes describe a
      completed education and UDD codes one that is ongoing or was interrupted,
      so a lookup table built for one will not fit the other.

  - id: hf_kilde
    name: hf_kilde
    label:
      da: "Kilde til uddannelsesoplysningen"
      en: "Source of the education record"
    type: character
    role: code
    origin: dst
    coverage: {from: 1980, to: 2025}
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/UDDA%20-%20Uddannelser%20%28BUE%29.html
      source_type: dst_variable_list
      verified_on: 2026-08-31
      verified_against: "DST variable list UDDA"
      type_inferred: true
  - id: hf_vfra
    name: hf_vfra
    label:
      da: "Tidspunkt for opnået højst fuldførte uddannelse"
      en: "Date the education was completed"
    type: date
    role: date
    key: true
    origin: dst
    coverage: {from: 1980, to: 2025}
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/UDDA%20-%20Uddannelser%20%28BUE%29.html
      source_type: dst_variable_list
      verified_on: 2026-08-31
      verified_against: "DST variable list UDDA"
      type_inferred: true
  - id: hfinstnr
    name: hfinstnr
    label:
      da: "Institutionsnummer, højst fuldført uddannelse"
      en: "Institution that awarded the education"
    type: character
    role: code
    origin: dst
    coverage: {from: 1980, to: 2025}
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/UDDA%20-%20Uddannelser%20%28BUE%29.html
      source_type: dst_variable_list
      verified_on: 2026-08-31
      verified_against: "DST variable list UDDA"
      type_inferred: true
    reader_note: >-
      The guide previously referred to this column as `INSTNR`. DST's list has
      no INSTNR; the institution columns are HFINSTNR, ALMINSTNR, ERHINSTNR and
      IGINSTNR, one per kind of education.
  - id: almaudd
    name: almaudd
    label: {da: "Hoejest fuldfoerte almen uddannelse", en: "Highest completed general education"}
    type: character
    role: code
    origin: dst
    coverage: {from: 1980, to: 2025}
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/UDDA%20-%20Uddannelser%20%28BUE%29.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list, including the per-variable year range"
      type_inferred: true
    reader_note: >-
      The general-education track only. hfaudd is the highest completed
      education of any kind, so the two answer different questions and are not
      interchangeable.
  - id: erhaudd
    name: erhaudd
    label: {da: "Hoejest fuldfoerte erhvervskompetencegivende uddannelse", en: "Highest completed vocational education"}
    type: character
    role: code
    origin: dst
    coverage: {from: 1980, to: 2025}
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/UDDA%20-%20Uddannelser%20%28BUE%29.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list, including the per-variable year range"
      type_inferred: true
  - id: alm_vfra
    name: alm_vfra
    label: {da: "Tidspunkt for opnaaet almenuddannelse", en: "Date the general education was obtained"}
    type: date
    role: date
    origin: dst
    coverage: {from: 1980, to: 2025}
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/UDDA%20-%20Uddannelser%20%28BUE%29.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list, including the per-variable year range"
      type_inferred: true
  - id: erh_vfra
    name: erh_vfra
    label: {da: "Tidspunkt for opnaaet erhvervskompetencegivende uddannelse", en: "Date the vocational education was obtained"}
    type: date
    role: date
    origin: dst
    coverage: {from: 1980, to: 2025}
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/UDDA%20-%20Uddannelser%20%28BUE%29.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list, including the per-variable year range"
      type_inferred: true
  - id: ig_vfra
    name: ig_vfra
    label: {da: "Paabegyndelsestidspunkt for igangvaerende uddannelse", en: "Start date of the ongoing education"}
    type: date
    role: date
    origin: dst
    coverage: {from: 1980, to: 2025}
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/UDDA%20-%20Uddannelser%20%28BUE%29.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list, including the per-variable year range"
      type_inferred: true
    reader_note: >-
      Pairs with udd: this is when the ongoing education began. An education
      with a start and no completion is either still running or was
      interrupted, and the register does not distinguish the two.
  - id: alminstnr
    name: alminstnr
    label: {da: "Institutionsnummer, hoejst fuldfoert almene uddannelse", en: "Institution, general education"}
