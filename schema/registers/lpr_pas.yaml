# LPR_PAS - LPR2's passive-waiting-time table. Confirmed by DST's own
# psychiatric sibling table's dedicated page title (PSYK_PAS -
# Landspatientregistret psykiatri - oplysninger om PASSIV VENTETID):
# "PAS" is short for "passiv" (passive), not "orlov" (leave) as first
# guessed from the column names alone - passive waiting time is time a
# patient spends waiting for reasons attributable to the patient (e.g.
# a requested postponement), as distinct from LPR_VENTE's general
# (typically hospital-side) waiting time. Missed when lpr_adm/lpr_diag/
# lpr_sksopr were first built; found by cross-checking DST's full order
# list (Bestillingsliste.xlsx) against the schema on 2026-09-12.

id: lpr_pas
hide_from_overview: true
name: "Landspatientregistret - passiv ventetid"
family: lpr2_somatic
scope: dst
reference_timing: event
one_row_per: expand_from_parent
description: >-
  One row per period of passive waiting time (ventetid patienten selv har
  forlaenget, fx ved udsaettelse), with a reason, its start/end dates, and
  which department/hospital the patient returned to when active treatment
  resumed. Carries no pnr: join to lpr_adm on recnum to reach the person.
source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
coverage: {from: 1999, to: 2019}

join_keys: [recnum]
relationships:
  - to: lpr_adm
    key: recnum
    cardinality: many_to_one

columns:
  - id: recnum
    name: recnum
    label: {da: "LPR-identnummer", en: "Contact identifier"}
    type: character
    role: join_key
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST order list (Bestillingsliste.xlsx): name only, no label. Label given here follows lpr_adm.yaml/lpr_diag.yaml's own confirmed recnum label."
      type_inferred: true
  - id: c_passarsag
    name: c_passarsag
    label: {da: null, en: "Passive waiting time reason code"}
    type: character
    role: code
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: >-
        DST's dedicated page for the psychiatric sibling table PSYK_PAS
        confirms the register-level concept ("oplysninger om passiv
        ventetid"), but gives no per-column labels for this specific
        table; DST's order list gives the column name only.
      type_inferred: true
  - id: d_passldto
    name: d_passldto
    label: {da: null, en: "Passive waiting time end date"}
    type: date
    role: date
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST order list: name only, no label."
      type_inferred: true
    reader_note: >-
      Read as the END date: this schema follows LPR2's own SLDTO=slut(end)
      / STDTO=start naming convention, confirmed on lpr_vente.yaml's
      matching d_vsldto/d_vstdto pair - not independently labelled by DST
      for this specific column.
  - id: d_passtdto
    name: d_passtdto
    label: {da: null, en: "Passive waiting time start date"}
    type: date
    role: date
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST order list: name only, no label."
      type_inferred: true
    reader_note: "Read as the START date under the same SLDTO/STDTO convention as d_passldto above."
  - id: c_tilbafd
    name: c_tilbafd
    label: {da: null, en: "Return department code"}
    type: character
    role: code
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST order list: name only, no label."
      type_inferred: true
    reader_note: "tilbage = back/return: the department the patient returned to once active treatment resumed, by the variable name."
  - id: c_tilbsgh
    name: c_tilbsgh
    label: {da: null, en: "Return hospital code"}
    type: character
    role: code
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST order list: name only, no label."
      type_inferred: true
  - id: d_tilbdto
    name: d_tilbdto
    label: {da: null, en: "Return date"}
    type: date
    role: date
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST order list: name only, no label."
      type_inferred: true

reader_note: >-
  Passive waiting time is specifically time NOT counted toward hospitals'
  waiting-time performance targets, typically because the delay is
  attributable to the patient rather than the hospital (e.g. a requested
  postponement) - the concept is confirmed via the psychiatric sibling
  table PSYK_PAS's own DST page title, but no per-column labels or
  code-value definitions were found for either the somatic or psychiatric
  version. Do not add this table's periods to lpr_vente.yaml's waiting
  time without checking whether the two are meant to be summed or are
  mutually exclusive measures - that is not documented anywhere found.
