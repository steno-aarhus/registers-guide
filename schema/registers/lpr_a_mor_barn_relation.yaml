      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST order list: name only, no label."
      type_inferred: true
    reader_note: "A citizen data-warehouse key for the child, alongside the plain PNR_BARN - LPR3's own internal identifier, not something to join other registers on directly."
