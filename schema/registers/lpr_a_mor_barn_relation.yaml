# LPR_A_MOR_BARN_RELATION - the real, DST-documented link between a mother's
# and a child's LPR3 course elements around a birth. Missed when
# lpr_a_kontakt/lpr_a_diagnose/lpr_a_procregistrering were first built;
# found by cross-checking DST's full order list (Bestillingsliste.xlsx)
# against the schema on 2026-09-12.
#
# Coverage in the order list is a single snapshot, 2025-12-31 to 2025-12-31
# ("Periode antal" = 1): this table appears new, or at least only recently
# distinguished as its own register, as of the most recent delivery DST's
# order list reflects. A project with an older delivery may not have it.
#
# Resolves an open question from mfr_nyfoedte.yaml and mfr_barn_forloeb.yaml/
# mfr_mor_forloeb.yaml, which could only mark their relationship to
# lpr_a_kontakt as `source_type: inferred`: this table is DST's own
# documented mother-child link at the LPR3 course-element level, the most
# direct real link found so far, though it is not itself confirmed to be
# what mfr_nyfoedte's own delivery is built from - see reader_note.

id: lpr_a_mor_barn_relation
hide_from_overview: true
name: "LPR_A_MOR_BARN_RELATION - Landspatientregistret (LPR3) - mor/barn-relation"
family: lpr3
scope: dst
reference_timing: event
one_row_per: event_from_person
description: >-
  One row per linked mother-child pair of LPR3 course elements around a
  birth. The DST-documented mechanism for finding the mother's course
  element that corresponds to a given child's, and vice versa.
source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
coverage: {from: 2025, to: 2025}

join_keys: [PNR_BARN, PNR_MOR]
relationships:
  - to: bef
    key: PNR_BARN
    to_key: pnr
    cardinality: many_to_one
    provenance:
      source_type: inferred
      verified_on: 2026-09-12
  - to: bef
    key: PNR_MOR
    to_key: pnr
    cardinality: many_to_one
    provenance:
      source_type: inferred
      verified_on: 2026-09-12
  - to: mfr_nyfoedte
    key: PNR_BARN
    to_key: CPRnummer_Barn
    cardinality: one_to_one
    provenance:
      source_type: inferred
      verified_on: 2026-09-12

columns:
  - id: dw_ek_mor_barn_relation
    name: DW_EK_MOR_BARN_RELATION
    label: {da: null, en: "Mother-child relation identifier"}
    type: character
    role: join_key
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST order list (Bestillingsliste.xlsx): name only, no label. DST's own dedicated pages for sibling LPR_A_* tables explicitly say 'Ingen label' rather than simply omitting one."
      type_inferred: true
  - id: pnr_barn
    name: PNR_BARN
    label: {da: null, en: "Child's personal identification number"}
    type: character
    role: join_key
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
      source_type: dst_variable_list
