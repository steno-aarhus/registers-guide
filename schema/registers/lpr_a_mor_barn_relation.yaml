reader_note: >-
  DST's own dedicated page for at least one sibling table in this same
  LPR_A_* batch (LPR_A_RESULTATER) explicitly states "Ingen label" for
  every column rather than omitting a label silently - this register's
  thinness is confirmed as deliberate/current DST documentation practice,
  not a gap in what this schema could find. The relationship to
  mfr_nyfoedte above is this schema's own reasoning from column names and
  the shared PNR_BARN concept, not a fact DST states outright anywhere: if
  a project needs a hard join between LPR3 and the 2019+ MFR family, verify
  it against real data before relying on it.
