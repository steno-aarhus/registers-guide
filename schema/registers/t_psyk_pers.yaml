# PSYK_PERS - the psychiatric outpatient-visit table: richer than
# lpr_bes.yaml's somatic equivalent (a bare visit date), carrying staff
# category and service-type detail as well. Sundhedsdatastyrelsen's own
# LPR documentation (esundhed.dk, table t_pers, cited from lpr_bes.yaml's
# header) confirms this table also covers home visits from 2003 onward and
# can hold multiple visit dates per day per patient. DST's own dedicated
# page confirms real column labels. Register id uses the t_psyk_ prefix,
# matching t_psyk_adm.yaml/t_psyk_diag.yaml's own established convention.
# Missed when t_psyk_adm/t_psyk_diag were first built; found by
# cross-checking DST's full order list (Bestillingsliste.xlsx) against the
# schema on 2026-09-12.

id: t_psyk_pers
hide_from_overview: true
name: "PSYK_PERS - Landspatientregistret psykiatri - oplysninger om ambulante besoeg"
family: lpr2_psychiatric
scope: dst
reference_timing: course
one_row_per: expand_from_parent
description: >-
  One row per psychiatric outpatient (ambulant) visit, or home visit from
  2003 onward, with the staff category involved, the service provided, and
  where it took place. A single contact can have several visits, and even
  several per day. Carries no pnr: join to t_psyk_adm on recnum to reach
  the person.
source_url: https://www.dst.dk/extranet/ForskningVariabellister/PSYK_PERS%20-%20Landspatientregistret%20psykiatri%20-%20oplysninger%20om%20ambulante%20bes%C3%B8g.html
coverage: {from: 1995, to: 2019}

join_keys: [recnum]
relationships:
  - to: t_psyk_adm
    key: recnum
    cardinality: many_to_one

columns:
  - id: recnum
    name: recnum
    label: {da: "LPR-identnummer", en: "Contact identifier"}
    type: character
    role: join_key
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/PSYK_PERS%20-%20Landspatientregistret%20psykiatri%20-%20oplysninger%20om%20ambulante%20bes%C3%B8g.html
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST's dedicated page for this register, confirmed by direct fetch on 2026-09-12."
  - id: c_perskat1
    name: c_perskat1
    label: {da: "Personale indraget i psykiatrisk besoeg", en: "Staff category involved in the visit (1)"}
    type: character
    role: code
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/PSYK_PERS%20-%20Landspatientregistret%20psykiatri%20-%20oplysninger%20om%20ambulante%20bes%C3%B8g.html
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST's dedicated page: label 'Personale indraget i psykiatrisk besoeg', confirmed by direct fetch on 2026-09-12."
    reader_note: "Three parallel staff-category columns (c_perskat1/2/3) share the identical label on DST's page - up to three staff categories can be recorded per visit, not one per column type."
  - id: c_perskat2
    name: c_perskat2
