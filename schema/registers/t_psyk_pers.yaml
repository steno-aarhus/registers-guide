      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST's dedicated page: label 'Dato for ambulant psykiatrisk besoeg', confirmed by direct fetch on 2026-09-12."
    reader_note: "Sundhedsdatastyrelsen's LPR documentation notes several visits can share the same date for the same patient - do not deduplicate by date alone when counting visits."

reader_note: >-
  Richer than lpr_bes.yaml, its somatic counterpart, which carries only a
  bare visit date: this table also records the staff category and the
  service provided, and (from 2003) whether the visit was a home visit.
  DST's page gives coverage as 2019 only, almost certainly the same
  order-list snapshot artifact seen throughout this PSYK batch rather than
  genuine content - Sundhedsdatastyrelsen's own LPR documentation dates
  this table from 1995.
