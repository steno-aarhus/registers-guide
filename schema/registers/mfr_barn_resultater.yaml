# Satellite table for the child, one row per reported clinical result
# (Apgar score, weight, birthplace result code, and more) tied to a
# birth-related contact or course element. Join to mfr_nyfoedte via
# DW_EK_Nyfoedt. Many of mfr_nyfoedte's own resolved columns (Apgarscore,
# Vaegt_Barn, Foedested_Faktisk, Tobaksforbrug's RGAB* half, Fosterpraesentation's
# RGAD* half) are built FROM rows in this exact table.

id: mfr_barn_resultater
name: "Barn_Resultater - MFR 2019+ satellite table"
scope: sds
family: mfr2019
reference_timing: event
one_row_per: event_from_person
description: >-
  One row per reported clinical result for the child, tied to a contact or
  course element within 42 days of birth. `ResultatVaerdi` is polymorphic:
  the actual data type it holds depends on `ResultatType` (see reader_note).
source_url: https://sundhedsdatastyrelsen.dk/data-og-registre/nationale-sundhedsregistre/foedselsregisteret
coverage: {from: 2019, to: 2026}

join_keys: [DW_EK_Nyfoedt]
relationships:
  - to: mfr_nyfoedte
    key: DW_EK_Nyfoedt
    to_key: DW_EK_Nyfoedt
    cardinality: many_to_one
  - to: mfr_barn_kontakter
    key: DW_EK_Kontakt
    to_key: DW_EK_Kontakt
    cardinality: many_to_one
  - to: mfr_barn_forloeb
    key: DW_EK_Forloeb
    to_key: DW_EK_Forloeb
    cardinality: many_to_one

columns:
  - id: dw_ek_nyfoedt
    name: DW_EK_Nyfoedt
    label: {da: null, en: "Newborn key"}
    type: character
    role: join_key
    key: true
    origin: dst
    provenance:
      source_url: https://sundhedsdatastyrelsen.dk/Media/638650989728109987/Dokumentation_Foedselsregisteret_2019_og_frem.xlsx
      source_type: dst_documentation
      verified_on: 2026-09-12
      verified_against: "Kolonner sheet."
  - id: resultatindberetningstype
    name: ResultatIndberetningsType
    label: {da: null, en: "Result-report type"}
    type: character
    role: code
    origin: dst
    provenance:
      source_url: https://sundhedsdatastyrelsen.dk/Media/638650989728109987/Dokumentation_Foedselsregisteret_2019_og_frem.xlsx
      source_type: dst_documentation
      verified_on: 2026-09-12
      verified_against: "Kolonner sheet: SKS code, e.g. RAA03."
  - id: resultatindberetningsstatus
    name: ResultatIndberetningsStatus
    label: {da: null, en: "Result-report status (complete/incomplete)"}
    type: character
    role: code
    origin: dst
    provenance:
      source_url: https://sundhedsdatastyrelsen.dk/Media/638650989728109987/Dokumentation_Foedselsregisteret_2019_og_frem.xlsx
      source_type: dst_documentation
      verified_on: 2026-09-12
      verified_against: >-
        Kolonner sheet: RAS00 = Inkomplet, RAS01 = Komplet. Only
        meaningfully populated after the LPR3 cutover; pre-cutover data
        defaults to RAS01, same caveat as SenereAfkraeftet on the diagnosis
        tables.
    reader_note: >-
      Several of mfr_nyfoedte's own resolved columns (Tobaksforbrug,
      Vaegt_Barn, Hoejde_Mor, and others) prioritise "komplet"
      (RAS01) results over "inkomplet" (RAS00) ones when more than one
      result exists for the same fact. Reproducing that resolution logic
      yourself means checking this column, not just the newest result.
  - id: resultattype
    name: ResultatType
    label: {da: null, en: "Result type"}
    type: character
    role: code
    key: true
    origin: dst
    provenance:
      source_url: https://sundhedsdatastyrelsen.dk/Media/638650989728109987/Dokumentation_Foedselsregisteret_2019_og_frem.xlsx
      source_type: dst_documentation
      verified_on: 2026-09-12
      verified_against: >-
        Kolonner sheet: SKS code, e.g. RDA39 (birth weight) or RDA80. This
        is the RDAnn family that mfr_nyfoedte.yaml's provenance blocks cite
        repeatedly (RDA22 parity, RDA25 smoking, RDA26/27 mother's height/
        weight, RDA34 fetal presentation, RDA35 Apgar, RDA36-38 head/
        abdominal circumference and placental weight, RDA39/40 weight/
        length, RDA41 birthplace).
    reader_note: >-
      No `code_system` attached: this is an open SKS result-type catalogue,
      not a small enumerated set, the same reasoning as ProcedureKode. Each
      RDAnn value determines both what ResultatVaerdi means and what data
      type it holds - see that column's reader_note.
  - id: resultatvaerdi
    name: ResultatVaerdi
    label: {da: null, en: "Result value (polymorphic)"}
    type: character
    role: value
    origin: dst
    provenance:
      source_url: https://sundhedsdatastyrelsen.dk/Media/638650989728109987/Dokumentation_Foedselsregisteret_2019_og_frem.xlsx
      source_type: dst_documentation
      verified_on: 2026-09-12
      verified_against: >-
        Kolonner sheet: "SKS-kode (fx RGAE01), heltal (antal, cm eller
        gram), boolean (0 = Ukendt, 1 = Kendt), decimaltal, datotid
        (YYYYMMDDHHMMSS) eller tekststreng" (the source spells "boolean"
        with one fewer O, corrected here) - six different value
        shapes in one column.
    reader_note: >-
      Reading this column as one consistent type will fail or silently
      coerce: for a `ResultatType` of RDA39 (weight) it is an integer number
      of grams, for RDA25 (smoking) or RDA41 (birthplace) it is itself an
      SKS code (RGAB*/RGAE*), for some boolean-style results 0 means
      "unknown" rather than "false" (not the usual R convention). Branch on
      `ResultatType` before parsing `ResultatVaerdi`, never parse it
      generically across the whole table.
