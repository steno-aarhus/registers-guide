# LPR_A_RESULTATER - mandatory "result reporting" (resultatindberetning):
# LPR3's replacement for LPR2's mandatory addendum coding, triggered by
# specific diagnoses/procedures/events (e.g. a cancer diagnosis triggers a
# cancer-registry result report). Missed when lpr_a_kontakt/diagnose/
# procregistrering were first built; found by cross-checking DST's full
# order list (Bestillingsliste.xlsx) against the schema on 2026-09-12.
#
# Sundhedsdatastyrelsen's own LPR3_F guidance describes this concept in
# detail (section 3.7, "Resultater") - a related but not confirmed-
# identical sibling of this LPR_A_* register. DST's own LPR_A_RESULTATER
# variable-list page was fetched directly and gives no column labels at
# all ("Ingen label"), for all 23 columns, confirmed 2026-09-12.

id: lpr_a_resultater
hide_from_overview: true
name: "LPR_A_RESULTATER - Landspatientregistret (LPR3) - Oplysninger om resultatindberetninger"
family: lpr3
scope: dst
reference_timing: event
one_row_per: event_from_person
description: >-
  One row per mandatory result report (resultatindberetning): a report
  required to a specific external registry or purpose, triggered by a
  specific value elsewhere in the LPR3 reporting (e.g. a cancer diagnosis
  triggers a required cancer-registry report, trigger type "Diagnose",
  trigger code "RAA01"). Replaces LPR2's mandatory addendum coding, which
  used to live as an addendum to a diagnosis/procedure, in the accident
  variables/table, or in the birth table. No unique key: a row hangs on the
  contact or course it was registered against.
source_url: https://www.dst.dk/extranet/ForskningVariabellister/LPR_A_RESULTATER%20-%20Landspatientregistret%20(LPR3)%20-%20Oplysninger%20om%20resultatindberetninger.html
coverage: {from: 2025, to: 2025}

join_keys: [DW_EK_FORLOEB, DW_EK_KONTAKT]
relationships:
  - to: lpr_a_forloeb
    key: DW_EK_FORLOEB
    to_key: dw_ek_forloeb
    cardinality: many_to_one
    provenance:
      source_type: inferred
      verified_on: 2026-09-12
  - to: lpr_a_kontakt
    key: DW_EK_KONTAKT
    to_key: dw_ek_kontakt
    cardinality: many_to_one
    provenance:
