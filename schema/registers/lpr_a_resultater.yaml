reader_note: >-
  This table did not exist under LPR2: LPR3_F's guidance (section 3.7)
  states it replaces LPR2's mandatory addendum coding, which used to live
  scattered across a diagnosis/procedure addendum code, the accident table,
  or the birth table depending on what triggered it. A study spanning the
  LPR2/LPR3 boundary that relied on any of those LPR2 mechanisms needs a
  different join strategy on each side of the cutover, not just a renamed
  column. That guidance documents LPR3_F's "resultater" table, a related
  but not confirmed-identical sibling of this LPR_A_* register.
