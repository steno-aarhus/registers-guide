# DODSAARS - cause of death, 1970-2001. First link in a chain of three.

id: dodsaars
name: "Dødsårssagsregistret"
family: null
scope: dst
description: >-
  Cause of death for 1970-2001. Closed. It also carries a date of death, which
  is why it is so often used for censoring, but that use is a mistake for any
  study running past 2001.
source_url: https://www.dst.dk/extranet/ForskningVariabellister/DODSAARS%20-%20D%C3%B8ds%C3%A5rssagsregistret.html

update_cadence: none
reference_timing: event
coverage:
  from: 1970
  to: 2001

deprecated: true
superseded_by: [dodsaasg]
join_keys: [pnr]
relationships: []

