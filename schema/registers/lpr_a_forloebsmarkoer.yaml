# LPR_A_FORLOEBSMARKOER - "course markers": timestamped events within a
# helbredsforloeb (health course), e.g. wait-time and referral-right
# milestones. Missed when lpr_a_kontakt/diagnose/procregistrering were
# first built; found by cross-checking DST's full order list
# (Bestillingsliste.xlsx) against the schema on 2026-09-12.
#
# Sundhedsdatastyrelsen's own LPR3_F guidance describes this concept in
# real detail (section 3.9, "Forloebsmarkoerer") - that PDF documents the
# LPR3_F variant of LPR3 (table name "forloebsmarkoerer", lowercase, no
# LPR_A_ prefix), a sibling family DST also publishes alongside LPR_A_*
# (confirmed: DST separately lists LPR_F_BETALER, LPR_F_HENVISNING_TILLAEG,
# LPR_F_FORLOEB pages alongside this schema's LPR_A_* tables). The concept
# and SKS overkode families below are read from that guide; DST's own
# LPR_A_FORLOEBSMARKOER variable-list page still gives no column labels at
# all, so nothing here is confirmed identical column-for-column between
# the two variants.

id: lpr_a_forloebsmarkoer
hide_from_overview: true
name: "LPR_A_FORLOEBSMARKOER - Landspatientregistret (LPR3) - Forloebsmarkoerer"
family: lpr3
scope: dst
reference_timing: event
one_row_per: event_from_person
description: >-
  One row per course marker: a timestamped event within a health course
  (helbredsforloeb), such as "referred for diagnostic workup", "informed
  consent given", or "specialised rehabilitation ended". Used for tracking
  wait times and deadlines under Denmark's "ret til hurtig udredning"
  (right to fast diagnostic workup) and cancer-pathway rules. No unique key:
  a marker "hangs" on the course it belongs to via dw_ek_forloeb.
source_url: https://www.dst.dk/extranet/ForskningVariabellister/LPR_A_FORLOEBSMARKOER%20-%20Landspatientregistret%20(LPR3)%20-Forl%C3%B8bsmark%C3%B8rer.html
coverage: {from: 2025, to: 2025}

join_keys: [DW_EK_FORLOEB]
relationships:
  - to: lpr_a_forloeb
    key: DW_EK_FORLOEB
    to_key: dw_ek_forloeb
    cardinality: many_to_one
    provenance:
      source_type: inferred
      verified_on: 2026-09-12

columns:
  - id: dw_ek_forloeb
    name: DW_EK_FORLOEB
    label: {da: null, en: "Course identifier"}
    type: character
    role: join_key
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/LPR_A_FORLOEBSMARKOER%20-%20Landspatientregistret%20(LPR3)%20-Forl%C3%B8bsmark%C3%B8rer.html
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST's dedicated page for this register: 'Ingen label' for all 9 columns, confirmed by direct fetch on 2026-09-12."
      type_inferred: true
    reader_note: "No unique key exists for this table (Sundhedsdatastyrelsen's LPR3_F guidance, section 3.9): every row hangs off the course it was registered on."
  - id: dw_ek_helbredsforloeb
    name: DW_EK_HELBREDSFORLOEB
    label: {da: null, en: "Health course identifier"}
    type: character
    role: code
    origin: dst
    provenance:
      source_url: https://sundhedsdatastyrelsen.dk/media/16364/Vejledning%20til%20LPR3_F.pdf
      source_type: dst_documentation
      verified_on: 2026-09-12
      verified_against: "LPR3_F guidance, section 2 and 3.9: a health course (helbredsforloeb) is the higher-level grouping of one or more `forloeb` (courses) that clinically belong together under one responsible SOR unit; dw_ek_helbredsforloeb is its key."
    reader_note: >-
      A level above dw_ek_forloeb, not documented anywhere else in this
      schema - a helbredsforloeb can group several forloeb rows. Not
      confirmed to match any single row in lpr_a_forloeb.yaml one-to-one.
  - id: dw_ek_markoerregistrering
    name: DW_EK_MARKOERREGISTRERING
    label: {da: null, en: "Marker registration identifier"}
    type: character
    role: identifier
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/LPR_A_FORLOEBSMARKOER%20-%20Landspatientregistret%20(LPR3)%20-Forl%C3%B8bsmark%C3%B8rer.html
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST's dedicated page: 'Ingen label'."
      type_inferred: true
  - id: lprindberetningssystem
    name: LPRINDBERETNINGSSYSTEM
    label: {da: null, en: "Reporting system"}
    type: character
    role: code
    origin: dst
    code_system: lprindberetningssystem
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/LPR_A_FORLOEBSMARKOER%20-%20Landspatientregistret%20(LPR3)%20-Forl%C3%B8bsmark%C3%B8rer.html
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST's dedicated page: 'Ingen label'."
      type_inferred: true
    reader_note: "Filter to 'LPR3' when combining with LPR2, or the same marker risks being counted under both systems."
  - id: markoer
    name: MARKOER
    label: {da: null, en: "Marker code"}
    type: character
    role: code
    key: true
    origin: dst
    provenance:
      source_url: https://sundhedsdatastyrelsen.dk/media/16364/Vejledning%20til%20LPR3_F.pdf
      source_type: dst_documentation
      verified_on: 2026-09-12
      verified_against: >-
        LPR3_F guidance, section 3.9: marker codes live in the SKS browser
        (medinfo.dk/sks/brows.php) under four top-level code families: AF
        (somatic course markers, with AFV as the wait-time subset), AG
        (adult psychiatry), AH (child/adolescent psychiatry), AW
        (administrative procedure codes). Individual code values within
        these families are not listed in the guidance and were not
        independently browsed for this schema.
    reader_note: >-
      Three logical kinds share this one column, distinguished only by
      which code fires: a single-event marker (e.g. informed consent
      given), a period-start marker (e.g. referred for workup), or a
      period-end marker (e.g. cancer pathway ended). Not every period has
      both a start and an end marker: some periods hand off to the next
      with only a start.
  - id: markoer_indb_tidspunkt
    name: MARKOER_INDB_TIDSPUNKT
    label: {da: null, en: "Marker reporting time"}
    type: datetime
    role: date
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/LPR_A_FORLOEBSMARKOER%20-%20Landspatientregistret%20(LPR3)%20-Forl%C3%B8bsmark%C3%B8rer.html
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST's dedicated page: 'Ingen label'."
      type_inferred: true
    reader_note: "When the marker was reported to LPR3, not necessarily when the event happened - see markoer_tidspunkt for that."
  - id: markoer_sks_type
    name: MARKOER_SKS_TYPE
    label: {da: null, en: "Marker SKS code type"}
    type: character
    role: code
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/LPR_A_FORLOEBSMARKOER%20-%20Landspatientregistret%20(LPR3)%20-Forl%C3%B8bsmark%C3%B8rer.html
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST's dedicated page: 'Ingen label'."
      type_inferred: true
  - id: markoer_tekst
    name: MARKOER_TEKST
    label: {da: null, en: "Marker, text"}
    type: character
    role: derived
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/LPR_A_FORLOEBSMARKOER%20-%20Landspatientregistret%20(LPR3)%20-Forl%C3%B8bsmark%C3%B8rer.html
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST's dedicated page: 'Ingen label'."
      type_inferred: true
    reader_note: "The text label for markoer - the practical way to read this column without a SKS browser lookup."
  - id: markoer_tidspunkt
    name: MARKOER_TIDSPUNKT
    label: {da: null, en: "Marker event time"}
    type: datetime
    role: date
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/LPR_A_FORLOEBSMARKOER%20-%20Landspatientregistret%20(LPR3)%20-Forl%C3%B8bsmark%C3%B8rer.html
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST's dedicated page: 'Ingen label'."
      type_inferred: true
    reader_note: "By LPR3_F's own definition (section 3.9) a marker IS its timestamp - this is the actual event time, distinct from markoer_indb_tidspunkt (when it was reported)."

reader_note: >-
  Use this table for wait-time and package-pathway (pakkeforloeb) deadline
  analyses, not for clinical events generally - lpr_a_diagnose and
  lpr_a_procregistrering cover those. The guidance this file's richer notes
  are drawn from documents LPR3_F's "forloebsmarkoerer" table specifically,
  a related but not confirmed-identical sibling of this LPR_A_*
  register: DST's own page for LPR_A_FORLOEBSMARKOER gives no column
  labels at all, so treat the concept-level detail as reliable and the
  exact column semantics as read off the column names.
