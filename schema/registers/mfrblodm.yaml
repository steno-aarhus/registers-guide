# MFRBLODM - richer than the other 16 simple marker sub-cuts (has its own
# quantity column, not just a code). Backs mfr.yaml's markoer_post_partum_bloedning
# flag (BLODM = blood amount) - inferred from naming, not stated by DST.
# See schema/families/mfr_markers.yaml for what this family shares.

id: mfrblodm
hide_from_overview: true
name: "MFRBLODM - MFR marker sub-cut, postpartum blood loss"
family: mfr_markers
scope: dst
reference_timing: event
one_row_per: event_from_person
description: >-
  One row per postpartum blood-loss finding for a birth in mfr.yaml, joined
  via FK_MFR, with the actual measured amount alongside the SKS code.
  Backs mfr.yaml's markoer_post_partum_bloedning flag. Coverage starts 2009,
  a decade later than most of the other marker sub-cuts.
source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
coverage: {from: 2009, to: 2018}

join_keys: [FK_MFR]
relationships:
  - to: mfr
    key: FK_MFR
    to_key: cpr_barn
    cardinality: many_to_one
    provenance:
      source_type: inferred
      verified_on: 2026-09-12

columns:
  - id: fk_mfr
    name: FK_MFR
    label: {da: null, en: null}
    type: character
    role: join_key
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST order list (Bestillingsliste.xlsx): name only, no label."
      type_inferred: true
    reader_note: "Foreign key back to mfr.yaml, same pattern as mfrhjmfo.yaml - not confirmed to match mfr's own cpr_barn specifically."
  - id: kodetype
    name: KODETYPE
    label: {da: null, en: null}
    type: character
    role: code
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST order list: name only, no label, no value definitions."
      type_inferred: true
  - id: skskode
    name: SKSKODE
    label: {da: null, en: null}
    type: character
    role: code
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST order list: name only, no label."
      type_inferred: true
    reader_note: >-
      No `code_system` attached: an open SKS code space restricted to
      postpartum-bleeding-related codes by this register's own scope, not
      documented as a specific list anywhere DST publishes.
  - id: blodmaengde
    name: BLODMAENGDE
    label: {da: null, en: null}
    type: numeric
    role: value
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST order list: name only, no label, no unit given."
      type_inferred: true
    reader_note: >-
      The measured blood-loss quantity, by the variable name
      ("blodmængde" = blood amount). Unit (ml presumably) is not documented
      by DST anywhere this schema found.

reader_note: >-
  DST's variable-list page for this register gives no label or value
  definition for any column. A birth with no postpartum-bleeding finding
  has no row here at all, not an explicit "no" row.
