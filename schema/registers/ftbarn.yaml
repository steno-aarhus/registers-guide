reader_note: >-
  DST's variable-list page for FTBARN gives a short Danish label for most
  columns but no value/code definitions anywhere, unlike mfr_nyfoedte's
  richer documentation. Every coded column above (KOEN, LEVENDE_ELLER_DOEDFOEDT,
  CPRTJEK, CPRTYPE, the *_KILDE and *_FOED_ADOP columns, and more) is left
  without a `code_system` for that reason: an invented lookup would be
  actively misleading. Confirm actual values on real data before writing
  code that filters or recodes on any of them.
