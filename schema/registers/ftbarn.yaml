# FTBARN - Fertilitet: børn. One of three "Fertilitet" datasets (with
# FTFORAEL, FTNAEVN) that together cover 1973-2023 per DST's register
# overview, filling the gap before mfr.yaml's own coverage starts in 1997.
# Not named "MFR" anywhere, which is why earlier searches for pre-1997 MFR
# data under that name came up empty; NCRR's own internal era label for this
# period is "MFR1", but that is NCRR's naming, not DST's or
# Sundhedsdatastyrelsen's.
#
# FTBARN explicitly incorporates Medical Birth Register content: its own
# MFR_OPLYSNING column, and DST's change log for this register documents
# weight/length values as brought into line with MFR data (see
# Registerhistorik/FTBARN.html, October 2025 correction notes).
#
# DST's own variable-list page for this register gives only a short Danish
# label per variable, no value/code definitions and no Format/Laengde -
# thinner documentation than mfr_nyfoedte's, and matching mfr.yaml's own
# situation exactly. No `code_system` is attached to any coded column below
# for that reason: inventing a lookup neither DST nor any other source
# confirms would be worse than leaving it undocumented. If a specific code's
# meaning matters for real analysis, confirm it on real data with
# `count()`/`table()`, or ask Sundhedsdatastyrelsen's Forskerservice.

id: ftbarn
name: "FTBARN - Fertilitet: børn"
scope: dst
reference_timing: event
one_row_per: event_from_person
description: >-
  One row per child (live-born or stillborn) in Denmark, 1973-2023.
  Distinct from mfr_nyfoedte: this is a demography/population-statistics
  register (parent linkage, adoption status, birth registration source),
  not a clinical record of the birth itself - it carries only a handful of
  clinical facts (weight, length, live/stillbirth) sourced from MFR.
source_url: https://www.dst.dk/extranet/ForskningVariabellister/FTBARN%20-%20Fertilitet%20-%20b%C3%B8rn.html
coverage: {from: 1973, to: 2023}

deprecated: false
superseded_by: null

join_keys: [PNR]
relationships:
  - to: bef
    key: PNR
    to_key: pnr
    cardinality: many_to_one
    provenance:
      source_type: inferred
      verified_on: 2026-09-12

