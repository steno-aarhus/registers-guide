      type_source: "https://www.esundhed.dk/Dokumentation/DocumentationExtended?id=5, table t_adm, Format Lokale Koder, Laengde 1; Sundhedsdatastyrelsen gives the open-contact tables the same structure as the closed ones"
    reader_note: >-
      Day patient (1) was discontinued in 2002, and hospitals then
      recorded those patients differently (some as outpatients, some as
      inpatients). Emergency room patient (3) was discontinued in 2014
      and replaced by outpatient (2) with acute admission (c_indm = 1).
