    origin: tooling
    added_by: parquet conversion
    provenance:
      source_type: unverified
      verified_on: 2026-11-23
      verified_against: null
    reader_note: >-
      Not a DST variable. It is the yearly file a row came from. In the
      open-contact tables that is a year in which the contact was open, and
      a contact open for several years is in several of them, so rows from
      different years can be the same contact. Use d_inddto in uaf_adm to
      say when a contact started.
