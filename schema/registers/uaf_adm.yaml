# UAF_ADM - LPR2 somatic contacts that were still open (uafsluttede kontakter).
# Deprecation is inherited from families/lpr2_somatic.yaml. Coverage is set here
# because DST's open-contact tables start in 1996, not 1977.

id: uaf_adm
name: "Landspatientregistret uafsluttede kontakter - administrative oplysninger"
family: lpr2_somatic
scope: dst
reference_timing: status_period
one_row_per: event_from_person
description: >-
  One row per somatic LPR2 contact that was still open, in each yearly
  table. A closed contact is in lpr_adm, filed by the year it ended. An open
  contact is here instead, filed by the year it started and repeated in each
  later year while it stays open, and it moves to lpr_adm in the year it
  ends. A contact that never closed, such as the LPR2 contacts still open
  after the switch to LPR3 in 2019, is only here.
source_url: https://www.dst.dk/extranet/ForskningVariabellister/UAF_ADM%20-%20Landspatientregistret%20uafsluttede%20kontakter%20-%20administrative%20oplysninger.html
coverage: {from: 1996, to: 2019}

join_keys: [recnum]
relationships:
  - to: uaf_diag
    key: recnum
    cardinality: one_to_many

columns:
  - id: recnum
    name: recnum
    label: {da: "LPR-identnummer", en: "Contact identifier"}
    type: character
    role: join_key
    coverage: {from: 1996, to: 2019}
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/UAF_ADM%20-%20Landspatientregistret%20uafsluttede%20kontakter%20-%20administrative%20oplysninger.html
      source_type: dst_variable_list
      verified_on: 2026-11-23
      verified_against: "DST variable list UAF_ADM, including the per-variable year range"
      type_source: "https://www.esundhed.dk/Dokumentation/DocumentationExtended?id=5, table t_adm, Format Lokale Koder, Laengde 0; Sundhedsdatastyrelsen gives the open-contact tables the same structure as the closed ones"
    reader_note: >-
      The key that links uaf_adm to uaf_diag and the other open-contact
      tables. It identifies a contact, not a person.

      Sundhedsdatastyrelsen states that recnum is unique only within one
      update of the register. A contact can get a new recnum when the
      register is updated, and a recnum can be reused for a different
      contact. Join tables only within the same delivery and the same
      year, and do not use recnum to match an open contact to its closed
      version in lpr_adm.
  - id: pnr
    name: pnr
    label: {da: "Personnummer", en: "Personal identifier"}
    type: character
    role: identifier
    coverage: {from: 1996, to: 2019}
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/UAF_ADM%20-%20Landspatientregistret%20uafsluttede%20kontakter%20-%20administrative%20oplysninger.html
      source_type: dst_variable_list
      verified_on: 2026-11-23
      verified_against: "DST variable list UAF_ADM, including the per-variable year range"
      type_source: "https://www.esundhed.dk/Dokumentation/DocumentationExtended?id=5, table t_adm, Format Numerisk, Laengde 10; Sundhedsdatastyrelsen gives the open-contact tables the same structure as the closed ones"
  - id: d_inddto
    name: d_inddto
    label: {da: null, en: "Date of admission"}
    type: date
    role: date
    coverage: {from: 1996, to: 2019}
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/UAF_ADM%20-%20Landspatientregistret%20uafsluttede%20kontakter%20-%20administrative%20oplysninger.html
      source_type: dst_variable_list
