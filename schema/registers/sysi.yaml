# SYSI - health insurance register, the older half of the primary-care series.
# Continues as SSSY, see superseded_by.

id: sysi
name: "Sygesikring (6-cifret)"
scope: dst
reference_timing: event
deprecated: true
superseded_by: [sssy]
description: >-
  Fees settled for primary-care activity: general practice, practising
  specialists, dentists, physiotherapists and so on. One row per settled service
  group, not one row per visit.
source_url: https://www.dst.dk/extranet/ForskningVariabellister/SYSI%20-%20Sygesikring%20%286-cifret%29.html
coverage: {from: 1990, to: 2005}

join_keys: [pnr]

columns:
  - id: pnr
    name: pnr
    label: {da: "Personnummer", en: "Personal identifier"}
    type: character
    role: join_key
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/SYSI%20-%20Sygesikring%20%286-cifret%29.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list, cross-checked against colnames() on the parquet"
  - id: ydernr
    name: ydernr
    label: {da: "Ydernummer", en: "Provider number"}
    type: character
    role: identifier
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/SYSI%20-%20Sygesikring%20%286-cifret%29.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list, cross-checked against colnames() on the parquet"
    reader_note: >-
      Identifies the practice, not the person treating you. It changes when a
      practice changes hands, so it does not track a doctor over time.
  - id: speciale
    name: speciale
    label: {da: "6-cifret speciale", en: "Specialty, 6-digit"}
    type: character
    role: code
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/SYSI%20-%20Sygesikring%20%286-cifret%29.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list, cross-checked against colnames() on the parquet"
    reader_note: >-
      The 6-digit specialty code is what distinguishes a GP contact from a
      specialist one. There is no separate contact-type column: the specialty
      is the classification.
  - id: ydtyp
    name: ydtyp
    label: {da: "Ydertype", en: "Provider type"}
    type: character
    role: code
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/SYSI%20-%20Sygesikring%20%286-cifret%29.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list, cross-checked against colnames() on the parquet"
  - id: ydlant
    name: ydlant
    label: {da: "Antal ydelser under specialet", en: "Number of services under the specialty"}
    type: integer
    role: value
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/SYSI%20-%20Sygesikring%20%286-cifret%29.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list, cross-checked against colnames() on the parquet"
    reader_note: >-
      One row can cover several services, so counting rows undercounts
      activity. Sum this column instead.
  - id: ydltid
    name: ydltid
    label: {da: "Tidspunktskode for ydelsen", en: "Service timing code"}
    type: character
    role: code
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/SYSI%20-%20Sygesikring%20%286-cifret%29.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list, cross-checked against colnames() on the parquet"
  - id: ydersamt
    name: ydersamt
    label: {da: "Yders amt", en: "Provider's county"}
    type: character
    role: code
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/SYSI%20-%20Sygesikring%20%286-cifret%29.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list, cross-checked against colnames() on the parquet"
  - id: afrper
    name: afrper
    label: {da: "Afregningsperiode", en: "Settlement period"}
    type: character
    role: date
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/SYSI%20-%20Sygesikring%20%286-cifret%29.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list, cross-checked against colnames() on the parquet"
    reader_note: >-
      A settlement period, not a treatment date. It says when the fee was
      settled, which can fall in a later week or month than the contact.
  - id: bruhon
    name: bruhon
    label: {da: "Bruttohonorar til laege mv.", en: "Gross fee to the provider"}
    type: numeric
    role: value
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/SYSI%20-%20Sygesikring%20%286-cifret%29.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list, cross-checked against colnames() on the parquet"
  - id: honuge
    name: honuge
    label: {da: "Honoraruge", en: "Fee week"}
    type: character
    role: date
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/SYSI%20-%20Sygesikring%20%286-cifret%29.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list, cross-checked against colnames() on the parquet"
  - id: barnmak
    name: barnmak
    label: {da: "Barnemarkering", en: "Child marker"}
    type: character
    role: code
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/SYSI%20-%20Sygesikring%20%286-cifret%29.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list, cross-checked against colnames() on the parquet"
  - id: sikgrup
    name: sikgrup
    label: {da: "Sikringsgruppe", en: "Insurance group"}
    type: character
    role: code
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/SYSI%20-%20Sygesikring%20%286-cifret%29.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list, cross-checked against colnames() on the parquet"
    reader_note: >-
      Group 1 patients are listed with a GP and need a referral to see most
      specialists; group 2 patients may go directly but pay part of the fee.
      The two groups therefore generate different rows for the same need.
  - id: pattyp
    name: pattyp
    label: {da: "Patienttype", en: "Patient type"}
    type: character
    role: code
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/SYSI%20-%20Sygesikring%20%286-cifret%29.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list, cross-checked against colnames() on the parquet"
  - id: praktyp
    name: praktyp
    label: {da: "Praksistype", en: "Practice type"}
    type: character
    role: code
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/SYSI%20-%20Sygesikring%20%286-cifret%29.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list, cross-checked against colnames() on the parquet"
  - id: sikrekom
    name: sikrekom
    label: {da: "Sikredes kommune", en: "Municipality of the insured"}
    type: character
    role: code
    origin: dst
    code_system: kom
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/SYSI%20-%20Sygesikring%20%286-cifret%29.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list, cross-checked against colnames() on the parquet"
  - id: year
    name: year
    label: {da: null, en: "Register year"}
    type: integer
    role: date
    key: true
    origin: tooling
    added_by: parquet conversion
    provenance:
      source_type: server_verified
      verified_on: 2026-09-01
      verified_by: "Sara Schwartz"
      verified_against: "colnames() on the parquet"
    reader_note: >-
      Not a DST variable. It is the partition the yearly deliveries were written
      into, so filtering on it stops the other years being read at all. Use it to
      limit how much is read, not to decide when something happened: for that,
      use the register's own date column.
