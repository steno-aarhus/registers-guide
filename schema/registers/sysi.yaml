# SYSI - health insurance register, the older half of the primary-care series.
# Continues as SSSY, see superseded_by.

# The same register exists under two naming systems. DST delivers it as SYSI and
# SSSY with the column names below. Sundhedsdatastyrelsen documents its own
# version on esundhed.dk with entirely different names - `c_ynr` for the provider
# number, `v_cpr` for the person, `c_speciale` for the specialty - so their
# published Format and Laengde cannot be carried over to these columns without
# first confirming the mapping. See
# https://www.esundhed.dk/Dokumentation/DocumentationExtended?id=10

id: sysi
name: "Sygesikring (6-cifret)"
scope: dst
reference_timing: status_period
one_row_per: event_from_person
deprecated: true
superseded_by: [sssy]
description: >-
  Fees settled for primary-care activity: general practice, practising
  specialists, dentists, physiotherapists and so on. One row per settled service
  group, not one row per visit.
source_url: https://www.dst.dk/extranet/ForskningVariabellister/SYSI%20-%20Sygesikring%20%286-cifret%29.html
coverage: {from: 1990, to: 2005}

join_keys: [pnr]

relationships:
  - to: bef
    key: pnr
    cardinality: many_to_one

columns:
  - id: pnr
    name: pnr
    label: {da: "Personnummer", en: "Personal identifier"}
    type: character
    role: join_key
    coverage: {from: 1990, to: 2005}
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/SYSI%20-%20Sygesikring%20%286-cifret%29.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list"
      type_inferred: true
  - id: ydernr
    name: ydernr
    label: {da: "Ydernummer", en: "Provider number"}
    type: character
    role: identifier
    coverage: {from: 1990, to: 2005}
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/SYSI%20-%20Sygesikring%20%286-cifret%29.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list"
      type_inferred: true
    reader_note: >-
      A provider number, not a person. DST's variable list does not say what
      unit it identifies or whether it is stable when a practice changes hands,
      so do not use it to follow an individual clinician over time without
      checking that first.
  - id: speciale
    name: speciale
    label: {da: "6-cifret speciale", en: "Specialty, 6-digit"}
    type: character
    role: code
    coverage: {from: 1990, to: 2005}
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/da/Statistik/dokumentation/Times/moduldata-for-sociale-forhold--sundhedsvaesen--retsvaesen/speciale
      source_type: dst_documentation
      verified_on: 2026-09-30
      verified_against: "DST's documentation page for SPECIALE and the high-quality variable page (Sygesikring - Ydelser), which gives it as valid from 1 January 1990"
      type_inferred: true
    reader_note: >-
      Two codes in one. The first two digits are the provider's specialty
      (general practice, dentist and so on); the last four are the type of
      service. DST publishes no value set for the full code: the service codes
      come from the collective agreements, and DST points to the historical
      fee schedules on okportalen.dk. Because the agreements change often, the
      same service can change code over time, so check a code's history before
      comparing years.
      The same wording, for example "Konsultation", appears under many
      specialties, so read a six-digit code together with its first two digits
      (DST, SPECIALE).
  - id: ydtyp
    name: ydtyp
    label: {da: "Ydertype", en: "Provider type"}
    type: character
    role: code
    coverage: {from: 1990, to: 2005}
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/SYSI%20-%20Sygesikring%20%286-cifret%29.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list"
      type_inferred: true
  - id: ydlant
    name: ydlant
    label: {da: "Antal ydelser under specialet", en: "Number of services under the specialty"}
    type: integer
    role: value
    coverage: {from: 1990, to: 2005}
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/SYSI%20-%20Sygesikring%20%286-cifret%29.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list"
      type_inferred: true
    reader_note: >-
      One row can cover several services, so counting rows undercounts
      activity. Sum this column instead.
  - id: ydltid
    name: ydltid
    label: {da: "Tidspunktskode for ydelsen", en: "Service timing code"}
    type: character
    role: code
    coverage: {from: 1990, to: 2005}
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/SYSI%20-%20Sygesikring%20%286-cifret%29.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list"
      type_inferred: true
  - id: ydersamt
    name: ydersamt
    label: {da: "Yders amt", en: "Provider's county"}
    type: character
    role: code
    coverage: {from: 1990, to: 2005}
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/SYSI%20-%20Sygesikring%20%286-cifret%29.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list"
      type_inferred: true
  - id: afrper
    name: afrper
    label: {da: "Afregningsperiode", en: "Settlement period"}
    type: character
    role: date
    coverage: {from: 1990, to: 2005}
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/SYSI%20-%20Sygesikring%20%286-cifret%29.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list"
      type_inferred: true
    reader_note: >-
      DST labels this "Afregningsperiode", a settlement period rather than a
      treatment date. Nothing in the variable list says how far settlement can
      lag the contact, so check the distribution against honuge before using it
      as a date.
  - id: bruhon
    name: bruhon
    label: {da: "Bruttohonorar til læge mv.", en: "Gross fee to the provider"}
    type: numeric
    role: value
    coverage: {from: 1990, to: 2005}
    origin: dst
    provenance:
      source_url: https://www.dst.dk/da/Statistik/dokumentation/Times/moduldata-for-sociale-forhold--sundhedsvaesen--retsvaesen/bruhon
      source_type: dst_documentation
      verified_on: 2026-09-30
      verified_against: "DST's documentation page for BRUHON"
      type_inferred: true
    reader_note: >-
      In ØRE for 1990-2004 and whole kroner from 2005, so divide the pre-2005
      values by 100 before combining them with SSSY. It is the fee the
      provider received, broadly the public subsidy; the patient's own
      co-payment is not included. DST reports that the average fee rose about
      10 percent from 2004 to 2005 because general practitioners' basic and
      practice fees were spread onto users from 2005, and that this break
      cannot be removed by cleaning the pre-2005 data.
  - id: honuge
    name: honuge
    label: {da: "Honoraruge", en: "Fee week"}
    type: character
    role: date
    coverage: {from: 1990, to: 2005}
    origin: dst
    provenance:
      source_url: https://www.dst.dk/da/statistik/dokumentation/times/sygesikringsstatistik/honuge
      source_type: dst_documentation
      verified_on: 2026-09-30
      verified_against: "DST's documentation page for HONUGE"
      type_inferred: true
    reader_note: >-
      The week the provider invoiced the county (from 2007, the region) for the
      service. It is a billing week, not the date of the contact.
  - id: barnmak
    name: barnmak
    label: {da: "Barnemarkering", en: "Child marker"}
    type: integer
    role: code
    coverage: {from: 1990, to: 2005}
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/SYSI%20-%20Sygesikring%20%286-cifret%29.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list"
      type_inferred: true
    reader_note: >-
      1 means a child whose own CPR-number is not on the row, 0 everything
      else (DST, BARNMAK). Until 1 January 1996 children under 16 had no
      health insurance card of their own, so their services were registered
      under a parent's CPR-number, and the introduction was complete in 1997.
      1996 is a run-in year, and sex cannot be assigned to services to
      children before 1996 (Sundhedsdatastyrelsen, register declaration). In
      1990 to 1996 every service to a child carries barnmak 1, which DST puts
      at 5.5 to 7.5 million records for the period, against 876,542 in 1997
      (DST, BARNMAK). The pnr on a row with barnmak 1 is the adult's, so such
      rows are not the child's own contacts. Sahl Andersen et al. 2011, Scand J Public Health 39(Suppl
      7):34-37, describe the same change.
  - id: sikgrup
    name: sikgrup
    label: {da: "Sikringsgruppe", en: "Insurance group"}
    type: character
    role: code
    coverage: {from: 1990, to: 2005}
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/SYSI%20-%20Sygesikring%20%286-cifret%29.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list"
      type_inferred: true
    reader_note: >-
      Group 1 patients need a referral from their GP to see a specialist,
      physiotherapist, chiropodist or psychologist, and pay nothing. Group 2
      patients may go directly to any GP or specialist, but pay the difference
      between the fee and the regional subsidy themselves. The two groups
      therefore leave different traces for the same clinical need, so group
      membership is a confounder in any analysis of specialist use. Source:
      borger.dk, "Sygesikring og sikringsgrupper".
  - id: pattyp
    name: pattyp
    label: {da: "Patienttype", en: "Patient type"}
    type: character
    role: code
    coverage: {from: 1990, to: 2005}
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/SYSI%20-%20Sygesikring%20%286-cifret%29.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list"
      type_inferred: true
  - id: praktyp
    name: praktyp
    label: {da: "Praksistype", en: "Practice type"}
    type: character
    role: code
    coverage: {from: 1990, to: 2005}
    origin: dst
    provenance:
