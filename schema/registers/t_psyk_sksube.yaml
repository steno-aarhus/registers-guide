reader_note: >-
  Column structure is identical to t_psyk_sksopr.yaml (operations): the
  only documented difference is which side of care the row is on
  (examination vs. treatment). Nothing in DST's labels distinguishes an
  examination from a treatment beyond which of the two tables the row sits
  in - do not assume c_opr's coding scheme itself tells them apart. DST's
  page gives coverage as 2019 only, almost certainly the same order-list
  snapshot artifact seen throughout this PSYK batch.
