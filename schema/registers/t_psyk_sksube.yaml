# PSYK_SKSUBE - the psychiatric counterpart of lpr_sksube.yaml:
# examinations/investigations coded under the modern SKS system,
# structurally identical to t_psyk_sksopr.yaml (operations) but for the
# "undersoegelse" (examination) side rather than treatment. DST's own
# dedicated page confirms real column labels. Register id uses the
# t_psyk_ prefix, matching t_psyk_adm.yaml/t_psyk_diag.yaml's own
# established convention. Missed when t_psyk_adm/t_psyk_diag were first
# built; found by cross-checking DST's full order list
# (Bestillingsliste.xlsx) against the schema on 2026-09-12.

id: t_psyk_sksube
hide_from_overview: true
name: "PSYK_SKSUBE - Landspatientregistret psykiatri - oplysninger om undersoegelser"
family: lpr2_psychiatric
scope: dst
reference_timing: course
one_row_per: expand_from_parent
description: >-
  One row per psychiatric examination/investigation coded under the modern
  SKS system. Carries no pnr: join to t_psyk_adm on recnum to reach the
  person.
source_url: https://www.dst.dk/extranet/ForskningVariabellister/PSYK_SKSUBE%20-%20Landspatientregistret%20psykiatri%20-%20oplysninger%20om%20unders%C3%B8gelser.html
coverage: {from: 1996, to: 2019}

join_keys: [recnum]
relationships:
  - to: t_psyk_adm
    key: recnum
    cardinality: many_to_one

