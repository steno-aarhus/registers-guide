# Satellite table for the child, one row per LPR contact starting within
# 42 days of birth. Join to mfr_nyfoedte via DW_EK_Nyfoedt. See
# mfr_barn_forloeb.yaml's header comment for the shared organisational
# columns (AnsvarligRegion_*/AnsvarligInstitution_*/SOR_*/SHAK_*), not
# re-explained here.

id: mfr_barn_kontakter
name: "Barn_Kontakter - MFR 2019+ satellite table"
scope: sds
family: mfr2019
reference_timing: event
one_row_per: event_from_person
description: >-
  One row per LPR contact for the child, starting within 42 days of birth.
  Satellite table of mfr_nyfoedte, structurally the same idea as
  lpr_a_kontakt but scoped to birth-related contacts only.
source_url: https://sundhedsdatastyrelsen.dk/data-og-registre/nationale-sundhedsregistre/foedselsregisteret
coverage: {from: 2019, to: 2026}

join_keys: [DW_EK_Nyfoedt]
relationships:
  - to: mfr_nyfoedte
    key: DW_EK_Nyfoedt
    to_key: DW_EK_Nyfoedt
    cardinality: many_to_one
  - to: mfr_barn_forloeb
    key: DW_EK_Forloeb
    to_key: DW_EK_Forloeb
    cardinality: many_to_one

columns:
