# Mirror of mfr_barn_kontakter.yaml for the mother: one row per LPR contact
# for the mother, from the start of pregnancy through 42 days after birth.
# Join to mfr_nyfoedte via DW_EK_Foedsel. See mfr_barn_forloeb.yaml's header
# for the shared organisational-column note.

id: mfr_mor_kontakter
name: "Mor_Kontakter - MFR 2019+ satellite table"
scope: sds
family: mfr2019
reference_timing: event
one_row_per: event_from_person
description: >-
  One row per LPR contact for the mother, from the start of pregnancy
  through 42 days after birth. Satellite table of mfr_nyfoedte, mirroring
  mfr_barn_kontakter.
source_url: https://sundhedsdatastyrelsen.dk/data-og-registre/nationale-sundhedsregistre/foedselsregisteret
coverage: {from: 2019, to: 2026}

join_keys: [DW_EK_Foedsel]
relationships:
  - to: mfr_nyfoedte
    key: DW_EK_Foedsel
    to_key: DW_EK_Foedsel
    cardinality: many_to_one
  - to: mfr_mor_forloeb
    key: DW_EK_Forloeb
    to_key: DW_EK_Forloeb
    cardinality: many_to_one

columns:
