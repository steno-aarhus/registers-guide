    name: DW_EK_Foedsel
    label: {da: null, en: "Birth event key"}
    type: character
    role: join_key
    key: true
    origin: dst
    provenance:
      source_url: https://sundhedsdatastyrelsen.dk/Media/638650989728109987/Dokumentation_Foedselsregisteret_2019_og_frem.xlsx
      source_type: dst_documentation
      verified_on: 2026-09-12
      verified_against: "Kolonner sheet."
    reader_note: "Filter mfr_nyfoedte to `Foedsel == 1` before joining onward for multiples, same as mfr_mor_forloeb.yaml."
  - id: aktionsdiagnose
    name: AktionsDiagnose
    label: {da: null, en: "Action diagnosis"}
    type: character
    role: code
    origin: dst
    code_system: icd10
