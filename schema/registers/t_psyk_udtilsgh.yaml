# PSYK_UDTILSGH - the psychiatric counterpart of lpr_udtilsgh.yaml:
# discharge (transfer) destination hospital/department. Register id uses
# the t_psyk_ prefix, matching t_psyk_adm.yaml/t_psyk_diag.yaml's own
# established convention. Missed when t_psyk_adm/t_psyk_diag were first
# built; found by cross-checking DST's full order list
# (Bestillingsliste.xlsx) against the schema on 2026-09-12.

id: t_psyk_udtilsgh
hide_from_overview: true
name: "PSYK_UDTILSGH - Landspatientregistret psykiatri - oplysninger om sygehus og afdeling"
family: lpr2_psychiatric
scope: dst
reference_timing: course
one_row_per: event_from_person
description: >-
  One row per contact recording the hospital and department the patient
  was discharged (transferred) to. Carries no pnr: join to t_psyk_adm on
  recnum to reach the person. Structurally identical to lpr_udtilsgh.yaml,
  its somatic counterpart.
source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
coverage: {from: 1995, to: 2019}

join_keys: [recnum]
relationships:
  - to: t_psyk_adm
    key: recnum
    cardinality: many_to_one

columns:
  - id: recnum
    name: recnum
    label: {da: "LPR-identnummer", en: "Contact identifier"}
    type: character
    role: join_key
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST order list: name only, no label. Label follows lpr_udtilsgh.yaml's own confirmed recnum label."
      type_inferred: true
  - id: c_udtilafd
    name: c_udtilafd
    label: {da: "Udskrevet til afdelingskode", en: "Discharged to department code"}
    type: character
    role: code
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "Label follows the confirmed label on lpr_udtilsgh.yaml's identically-named c_udtilafd (DST's LPR_UDTILSGH page)."
      type_inferred: true
  - id: c_udtilsgh
    name: c_udtilsgh
    label: {da: "Udskrevet til sygehuskode", en: "Discharged to hospital code"}
    type: character
    role: code
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "Label follows the confirmed label on lpr_udtilsgh.yaml's identically-named c_udtilsgh (DST's LPR_UDTILSGH page)."
      type_inferred: true

reader_note: >-
  Only populated for contacts that ended in a transfer, not every
  discharge - most rows in t_psyk_adm should have no matching row here.
  DST's order list gives coverage as 2019 only, almost certainly the same
  snapshot artifact seen throughout this PSYK batch; the family's
  confirmed real span is 1995-2019.
