      verified_against: "SDS, DRG-grupperet LPR3-data - Takstsystem 2025 - Dokumentation v1.0, Table 25. DST's variable list for DRG_SGHFORLOB gives the name and years and no label ('Se dokumentation hos SDS/sundhedsdatastyrelsen')."
      type_inferred: true
      guide_page: register-reference.qmd
    reader_note: >-
      The hospital course is grouped as a whole, so this is the tariff of the
      course's own DRG group and not the sum of the prices of its contacts,
      which are grouped one by one in DRG_KONTAKTER. Adding contact prices and
      course prices counts the same activity twice. Use one level. SDS gives
      no currency for the price columns, and tariffs hold for one calendar
      year, so prices from different tariff-year files are not comparable. The
      long-stay price and the payroll tax (`lonsumafgift_*`, which exist only
      on the course) are separate columns, and `totalpris_drgsghf` is price
      plus long-stay price (SDS: "Pris + Langliggerpris"), without the payroll
      tax.
