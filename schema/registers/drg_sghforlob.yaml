  - id: aktivitetsaar
    name: aktivitetsaar
    label:
      da: null
      en: "Activity year"
    type: integer
    role: date
    key: true
    origin: dst
    coverage: {from: 2021, to: 2025}
    provenance:
      source_url: https://cdn1.gopublic.dk/sundhedsdatastyrelsen/Media/638769532677303948/DRG-grupperet%20LPR3-data%20-%20Takstsystem%202025%20-%20Dokumentation.pdf
      source_type: dst_documentation
      verified_on: 2026-11-23
      verified_against: "SDS, DRG-grupperet LPR3-data - Takstsystem 2025 - Dokumentation v1.0, Table 3. DST's variable list for DRG_SGHFORLOB gives the name and years and no label ('Se dokumentation hos SDS/sundhedsdatastyrelsen')."
      type_inferred: true
      guide_page: register-reference.qmd
    reader_note: >-
      This is the year of the activity, not the year in the file name. DST
      names each yearly file after the tariff year ("Takståret") and says the
      table holds hospital courses "for det pågældende og de to foregående
      aktivitetsår, jf. variablen AKTIVITETSAAR". DST's first release
      (register history, 14 May 2024) was calculated from tariff system 2021,
      which holds activity years 2019 to 2021, and tariff system 2022, which
      holds 2020 to 2022. The same activity therefore appears in up to three
      yearly files, priced with a different tariff each time. Stacking the
      yearly files repeats activity. Choose the tariff year you want and
      filter on `aktivitetsaar`, or take each activity year from one file
      only.

      SDS defines the activity year as the year of the end time of the
      course's last contact, and includes only hospital courses that ended in
      the activity year ("Kun DRG-sygehusforløb, der er afsluttet i
      aktivitetsåret"). SDS's text for tariff system 2025 says the courses are
      formed from activity in the activity year "og de 3 forrige" but gives
      2023 to 2025 as its example for DRG2025. SDS also writes that tariffs
      hold for one calendar year, "men i uddata grupperes typisk flere
      aktivitetsår, så årene kan sammenlignes i samme takstsystem".

      DST's dataset list shows the 2021 file with 58 variables and the later
      files with 60 to 61. The 2021 file was re-run with the original variable
      names on 31 Oct 2025 and with a changed date format on 6 Feb 2026.
