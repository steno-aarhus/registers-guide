# DRG_SGHFORLOB - DST's DRG-grouped LPR3 data, one of two levels (DRG_KONTAKTER holds contacts,
# DRG_SGHFORLOB hospital courses). Built from DST's variable list for DRG_SGHFORLOB
# (61 variables, 2021 to 2025) and Sundhedsdatastyrelsen's documentation
# "DRG-grupperet LPR3-data - Takstsystem 2025 - Dokumentation v1.0", which gives
# the meaning of the many variables whose DST label only says to see SDS.
#
# DST publishes no data types, so every type here is a reading of the column
# name (type_inferred). Years are tariff years, not activity years: see the
# register-level note and the note on aktivitetsaar.

id: drg_sghforlob
name: "DRG_SGHFORLOB - Landspatientregistret (LPR3) takster – DRG sygehusforløb"
family: null
scope: dst
description: >-
  One row per DRG hospital course ("DRG-sygehusforløb"): contacts for the same
  person, at the same hospital and in the same disease course, each starting
  at most four hours after the previous one ended, formed by
  Sundhedsdatastyrelsen and grouped into a DRG as a whole. The contacts are in
  DRG_KONTAKTER. Carries pnr.
source_url: https://www.dst.dk/extranet/ForskningVariabellister/DRG_SGHFORLOB%20-%20Landspatientregistret%20(LPR3)%20takster%20%E2%80%93%20DRG%20sygehusforl%C3%B8b.html

update_cadence: annual
reference_timing: status_period
one_row_per: event_from_person
coverage:
  from: 2021
  to: 2025

deprecated: false
superseded_by: null
join_keys: [id, pnr]

relationships:
  - to: drg_kontakter
    key: id
    to_key: drgsghforlob_id
    cardinality: one_to_many
    provenance:
      source_type: dst_documentation
      source_url: https://cdn1.gopublic.dk/sundhedsdatastyrelsen/Media/638769532677303948/DRG-grupperet%20LPR3-data%20-%20Takstsystem%202025%20-%20Dokumentation.pdf
      verified_on: 2026-11-23
      verified_against: "SDS section 2 and section 6.1.1: a hospital course holds one or more DRG contacts, linked by the course ID that DRG_KONTAKTER carries as DRGSGHFORLOB_ID."
      guide_page: register-reference.qmd
  - to: bef
    key: pnr
    to_key: pnr
    cardinality: many_to_one
    provenance:
      source_type: unverified
      verified_on: 2026-11-23
      verified_against: "Both registers name the person key PNR ('Personnummer' in DST's variable list). No DST page states the join to BEF, so this is the usual reading of the person key, not a documented relationship."
      guide_page: register-reference.qmd

reader_note: >-
  The year in the file name is the tariff year. DST: "DRG_SGHFORLOB_år, hvor
  'år' angiver det år, som taksterne er baseret på: Takståret". Each yearly
  file holds hospital courses for that year and the two preceding activity
  years, given by `aktivitetsaar`: tariff system 2021 holds activity years
  2019 to 2021 and tariff system 2022 holds 2020 to 2022 (register history, 14
  May 2024). Stacking the yearly files repeats the same activity, so select by
  `aktivitetsaar` and compare prices only within one tariff year. SDS adds
  that tariffs hold for one calendar year, "men i uddata grupperes typisk
  flere aktivitetsår, så årene kan sammenlignes i samme takstsystem".

  There are two price levels. Hospital courses are grouped and priced as
  wholes in this table, and the contacts in them are grouped one by one in
  DRG_KONTAKTER with their own price. Use one level and do not add course
  prices to contact prices.

  SDS's documentation says the DRG-grouped data hold only somatic activity
  ("Kun somatisk aktivitet", section 3.4.1.2), where psychiatric activity is
  defined by the SOR specialty of the responsible unit being 'psykiatri' or
  'børne- og ungdomspsykiatri' (section 3.4.1.1). DST's register histories for
  the closed registers DRGPSYK_HEL and DRGPSYK_AMB give a different picture.
  The entries of 15 Jan 2024 say the registers were closed because tariffs for
  psychiatry are now included "sammen med takster for somatikken, i det nye
  DRG", and name DRG_KONTAKTER and DRG_SGHFORLOB as the new registers. The two
  statements are not reconciled here. Check the specialties in your own
  delivery before assuming that psychiatric contacts are present or absent.

  Corrections recorded in DST's register history. SOR codes in the unit
  columns were delivered non-pseudonymised from 22 Jun 2025, which changed
  their format. A new delivery with the original keys replaced 2022 to 2023 on
  31 Oct 2025, and a new delivery with all values of `sygehustype` was made on
  2 Oct 2025. The 2021 file was re-run with the original variable names on 31
  Oct 2025 and with a changed date format on 6 Feb 2026. On 11 Jun 2026 DST
  changed `sygehus` to text for the 2021 file and dropped `sygehusnavn`. The
  register history also names the variables `SORENHED` and `SORENHED_HEN`,
  which the current variable list does not contain. If you hold a copy of a
  file from before these dates, it may differ from the current one. DST's
  dataset list shows the 2021 file with 58 variables, 2022 and 2023 with 61,
  and 2024 and 2025 with 60. SDS's documentation describes tariff system 2025,
  and other tariff systems may differ.

