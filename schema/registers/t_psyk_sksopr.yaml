    name: recnum
    label: {da: "LPR-identnummer", en: "Contact identifier"}
    type: character
    role: join_key
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/PSYK_SKSOPR%20-%20Landspatientregistret%20psykiatri%20-%20oplysninger%20om%20operationer.html
