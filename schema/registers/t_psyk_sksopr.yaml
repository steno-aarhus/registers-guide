reader_note: >-
  DST's page gives this register's coverage year as 2019 only, almost
  certainly the same order-list snapshot artifact seen throughout this
  PSYK batch rather than genuine content limited to 2019 - the family's
  confirmed real span (t_psyk_adm.yaml/t_psyk_diag.yaml) is 1995-2019, and
  this table's SKS-era content should logically start once t_psyk_opr.yaml
  (the pre-1996 ICD8 table) ends. Verify against actual delivered data
  before relying on either boundary.
