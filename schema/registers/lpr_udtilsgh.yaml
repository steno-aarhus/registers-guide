# LPR_UDTILSGH - LPR2's discharge-destination table: which hospital and
# department a patient was discharged TO (e.g. transferred onward), as
# opposed to lpr_adm's own admission/discharge facility. Missed when
# lpr_adm/lpr_diag/lpr_sksopr were first built; found by cross-checking
# DST's full order list (Bestillingsliste.xlsx) against the schema on
# 2026-09-12.

id: lpr_udtilsgh
hide_from_overview: true
name: "LPR_UDTILSGH - Landspatientregistret - oplysninger om sygehus og afdeling"
family: lpr2_somatic
scope: dst
reference_timing: event
one_row_per: event_from_person
description: >-
  One row per contact recording the hospital and department the patient
  was discharged (transferred) to. Carries no pnr: join to lpr_adm on
  recnum to reach the person.
source_url: https://www.dst.dk/extranet/ForskningVariabellister/LPR_UDTILSGH%20-%20Landspatientregistret%20-%20oplysninger%20om%20sygehus%20og%20afdeling.html
coverage: {from: 1977, to: 2019}

join_keys: [recnum]
relationships:
  - to: lpr_adm
    key: recnum
    cardinality: many_to_one

columns:
  - id: recnum
    name: recnum
    label: {da: "LPR-identnummer", en: "Contact identifier"}
    type: character
    role: join_key
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/LPR_UDTILSGH%20-%20Landspatientregistret%20-%20oplysninger%20om%20sygehus%20og%20afdeling.html
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST's dedicated page for this register, confirmed by direct fetch on 2026-09-12."
  - id: c_udtilafd
    name: c_udtilafd
    label: {da: "Udskrevet til afdelingskode", en: "Discharged to department code"}
    type: character
    role: code
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/LPR_UDTILSGH%20-%20Landspatientregistret%20-%20oplysninger%20om%20sygehus%20og%20afdeling.html
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST's dedicated page: label 'Udskrevet til afdelingskode', confirmed by direct fetch on 2026-09-12."
  - id: c_udtilsgh
    name: c_udtilsgh
    label: {da: "Udskrevet til sygehuskode", en: "Discharged to hospital code"}
    type: character
    role: code
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/LPR_UDTILSGH%20-%20Landspatientregistret%20-%20oplysninger%20om%20sygehus%20og%20afdeling.html
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST's dedicated page: label 'Udskrevet til sygehuskode', confirmed by direct fetch on 2026-09-12."

reader_note: >-
  Only populated for contacts that ended in a transfer to another
  hospital/department, not every discharge - most rows in lpr_adm should
  have no matching row here. Not the same fact as lpr_adm's own admitting
  hospital/department: this is specifically the destination on transfer.
