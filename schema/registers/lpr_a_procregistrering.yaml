      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list (column name only - DST gives no label)"
      type_inferred: true
    reader_note: >-
      Flags a procedure with no contact attached. Those rows cannot be joined
      to lpr_a_kontakt at all, so a plain inner join drops them silently.
