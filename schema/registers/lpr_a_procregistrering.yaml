    role: code
    coverage: {from: 2025, to: 2025}
    key: true
    origin: dst
    code_system: sks
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/LPR_A_PROCREGISTRERING%20-%20Landspatientregisteret%20%28LPR3%29%20-%20Oplysninger%20om%20procedureregistreringer.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list (column name only - DST gives no label)"
      type_inferred: true
    reader_note: >-
      LPR3 nests procedures the same way it nests diagnoses: an add-on code
      points at the procedure it belongs to.
  - id: dw_ek_forloeb
    name: dw_ek_forloeb
    label: {da: null, en: "Course identifier"}
    type: character
    role: code
    coverage: {from: 2025, to: 2025}
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/LPR_A_PROCREGISTRERING%20-%20Landspatientregisteret%20%28LPR3%29%20-%20Oplysninger%20om%20procedureregistreringer.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list (column name only - DST gives no label)"
      type_inferred: true
    reader_note: >-
      One level above the contact. Where dw_ek_kontakt is empty, this is the
      only route back to a person, and it reaches a whole course of treatment
      rather than a single contact.
