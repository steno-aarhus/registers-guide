# LPR_A_PROCREGISTRERING - LPR3 procedures. DST gives no labels for any column,
# so the English names here are readings of the column names.
#
# This is the DST register. Some projects receive a reshaped version under
# another name (DARTER calls its copy procedurer_kirurgi), which is documented
# in the DARTER chapter rather than here.

id: lpr_a_procregistrering
name: "Landspatientregistret (LPR3) - procedureregistreringer"
family: lpr3
scope: dst
reference_timing: event
description: >-
  One row per procedure registration. Carries no pnr: join to lpr_a_kontakt on
  dw_ek_kontakt, exactly as the diagnosis table does.
source_url: https://www.dst.dk/extranet/ForskningVariabellister/LPR_A_PROCREGISTRERING%20-%20Landspatientregisteret%20%28LPR3%29%20-%20Oplysninger%20om%20procedureregistreringer.html

join_keys: [dw_ek_kontakt]
relationships:
  - to: lpr_a_kontakt
    key: dw_ek_kontakt
    cardinality: many_to_one

columns:
  - id: dw_ek_kontakt
    name: dw_ek_kontakt
    label: {da: null, en: "Contact identifier"}
    type: character
    role: join_key
    coverage: {from: 2025, to: 2025}
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/LPR_A_PROCREGISTRERING%20-%20Landspatientregisteret%20%28LPR3%29%20-%20Oplysninger%20om%20procedureregistreringer.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list (column name only - DST gives no label)"
      type_inferred: true
    reader_note: >-
      The key to lpr_a_kontakt, which is where pnr lives. This table carries no
      person identifier of its own.
  - id: proc_kode
    name: proc_kode
    label: {da: null, en: "Procedure code"}
    type: character
    role: code
    coverage: {from: 2025, to: 2025}
    key: true
    origin: dst
    code_system: sks
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/LPR_A_PROCREGISTRERING%20-%20Landspatientregisteret%20%28LPR3%29%20-%20Oplysninger%20om%20procedureregistreringer.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list (column name only - DST gives no label)"
      type_inferred: true
  - id: proc_starttidspunkt
    name: proc_starttidspunkt
    label: {da: null, en: "Procedure start"}
    type: datetime
    role: date
    coverage: {from: 2025, to: 2025}
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/LPR_A_PROCREGISTRERING%20-%20Landspatientregisteret%20%28LPR3%29%20-%20Oplysninger%20om%20procedureregistreringer.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list (column name only - DST gives no label)"
      type_inferred: true
    reader_note: >-
      A datetime, not a date. as.Date() it before comparing with an index date.
  - id: proc_kode_type
    name: proc_kode_type
    label: {da: null, en: "Procedure code type"}
    type: character
    role: code
    coverage: {from: 2025, to: 2025}
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/LPR_A_PROCREGISTRERING%20-%20Landspatientregisteret%20%28LPR3%29%20-%20Oplysninger%20om%20procedureregistreringer.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list (column name only - DST gives no label)"
      type_inferred: true
    reader_note: >-
      "P" marks a procedure, "+" an add-on code. An add-on code modifies the
      procedure above it and is not a procedure in its own right, so counting
      all rows overcounts.
  - id: proc_sluttidspunkt
    name: proc_sluttidspunkt
    label: {da: null, en: "Procedure end"}
    type: datetime
    role: date
    coverage: {from: 2025, to: 2025}
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/LPR_A_PROCREGISTRERING%20-%20Landspatientregisteret%20%28LPR3%29%20-%20Oplysninger%20om%20procedureregistreringer.html
