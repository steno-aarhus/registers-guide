# LPR_ULYK - LPR2's accident/injury code table. Sundhedsdatastyrelsen's own
# LPR documentation (esundhed.dk) notes accident variables (c_eakt, c_emek,
# c_epart, c_emodpart, c_ested, c_etraf) already existed directly on
# lpr_adm before 2000, and are "also found from 2000 in table T_ULYK" - so
# this standalone table is specifically the 2000+ extraction, not the only
# place accident data ever lived. Missed when lpr_adm/lpr_diag/lpr_sksopr
# were first built; found by cross-checking DST's full order list
# (Bestillingsliste.xlsx) against the schema on 2026-09-12.

id: lpr_ulyk
hide_from_overview: true
name: "LPR_ULYK - Landspatientregistret - ulykkeskoder"
family: lpr2_somatic
scope: dst
reference_timing: event
one_row_per: expand_from_parent
description: >-
  One row per accident/injury code on a contact. Carries no pnr: join to
  lpr_adm on recnum to reach the person. Before 2000, the equivalent
  accident variables (c_eakt/c_emek/c_epart/c_emodpart/c_ested/c_etraf) are
  documented as living directly on lpr_adm rather than in this table -
  check whether lpr_adm carries them for a project's specific delivery
  before assuming this table is the only source.
source_url: https://www.dst.dk/extranet/ForskningVariabellister/Datasaetlister/LPR_ULYK%20-%20Landspatientregistret%20-%20ulykkeskoder.html
coverage: {from: 2000, to: 2019}

join_keys: [recnum]
relationships:
  - to: lpr_adm
    key: recnum
    cardinality: many_to_one

columns:
  - id: recnum
    name: recnum
    label: {da: "LPR-identnummer", en: "Contact identifier"}
    type: character
    role: join_key
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/Datasaetlister/LPR_ULYK%20-%20Landspatientregistret%20-%20ulykkeskoder.html
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST's dedicated page for this register, confirmed by direct fetch on 2026-09-12."
  - id: c_art
    name: c_art
    label: {da: null, en: "Supplementary code indicator"}
    type: character
    role: code
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/Datasaetlister/LPR_ULYK%20-%20Landspatientregistret%20-%20ulykkeskoder.html
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST's dedicated page: 'Indicator for supplementary codes', confirmed by direct fetch on 2026-09-12."
    reader_note: "Same add-on mechanism as lpr_diag.yaml's diagnosis add-on codes and lpr_afl.yaml's c_oprart: flags that c_tilulyk holds a supplementary code rather than c_ulyk being a standalone accident code."
  - id: c_tilulyk
    name: c_tilulyk
    label: {da: null, en: "Supplementary accident code"}
    type: character
    role: code
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/Datasaetlister/LPR_ULYK%20-%20Landspatientregistret%20-%20ulykkeskoder.html
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST's dedicated page: 'Supplementary code for injury codes', confirmed by direct fetch on 2026-09-12."
  - id: c_ulyk
    name: c_ulyk
    label: {da: null, en: "Accident/injury code"}
    type: character
    role: code
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/Datasaetlister/LPR_ULYK%20-%20Landspatientregistret%20-%20ulykkeskoder.html
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST's dedicated page: 'Injury code', confirmed by direct fetch on 2026-09-12."

reader_note: >-
  A contact can have more than one row here (a primary accident code plus
  supplementary codes flagged via c_art), the same nesting pattern as
  lpr_diag.yaml's diagnosis add-on codes - counting rows rather than
  distinct primary codes overcounts accidents.
