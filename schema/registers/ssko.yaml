# SSKO - health insurance contacts, an aggregate built from the same primary-care
# data as SSSY. Kept off the overview page: a reader only needs it once they know
# SSSY exists.

id: ssko
hide_from_overview: true
name: "Sygesikring (Kontakt)"
scope: dst
reference_timing: status_period
one_row_per: unknown
description: >-
  Contacts with general practice, practising specialists and the other
  providers under the public health insurance, already summed per person and
  per 2-digit specialty (spec2). No fees, service codes or dates: use SSSY for
  those. DST's documentation says what the sum is taken over but not the time
  unit, which is why one_row_per is unknown; one row per person, specialty and
  year is the likely reading, so check it in your own delivery.
source_url: https://www.dst.dk/extranet/ForskningVariabellister/SSKO%20-%20Sygesikring%20%28Kontakt%29.html
coverage: {from: 2005, to: 2025}

join_keys: [pnr]

relationships:
  - to: bef
    key: pnr
    cardinality: many_to_one

columns:
  - id: pnr
    name: pnr
    label: {da: "Personnummer", en: "Personal identifier"}
    type: character
    role: join_key
    coverage: {from: 2005, to: 2025}
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/SSKO%20-%20Sygesikring%20%28Kontakt%29.html
      source_type: dst_variable_list
      verified_on: 2026-09-30
      verified_against: "DST variable list SSKO"
  - id: spec2
    name: spec2
    label: {da: "2-cifret speciale", en: "Specialty, 2-digit"}
    type: character
    role: code
    coverage: {from: 2005, to: 2025}
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/da/Statistik/dokumentation/Times/moduldata-for-sociale-forhold--sundhedsvaesen--retsvaesen/spec2
      source_type: dst_documentation
      verified_on: 2026-09-30
      verified_against: "DST variable list SSKO (name, label, period) and DST's documentation page for SPEC2"
      type_inferred: true
    reader_note: >-
      The kind of provider (general practice, specialist, dentist,
      psychologist and so on), the same code as spec2 in SSSY. General
      practice is spread over several codes, so take the list from DST's value
      set rather than picking a single code.
  - id: kontaktagg
    name: kontaktagg
    label: {da: "Kontakt aggregeret", en: "Contacts, aggregated"}
    type: numeric
    role: value
    coverage: {from: 2005, to: 2025}
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/da/Statistik/dokumentation/Times/sygesikringsstatistik/kontaktagg
      source_type: dst_documentation
      verified_on: 2026-09-30
      verified_against: "DST's documentation page for KONTAKTAGG"
      type_inferred: true
    reader_note: >-
      The number of contacts summed per person and specialty. A contact is a
      direct meeting between patient and provider: a consultation (including
      phone and e-mail) or a home visit, with any examinations in the same
      contact counted once. For dentists only the first visit counts, and DST
      calls the count uncertain for chiropody, physiotherapy and riding
      physiotherapy. DST notes a small number of negative values in 2008-2010
      from settlement corrections, and that the definition of a contact has
      changed over time.
  - id: koenimp
    name: koenimp
    label: {da: "Køn inkl. imputerede", en: "Sex, imputed values included"}
    type: character
    role: code
    coverage: {from: 2005, to: 2025}
    origin: dst
    code_system: koen
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/SSKO%20-%20Sygesikring%20%28Kontakt%29.html
      source_type: dst_variable_list
      verified_on: 2026-09-30
      verified_against: "DST variable list SSKO"
      type_inferred: true
    reader_note: >-
      Imputed where the source was missing, so it is not identical to koen in
      BEF. Prefer BEF when you need sex as a study variable.
  - id: alderimp
    name: alderimp
    label: {da: "Alder ultimo inkl. imputerede", en: "Age at end of year, imputed values included"}
    type: numeric
    role: value
    coverage: {from: 2005, to: 2025}
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/SSKO%20-%20Sygesikring%20%28Kontakt%29.html
      source_type: dst_variable_list
      verified_on: 2026-09-30
      verified_against: "DST variable list SSKO"
      type_inferred: true
  - id: cprtjek
    name: cprtjek
    label: {da: "CPR-tjek", en: null}
    type: character
    role: code
    coverage: {from: 2013, to: 2025}
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/SSKO%20-%20Sygesikring%20%28Kontakt%29.html
      source_type: dst_variable_list
      verified_on: 2026-09-30
      verified_against: "DST variable list SSKO"
      type_inferred: true
  - id: cprtype
    name: cprtype
    label: {da: "CPR-type", en: null}
    type: character
    role: code
    coverage: {from: 2013, to: 2025}
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/SSKO%20-%20Sygesikring%20%28Kontakt%29.html
      source_type: dst_variable_list
