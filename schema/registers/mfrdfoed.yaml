# MFRDFOED - Dødfødsler fra det medicinske fødselsregister (stillbirths from
# the Medical Birth Register), 1997-2018. Structurally different from the 19
# marker sub-cuts (schema/families/mfr_markers.yaml): not one row per SKS
# code, but a full supplementary detail table for the stillbirth subset of
# mfr.yaml's population, the same relationship mfrhjmfo.yaml has for home
# births. mfr.yaml's own LEVENDE_ELLER_DOEDFOEDT already flags stillbirths;
# this is the extra clinical detail for that subset, joined via FK_MFR.
# Also confirmed as an independent source: DST's LPRMFRDF/LPRMFRLF registers
# ("stillbirths/live-births ud fra LPR") are a third angle on birth data,
# derived from LPR rather than MFR - not modelled here, a separate register.

id: mfrdfoed
hide_from_overview: true
name: "MFRDFOED - Dødfødsler fra det medicinske fødselsregister"
scope: dst
reference_timing: event
one_row_per: event_from_person
description: >-
  Supplementary clinical detail for the stillbirth subset of the 1997-2018
  Medical Birth Register, joined to mfr.yaml via FK_MFR. Not a standalone
  population: every row here should also have a row in mfr.yaml with
  LEVENDE_ELLER_DOEDFOEDT indicating a stillbirth.
source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
coverage: {from: 1997, to: 2018}

deprecated: true
superseded_by: null

join_keys: [FK_MFR]
relationships:
  - to: mfr
    key: FK_MFR
    to_key: cpr_barn
    cardinality: one_to_one
    provenance:
      source_type: inferred
      verified_on: 2026-09-12
  - to: bef
    key: CPR_MODER
    to_key: pnr
    cardinality: many_to_one
    provenance:
      source_type: inferred
      verified_on: 2026-09-12

columns:
  - id: fk_mfr
    name: FK_MFR
    label: {da: null, en: null}
    type: character
    role: join_key
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST order list (Bestillingsliste.xlsx): name only, no label."
      type_inferred: true
    reader_note: "Foreign key back to mfr.yaml, same pattern as mfrhjmfo.yaml - not confirmed to match mfr's own cpr_barn specifically."
  - id: cpr_moder
    name: CPR_MODER
    label: {da: null, en: null}
    type: character
    role: join_key
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST order list: name only, no label."
      type_inferred: true
  - id: cpr_fader
    name: CPR_FADER
    label: {da: null, en: null}
    type: character
    role: join_key
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST order list: name only, no label."
      type_inferred: true
    reader_note: >-
      The father's CPR-number - a column mfr.yaml and mfrhjmfo.yaml do not
      carry, specific to this stillbirth-detail table.
  - id: foedselsdato
    name: FOEDSELSDATO
