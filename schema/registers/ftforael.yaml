# FTFORAEL - Fertilitet: forælder. Sibling of ftbarn.yaml (1973-2023). One
# row per parent-child link, not per child: a child with both parents known
# contributes two rows here (MOR_FAR distinguishes which). Same
# thin-documentation situation as ftbarn.yaml - see the register-level
# reader_note.

id: ftforael
name: "FTFORAEL - Fertilitet: forælder"
scope: dst
reference_timing: event
one_row_per: event_from_person
description: >-
  One row per parent-child link in Denmark, 1973-2023: up to two rows per
  child in ftbarn (mother and father), distinguished by MOR_FAR. Carries
  four different parity and birth-spacing measures per parent
  (DEMOGRAFISK_/ENKELT_/FAMILIE_/MEDICINSK_), a demography-specific
  distinction DST's own page does not further define - see the reader_note.
source_url: https://www.dst.dk/extranet/ForskningVariabellister/FTFORAEL%20-%20Fertilitet%20-%20for%C3%A6lder.html
coverage: {from: 1973, to: 2023}

deprecated: false
superseded_by: null

