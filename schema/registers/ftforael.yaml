reader_note: >-
  DST's variable-list page gives no definition distinguishing
  DEMOGRAFISK_/ENKELT_/FAMILIE_/MEDICINSK_ paritet and spacing from one
  another or from the simpler PARITET column: only ENKELT_PARITET,
  FAMILIE_PARITET and MEDICINSK_PARITET get any label text at all
  ("Enkeltparitet", "Familieparitet", "Medicinsk paritet"), and
  DEMOGRAFISK_PARITET gets none. These are standard demographic concepts in
  fertility research (parity can be counted per single birth event, per
  family unit, or per pregnancy outcome including multiples differently),
  but which definition DST actually implements for each column here is not
  confirmed - do not guess at the formula without checking Sundhedsdatastyrelsen's
  or DST's own fuller methodology documentation, if one exists beyond this
  variable list.
