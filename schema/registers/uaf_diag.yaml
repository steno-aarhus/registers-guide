# UAF_DIAG - diagnoses on LPR2 somatic contacts that were still open. Deprecation
# is inherited from families/lpr2_somatic.yaml. Coverage is set here because DST's
# open-contact tables start in 1996.

id: uaf_diag
name: "Landspatientregistret uafsluttede kontakter - diagnoser"
family: lpr2_somatic
scope: dst
reference_timing: status_period
one_row_per: expand_from_parent
description: >-
  One row per diagnosis on an open contact, so a contact can have several.
  Carries no pnr: join to uaf_adm on recnum, within the same year, to reach
  the person. Filed like uaf_adm, so a contact open for several years has
  its diagnoses in several yearly tables.
source_url: https://www.dst.dk/extranet/ForskningVariabellister/UAF_DIAG%20-%20Landspatientregistret%20uafsluttede%20kontakter%20-%20diagnoser.html
coverage: {from: 1996, to: 2019}

join_keys: [recnum]
relationships:
  - to: uaf_adm
    key: recnum
    cardinality: many_to_one

columns:
  - id: recnum
    name: recnum
    label: {da: "LPR-identnummer", en: "Contact identifier"}
    type: character
    role: join_key
    coverage: {from: 1996, to: 2019}
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/UAF_DIAG%20-%20Landspatientregistret%20uafsluttede%20kontakter%20-%20diagnoser.html
      source_type: dst_variable_list
      verified_on: 2026-11-23
      verified_against: "DST variable list UAF_DIAG, including the per-variable year range"
      type_source: "https://www.esundhed.dk/Dokumentation/DocumentationExtended?id=5, table t_diag, Format Lokale Koder, Laengde 0; Sundhedsdatastyrelsen gives the open-contact tables the same structure as the closed ones"
    reader_note: >-
      The key that links uaf_diag to uaf_adm. It identifies a contact,
      not a person.

      Sundhedsdatastyrelsen states that recnum is unique only within one
      update of the register. A contact can get a new recnum when the
      register is updated, and a recnum can be reused for a different
      contact. Join tables only within the same delivery and the same
      year, and do not use recnum to match an open contact to its closed
      version in lpr_adm.
  - id: c_diag
    name: c_diag
    label: {da: null, en: "Diagnosis code"}
    type: character
    role: code
    coverage: {from: 1996, to: 2019}
    code_system: icd10_sks
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/UAF_DIAG%20-%20Landspatientregistret%20uafsluttede%20kontakter%20-%20diagnoser.html
      source_type: dst_variable_list
      verified_on: 2026-11-23
      verified_against: "DST variable list UAF_DIAG, including the per-variable year range"
      type_source: "https://www.esundhed.dk/Dokumentation/DocumentationExtended?id=5, table t_diag, Format Klassificerede koder, Laengde 10; Sundhedsdatastyrelsen gives the open-contact tables the same structure as the closed ones"
  - id: c_diagtype
    name: c_diagtype
    label: {da: null, en: "Diagnosis type"}
    type: character
    role: code
    coverage: {from: 1996, to: 2019}
    code_system: diagtype
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/UAF_DIAG%20-%20Landspatientregistret%20uafsluttede%20kontakter%20-%20diagnoser.html
      source_type: dst_variable_list
      verified_on: 2026-11-23
      verified_against: "DST variable list UAF_DIAG, including the per-variable year range"
      type_inferred: true
    reader_note: >-
      Which types exist depends on the year (see the code system). Type
      M, a provisional diagnosis for an open somatic outpatient contact,
      was in use from 1998 to 2013, and an A and B filter leaves it out.
  - id: c_tildiag
    name: c_tildiag
    label: {da: null, en: "Supplementary diagnosis"}
    type: character
    role: code
    coverage: {from: 1996, to: 2019}
    code_system: icd10_sks
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/UAF_DIAG%20-%20Landspatientregistret%20uafsluttede%20kontakter%20-%20diagnoser.html
      source_type: dst_variable_list
      verified_on: 2026-11-23
      verified_against: "DST variable list UAF_DIAG, including the per-variable year range"
      type_inferred: true
  - id: leverancedato
    name: leverancedato
    label: {da: null, en: "Delivery date"}
    type: date
    role: date
    coverage: {from: 1996, to: 2019}
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/UAF_DIAG%20-%20Landspatientregistret%20uafsluttede%20kontakter%20-%20diagnoser.html
      source_type: dst_variable_list
      verified_on: 2026-11-23
      verified_against: "DST variable list UAF_DIAG, including the per-variable year range"
      type_inferred: true
  - id: version
    name: version
    label: {da: "Version", en: "Version"}
    type: character
    role: code
    coverage: {from: 1996, to: 2019}
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/UAF_DIAG%20-%20Landspatientregistret%20uafsluttede%20kontakter%20-%20diagnoser.html
      source_type: dst_variable_list
      verified_on: 2026-11-23
      verified_against: "DST variable list UAF_DIAG, including the per-variable year range"
      type_inferred: true
  - id: year
    name: year
    label: {da: null, en: "Register year"}
    type: integer
    role: date
    key: true
    origin: tooling
    added_by: parquet conversion
    provenance:
      source_type: unverified
      verified_on: 2026-11-23
      verified_against: null
    reader_note: >-
      Not a DST variable. It is the yearly file a row came from. In the
      open-contact tables that is a year in which the contact was open, and
      a contact open for several years is in several of them, so rows from
      different years can be the same contact. Use d_inddto in uaf_adm to
      say when a contact started.
