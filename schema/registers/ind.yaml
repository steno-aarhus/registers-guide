# IND - personal income. Bootstrapped from DST's variable list.
#
# Checked 2026-11-23: the variable list gives only Aar, Variabel, TIMES link,
# a link to "Hoejkvalitetsdokumentation" where one exists, and Label, no Format
# or Laengde, and IND does not appear in esundhed's documentation index (see
# schema/README.md, Types). 118 of the 244 variables link to a
# "Hoejkvalitetsdokumentation" page each
# (https://www.dst.dk/da/TilSalg/data-til-forskning/generelt-om-data/
# dokumentation-af-data/hoejkvalitetsvariable/Personindkomster/<VARIABEL>).
# Those pages give derivations, validity dates and a data-break flag, and were
# mined on 2026-11-23: every variable DST flags with a break has a reader_note
# built from its page, and the core income variables have longer ones. They
# do not give Format/Laengde, so the types stay inferred.
#
# Two further public sources are used. DST's register history for IND
# (https://www.dst.dk/extranet/ForskningVariabellister/Registerhistorik/IND.html)
# records the correction of 27 January 2017 (BESKST13 and PRE_SOCIO) and the
# entries of 23 August 2022 and 1 December 2022 on GAELD_TIL_OFF, SUNDHEDSBIDRAG
# and RNT_UDG_OFF_GAELD. The _13 variables follow the 2013 revision of the
# income statistics, described in Quitzau, Revision af indkomststatistikken,
# December 2014 (https://www.dst.dk/Site/Dst/SingleFiles/hojkvalbilagOmr.aspx?
# filename=908fbc98-9acb-4a4f-b065-c1dd40f15aacRevision_af_indkomststatistikken_v1).
#
# DST publishes no statement of what one row is, so one_row_per stays unknown.
# What it does document, on the pages for LOENMV_13 and ERHVERSINDK_13, is the
# population: people in the population on 31 December of the income year, and
# everyone in the tax authority's final assessment register with income or
# wealth, including people who emigrated or died during the year. From 2004
# people who are not taxable are included too.

id: ind
name: "Indkomst (personal income)"
family: null
scope: dst
description: >-
  Personal income per person per year, from the tax authority's registers:
  wages, transfers, pensions, capital income, tax and the derived disposable
  income. Some variables follow the 2013 revision of the income statistics and
  carry the suffix _13.
source_url: https://www.dst.dk/extranet/ForskningVariabellister/IND%20-%20Indkomst.html

# All 244 columns DST publishes for IND are listed here, not just the ones this
# guide uses. A project receives only the variables it ordered, so the list is
# what you can ASK for, and colnames() is what you actually have.

update_cadence: annual
reference_timing: status_period
one_row_per: unknown
coverage:
  from: 1980
  to: 2025

deprecated: false
superseded_by: null
join_keys: [pnr]
relationships:
  - to: bef
    key: pnr
    cardinality: many_to_one

columns:
  - id: pnr
    name: pnr
    label: {da: "Personnummer", en: "Personal identifier"}
    type: character
    role: join_key
    key: true
    origin: dst
    coverage: {from: 1980, to: 2025}
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/IND%20-%20Indkomst.html
      source_type: dst_variable_list
      verified_on: 2026-11-23
      verified_against: "DST variable list IND"
      type_inferred: true
      guide_page: register-reference.qmd
  - id: perindkialt_13
    name: perindkialt_13
    label: {da: "Personindkomst i alt ekskl. beregnet lejeværdi af egen bolig", en: "Total personal income excluding imputed rent"}
    type: numeric
    role: value
    key: true
    origin: dst
    coverage: {from: 1980, to: 2025}
    provenance:
      source_url: https://www.dst.dk/da/TilSalg/data-til-forskning/generelt-om-data/dokumentation-af-data/hoejkvalitetsvariable/Personindkomster/PERINDKIALT-13
      source_type: dst_documentation
      verified_on: 2026-11-23
      verified_against: "DST's high-quality variable page: data break within the variable"
      type_inferred: true
      guide_page: register-reference.qmd
    derivation: "PERINDKIALT_13 = ERHVERVSINDK_13 + OFF_OVERFORSEL_13 + PRIVAT_PENSION_13 + FORMUEINDK_BRUTTO + RESUINK_13"
    derivation_source: https://www.dst.dk/da/TilSalg/data-til-forskning/generelt-om-data/dokumentation-af-data/hoejkvalitetsvariable/Personindkomster/PERINDKIALT-13
    reader_note: >-
      Total personal income before tax, labour market contribution and special
      pension contribution, excluding the imputed rent of an own home and
      without deducting interest expenses. For the self-employed it can be
      negative. Some incomes are not in it, for example employer-administered
      pension contributions, pensions withdrawn early, lottery winnings and
      tax-free health supplements to pensioners. DST flags a data break within
      this variable. Its page lists the changes over time: tax-free social
      assistance and heating aid are included from 2002, the green cheque from
      2010, repaid social assistance is deducted from 1997, and from 2016 the
      data are extracted in early August after the income year instead of early
      November. This is a variable of the 2013 revision of the income
      statistics, which DST planned in December 2014 to carry back to 1987 "i
      det omfang, datagrundlaget er tilstrækkeligt" (Quitzau, Revision af
      indkomststatistikken,
      https://www.dst.dk/Site/Dst/SingleFiles/hojkvalbilagOmr.aspx?filename=908fbc98-9acb-4a4f-b065-c1dd40f15aacRevision_af_indkomststatistikken_v1).
      DST's variable list shows it from 1980, but its documentation page gives
      validity from 1 January 1987. Use 1987 as the first year. The older
      perindkialt, without _13, ends in 2013 and is defined differently, so a
      series across 2013 should use this variable throughout.
  - id: loenmv_13
    name: loenmv_13
    label: {da: "Lønindkomst i alt", en: "Total wage income"}
    type: numeric
    role: value
    key: true
    origin: dst
    coverage: {from: 1980, to: 2025}
    provenance:
      source_url: https://www.dst.dk/da/TilSalg/data-til-forskning/generelt-om-data/dokumentation-af-data/hoejkvalitetsvariable/Personindkomster/LOENMV-13
      source_type: dst_documentation
      verified_on: 2026-11-23
      verified_against: "DST's high-quality variable page: data break within and across variables"
      type_inferred: true
      guide_page: register-reference.qmd
    derivation: "LOENMV_13 = LOENSKPL + QSKATFRI (1994-) + JUBJUB (1995-) + QAKTIE (1999-) + ADAGPAGN (2002-2013) + ADAGPAG (1994-2001)"
    derivation_source: https://www.dst.dk/da/TilSalg/data-til-forskning/generelt-om-data/dokumentation-af-data/hoejkvalitetsvariable/Personindkomster/LOENMV-13
    reader_note: >-
      Total wage income: taxable wages including fringe benefits, tax-free
      wages, anniversary and severance pay, share option value and board fees.
      It is after employer-administered pension contributions and ATP, and
      before labour market contribution. It includes pay during sickness and
      maternity leave and employer-paid sickness benefit. Fees for consultancy
      and lectures are in honny, not here. DST flags a data break both within
      this variable and across variables. Its page lists the changes over time:
      wage is taken from the final assessment register from 1994, fringe
      benefits are included from 1994, anniversary and severance pay from 1995,
      share options from 1999, wages paid to non-taxable people without a
      personal identifier from 2011, a range of foreign incomes moved from
      resuink_13 into wages in 2012 (13,713 people that year), and from 2013
      flexible-job wage subsidy is no longer in wages. A variable of the 2013
      revision. DST's variable list shows it from 1980, but its documentation
      page gives validity from 1 January 1987, as for perindkialt_13. Use 1987
      as the first year. The older loenmv ends in 2013.
  - id: erhvervsindk_13
    name: erhvervsindk_13
    label: {da: "Erhvervsindkomst, løn og nettooverskud af selvstændig virksomhed inkl. visse honorarer", en: "Earned income: wages and net profit from self-employment, including certain fees"}
    type: numeric
    role: value
    key: true
    origin: dst
    coverage: {from: 1980, to: 2025}
    provenance:
      source_url: https://www.dst.dk/da/TilSalg/data-til-forskning/generelt-om-data/dokumentation-af-data/hoejkvalitetsvariable/Personindkomster/ERHVERVSINDK-13
      source_type: dst_documentation
      verified_on: 2026-11-23
      verified_against: "DST's high-quality variable page: data break within and across variables"
      type_inferred: true
      guide_page: register-reference.qmd
    derivation: "ERHVERVSINDK_13 = LOENMV_13 + HONNY + NETOVSKUD_13"
    derivation_source: https://www.dst.dk/da/TilSalg/data-til-forskning/generelt-om-data/dokumentation-af-data/hoejkvalitetsvariable/Personindkomster/ERHVERVSINDK-13
    reader_note: >-
      Earned income: wages, net profit from self-employment after capital income
      and interest in the business, and fees liable to labour market
      contribution. It is before labour market contribution and special pension
      contribution, and can be negative for the self-employed. DST's page spells
      the name ERHVERSINDK_13 in some of its formulas, but the variable list
      spells it erhvervsindk_13. DST flags a data break both within this
      variable and across variables. Its page lists the changes over time:
      capital income and interest expenses of a self-employed business can only
      enter from 1987, fringe benefits, foreign business profit and fee income
      are included from 1994, share options from 1999, and from 2007 sickness
      and maternity benefit sits under fee income instead of under profit from
      self-employment. A variable of the 2013 revision. DST's variable list
      shows it from 1980, but its documentation page gives validity from 1
      January 1987, as for perindkialt_13. Use 1987 as the first year. The older
      erhvervsindk and erhvervsindk_gl end in 2013.
  - id: dispon_13
    name: dispon_13
    label: {da: "Indkomst efter skat og renteudgifter tillagt beregnet lejeværdi af egen bolig.", en: "Disposable income"}
    type: numeric
    role: value
    key: true
    origin: dst
    coverage: {from: 1980, to: 2025}
    provenance:
      source_url: https://www.dst.dk/da/TilSalg/data-til-forskning/generelt-om-data/dokumentation-af-data/hoejkvalitetsvariable/Personindkomster/DISPON-13
      source_type: dst_documentation
      verified_on: 2026-11-23
      verified_against: "DST's high-quality variable page: no data break flagged; DST's register history for IND"
      type_inferred: true
      guide_page: register-reference.qmd
    derivation: "DISPON_13 = PERINDKIALT_13 + LEJEV_EGEN_BOLIG - RENTUDGPR - SKATMVIALT_13 - UNDERHOL"
    derivation_source: https://www.dst.dk/da/TilSalg/data-til-forskning/generelt-om-data/dokumentation-af-data/hoejkvalitetsvariable/Personindkomster/DISPON-13
    reader_note: >-
      Disposable income per person: income after tax and interest expenses, with
      the imputed rent of an own home added. It is not adjusted for family size,
      so use aekvivadisp_13 to compare people who live in families of different
      size. DST states that from the 2013 revision it replaced dispon_ny. Church
      tax is no longer counted as tax. DST's page lists no data break, but notes
      that the imputed rent is missing for about 20 per cent of people in
      1980-1982, falling to 4 per cent in 1986, and that from 2016 the data are
      extracted in early August instead of early November, which raised
      disposable income by 0.2 per cent. DST's register history
      (https://www.dst.dk/extranet/ForskningVariabellister/Registerhistorik/IND.html)
      records that the first delivery for income years 2016, 2017 and 2018
      lacked dispon_13 and aekvivadisp_13, among other variables, and that they
      followed in a later update.
  - id: aekvivadisp_13
    name: aekvivadisp_13
    label: {da: "Ækvivaleret disponibel indkomst", en: "Equivalised disposable income"}
    type: numeric
    role: value
    key: true
    origin: dst
    coverage: {from: 1987, to: 2025}
    provenance:
      source_url: https://www.dst.dk/da/TilSalg/data-til-forskning/generelt-om-data/dokumentation-af-data/hoejkvalitetsvariable/Personindkomster/AEKVIVADISP-13
      source_type: dst_documentation
      verified_on: 2026-11-23
      verified_against: "DST's high-quality variable page: no data break flagged; DST's register history for IND"
      type_inferred: true
      guide_page: register-reference.qmd
    derivation: "AEKVIVADISP_13 = family disposable income / (1 + 0.5 * (number of people over 14 in the family - 1) + 0.3 * number of people under 15)"
    derivation_source: https://www.dst.dk/da/TilSalg/data-til-forskning/generelt-om-data/dokumentation-af-data/hoejkvalitetsvariable/Personindkomster/AEKVIVADISP-13
    reader_note: >-
      The family's disposable income divided by an equivalence factor, so that
      people in families of different size can be compared. Every member of the
      family gets the same value. The first adult counts 1, each further person
      over 14 counts 0.5 and each child under 15 counts 0.3, which is the OECD
      modified scale. A couple with two young children has a factor of 2.1, so a
      family income of 420,000 gives 200,000 for each of the four. A family is
      DST's e-family: people at the same address with certain relations,
      including children living at home under 25. DST flags no data break. Its
      page notes that for 2014 to 2016 data on tax-free social assistance were
      missing or wrong in some municipalities, and that an older version of the
      variable can differ slightly from DST's statistics. The register history
      (https://www.dst.dk/extranet/ForskningVariabellister/Registerhistorik/IND.html)
      records that the first delivery for income years 2016, 2017 and 2018
      lacked this variable and that it followed in a later update.
  - id: beskst13
    name: beskst13
    label: {da: "Kode for personens væsentligste indkomstkilde (INDKOMST/AKM)", en: "Main source of income"}
    type: integer
    role: code
    key: true
    origin: dst
    code_system: beskst02
    coverage: {from: 1980, to: 2025}
    provenance:
      source_url: https://www.dst.dk/da/TilSalg/data-til-forskning/generelt-om-data/dokumentation-af-data/hoejkvalitetsvariable/Personers-tilknytning-til-arbejdsmarkedet-set-over-hele-aaret--AKM-/BESKST13
      source_type: dst_documentation
      verified_on: 2026-11-23
      verified_against: "DST's high-quality variable page for BESKST13 (documented under AKM): data break within the variable; DST's register history for IND"
      type_inferred: true
      guide_page: register-reference.qmd
    reader_note: >-
      Code for the person's main source of income in the income year, built in a
      fixed order of priority (early retirement, unemployed, other outside
      employment, social assistance, self-employed, and so on). It uses the same
      codes as beskst02, and is the basis of pre_socio and of socio13 in AKM.
      DST names two differences from beskst02: income of the self-employed is
      net of capital income and interest (about 8,000 people in 2012 change from
      self-employed to another category), and recipients of some benefits move
      from "other" to social assistance recipients. DST flags a data break
      within this variable. For 1980 to 1986 profit from self-employment is
      before interest expenses, which classifies more people as self-employed.
      From 2008 days on holiday benefit no longer count as unemployment, and
      working hours replace ATP as the measure of employment. From 2016 the data
      are extracted 7 to 8 months after the income year instead of 10 to 11 (11
      months again for 2019 and 2020). DST's page for the variable, which is
      documented under AKM
      (https://www.dst.dk/da/TilSalg/data-til-forskning/generelt-om-data/dokumentation-af-data/hoejkvalitetsvariable/Personers-tilknytning-til-arbejdsmarkedet-set-over-hele-aaret--AKM-/BESKST13),
      gives validity from 1 January 1991, while the IND list shows it from 1980.
      DST's register history
      (https://www.dst.dk/extranet/ForskningVariabellister/Registerhistorik/IND.html)
      records a correction on 27 January 2017: "I indkomstregistret er 15 til 35
      tusinde personer fejlagtigt blevet placeret som efterlønsmodtagere i de
      nuværende data". Most of them became self-employed and the rest pensioners
      and wage earners. The error concerned the 2013 definitions for 1987 to
      2014, which DST re-ran. It affected beskst13 and pre_socio.
  - id: pre_socio
    name: pre_socio
    label: {da: "Socioøkonomisk klassifikation (Indkomst/AKM)", en: "Socioeconomic classification (preliminary version of socio13)"}
    type: integer
    role: code
    key: true
    origin: dst
    code_system: socio13
    coverage: {from: 1980, to: 2025}
    provenance:
      source_url: https://www.dst.dk/da/TilSalg/data-til-forskning/generelt-om-data/dokumentation-af-data/hoejkvalitetsvariable/Personindkomster/PRE-SOCIO
      source_type: dst_documentation
      verified_on: 2026-11-23
      verified_against: "DST's high-quality variable page: data break within the variable"
      type_inferred: true
      guide_page: register-reference.qmd
    reader_note: >-
      A preliminary version of socio13 in AKM, built from beskst13 and available
      a couple of months before it. DST recommends socio13 once AKM exists. It
      equals socio13 except that wage earners are not divided by occupation
      level, and it is built back to 1980 while socio13 starts in 1991. The
      self-employed are divided by number of employees from 1994. Students and
      young people in education who are wage earners in beskst13 and worked
      fewer than 950 hours in the year are coded 310 (student). DST flags a data
      break within this variable. DST's correction of 27 January 2017, described
      under beskst13, affected this variable for 1987 to 2014 in the 2013
      definitions.
  - id: year
    name: year
    label: {da: null, en: "Register year"}
    type: integer
    role: date
    key: true
    origin: tooling
    added_by: fastreg
    provenance:
