# LPR_A_FORLOEB - the general-population LPR3 course-element table. Not
# birth-scoped: this is the same "forloeb" concept mfr_barn_forloeb.yaml/
# mfr_mor_forloeb.yaml use for birth-related course elements specifically,
# but for the whole LPR3 population. Missed when lpr_a_kontakt/lpr_a_diagnose/
# lpr_a_procregistrering were first built; found by cross-checking DST's
# full order list (Bestillingsliste.xlsx) against the schema on 2026-09-12.
#
# Carries PNR directly, unlike lpr_a_kontakt (keyed on dw_ek_kontakt with no
# plain personal number of its own) - a real, useful difference, not an
# oversight to flag.

id: lpr_a_forloeb
hide_from_overview: true
name: "LPR_A_FORLOEB - Landspatientregistret (LPR3) - forloeb"
family: lpr3
scope: dst
reference_timing: event
one_row_per: event_from_person
description: >-
  One row per LPR3 course element ("forloebselement") for the whole
  population, not restricted to birth-related courses the way
  mfr_barn_forloeb/mfr_mor_forloeb are. Contacts (lpr_a_kontakt) reference a
  course element from this table via DW_EK_FORLOEB.
source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
coverage: {from: 2025, to: 2025}

join_keys: [PNR]
relationships:
  - to: bef
    key: PNR
    to_key: pnr
    cardinality: many_to_one
    provenance:
      source_type: inferred
      verified_on: 2026-09-12
  - to: lpr_a_kontakt
    key: DW_EK_FORLOEB
    to_key: DW_EK_Forloeb
    cardinality: one_to_many
    provenance:
      source_type: inferred
      verified_on: 2026-09-12

columns:
