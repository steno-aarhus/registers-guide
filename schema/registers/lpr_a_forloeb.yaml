    provenance:
      source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST order list (Bestillingsliste.xlsx): name only, no label. DST's own dedicated pages for sibling LPR_A_* tables explicitly say 'Ingen label' rather than omitting one."
