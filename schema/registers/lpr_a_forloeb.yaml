reader_note: >-
  DST's own dedicated page for this register's sibling LPR_A_RESULTATER
  explicitly states "Ingen label" for every column rather than omitting one
  silently - this register's thinness is confirmed current DST
  documentation practice, not a gap in what this schema could find. Most
  column names pair a code with its own `_TEKST` derived-text sibling; that
  pattern is not repeated in every column's reader_note below, only noted
  once here.
