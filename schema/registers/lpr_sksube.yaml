# LPR_SKSUBE - LPR2 examinations and treatments. Same shape as LPR_SKSOPR, but
# the procedure code is missing from at least one delivery, see the note on c_opr.

id: lpr_sksube
name: "Landspatientregistret - undersoegelser og behandlinger"
family: lpr2_somatic
scope: dst
reference_timing: status_period
one_row_per: expand_from_parent
description: >-
  One row per examination or treatment. Structured exactly like LPR_SKSOPR, and
  joined to lpr_adm on recnum in the same way.
source_url: https://www.dst.dk/extranet/ForskningVariabellister/LPR_SKSUBE%20-%20Landspatientregistret%20-%20unders%C3%B8gelser%20og%20behandlinger.html
coverage: {from: 1999, to: 2019}

join_keys: [recnum]
relationships:
  - to: lpr_adm
    key: recnum
    cardinality: many_to_one

columns:
  - id: recnum
    name: recnum
    label: {da: "LPR-identnummer", en: "Contact identifier"}
    type: character
    role: join_key
    coverage: {from: 1999, to: 2019}
    key: true
    origin: dst
    provenance:
      source_url: https://www.esundhed.dk/Dokumentation/DocumentationExtended?id=5
      source_type: esundhed_kodeark
      verified_on: 2026-10-01
      verified_against: "Sundhedsdatastyrelsen's documentation of Landspatientregisteret (DocumentationExtended?id=5), table t_sksube, variable v_recnum"
      type_source: "https://www.esundhed.dk/Dokumentation/DocumentationExtended?id=5, Format Lokale Koder, Laengde 0"
    reader_note: >-
      Sundhedsdatastyrelsen states that recnum is unique only within one
      update of the register. A contact can get a new recnum when the
      register is updated, and a recnum can be reused for a different
      contact. Join tables only within the same delivery, and never store
      recnum as a lasting id for a contact.
  - id: c_opr
    name: c_opr
    label: {da: "Procedurekodenummer (undersoegelse & behandling)", en: "Procedure code"}
    type: character
    role: code
    coverage: {from: 1999, to: 2019}
    key: true
    origin: dst
    code_system: sks
    provenance:
      source_url: https://www.esundhed.dk/Dokumentation/DocumentationExtended?id=5
      source_type: esundhed_kodeark
      verified_on: 2026-10-01
      verified_against: "Sundhedsdatastyrelsen's documentation of Landspatientregisteret (DocumentationExtended?id=5), table t_sksube, variable c_opr"
      type_source: "https://www.esundhed.dk/Dokumentation/DocumentationExtended?id=5, Format Klassificerede koder, Laengde 10"
    reader_note: >-
      Check that you actually have this column. DST documents it for every
      year 1999-2019, but a delivery can arrive with only recnum, d_odto and
      year, which leaves no way to tell one procedure from another. Without it
      the table is unusable, and no filtering recovers it.

      Every SKS code that is neither a diagnosis (D) nor an operation (K):
      examinations, non-surgical treatments and administrative codes. Look
      up the code text valid on d_odto.
  - id: c_oprart
    name: c_oprart
    label: {da: "Procedureart (undersoegelse & behandling)", en: "Procedure type"}
    type: character
    role: code
    coverage: {from: 1999, to: 2019}
    origin: dst
    provenance:
      source_url: https://www.esundhed.dk/Dokumentation/DocumentationExtended?id=5
      source_type: esundhed_kodeark
      verified_on: 2026-10-01
      verified_against: "Sundhedsdatastyrelsen's documentation of Landspatientregisteret (DocumentationExtended?id=5), table t_sksube, variable c_oprart"
      type_source: "https://www.esundhed.dk/Dokumentation/DocumentationExtended?id=5, Format Lokale Koder, Laengde 1"
    reader_note: >-
      Not the same column as c_oprart in lpr_sksopr. Here it is only an
      indicator: '+' when the procedure has an add-on code in c_tilopr,
      blank otherwise. The V/P/D values of the oprart code system do not
      occur.
  - id: c_osgh
    name: c_osgh
    label: {da: "Procedurende sygehus (undersoegelse & behandling)", en: "Hospital performing the procedure"}
    type: character
    role: code
    coverage: {from: 1999, to: 2019}
    origin: dst
    provenance:
      source_url: https://www.esundhed.dk/Dokumentation/DocumentationExtended?id=5
      source_type: esundhed_kodeark
      verified_on: 2026-10-01
      verified_against: "Sundhedsdatastyrelsen's documentation of Landspatientregisteret (DocumentationExtended?id=5), table t_sksube, variable c_osgh"
      type_inferred: true
    reader_note: >-
      Hospital code from the SHAK classification. Names change over time, so
      look up the name valid on d_odto.
  - id: c_tilopr
    name: c_tilopr
    label: {da: "Tillaegskode (undersoegelse & behandling)", en: "Supplementary code"}
    type: character
    role: code
    coverage: {from: 1999, to: 2019}
    origin: dst
    code_system: sks
    provenance:
      source_url: https://www.esundhed.dk/Dokumentation/DocumentationExtended?id=5
      source_type: esundhed_kodeark
      verified_on: 2026-10-01
      verified_against: "Sundhedsdatastyrelsen's documentation of Landspatientregisteret (DocumentationExtended?id=5), table t_sksube, variable c_tilopr"
      type_inferred: true
    reader_note: >-
      Add-on code to the procedure in c_opr (marked by c_oprart '+'). Almost
      any SKS code can be used as an add-on.
  - id: d_odto
    name: d_odto
    label: {da: "Proceduredato (undersoegelse & behandling)", en: "Procedure date"}
    type: date
    role: date
    coverage: {from: 1999, to: 2019}
    key: true
    origin: dst
    provenance:
      source_url: https://www.esundhed.dk/Dokumentation/DocumentationExtended?id=5
      source_type: esundhed_kodeark
      verified_on: 2026-10-01
      verified_against: "Sundhedsdatastyrelsen's documentation of Landspatientregisteret (DocumentationExtended?id=5), table t_sksube, variable d_odto"
      type_inferred: true
    reader_note: >-
      The date the procedure started.
  - id: year
    name: year
    label: {da: null, en: "Register year"}
    type: integer
    role: date
    key: true
    origin: tooling
    added_by: parquet conversion
    provenance:
      source_type: unverified
      verified_on: 2026-09-01
      verified_against: null
    reader_note: >-
      Not a DST variable. It is the partition the yearly deliveries were written
      into, so filtering on it stops the other years being read at all. Use it to
      limit how much is read, not to decide when something happened: for that,
      use the register's own date column.
  - id: c_oafd
    name: c_oafd
    label: {da: "Procedurende afdeling (undersøgelse & behandling)", en: "Department performing the procedure"}
    type: character
    role: code
    origin: dst
    coverage: {from: 1999, to: 2019}
    provenance:
      source_url: https://www.esundhed.dk/Dokumentation/DocumentationExtended?id=5
      source_type: esundhed_kodeark
      verified_on: 2026-10-01
      verified_against: "Sundhedsdatastyrelsen's documentation of Landspatientregisteret (DocumentationExtended?id=5), table t_sksube, variable c_oafd"
      type_inferred: true
    reader_note: >-
      Not unique on its own: combine it with c_osgh to get the 7-character
      hospital-department code (SHAK). Department names change over time, so
      look up the name valid on d_odto.
  - id: leverancedato
    name: leverancedato
    label: {da: null, en: "Delivery date"}
    type: date
    role: date
    origin: dst
    coverage: {from: 1999, to: 2019}
    provenance:
      source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
      source_type: dst_variable_list
      verified_on: 2026-09-02
      verified_against: "DST order list (Bestillingsliste.xlsx): name, Danish label and period"
      type_inferred: true
  - id: version
    name: version
    label: {da: "Version", en: "Version"}
    type: character
    role: code
    origin: dst
    coverage: {from: 1999, to: 2019}
    provenance:
      source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
      source_type: dst_variable_list
      verified_on: 2026-09-02
      verified_against: "DST order list (Bestillingsliste.xlsx): name, Danish label and period"
      type_inferred: true
  - id: v_ominut
    name: v_ominut
    label: {da: "Procedureminut (undersøgelse & behandling)", en: "Procedure start, minute"}
    type: numeric
    role: value
    origin: dst
    coverage: {from: 1999, to: 2019}
    provenance:
      source_url: https://www.esundhed.dk/Dokumentation/DocumentationExtended?id=5
      source_type: esundhed_kodeark
      verified_on: 2026-10-01
      verified_against: "Sundhedsdatastyrelsen's documentation of Landspatientregisteret (DocumentationExtended?id=5), table t_sksube, variable v_ominut"
      type_inferred: true
    reader_note: >-
      Minute (0-59) of the start time, from 1999. Combine with v_otime;
      before 1999 only the date exists.
  - id: v_otime
    name: v_otime
    label: {da: "Proceduretime (undersøgelse & behandling)", en: "Procedure start, hour"}
    type: numeric
    role: value
    origin: dst
    coverage: {from: 1999, to: 2019}
    provenance:
      source_url: https://www.esundhed.dk/Dokumentation/DocumentationExtended?id=5
      source_type: esundhed_kodeark
      verified_on: 2026-10-01
      verified_against: "Sundhedsdatastyrelsen's documentation of Landspatientregisteret (DocumentationExtended?id=5), table t_sksube, variable v_otime"
      type_inferred: true
    reader_note: >-
      Hour (0-23) of the start time, from 1999.
