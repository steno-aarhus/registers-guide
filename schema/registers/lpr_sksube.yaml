# LPR_SKSUBE - LPR2 examinations and treatments. Same shape as LPR_SKSOPR, but
# the procedure code is missing from at least one delivery, see the note on c_opr.

id: lpr_sksube
name: "Landspatientregistret - undersoegelser og behandlinger"
family: lpr2_somatic
scope: dst
reference_timing: event
description: >-
  One row per examination or treatment. Structured exactly like LPR_SKSOPR, and
  joined to lpr_adm on recnum in the same way.
source_url: https://www.dst.dk/extranet/ForskningVariabellister/LPR_SKSUBE%20-%20Landspatientregistret%20-%20unders%C3%B8gelser%20og%20behandlinger.html
coverage: {from: 1999, to: 2019}

join_keys: [recnum]
relationships:
  - to: lpr_adm
    key: recnum
    cardinality: many_to_one

columns:
  - id: recnum
    name: recnum
    label: {da: "LPR-identnummer", en: "Contact identifier"}
    type: character
    role: join_key
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/LPR_SKSUBE%20-%20Landspatientregistret%20-%20unders%C3%B8gelser%20og%20behandlinger.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list, cross-checked against colnames() on the parquet"
  - id: c_opr
    name: c_opr
    label: {da: "Procedurekodenummer (undersoegelse & behandling)", en: "Procedure code"}
    type: character
    role: code
    key: true
    origin: dst
    code_system: sks
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/LPR_SKSUBE%20-%20Landspatientregistret%20-%20unders%C3%B8gelser%20og%20behandlinger.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list, cross-checked against colnames() on the parquet"
    reader_note: >-
      Check that you actually have this column. DST documents it for every
      year 1999-2019, but the DARTER delivery of this table contains only
      recnum, d_odto and year, which leaves no way to tell one procedure from
      another. Without it the table is unusable, and no filtering recovers it.
  - id: c_oprart
    name: c_oprart
    label: {da: "Procedureart (undersoegelse & behandling)", en: "Procedure type"}
    type: character
    role: code
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/LPR_SKSUBE%20-%20Landspatientregistret%20-%20unders%C3%B8gelser%20og%20behandlinger.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list, cross-checked against colnames() on the parquet"
  - id: c_osgh
    name: c_osgh
    label: {da: "Procedurende sygehus (undersoegelse & behandling)", en: "Hospital performing the procedure"}
    type: character
    role: code
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/LPR_SKSUBE%20-%20Landspatientregistret%20-%20unders%C3%B8gelser%20og%20behandlinger.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list, cross-checked against colnames() on the parquet"
  - id: c_tilopr
    name: c_tilopr
    label: {da: "Tillaegskode (undersoegelse & behandling)", en: "Supplementary code"}
    type: character
    role: code
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/LPR_SKSUBE%20-%20Landspatientregistret%20-%20unders%C3%B8gelser%20og%20behandlinger.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list, cross-checked against colnames() on the parquet"
  - id: d_odto
    name: d_odto
    label: {da: "Proceduredato (undersoegelse & behandling)", en: "Procedure date"}
    type: date
    role: date
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/LPR_SKSUBE%20-%20Landspatientregistret%20-%20unders%C3%B8gelser%20og%20behandlinger.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list, cross-checked against colnames() on the parquet"
  - id: year
    name: year
    label: {da: null, en: "Register year"}
    type: integer
    role: date
    key: true
    origin: tooling
    added_by: parquet conversion
    provenance:
      source_type: server_verified
      verified_on: 2026-09-01
      verified_by: "Sara Schwartz"
      verified_against: "colnames() on the parquet"
    reader_note: >-
      Not a DST variable. It is the partition the yearly deliveries were written
      into, so filtering on it stops the other years being read at all. Use it to
      limit how much is read, not to decide when something happened: for that,
      use the register's own date column.
