      verified_on: 2026-09-02
      verified_against: "DST order list (Bestillingsliste.xlsx): name, Danish label and period"
      type_inferred: true
  - id: v_ominut
    name: v_ominut
    label: {da: "Procedureminut (undersøgelse &amp; behandling)", en: null}
    type: numeric
    role: value
    origin: dst
    coverage: {from: 1999, to: 2019}
    provenance:
