# SYST - health insurance, 4-digit specialty. An aggregated sibling of SYSI for
# the same years. Kept off the overview page: a reader only needs it once they
# know SYSI exists. DST's variable list links no documentation page for any
# column except pnr, so everything beyond names, labels and periods is open.

id: syst
hide_from_overview: true
name: "Sygesikring (4-cifret)"
scope: dst
reference_timing: status_period
one_row_per: unknown
deprecated: true
description: >-
  Primary-care services and fees already summed (sumydl, sumbru) under a
  4-digit specialty code, 1992-2005. DST does not document what the sums are
  taken over, so the grain is unknown. For anything at service level, or for
  the fee week and provider number, use SYSI for the same years.
source_url: https://www.dst.dk/extranet/ForskningVariabellister/SYST%20-%20Sygesikring%20%284-cifret%29.html
coverage: {from: 1992, to: 2005}

join_keys: [pnr]

relationships:
  - to: bef
    key: pnr
    cardinality: many_to_one

columns:
  - id: pnr
    name: pnr
    label: {da: "Personnummer", en: "Personal identifier"}
    type: character
    role: join_key
    coverage: {from: 1992, to: 2005}
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/SYST%20-%20Sygesikring%20%284-cifret%29.html
      source_type: dst_variable_list
      verified_on: 2026-09-30
      verified_against: "DST variable list SYST"
  - id: spec4
    name: spec4
    label: {da: "4-cifret speciale nr.", en: "Specialty, 4-digit"}
    type: character
    role: code
    coverage: {from: 1992, to: 2005}
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/SYST%20-%20Sygesikring%20%284-cifret%29.html
      source_type: dst_variable_list
      verified_on: 2026-09-30
      verified_against: "DST variable list SYST"
      type_inferred: true
    reader_note: >-
      DST documents neither the structure nor a value set for this code, and
      it is not the same code as the 6-digit speciale in SYSI and SSSY. Do not
      assume the first two digits are spec2 without checking.
  - id: sumydl
    name: sumydl
    label: {da: "Sum af antal ydelser", en: "Sum of number of services"}
    type: numeric
    role: value
    coverage: {from: 1992, to: 2005}
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/SYST%20-%20Sygesikring%20%284-cifret%29.html
      source_type: dst_variable_list
      verified_on: 2026-09-30
      verified_against: "DST variable list SYST"
      type_inferred: true
  - id: sumbru
    name: sumbru
    label: {da: "Sum bruttohonorar", en: "Sum of gross fees"}
    type: numeric
    role: value
    coverage: {from: 1992, to: 2005}
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/SYST%20-%20Sygesikring%20%284-cifret%29.html
      source_type: dst_variable_list
      verified_on: 2026-09-30
      verified_against: "DST variable list SYST"
      type_inferred: true
    reader_note: >-
      DST documents no unit for this column. bruhon in SYSI is in øre until
      2004 and in kroner from 2005, so check which unit this sum is in before
      comparing it with anything.
  - id: kontakt
    name: kontakt
    label: {da: "Kontakt", en: "Contact"}
    type: numeric
    role: value
    coverage: {from: 1992, to: 2005}
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/SYST%20-%20Sygesikring%20%284-cifret%29.html
      source_type: dst_variable_list
      verified_on: 2026-09-30
      verified_against: "DST variable list SYST"
      type_inferred: true
  - id: sikgrup
    name: sikgrup
    label: {da: "Sikringsgruppe", en: "Insurance group"}
    type: character
    role: code
    coverage: {from: 1992, to: 2005}
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/SYST%20-%20Sygesikring%20%284-cifret%29.html
      source_type: dst_variable_list
      verified_on: 2026-09-30
      verified_against: "DST variable list SYST"
      type_inferred: true
  - id: barnmak
    name: barnmak
    label: {da: "Barnemarkering", en: "Child marker"}
    type: character
    role: code
    coverage: {from: 1992, to: 2005}
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/SYST%20-%20Sygesikring%20%284-cifret%29.html
      source_type: dst_variable_list
      verified_on: 2026-09-30
      verified_against: "DST variable list SYST"
      type_inferred: true
    reader_note: >-
      Until 1 January 1996, services to a child under 16 were reported under
      the parent's CPR-number (Sahl Andersen et al. 2011, Scand J Public
      Health 39(Suppl 7):34-37). See the same column in SYSI.
  - id: kommune
    name: kommune
    label: {da: "Bopæls kommune", en: "Municipality of residence"}
    type: character
    role: code
    coverage: {from: 1992, to: 2005}
    origin: dst
    code_system: kom
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/SYST%20-%20Sygesikring%20%284-cifret%29.html
      source_type: dst_variable_list
      verified_on: 2026-09-30
      verified_against: "DST variable list SYST"
      type_inferred: true
    reader_note: >-
      All years are before the 2007 municipal reform, so these are the old
      municipality codes. The same number can mean a different municipality
      after 2007.
