# PSYK_ULYK - the psychiatric counterpart of lpr_ulyk.yaml: accident/
# injury codes. Register id uses the t_psyk_ prefix, matching
# t_psyk_adm.yaml/t_psyk_diag.yaml's own established convention. Missed
# when t_psyk_adm/t_psyk_diag were first built; found by cross-checking
# DST's full order list (Bestillingsliste.xlsx) against the schema on
# 2026-09-12.

id: t_psyk_ulyk
hide_from_overview: true
name: "PSYK_ULYK - Landspatientregistret psykiatri - ulykkeskoder"
family: lpr2_psychiatric
scope: dst
reference_timing: course
one_row_per: expand_from_parent
description: >-
  One row per accident/injury code on a psychiatric contact. Carries no
  pnr: join to t_psyk_adm on recnum to reach the person. Structurally
  identical to lpr_ulyk.yaml, its somatic counterpart.
source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
coverage: {from: 2000, to: 2019}

join_keys: [recnum]
relationships:
  - to: t_psyk_adm
    key: recnum
    cardinality: many_to_one

columns:
  - id: recnum
    name: recnum
    label: {da: "LPR-identnummer", en: "Contact identifier"}
    type: character
    role: join_key
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST order list: name only, no label. Label follows lpr_ulyk.yaml's own confirmed recnum label."
      type_inferred: true
  - id: c_art
    name: c_art
    label: {da: null, en: "Supplementary code indicator"}
    type: character
    role: code
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "Label follows the confirmed label on lpr_ulyk.yaml's identically-named c_art (DST's LPR_ULYK page)."
      type_inferred: true
    reader_note: "Same add-on mechanism as lpr_ulyk.yaml's c_art: flags that c_tilulyk holds a supplementary code."
  - id: c_tilulyk
    name: c_tilulyk
    label: {da: null, en: "Supplementary accident code"}
    type: character
    role: code
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "Label follows the confirmed label on lpr_ulyk.yaml's identically-named c_tilulyk (DST's LPR_ULYK page)."
      type_inferred: true
  - id: c_ulyk
    name: c_ulyk
    label: {da: null, en: "Accident/injury code"}
    type: character
    role: code
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "Label follows the confirmed label on lpr_ulyk.yaml's identically-named c_ulyk (DST's LPR_ULYK page)."
      type_inferred: true

reader_note: >-
  A contact can have more than one row here, the same nesting pattern as
  lpr_ulyk.yaml - counting rows rather than distinct primary codes
  overcounts accidents. DST's order list gives coverage as 2019 only,
  almost certainly the same snapshot artifact seen throughout this PSYK
  batch; the somatic counterpart's real span (2000-2019) is used here.
