  - id: beskst13
    name: beskst13
    label:
      da: "Kode for personens væsentligste indkomst-kilde (INDKOMST/AKM)"
      en: "Main source of income"
    type: integer
    role: code
    origin: dst
    coverage: {from: 1991, to: 2024}
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/AKM%20-%20Arbejdsklassifikationsmodulet.html
      source_type: dst_variable_list
      verified_on: 2026-08-31
      verified_against: "DST variable list AKM"
    reader_note: >-
      A different question from socio13: where the money came from, rather than
      what the person's labour market position was. The value set has not been
      sourced.

  - id: year
    name: year
    label: {da: null, en: "Register year"}
    type: integer
    role: date
    origin: tooling
    added_by: fastreg
    provenance:
      source_type: server_verified
      guide_page: register-reference.qmd
      verified_on: 2026-09-01
      verified_by: "Sara Schwartz"
      verified_against: "fastreg's parquet conversion - confirmed for aar/year across registers"
    reader_note: >-
      Not a DST variable. It comes from fastreg's parquet conversion, which
      concatenates the yearly deliveries, so it exists in the data you read but
      not in DST's own documentation of this register.
