# AKM - labour classification module. Bootstrapped from DST's variable list.
# DST lists 45+ variables; only the subset the guide references is structured.

id: akm
name: "Arbejdsklassifikationsmodulet (labour classification module)"
family: null
scope: dst
description: >-
  One record per person per year with their socioeconomic classification:
  employed, self-employed, student, unemployed, pensioner, outside the labour
  market.
source_url: https://www.dst.dk/extranet/ForskningVariabellister/AKM%20-%20Arbejdsklassifikationsmodulet.html

update_cadence: annual
reference_timing: event
coverage:
  from: 1976
  to: 2024

deprecated: false
superseded_by: null
join_keys: [pnr]
relationships: []

columns:
  - id: pnr
    name: pnr
    label: {da: "Personnummer", en: "Personal identifier"}
    type: character
    role: join_key
    key: true
    origin: dst
    coverage: {from: 1976, to: 2024}
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/AKM%20-%20Arbejdsklassifikationsmodulet.html
      source_type: dst_variable_list
      verified_on: 2026-08-31
      verified_against: "DST variable list AKM"

  - id: socio13
    name: socio13
    label:
      da: "Socioøkonomisk klassifikation version 2013 (AKM)"
      en: "Socioeconomic classification, 2013 version"
    type: integer
    role: code
    key: true
    origin: dst
    code_system: socio13
    coverage: {from: 1991, to: 2024}
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/AKM%20-%20Arbejdsklassifikationsmodulet.html
      source_type: dst_variable_list
      verified_on: 2026-08-31
      verified_against: "DST variable list AKM"
      guide_page: register-reference.qmd
    reader_note: >-
      This is the version to use. It runs from 1991, so it reaches back further
      than its name suggests and covers the periods of the three older versions
      as well.

  - id: socio02
    name: socio02
    label:
      da: "Socioøkonomisk klassifikation fra 2002 (AKM)"
      en: "Socioeconomic classification, 2002 version"
    type: integer
    role: code
    key: true
    origin: dst
    code_system: socio13
    coverage: {from: 2002, to: 2013}
    superseded_by: socio13
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/AKM%20-%20Arbejdsklassifikationsmodulet.html
      source_type: dst_variable_list
      verified_on: 2026-08-31
      verified_against: "DST variable list AKM"

  - id: socio
    name: socio
    label:
      da: "Socioøkonomisk klassifikation fra 1994 til 2001 (AKM)"
      en: "Socioeconomic classification, 1994-2001 version"
    type: integer
    role: code
    key: true
    origin: dst
    code_system: socio13
    coverage: {from: 1994, to: 2001}
    superseded_by: socio02
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/AKM%20-%20Arbejdsklassifikationsmodulet.html
      source_type: dst_variable_list
      verified_on: 2026-08-31
      verified_against: "DST variable list AKM"

  - id: socio_gl
    name: socio_gl
    label:
      da: "Socioøkonomisk klassifikation fra 1976 til 1990"
      en: "Socioeconomic classification, 1976-1990 version"
    type: integer
    role: code
    key: true
    origin: dst
    code_system: socio13
    coverage: {from: 1976, to: 1990}
    superseded_by: socio
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/AKM%20-%20Arbejdsklassifikationsmodulet.html
      source_type: dst_variable_list
      verified_on: 2026-08-31
      verified_against: "DST variable list AKM"

  - id: beskst13
    name: beskst13
    label:
      da: "Kode for personens væsentligste indkomst-kilde (INDKOMST/AKM)"
      en: "Main source of income"
    type: integer
    role: code
    origin: dst
    coverage: {from: 1991, to: 2024}
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/AKM%20-%20Arbejdsklassifikationsmodulet.html
      source_type: dst_variable_list
      verified_on: 2026-08-31
      verified_against: "DST variable list AKM"
    reader_note: >-
      A different question from socio13: where the money came from, rather than
      what the person's labour market position was. The value set has not been
      sourced.

  - id: year
    name: year
    label: {da: null, en: "Register year"}
    type: integer
    role: date
    key: true
    origin: tooling
    added_by: fastreg
    provenance:
      source_type: server_verified
      guide_page: register-reference.qmd
      verified_on: 2026-09-01
      verified_by: "Sara Schwartz"
      verified_against: "colnames() via both read_register() and load_database() - both return year"
    reader_note: >-
      Not a DST variable. It comes from fastreg's parquet conversion, which
      concatenates the yearly deliveries, so it exists in the data you read but
      not in DST's own documentation of this register.
  - id: disco08_alle_indk_13
    name: disco08_alle_indk_13
    label: {da: "Fagkode for vaesentligste beskaeftigelse i aaret", en: "Occupation code, DISCO-08"}
    type: character
    role: code
    origin: dst
    coverage: {from: 2010, to: 2024}
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/AKM%20-%20Arbejdsklassifikationsmodulet.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list, including the per-variable year range"
    reader_note: >-
      Occupation, not socioeconomic position. DISCO-08 only starts in 2010;
      1991-2009 uses the older disco_alle_indk_13 with a different code set,
      so an occupation series across 2010 is not continuous.
  - id: nace_db07_13
    name: nace_db07_13
    label: {da: "Branche for vaesentligste beskaeftigelse", en: "Industry, DB07"}
    type: character
    role: code
    origin: dst
    coverage: {from: 2007, to: 2024}
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/AKM%20-%20Arbejdsklassifikationsmodulet.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list, including the per-variable year range"
    reader_note: >-
      Industry classification from 2007. The pre-2007 series uses nace_13,
      which is a different classification rather than a renamed one.
  - id: alder_ult_ink
    name: alder_ult_ink
    label: {da: "Personens alder paa referencetidspunktet, 31.12.", en: "Age at 31 December"}
    type: integer
    role: value
    origin: dst
    coverage: {from: 1991, to: 2024}
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/AKM%20-%20Arbejdsklassifikationsmodulet.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list, including the per-variable year range"
    reader_note: >-
      Age at the end of the year, not at your index date. Recompute from a
      birth date if the exact age matters.
