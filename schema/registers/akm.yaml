      verified_on: 2026-09-01
      verified_against: "DST variable list, including the per-variable year range"
      type_inferred: true
    reader_note: >-
      Occupation, not socioeconomic position. DISCO-08 only starts in 2010;
      1991-2009 uses the older disco_alle_indk_13 with a different code set,
      so an occupation series across 2010 is not continuous.
