      source_type: dst_documentation
      verified_on: 2026-09-12
      verified_against: "Kolonner sheet: 1 = tied to the mother's own prioritised birth contact/record, 0 = other."
    reader_note: "Filter to `== 1` to reproduce Nyfoedte's own choice, same logic as the other satellite tables."
  - id: dw_ek_kontakt
    name: DW_EK_Kontakt
