# Mirror of mfr_barn_diagnoser.yaml for the mother: one row per diagnosis/
# contact-reason/add-on code attached to a pregnancy or birth contact for
# the mother. Join to mfr_nyfoedte via DW_EK_Foedsel.

id: mfr_mor_diagnoser
hide_from_overview: true
name: "Mor_Diagnoser - MFR 2019+ satellite table"
scope: sds
family: mfr2019
reference_timing: event
one_row_per: event_from_person
description: >-
  One row per diagnosis, contact reason, or diagnosis add-on code for the
  mother, tied to a contact from the start of pregnancy through 42 days
  after birth. Structurally the same idea as mfr_barn_diagnoser, mirroring
  lpr_a_diagnose. `tobaksforbrug`'s DUT* codes are add-on rows in this exact
  table (DiagnoseType = "+").
source_url: https://sundhedsdatastyrelsen.dk/data-og-registre/nationale-sundhedsregistre/foedselsregisteret
coverage: {from: 2019, to: 2026}

join_keys: [DW_EK_Foedsel]
relationships:
  - to: mfr_nyfoedte
    key: DW_EK_Foedsel
    to_key: DW_EK_Foedsel
    cardinality: many_to_one
  - to: mfr_mor_kontakter
    key: DW_EK_Kontakt
    to_key: DW_EK_Kontakt
    cardinality: many_to_one
  - to: mfr_mor_forloeb
    key: DW_EK_Forloeb
    to_key: DW_EK_Forloeb
    cardinality: many_to_one

columns:
  - id: dw_ek_foedsel
    name: DW_EK_Foedsel
    label: {da: null, en: "Birth event key"}
    type: character
    role: join_key
    key: true
    origin: dst
    provenance:
      source_url: https://sundhedsdatastyrelsen.dk/Media/638650989728109987/Dokumentation_Foedselsregisteret_2019_og_frem.xlsx
      source_type: dst_documentation
      verified_on: 2026-09-12
      verified_against: "Kolonner sheet."
  - id: diagnosekode
    name: DiagnoseKode
    label: {da: null, en: "Diagnosis, contact-reason, or add-on code"}
    type: character
    role: code
    key: true
    origin: dst
    code_system: icd10
    provenance:
      source_url: https://sundhedsdatastyrelsen.dk/Media/638650989728109987/Dokumentation_Foedselsregisteret_2019_og_frem.xlsx
      source_type: dst_documentation
      verified_on: 2026-09-12
      verified_against: "Kolonner sheet: e.g. DZ340 (diagnosis), DUT00 (smoking add-on) or ALCC90 (contact reason)."
    reader_note: >-
      Same caveat as mfr_barn_diagnoser.yaml's DiagnoseKode: `code_system:
      icd10` fits only the diagnosis case. Check DiagnoseType first.
  - id: diagnosetype
    name: DiagnoseType
    label: {da: null, en: "Diagnosis role"}
    type: character
    role: code
    key: true
    origin: dst
    code_system: mfr_diagnose_type
    provenance:
      source_url: https://sundhedsdatastyrelsen.dk/Media/638650989728109987/Dokumentation_Foedselsregisteret_2019_og_frem.xlsx
      source_type: dst_documentation
      verified_on: 2026-09-12
      verified_against: "Kolonner sheet, identical to mfr_barn_diagnoser.yaml's DiagnoseType."
  - id: diagnosetype_tekst
    name: DiagnoseType_Tekst
    label: {da: null, en: "Diagnosis role (text)"}
    type: character
    role: derived
    origin: dst
    provenance:
      source_url: https://sundhedsdatastyrelsen.dk/Media/638650989728109987/Dokumentation_Foedselsregisteret_2019_og_frem.xlsx
      source_type: dst_documentation
      verified_on: 2026-09-12
      verified_against: "Kolonner sheet."
  - id: senereafkraeftet
    name: SenereAfkraeftet
    label: {da: null, en: "Later disproven"}
    type: character
    role: code
    origin: dst
    provenance:
      source_url: https://sundhedsdatastyrelsen.dk/Media/638650989728109987/Dokumentation_Foedselsregisteret_2019_og_frem.xlsx
      source_type: dst_documentation
      verified_on: 2026-09-12
      verified_against: "Kolonner sheet: Ja/Nej, same pre-LPR3 default-to-'Nej' caveat as mfr_barn_diagnoser.yaml."
  - id: diagnosekode_parent
    name: DiagnoseKode_Parent
    label: {da: null, en: "Parent diagnosis code (when DiagnoseType = +)"}
    type: character
    role: code
    origin: dst
    code_system: icd10
    provenance:
      source_url: https://sundhedsdatastyrelsen.dk/Media/638650989728109987/Dokumentation_Foedselsregisteret_2019_og_frem.xlsx
      source_type: dst_documentation
      verified_on: 2026-09-12
      verified_against: "Kolonner sheet: e.g. DO800 or DO720, only relevant when DiagnoseType = '+'."
  - id: diagnosetype_parent
    name: DiagnoseType_Parent
    label: {da: null, en: "Role of the parent diagnosis (when DiagnoseType = +)"}
    type: character
    role: code
    origin: dst
    code_system: mfr_diagnose_type
    provenance:
      source_url: https://sundhedsdatastyrelsen.dk/Media/638650989728109987/Dokumentation_Foedselsregisteret_2019_og_frem.xlsx
      source_type: dst_documentation
      verified_on: 2026-09-12
      verified_against: "Kolonner sheet: only relevant when DiagnoseType = '+'."
    reader_note: "Narrower set (A/B/C/G/H/M only), same as mfr_barn_diagnoser.yaml's DiagnoseType_Parent."
  - id: diagnosetype_parent_tekst
    name: DiagnoseType_Parent_Tekst
    label: {da: null, en: "Role of the parent diagnosis, text (when DiagnoseType = +)"}
    type: character
    role: derived
    origin: dst
    provenance:
      source_url: https://sundhedsdatastyrelsen.dk/Media/638650989728109987/Dokumentation_Foedselsregisteret_2019_og_frem.xlsx
      source_type: dst_documentation
      verified_on: 2026-09-12
      verified_against: "Kolonner sheet: only relevant when DiagnoseType = '+'."
  - id: senereafkraeftet_parent
    name: SenereAfkraeftet_Parent
    label: {da: null, en: "Whether the parent diagnosis was later disproven (when DiagnoseType = +)"}
    type: character
    role: code
    origin: dst
    provenance:
      source_url: https://sundhedsdatastyrelsen.dk/Media/638650989728109987/Dokumentation_Foedselsregisteret_2019_og_frem.xlsx
      source_type: dst_documentation
      verified_on: 2026-09-12
      verified_against: "Kolonner sheet: Ja/Nej, only relevant when DiagnoseType = '+'."
  - id: aktionsdiagnose
    name: AktionsDiagnose
    label: {da: null, en: "Action diagnosis of the contact this row belongs to"}
    type: character
    role: code
    origin: dst
    code_system: icd10
    provenance:
      source_url: https://sundhedsdatastyrelsen.dk/Media/638650989728109987/Dokumentation_Foedselsregisteret_2019_og_frem.xlsx
      source_type: dst_documentation
      verified_on: 2026-09-12
      verified_against: "Kolonner sheet."
  - id: startdato_kontakt
    name: StartDato_Kontakt
    label: {da: null, en: "Start date of the contact this row belongs to"}
    type: date
    role: date
    origin: dst
    provenance:
      source_url: https://sundhedsdatastyrelsen.dk/Media/638650989728109987/Dokumentation_Foedselsregisteret_2019_og_frem.xlsx
      source_type: dst_documentation
      verified_on: 2026-09-12
      verified_against: "Kolonner sheet."
