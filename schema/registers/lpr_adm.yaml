    reader_note: >-
      Used together with c_pattype to separate emergency-room contacts from
      ordinary outpatient ones after about 2014, see the LPR extraction
      chapter. Available for the register's whole span, so a missing c_indm is
      an extract boundary rather than a coverage gap.
