      verified_on: 2026-09-01
      verified_against: "DST variable list"
  - id: c_adiag
    name: c_adiag
    label: {da: "Aktionsdiagnose", en: "Action diagnosis"}
    type: character
    role: code
    origin: dst
    code_system: icd10
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/LPR_ADM%20-%20Landspatientregistret%20-%20administrative%20oplysninger.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list"
    reader_note: >-
      A copy of the contact's action diagnosis. Use lpr_diag instead: it holds
      every diagnosis on the contact, not only the action one.
  - id: v_alder
    name: v_alder
