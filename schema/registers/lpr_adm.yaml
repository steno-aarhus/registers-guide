    reader_note: >-
      Before 2005, the same fact (a contact's last-update date) lived in
      its own table, LPR_OPDTDTO, covering 2000-2004 - not modelled as a
      separate register here since Sundhedsdatastyrelsen's own LPR
      documentation (esundhed.dk, table t_opdatdto) confirms the fact
      simply moved onto lpr_adm from 2005 onward. A study needing this
      fact before 2005 has no column to read it from; DST's order list
      shows no earlier source. From 2005. Sundhedsdatastyrelsen keeps the
      update dates for 2000-2004 in a separate table (t_opdatdto).
