# LPR_ADM - LPR2 contacts. Coverage, the LPR3 boundary and the deprecation are
# inherited from families/lpr2_somatic.yaml.

id: lpr_adm
name: "Landspatientregistret - administrative oplysninger"
family: lpr2_somatic
scope: dst
reference_timing: event
description: >-
  One row per hospital contact. This is the only LPR2 dataset that carries pnr,
  so every other one reaches the person through it.
source_url: https://www.dst.dk/extranet/ForskningVariabellister/LPR_ADM%20-%20Landspatientregistret%20-%20administrative%20oplysninger.html

join_keys: [recnum]
relationships:
  - to: lpr_diag
    key: recnum
    cardinality: one_to_many

columns:
  - id: recnum
    name: recnum
    label: {da: "LPR-identnummer", en: "Contact identifier"}
    type: character
    role: join_key
    coverage: {from: 1977, to: 2019}
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/LPR_ADM%20-%20Landspatientregistret%20-%20administrative%20oplysninger.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list"
      type_source: "https://www.esundhed.dk/Dokumentation/DocumentationExtended?id=5, Format Lokale Koder, Laengde 0"
    reader_note: >-
      The key every other LPR2 dataset joins on. It identifies a contact,
      not a person.
  - id: pnr
    name: pnr
    label: {da: "Personnummer", en: "Personal identifier"}
    type: character
    role: identifier
    coverage: {from: 1977, to: 2019}
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/LPR_ADM%20-%20Landspatientregistret%20-%20administrative%20oplysninger.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list"
      type_source: "https://www.esundhed.dk/Dokumentation/DocumentationExtended?id=5, Format Numerisk, Laengde 10"
  - id: d_inddto
    name: d_inddto
    label: {da: "Indlæggelsesdato", en: "Date of admission"}
    type: date
    role: date
    coverage: {from: 1977, to: 2019}
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/LPR_ADM%20-%20Landspatientregistret%20-%20administrative%20oplysninger.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list"
      type_source: "https://www.esundhed.dk/Dokumentation/DocumentationExtended?id=5, Format Dato, Laengde 8"
    reader_note: >-
      Use this as the contact date. It is the admission date, so for an outpatient
      course it is the date the course started, not the date of a particular visit.
  - id: d_uddto
    name: d_uddto
    label: {da: "Udskrivningsdato", en: "Date of discharge"}
