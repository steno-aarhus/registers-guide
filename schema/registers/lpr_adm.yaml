# LPR_ADM - LPR2 contacts. Coverage, the LPR3 boundary and the deprecation are
# inherited from families/lpr2_somatic.yaml.

id: lpr_adm
name: "Landspatientregistret - administrative oplysninger"
family: lpr2_somatic
scope: dst
reference_timing: event
one_row_per: event_from_person
description: >-
  One row per hospital contact. This is the only LPR2 dataset that carries pnr,
  so every other one reaches the person through it.
source_url: https://www.dst.dk/extranet/ForskningVariabellister/LPR_ADM%20-%20Landspatientregistret%20-%20administrative%20oplysninger.html

join_keys: [recnum]
relationships:
  - to: lpr_diag
    key: recnum
    cardinality: one_to_many

columns:
  - id: recnum
    name: recnum
    label: {da: "LPR-identnummer", en: "Contact identifier"}
    type: character
    role: join_key
    coverage: {from: 1977, to: 2019}
    key: true
    origin: dst
    provenance:
      source_url: https://www.esundhed.dk/Dokumentation/DocumentationExtended?id=5
      source_type: esundhed_kodeark
      verified_on: 2026-10-01
      verified_against: "Sundhedsdatastyrelsen's documentation of Landspatientregisteret (DocumentationExtended?id=5), table t_adm, variable v_recnum"
      type_source: "https://www.esundhed.dk/Dokumentation/DocumentationExtended?id=5, Format Lokale Koder, Laengde 0"
    reader_note: >-
      The key every other LPR2 dataset joins on. It identifies a contact,
      not a person.

      Sundhedsdatastyrelsen states that recnum is unique only within one
      update of the register. A contact can get a new recnum when the
      register is updated, and a recnum can be reused for a different
      contact. Join tables only within the same delivery, and never store
      recnum as a lasting id for a contact.
  - id: pnr
    name: pnr
    label: {da: "Personnummer", en: "Personal identifier"}
    type: character
    role: identifier
    coverage: {from: 1977, to: 2019}
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/LPR_ADM%20-%20Landspatientregistret%20-%20administrative%20oplysninger.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list"
      type_source: "https://www.esundhed.dk/Dokumentation/DocumentationExtended?id=5, Format Numerisk, Laengde 10"
  - id: d_inddto
    name: d_inddto
    label: {da: "Indlæggelsesdato", en: "Date of admission"}
    type: date
    role: date
    coverage: {from: 1977, to: 2019}
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/LPR_ADM%20-%20Landspatientregistret%20-%20administrative%20oplysninger.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list"
      type_source: "https://www.esundhed.dk/Dokumentation/DocumentationExtended?id=5, Format Dato, Laengde 8"
    reader_note: >-
      Use this as the contact date. It is the admission date, so for an outpatient
      course it is the date the course started, not the date of a particular visit.
  - id: d_uddto
    name: d_uddto
    label: {da: "Udskrivningsdato", en: "Date of discharge"}
    type: date
    role: date
    coverage: {from: 1977, to: 2019}
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/LPR_ADM%20-%20Landspatientregistret%20-%20administrative%20oplysninger.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list"
      type_source: "https://www.esundhed.dk/Dokumentation/DocumentationExtended?id=5, Format Dato, Laengde 8"
  - id: c_pattype
    name: c_pattype
    label: {da: "Patienttype", en: "Patient type"}
    type: character
    role: code
    coverage: {from: 1977, to: 2019}
    code_system: pattype
    key: true
    origin: dst
    provenance:
      source_url: https://www.esundhed.dk/Dokumentation/DocumentationExtended?id=5
      source_type: esundhed_kodeark
      verified_on: 2026-09-30
      verified_against: "Sundhedsdatastyrelsen's documentation of Landspatientregisteret (DocumentationExtended?id=5, PDF export), matched to this DST column on name and label"
      type_source: "https://www.esundhed.dk/Dokumentation/DocumentationExtended?id=5, Format Lokale Koder, Laengde 1"
    reader_note: >-
      Until 1993 only patient type 0 (inpatient) was recorded. Day patient
      (1) was discontinued in 2002, and hospitals then recorded those
      patients differently (some as outpatients, some as inpatients).
      Emergency room patient (3) was discontinued in 2014 and replaced by
      outpatient (2) with acute admission (c_indm = 1).
