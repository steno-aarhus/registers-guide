# LPR_ADM - LPR2 contacts. Coverage, the LPR3 boundary and the deprecation are
# inherited from families/lpr2_somatic.yaml.

id: lpr_adm
name: "Landspatientregistret - administrative oplysninger"
family: lpr2_somatic
scope: dst
reference_timing: event
description: >-
  One row per hospital contact. This is the only LPR2 dataset that carries pnr,
  so every other one reaches the person through it.
source_url: https://www.dst.dk/extranet/ForskningVariabellister/LPR_ADM%20-%20Landspatientregistret%20-%20administrative%20oplysninger.html

join_keys: [recnum]
relationships:
  - to: lpr_diag
    key: recnum
    cardinality: one_to_many

columns:
  - id: recnum
    name: recnum
    label: {da: "LPR-identnummer", en: "Contact identifier"}
    type: character
    role: join_key
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/LPR_ADM%20-%20Landspatientregistret%20-%20administrative%20oplysninger.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list"
    reader_note: >-
      The key every other LPR2 dataset joins on. It identifies a contact,
      not a person.
  - id: pnr
    name: pnr
    label: {da: "Personnummer", en: "Personal identifier"}
    type: character
    role: identifier
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/LPR_ADM%20-%20Landspatientregistret%20-%20administrative%20oplysninger.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list"
  - id: d_inddto
    name: d_inddto
    label: {da: "Indlæggelsesdato", en: "Date of admission"}
    type: date
    role: date
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/LPR_ADM%20-%20Landspatientregistret%20-%20administrative%20oplysninger.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list"
    reader_note: >-
      Use this as the contact date. It is the admission date, so for an outpatient
      course it is the date the course started, not the date of a particular visit.
  - id: d_uddto
    name: d_uddto
    label: {da: "Udskrivningsdato", en: "Date of discharge"}
    type: date
    role: date
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/LPR_ADM%20-%20Landspatientregistret%20-%20administrative%20oplysninger.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list"
  - id: c_pattype
    name: c_pattype
    label: {da: "Patienttype", en: "Patient type"}
    type: character
    role: code
    code_system: pattype
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/LPR_ADM%20-%20Landspatientregistret%20-%20administrative%20oplysninger.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list"
  - id: c_spec
    name: c_spec
    label: {da: "Specialekode", en: "Specialty"}
    type: character
    role: code
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/LPR_ADM%20-%20Landspatientregistret%20-%20administrative%20oplysninger.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list"
    reader_note: >-
      DST publishes what each specialty code means in its department and specialty
      overview: https://www.dst.dk/da/Statistik/dokumentation/Times/moduldata-for-sociale-forhold--sundhedsvaesen--retsvaesen/spec
      (in Danish). The codes are not self-explanatory, so look them up rather
      than grouping on the digits.
  - id: c_sgh
    name: c_sgh
    label: {da: "Sygehus", en: "Hospital"}
    type: character
    role: code
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/LPR_ADM%20-%20Landspatientregistret%20-%20administrative%20oplysninger.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list"
  - id: c_afd
    name: c_afd
    label: {da: "Afdelingskode", en: "Department"}
    type: character
    role: code
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/LPR_ADM%20-%20Landspatientregistret%20-%20administrative%20oplysninger.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list"
  - id: c_adiag
    name: c_adiag
    label: {da: "Aktionsdiagnose", en: "Action diagnosis"}
    type: character
    role: code
    key: true
    origin: dst
    code_system: icd10
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/LPR_ADM%20-%20Landspatientregistret%20-%20administrative%20oplysninger.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list"
    reader_note: >-
      A copy of the contact's action diagnosis. Use lpr_diag instead: it holds
      every diagnosis on the contact, not only the action one.
  - id: v_alder
    name: v_alder
    label: {da: "Alder i år ved kontaktens start", en: "Age at the start of the contact"}
    type: integer
    role: value
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/LPR_ADM%20-%20Landspatientregistret%20-%20administrative%20oplysninger.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list"
  - id: c_indm
    name: c_indm
    label: {da: "Indlaeggelsesmaade", en: "Admission mode"}
    type: character
    role: code
    key: true
    origin: dst
    coverage: {from: 1977, to: 2019}
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/LPR_ADM%20-%20Landspatientregistret%20-%20administrative%20oplysninger.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list, including the per-variable year range"
    reader_note: >-
      Used together with c_pattype to separate emergency-room contacts from
      ordinary outpatient ones after about 2014, see the LPR extraction
      chapter. Available for the register's whole span, so a missing c_indm is
      an extract boundary rather than a coverage gap.
  - id: c_udm
    name: c_udm
    label: {da: "Udskrivningsmaade", en: "Discharge mode"}
    type: character
    role: code
    origin: dst
    coverage: {from: 1987, to: 2019}
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/LPR_ADM%20-%20Landspatientregistret%20-%20administrative%20oplysninger.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list, including the per-variable year range"
    reader_note: >-
      Starts in 1987, ten years after the register itself.
  - id: c_henm
    name: c_henm
    label: {da: "Henvisningsmaade", en: "Referral mode"}
    type: character
    role: code
    origin: dst
    coverage: {from: 1987, to: 2019}
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/LPR_ADM%20-%20Landspatientregistret%20-%20administrative%20oplysninger.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list, including the per-variable year range"
  - id: c_kontaars
    name: c_kontaars
    label: {da: "Kontaktaarsag", en: "Reason for the contact"}
    type: character
    role: code
    origin: dst
    coverage: {from: 1987, to: 2019}
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/LPR_ADM%20-%20Landspatientregistret%20-%20administrative%20oplysninger.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list, including the per-variable year range"
  - id: c_bopamt
    name: c_bopamt
    label: {da: "Bopaelsamt", en: "County of residence"}
    type: character
    role: code
    origin: dst
    coverage: {from: 1977, to: 2004}
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/LPR_ADM%20-%20Landspatientregistret%20-%20administrative%20oplysninger.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list, including the per-variable year range"
    reader_note: >-
      Ends with the counties themselves: the 2007 local government reform is
      already visible here in 2004/2005, where c_bopamt stops and c_amt
      starts. Neither covers the whole register, so a geographic analysis
      spanning that point needs both.
  - id: c_amt
    name: c_amt
    label: {da: "Amt", en: "County"}
    type: character
    role: code
    origin: dst
    coverage: {from: 2005, to: 2019}
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/LPR_ADM%20-%20Landspatientregistret%20-%20administrative%20oplysninger.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list, including the per-variable year range"
  - id: v_sengdage
    name: v_sengdage
    label: {da: "Sengedage", en: "Bed days"}
    type: numeric
    role: value
    origin: dst
    coverage: {from: 1994, to: 2019}
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/LPR_ADM%20-%20Landspatientregistret%20-%20administrative%20oplysninger.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list, including the per-variable year range"
    reader_note: >-
      Starts in 1994. Before that, compute the stay from d_inddto and d_uddto
      instead.
  - id: v_behdage
    name: v_behdage
    label: {da: "Behandlingsdage", en: "Treatment days"}
    type: numeric
    role: value
    origin: dst
    coverage: {from: 1977, to: 2001}
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/LPR_ADM%20-%20Landspatientregistret%20-%20administrative%20oplysninger.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list, including the per-variable year range"
    reader_note: >-
      Ends in 2001.
  - id: year
    name: year
    label: {da: null, en: "Register year"}
    type: integer
    role: date
    key: true
    origin: tooling
    added_by: parquet conversion
    provenance:
      source_type: server_verified
      verified_on: 2026-09-01
      verified_by: "Sara Schwartz"
      verified_against: "colnames() on the parquet"
    reader_note: >-
      Not a DST variable. It is the partition the yearly deliveries were written
      into, so filtering on it stops the other years being read at all. Use it to
      limit how much is read, not to decide when something happened: for that,
      use the register's own date column.
