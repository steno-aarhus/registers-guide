      verified_against: "DST variable list"
      type_source: "https://www.esundhed.dk/Dokumentation/DocumentationExtended?id=5, Format Klassificerede koder, Laengde 3"
    reader_note: >-
      DST publishes what each specialty code means in its department and specialty
      overview: https://www.dst.dk/da/Statistik/dokumentation/Times/moduldata-for-sociale-forhold--sundhedsvaesen--retsvaesen/spec
      (in Danish). The codes are not self-explanatory, so look them up rather
      than grouping on the digits.
