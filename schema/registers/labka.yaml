# LABKA - a REGIONAL laboratory research database, held by the Department of
# Clinical Epidemiology at Aarhus University Hospital. Not DST, not
# Sundhedsdatastyrelsen: a separate institution with its own application
# process, entirely outside Forskerservice. See scope: external in
# schema/R/validate_schema.R.
#
# Covers only the Central Denmark Region and the North Denmark Region (about
# a third of the population), not the whole country - the national
# equivalent on this guide is lab_dm_forsker (RLRR, held by
# Sundhedsdatastyrelsen). Its selling point over that national register is
# history: LABKA is complete from 2005, with partial coverage back to the
# late 1990s for parts of the two regions, against the national register's
# 2008 start.
#
# IMPORTANT - weaker sourcing than the rest of this schema: unlike a DST or
# SDS register, there is no published variable list or data dictionary to
# check column names against. Everything below is read off the description
# in Arendt et al. 2020 (a review of Danish lab databases) and Grann et al.
# 2011 (the original LABKA database paper), which describe what data exists,
# not the literal field names in a delivery. Every column is marked
# `source_type: unverified` for exactly this reason. Sara has her own LABKA
# access - confirm the real column names and current coverage end date
# against that before treating this file as solid.

id: labka
name: "LABKA-forskningsdatabasen"
scope: external
reference_timing: event
one_row_per: event_from_person
update_cadence: continuous
description: >-
  One row per laboratory test result from hospitals and general practice in
  the Central and North Denmark regions. Regional, not national - see the
  note above for how it relates to lab_dm_forsker.
source_url: https://doi.org/10.2147/CLEP.S245060
# Coverage end year is NOT sourced - the literature describes the database as
# ongoing but does not state a current cutoff. Confirm against your own
# access rather than trusting this value.
coverage: {from: 2005, to: 2025}

deprecated: false
superseded_by: null
join_keys: [cpr]

columns:
  - id: cpr
    name: cpr
    label: {da: "CPR-nummer", en: "Personal identifier"}
    type: character
    role: join_key
    key: true
    origin: dst
    provenance:
      source_url: https://doi.org/10.2147/CLEP.S245060
      source_type: unverified
      type_inferred: true
    reader_note: >-
      Described in the literature as the CPR number, not necessarily
      delivered in the same pseudonymised `pnr` form as a DST register.
      Confirm how it arrives, and what encryption/pseudonymisation applies,
      before joining it to anything else in your project.

  - id: samplingdate
    name: samplingdate
    label: {da: "Prøvetagningsdato", en: "Sampling date"}
    type: date
    role: date
    key: true
    origin: dst
    provenance:
      source_url: https://doi.org/10.2147/CLEP.S245060
      source_type: unverified
      type_inferred: true

  - id: samplingtime
    name: samplingtime
    label: {da: "Prøvetagningstidspunkt", en: "Sampling time"}
    type: character
    role: value
    origin: dst
    provenance:
      source_url: https://doi.org/10.2147/CLEP.S245060
      source_type: unverified
      type_inferred: true
    reader_note: >-
      Reported to the hour and minute, per Arendt et al. 2020.

  - id: analysiscode
    name: analysiscode
    label: {da: "Analysekode", en: "Analyte code"}
    type: character
    role: code
    key: true
    origin: dst
    provenance:
      source_url: https://doi.org/10.2147/CLEP.S245060
      source_type: unverified
      type_inferred: true
    reader_note: >-
      NPU, the Danish DNK modification of it, or a laboratory's own local
      code - the same three-way split as the national laboratory register
      (see [Laboratory results](register-reference.qmd#lab-forsker)).

  - id: biomarker_name
    name: biomarker_name
    label: {da: "Analysenavn", en: "Biomarker name"}
    type: character
    role: value
    origin: dst
    provenance:
      source_url: https://doi.org/10.2147/CLEP.S245060
      source_type: unverified
      type_inferred: true
    reader_note: >-
      A text name alongside the code, per Arendt et al. 2020. The national
      register has no equivalent column.

  - id: value
    name: value
    label: {da: "Resultat", en: "Result"}
    type: character
    role: value
    key: true
    origin: dst
    provenance:
      source_url: https://doi.org/10.2147/CLEP.S245060
      source_type: unverified
      type_inferred: true
    reader_note: >-
      Numeric results and text-written non-numeric results both, same
      pitfall as the national register: do not `as.numeric()` this column
      without splitting the two first.

  - id: unit
    name: unit
    label: {da: "Enhed", en: "Unit"}
    type: character
    role: code
    key: true
    origin: dst
    provenance:
      source_url: https://doi.org/10.2147/CLEP.S245060
      source_type: unverified
      type_inferred: true

  - id: referenceinterval_lowerlimit
    name: referenceinterval_lowerlimit
    label: {da: "Referenceinterval, nedre grænse", en: "Reference interval, lower limit"}
    type: character
    role: value
    origin: dst
    provenance:
      source_url: https://doi.org/10.2147/CLEP.S245060
      source_type: unverified
      type_inferred: true

  - id: referenceinterval_upperlimit
    name: referenceinterval_upperlimit
    label: {da: "Referenceinterval, øvre grænse", en: "Reference interval, upper limit"}
    type: character
    role: value
    origin: dst
    provenance:
      source_url: https://doi.org/10.2147/CLEP.S245060
      source_type: unverified
      type_inferred: true

  - id: laboratorium_id
    name: laboratorium_id
    label: {da: "Laboratorie-id", en: "Laboratory identifier"}
    type: character
    role: code
    origin: dst
    provenance:
      source_url: https://doi.org/10.2147/CLEP.S245060
      source_type: unverified
      type_inferred: true

  - id: rekvirent_id
    name: rekvirent_id
    label: {da: "Rekvirent-id", en: "Requester identifier"}
    type: character
    role: code
    origin: dst
    provenance:
      source_url: https://doi.org/10.2147/CLEP.S245060
      source_type: unverified
      type_inferred: true
