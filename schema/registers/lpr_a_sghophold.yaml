# LPR_A_SGHOPHOLD - hospital STAY ("sygehusophold"), a level above the
# individual contact: groups multiple related lpr_a_kontakt rows into one
# admission episode. A genuinely new concept versus what lpr_a_kontakt/
# lpr_a_diagnose/lpr_a_procregistrering already covered, not a rename of
# something already in this schema. Found by cross-checking DST's full
# order list (Bestillingsliste.xlsx) against the schema on 2026-09-12.

id: lpr_a_sghophold
hide_from_overview: true
name: "LPR_A_SGHOPHOLD - Landspatientregistret (LPR3) - sygehusophold"
family: lpr3
scope: dst
reference_timing: event
one_row_per: event_from_person
description: >-
  One row per hospital stay, grouping the contacts (lpr_a_kontakt) that
  belong to one continuous admission episode. ANTAL_KONT_SGH_OPH gives how
  many contacts were grouped into it.
source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
coverage: {from: 2025, to: 2025}

join_keys: [PNR]
relationships:
  - to: bef
    key: PNR
    to_key: pnr
    cardinality: many_to_one
    provenance:
      source_type: inferred
      verified_on: 2026-09-12
  - to: lpr_a_kontakt
    key: DW_EK_KONTAKT_FOERSTE
    to_key: DW_EK_Kontakt
    cardinality: one_to_one
    provenance:
      source_type: inferred
      verified_on: 2026-09-12

columns:
