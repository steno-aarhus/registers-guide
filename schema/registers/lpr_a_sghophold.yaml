      verified_against: "DST order list: name only, no label."
      type_inferred: true
    reader_note: "A surrogate key distinct from DW_EK_SYGEHUSOPHOLD - the SK/EK distinction is not documented, matching mfr_nyfoedte.yaml's own dw_sk_sygehusophold column on lpr_a_kontakt."
