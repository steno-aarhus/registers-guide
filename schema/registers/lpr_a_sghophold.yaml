reader_note: >-
  DST's own dedicated page for this register's sibling LPR_A_RESULTATER
  explicitly states "Ingen label" for every column - this register's
  thinness is confirmed current DST documentation practice. A hospital
  stay this table describes may span several lpr_a_kontakt rows
  (ANTAL_KONT_SGH_OPH says how many): summarising by contact rather than by
  stay double-counts anything that is really one continuous admission.
