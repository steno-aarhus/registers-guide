      verified_against: >-
        Kolonner sheet: "SKS-kode (fx RGAB00), heltal (antal, cm, kg eller
        ml) eller datotid (YYYYMMDDHHMMSS)" verbatim - narrower than
        mfr_barn_resultater's documented shapes (no boolean or free-text
        string case listed here), but treat that as what Sundhedsdatastyrelsen
        chose to document, not a guarantee no other shape occurs.
    reader_note: "Branch on `ResultatType` before parsing, same trap as mfr_barn_resultater.yaml's ResultatVaerdi."
