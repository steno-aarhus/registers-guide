      source_type: dst_documentation
      verified_on: 2026-09-12
      verified_against: "Kolonner sheet: RAS00 = Inkomplet, RAS01 = Komplet, same pre-LPR3 default as mfr_barn_resultater.yaml."
    reader_note: "See mfr_barn_resultater.yaml's ResultatIndberetningsStatus for the resolution-priority explanation - the same rule applies here for Vaegt_Mor, Hoejde_Mor and others."
  - id: resultattype
    name: ResultatType
