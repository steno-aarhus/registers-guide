# Mirror of mfr_barn_resultater.yaml for the mother: one row per reported
# clinical result (weight, height, BMI, smoking status, and more) tied to a
# pregnancy/birth contact or course element for the mother. Join to
# mfr_nyfoedte via DW_EK_Foedsel. Many of mfr_nyfoedte's own resolved
# columns for the mother (Vaegt_Mor, Hoejde_Mor, BMI_Mor, Paritet,
# Tobaksforbrug's RGAB* half) are built FROM rows in this exact table.

id: mfr_mor_resultater
hide_from_overview: true
name: "Mor_Resultater - MFR 2019+ satellite table"
scope: sds
family: mfr2019
reference_timing: event
one_row_per: event_from_person
description: >-
  One row per reported clinical result for the mother, tied to a contact or
  course element from the start of pregnancy through 42 days after birth.
  `ResultatVaerdi` is polymorphic, same as mfr_barn_resultater (though this
  table's documented value shapes omit the boolean/text-string cases seen
  there).
source_url: https://sundhedsdatastyrelsen.dk/data-og-registre/nationale-sundhedsregistre/foedselsregisteret
coverage: {from: 2019, to: 2026}

join_keys: [DW_EK_Foedsel]
relationships:
  - to: mfr_nyfoedte
    key: DW_EK_Foedsel
    to_key: DW_EK_Foedsel
    cardinality: many_to_one
  - to: mfr_mor_kontakter
    key: DW_EK_Kontakt
    to_key: DW_EK_Kontakt
    cardinality: many_to_one
  - to: mfr_mor_forloeb
    key: DW_EK_Forloeb
    to_key: DW_EK_Forloeb
    cardinality: many_to_one

columns:
  - id: dw_ek_foedsel
    name: DW_EK_Foedsel
    label: {da: null, en: "Birth event key"}
    type: character
    role: join_key
    key: true
    origin: dst
    provenance:
      source_url: https://sundhedsdatastyrelsen.dk/Media/638650989728109987/Dokumentation_Foedselsregisteret_2019_og_frem.xlsx
      source_type: dst_documentation
      verified_on: 2026-09-12
      verified_against: "Kolonner sheet."
  - id: resultatindberetningstype
    name: ResultatIndberetningsType
    label: {da: null, en: "Result-report type"}
    type: character
    role: code
    origin: dst
    provenance:
      source_url: https://sundhedsdatastyrelsen.dk/Media/638650989728109987/Dokumentation_Foedselsregisteret_2019_og_frem.xlsx
      source_type: dst_documentation
      verified_on: 2026-09-12
      verified_against: "Kolonner sheet: SKS code, e.g. RAA02."
  - id: resultatindberetningsstatus
