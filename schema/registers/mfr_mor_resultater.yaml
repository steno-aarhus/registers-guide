      source_type: dst_documentation
      verified_on: 2026-09-12
      verified_against: "Kolonner sheet: SKS code, e.g. RDA20 or RDA22, from the same RDAnn family as mfr_barn_resultater.yaml."
    reader_note: "No `code_system` attached, same reasoning as mfr_barn_resultater.yaml's ResultatType."
  - id: resultatvaerdi
