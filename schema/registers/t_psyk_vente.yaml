# PSYK_VENTE - the psychiatric counterpart of lpr_vente.yaml: waiting
# time. Register id uses the t_psyk_ prefix, matching t_psyk_adm.yaml/
# t_psyk_diag.yaml's own established convention. Missed when t_psyk_adm/
# t_psyk_diag were first built; found by cross-checking DST's full order
# list (Bestillingsliste.xlsx) against the schema on 2026-09-12.

id: t_psyk_vente
hide_from_overview: true
name: "PSYK_VENTE - Landspatientregistret psykiatri - ventetid"
family: lpr2_psychiatric
scope: dst
reference_timing: course
one_row_per: expand_from_parent
description: >-
  One row per waiting-time period tied to a psychiatric contact, with a
  status and a start/end date. Carries no pnr: join to t_psyk_adm on
  recnum to reach the person. Structurally identical to lpr_vente.yaml,
  its somatic counterpart.
source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
coverage: {from: 2004, to: 2019}

join_keys: [recnum]
relationships:
  - to: t_psyk_adm
    key: recnum
    cardinality: many_to_one

columns:
  - id: recnum
    name: recnum
    label: {da: "LPR-identnummer", en: "Contact identifier"}
    type: character
    role: join_key
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST order list: name only, no label. Label follows lpr_vente.yaml's own confirmed recnum label."
      type_inferred: true
  - id: c_vstatus
    name: c_vstatus
    label: {da: null, en: "Waiting period status code"}
    type: character
    role: code
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST order list: name only, no label."
      type_inferred: true
  - id: d_vsldto
    name: d_vsldto
    label: {da: null, en: "Waiting period end date"}
    type: date
    role: date
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST order list: name only, no label."
      type_inferred: true
    reader_note: "Read as the END date, following the SLDTO=slut(end) convention confirmed on lpr_vente.yaml's matching pair."
  - id: d_vstdto
    name: d_vstdto
    label: {da: null, en: "Waiting period start date"}
    type: date
    role: date
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST order list: name only, no label."
      type_inferred: true
    reader_note: "Read as the START date under the same SLDTO/STDTO convention as d_vsldto above."

reader_note: >-
  No DST or Sundhedsdatastyrelsen documentation describing this specific
  table's purpose was found, matching lpr_vente.yaml's own thinness.
  t_psyk_pas.yaml covers passive waiting time specifically (delay
  attributable to the patient); this table's c_vstatus is not confirmed to
  distinguish active from passive waiting itself, so check both tables if
  a study needs the full waiting-time picture.
