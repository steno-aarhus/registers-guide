# Cancerregisteret - held by Sundhedsdatastyrelsen, not DST. It does not appear
# in DST's register list at all: a project reaches it through Forskerservice.
#
# Formats and labels come from Sundhedsdatastyrelsen's own documentation, which
# unlike DST's variable lists publishes a Format and Laengde per variable.

id: cancer
name: "Cancerregisteret"
scope: sds
reference_timing: event
description: >-
  One row per incident cancer diagnosis: a person appears once per tumour, not
  once in total. Running since 1943, which makes it one of the longest
  continuous cancer registries in the world.
source_url: https://www.esundhed.dk/Dokumentation/DocumentationExtended?id=23
coverage: {from: 1943, to: 2024}

join_keys: [k_cprnr]

