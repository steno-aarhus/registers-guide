# DODSAASG - cause of death, 2002-2022. Second link in the chain.

id: dodsaasg
name: "Dødsårsagsregister (2002-2022)"
family: null
scope: dst
description: >-
  Cause of death for 2002-2022. Closed. Takes over from DODSAARS and is itself
  replaced by DODSAARSAGER.
source_url: https://www.dst.dk/extranet/ForskningVariabellister/DODSAASG%20-%20D%C3%B8ds%C3%A5rsagsregister.html

update_cadence: none
reference_timing: event
one_row_per: event_from_person
coverage:
  from: 2002
  to: 2022

deprecated: true
superseded_by: [dodsaarsager]
join_keys: [pnr]
relationships:
  - to: bef
    key: pnr
    cardinality: many_to_one

columns:
  - id: pnr
    name: pnr
    label: {da: "Personnummer", en: "Personal identifier"}
    type: character
    role: join_key
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/DODSAASG%20-%20D%C3%B8ds%C3%A5rsagsregister.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list"
      type_inferred: true
