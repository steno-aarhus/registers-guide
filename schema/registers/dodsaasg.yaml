      verified_on: 2026-09-01
      verified_against: "DST variable list (column name only - DST gives no label)"
      type_source: "https://www.esundhed.dk/Dokumentation/DocumentationExtended?id=17, Format Dato, Laengde 8"
    reader_note: >-
      Note the spelling: d_dodsdato here, d_dodsdto in DODSAARS. The two
      registers do not use the same column names.
  - id: c_dodtilgrundl_acme
    name: c_dodtilgrundl_acme
    label: {da: "Tilgrundliggende dødsårsag ifølge ACME", en: "Underlying cause of death (ACME)"}
    type: character
    role: code
    key: true
    origin: dst
    code_system: icd10
    provenance:
      source_url: https://www.esundhed.dk/Dokumentation/DocumentationExtended?id=17
      source_type: esundhed_kodeark
      verified_on: 2026-09-30
      verified_against: "Sundhedsdatastyrelsen's documentation of Doedsaarsagsregisteret (DocumentationExtended?id=17, PDF export), matched to this DST column on name and label"
      type_source: "https://www.esundhed.dk/Dokumentation/DocumentationExtended?id=17, Format Klassificerede koder, Laengde 4"
    reader_note: >-
      The underlying cause, selected by the ACME algorithm. This is
      usually the one an analysis wants, rather than the individual
      certificate lines. The 2002-2004 certificates were coded at the
      Danish Cancer Society with less follow-up of missing certificates
      and no forensic reports, so drug deaths and poisonings are under-
      represented in those years. Since 2013 the ACME tables behind IRIS
      are used.
