# DODSAASG - cause of death, 2002-2022. Second link in the chain.

id: dodsaasg
name: "Dødsårsagsregister (2002-2022)"
family: null
scope: dst
description: >-
  Cause of death for 2002-2022. Closed. Takes over from DODSAARS and is itself
  replaced by DODSAARSAGER.
source_url: https://www.dst.dk/extranet/ForskningVariabellister/DODSAASG%20-%20D%C3%B8ds%C3%A5rsagsregister.html

update_cadence: none
reference_timing: event
coverage:
