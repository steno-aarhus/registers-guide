      source_url: https://www.esundhed.dk/Dokumentation/DocumentationExtended?id=17
      source_type: esundhed_kodeark
      verified_on: 2026-09-30
      verified_against: "Sundhedsdatastyrelsen's documentation of Doedsaarsagsregisteret (DocumentationExtended?id=17, PDF export), matched to this DST column on name and label"
      type_inferred: true
    reader_note: >-
      Incomplete from 2007, when the electronic death certificate was
      introduced: many certificates were still sent on paper, and the part
      with the place of death or finding (page 1) is missing for 20-25
      percent of deaths a year in 2007-2012, except 2009, when it was
      entered by hand (about 3 percent missing). About 10 percent were
      still missing in 2014. Hospices count as nursing homes (so as own
      home) in 2002-2006 and as hospitals from 2007.
