# PSYK_DIAG - LPR2 psychiatric diagnoses.

id: t_psyk_diag
name: "Landspatientregistret psykiatri - diagnoser"
scope: dst
reference_timing: status_period
deprecated: true
superseded_by: [lpr_a_diagnose]
description: >-
  One row per diagnosis on a psychiatric contact. Carries no person identifier:
  join to t_psyk_adm to reach the person.
source_url: https://www.dst.dk/extranet/ForskningVariabellister/PSYK_DIAG%20-%20Landspatientregistret%20psykiatri%20-%20diagnoser.html
coverage: {from: 1995, to: 2019}

join_keys: [recnum]
relationships:
  - to: t_psyk_adm
    key: recnum
    cardinality: many_to_one

columns:
  - id: recnum
    name: recnum
    label: {da: "LPR-identnummer", en: "Contact identifier"}
    type: character
    role: join_key
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/PSYK_DIAG%20-%20Landspatientregistret%20psykiatri%20-%20diagnoser.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list, cross-checked against colnames() on the parquet"
    reader_note: >-
      DST's variable list calls this column RECNUM. Some deliveries rename it:
      in DARTER it arrives as `v_recnum`, while the contact table gets
      `k_recnum`. One key, three names. Check colnames() and rename to recnum.
  - id: c_diag
    name: c_diag
    label: {da: "Diagnosekode", en: "Diagnosis code"}
    type: character
    role: code
    origin: dst
    code_system: icd10
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/PSYK_DIAG%20-%20Landspatientregistret%20psykiatri%20-%20diagnoser.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list, cross-checked against colnames() on the parquet"
  - id: c_diagtype
    name: c_diagtype
    label: {da: "Diagnosetype", en: "Diagnosis type"}
    type: character
    role: code
    origin: dst
    code_system: diagtype
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/PSYK_DIAG%20-%20Landspatientregistret%20psykiatri%20-%20diagnoser.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list, cross-checked against colnames() on the parquet"
  - id: c_tildiag
    name: c_tildiag
    label: {da: "Tillaegsdiagnose", en: "Supplementary diagnosis"}
    type: character
    role: code
    origin: dst
    code_system: icd10
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/PSYK_DIAG%20-%20Landspatientregistret%20psykiatri%20-%20diagnoser.html
