    to_key: dw_ek_kontakt
    cardinality: many_to_one
    provenance:
      source_type: inferred
      verified_on: 2026-09-12
  - to: lpr_a_sghophold
    key: DW_SK_SYGEHUSOPHOLD
    to_key: dw_sk_sygehusophold
    cardinality: many_to_one
    provenance:
      source_type: inferred
      verified_on: 2026-09-12

