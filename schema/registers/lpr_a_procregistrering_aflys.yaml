reader_note: >-
  DST gives no label for any column here, and unlike this batch's other
  five newly-found LPR_A_* tables, no institutional guidance describing
  this specific table's meaning or classification was found: it has no
  visible sibling in Sundhedsdatastyrelsen's LPR3_F guidance, and its
  order-list coverage (2023-2023 only, a single year) suggests it may be a
  recent, LPR_A-specific addition. Column-level notes above are read off
  the column names and cross-referenced against lpr_a_procregistrering.yaml
  where names match exactly, not independently confirmed. Before using
  this table to study cancelled procedures, verify against real data that
  a "cancelled" row here is genuinely absent from lpr_a_procregistrering.
