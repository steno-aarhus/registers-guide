# LPR_A_PROCREGISTRERING_AFLYS - cancelled procedure registrations, the
# same shape as lpr_a_procregistrering but for procedures that were
# registered and then cancelled/withdrawn rather than carried out. Missed
# when lpr_a_procregistrering was first built; found by cross-checking
# DST's full order list (Bestillingsliste.xlsx) against the schema on
# 2026-09-12.
#
# Unlike kontaktlokation/henvisning_tillaeg/betalingsoplysninger/
# forloebsmarkoer/resultater above, this table has NO equivalent described
# in Sundhedsdatastyrelsen's LPR3_F guidance (dated December 2023): its
# coverage in DST's order list is 2023-2023 only (a single-year snapshot),
# suggesting it is a newer, LPR_A-specific addition with no LPR_F sibling
# and no institutional documentation found beyond bare column names.

id: lpr_a_procregistrering_aflys
hide_from_overview: true
name: "LPR_A_PROCREGISTRERING_AFLYS - Landspatientregistret (LPR3) - Aflyste procedureregistreringer"
family: lpr3
scope: dst
reference_timing: event
one_row_per: event_from_person
description: >-
  One row per procedure registration that was cancelled/withdrawn rather
  than carried out, mirroring lpr_a_procregistrering's column structure
  (parent/child procedure codes, timestamps, producing unit). Not a
  subset of lpr_a_procregistrering: a cancelled procedure registration is
  not expected to also appear there.
source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
coverage: {from: 2023, to: 2023}

join_keys: [DW_EK_FORLOEB, DW_EK_KONTAKT]
