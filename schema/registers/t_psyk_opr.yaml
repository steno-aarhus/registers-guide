# PSYK_OPR - the psychiatric counterpart of lpr_opr.yaml: pre-1996
# operations coded under the old (ICD8-era) classification. DST's own
# dedicated page confirms real column labels, matching lpr_opr.yaml's
# somatic ones exactly. Register id uses the t_psyk_ prefix, matching
# t_psyk_adm.yaml/t_psyk_diag.yaml's own established convention. Missed
# when t_psyk_adm/t_psyk_diag were first built; found by cross-checking
# DST's full order list (Bestillingsliste.xlsx) against the schema on
# 2026-09-12.

id: t_psyk_opr
hide_from_overview: true
name: "PSYK_OPR - Landspatientregistret psykiatri - operationer efter ICD8 klassifikationen"
family: lpr2_psychiatric
scope: dst
reference_timing: course
one_row_per: expand_from_parent
description: >-
  One row per psychiatric operation coded under the pre-1996 (ICD8-era)
  classification. Carries no pnr: join to t_psyk_adm on recnum to reach
  the person. Structurally identical to lpr_opr.yaml, its somatic
  counterpart.
source_url: https://www.dst.dk/extranet/ForskningVariabellister/PSYK_OPR%20-%20Landspatientregistret%20psykiatri%20-%20operationer%20efter%20ICD8%20klassifikationen.html
coverage: {from: 1995, to: 1995}

join_keys: [recnum]
relationships:
  - to: t_psyk_adm
    key: recnum
    cardinality: many_to_one

columns:
  - id: recnum
    name: recnum
    label: {da: "LPR-identnummer", en: "Contact identifier"}
    type: character
    role: join_key
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/PSYK_OPR%20-%20Landspatientregistret%20psykiatri%20-%20operationer%20efter%20ICD8%20klassifikationen.html
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST's dedicated page for this register, confirmed by direct fetch on 2026-09-12."
  - id: c_komb
    name: c_komb
    label: {da: "Kombination", en: "Combination code"}
    type: character
    role: code
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/PSYK_OPR%20-%20Landspatientregistret%20psykiatri%20-%20operationer%20efter%20ICD8%20klassifikationen.html
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST's dedicated page: label 'Kombination', confirmed by direct fetch on 2026-09-12."
    reader_note: "Same bare label as lpr_opr.yaml's own c_komb - DST does not define what is being combined."
  - id: c_oafd
    name: c_oafd
    label: {da: "Operationsafdeling", en: "Operating department"}
    type: character
    role: code
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/PSYK_OPR%20-%20Landspatientregistret%20psykiatri%20-%20operationer%20efter%20ICD8%20klassifikationen.html
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST's dedicated page: label 'Operationsafdeling', confirmed by direct fetch on 2026-09-12."
  - id: c_opr
    name: c_opr
    label: {da: "Operationskode", en: "Operation code"}
    type: character
    role: code
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/PSYK_OPR%20-%20Landspatientregistret%20psykiatri%20-%20operationer%20efter%20ICD8%20klassifikationen.html
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST's dedicated page: label 'Operationskode', confirmed by direct fetch on 2026-09-12."
    reader_note: "ICD8-era operation code, not comparable to t_psyk_sksopr.yaml's SKS codes without a crosswalk."
  - id: c_osgh
    name: c_osgh
    label: {da: "Operationssygehus", en: "Operating hospital"}
    type: character
    role: code
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/PSYK_OPR%20-%20Landspatientregistret%20psykiatri%20-%20operationer%20efter%20ICD8%20klassifikationen.html
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST's dedicated page: label 'Operationssygehus', confirmed by direct fetch on 2026-09-12."

reader_note: >-
  DST's page gives this register's coverage year as 2019 only, which
  cannot be right for an "efter ICD8 klassifikationen" (pre-1996) table -
  almost certainly the same order-list snapshot artifact seen throughout
  this PSYK batch. Following lpr_opr.yaml's own confirmed real span, this
  table's genuine content is expected to sit in 1995 (the single year LPR2
  psychiatric data exists before the 1996 Nordic classification switch),
  not 2019 - verify against actual delivered data before relying on either
  year.
