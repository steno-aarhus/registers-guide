# LPR_DIAG - LPR2 diagnoses. Coverage and deprecation inherited from
# families/lpr2_somatic.yaml.

id: lpr_diag
name: "Landspatientregistret - diagnoser"
family: lpr2_somatic
scope: dst
reference_timing: status_period
one_row_per: expand_from_parent
description: >-
  One row per diagnosis on a contact, so a contact can have several. Carries no
  pnr: join to lpr_adm on recnum to reach the person.
source_url: https://www.dst.dk/extranet/ForskningVariabellister/LPR_DIAG%20-%20Landspatientregistret%20-%20diagnoser.html

join_keys: [recnum]
relationships:
  - to: lpr_adm
    key: recnum
    cardinality: many_to_one

columns:
  - id: recnum
    name: recnum
    label: {da: "LPR-identnummer", en: "Contact identifier"}
    type: character
    role: join_key
    coverage: {from: 1977, to: 2019}
    key: true
    origin: dst
    provenance:
      source_url: https://www.esundhed.dk/Dokumentation/DocumentationExtended?id=5
      source_type: esundhed_kodeark
      verified_on: 2026-10-01
      verified_against: "Sundhedsdatastyrelsen's documentation of Landspatientregisteret (DocumentationExtended?id=5), table t_diag, variable v_recnum"
      type_source: "https://www.esundhed.dk/Dokumentation/DocumentationExtended?id=5, Format Lokale Koder, Laengde 0"
    reader_note: >-
      Sundhedsdatastyrelsen states that recnum is unique only within one
      update of the register. A contact can get a new recnum when the
      register is updated, and a recnum can be reused for a different
      contact. Join tables only within the same delivery, and never store
      recnum as a lasting id for a contact.
  - id: c_diag
    name: c_diag
    label: {da: "Diagnosekode", en: "Diagnosis code"}
    type: character
    role: code
    coverage: {from: 1977, to: 2019}
    key: true
    origin: dst
    code_system: icd10_sks
    # Pure digits before 1994, see the icd8 code system.
    previous_code_system: {id: icd8, until: 1993}
    provenance:
      source_url: https://www.esundhed.dk/Dokumentation/DocumentationExtended?id=5
      source_type: esundhed_kodeark
      verified_on: 2026-10-01
      verified_against: "Sundhedsdatastyrelsen's documentation of Landspatientregisteret (DocumentationExtended?id=5), table t_diag, variable c_diag"
      type_source: "https://www.esundhed.dk/Dokumentation/DocumentationExtended?id=5, Format Klassificerede koder, Laengde 10"
    reader_note: >-
      To get the text for a code, use the version of the classification
      valid on the contact's discharge date, because codes can change
      meaning over time. ICD-10 codes in SKS form start with D; ICD-8 codes
      are digits only. Sundhedsdatastyrelsen's own text is inconsistent
      about the changeover year: the t_adm section says every contact ended
      after 31 December 1994 is coded in ICD-10, while the t_diag section
      says the switch was in 1994 and ICD-8 was used before 1994. Telling
      the two apart by the shape of the code (starts with D or not) is safer
      than by year. Referral diagnoses use ICD-10 when the referral date is
      after 31 December 1994.
  - id: c_diagtype
    name: c_diagtype
    label: {da: "Diagnosetype", en: "Diagnosis type"}
    type: character
    role: code
    coverage: {from: 1977, to: 2019}
    key: true
    origin: dst
    code_system: diagtype
    provenance:
      source_url: https://www.esundhed.dk/Dokumentation/DocumentationExtended?id=5
      source_type: esundhed_kodeark
      verified_on: 2026-10-01
      verified_against: "Sundhedsdatastyrelsen's documentation of Landspatientregisteret (DocumentationExtended?id=5), table t_diag, variable c_diagtype"
      type_inferred: true
    reader_note: >-
      Which types exist depends on the year (see the code system), and
      Sundhedsdatastyrelsen adds when they were required. Referral diagnoses
      (H) were voluntary 1995-1998 and only required for some referral
      routes after that. Underlying disease (G) was voluntary 1995-2001,
      recorded only for psychiatric patients in 2002-2003, and then dropped.
      Complication (C) and temporary diagnosis (M) were dropped at the end
      of 2013. A count of H or G codes over time therefore tracks the
      reporting rules as much as the patients.
  - id: c_tildiag
    name: c_tildiag
    label: {da: "Tillægsdiagnose", en: "Supplementary diagnosis"}
    type: character
    role: code
    key: true
    origin: dst
    code_system: icd10_sks
    # Pure digits before 1994, see the icd8 code system.
    previous_code_system: {id: icd8, until: 1993}
    coverage: {from: 1995, to: 2019}
    provenance:
      source_url: https://www.esundhed.dk/Dokumentation/DocumentationExtended?id=5
      source_type: esundhed_kodeark
      verified_on: 2026-10-01
      verified_against: "Sundhedsdatastyrelsen's documentation of Landspatientregisteret (DocumentationExtended?id=5), table t_diag, variable c_tildiag"
      type_inferred: true
    reader_note: >-
      An add-on code to the diagnosis in c_diag on the same row, from 1995.
      Almost any SKS code can be used as an add-on, so it is not necessarily
      a diagnosis.
  - id: c_diagmod
    name: c_diagmod
    label: {da: "Diagnosemodifikation", en: "Diagnosis modification"}
    type: character
    role: code
    code_system: c_diagmod
    origin: dst
    coverage: {from: 1977, to: 1994}
    provenance:
      source_url: https://www.esundhed.dk/Dokumentation/DocumentationExtended?id=5
      source_type: esundhed_kodeark
      verified_on: 2026-10-01
      verified_against: "Sundhedsdatastyrelsen's documentation of Landspatientregisteret (DocumentationExtended?id=5), table t_diag, variable c_diagmod"
      type_inferred: true
    reader_note: >-
      Modifier for the ICD-8 era, for example 'obs. pro.' or 'ej befundet'
      (not found). A diagnosis with such a modifier was suspected and not
      confirmed, so check this column before counting pre-1994 diagnoses as
      cases.
  - id: year
    name: year
    label: {da: null, en: "Register year"}
    type: integer
    role: date
    key: true
    origin: tooling
    added_by: parquet conversion
    provenance:
      source_type: unverified
      verified_on: 2026-09-01
      verified_against: null
    reader_note: >-
      Not a DST variable. It is the partition the yearly deliveries were written
      into, so filtering on it stops the other years being read at all. Use it to
      limit how much is read, not to decide when something happened: for that,
      use the register's own date column.
  - id: leverancedato
    name: leverancedato
    label: {da: null, en: "Delivery date"}
    type: date
    role: date
    origin: dst
    coverage: {from: 1977, to: 2019}
    provenance:
      source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
      source_type: dst_variable_list
      verified_on: 2026-09-02
      verified_against: "DST order list (Bestillingsliste.xlsx): name, Danish label and period"
      type_inferred: true
  - id: version
    name: version
    label: {da: "Version", en: "Version"}
    type: character
    role: code
    origin: dst
    coverage: {from: 1977, to: 2019}
    provenance:
      source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
      source_type: dst_variable_list
      verified_on: 2026-09-02
      verified_against: "DST order list (Bestillingsliste.xlsx): name, Danish label and period"
      type_inferred: true
