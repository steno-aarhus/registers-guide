# LPR_DIAG - LPR2 diagnoses. Coverage and deprecation inherited from
# families/lpr2_somatic.yaml.

id: lpr_diag
name: "Landspatientregistret - diagnoser"
family: lpr2_somatic
scope: dst
reference_timing: status_period
description: >-
  One row per diagnosis on a contact, so a contact can have several. Carries no
  pnr: join to lpr_adm on recnum to reach the person.
source_url: https://www.dst.dk/extranet/ForskningVariabellister/LPR_DIAG%20-%20Landspatientregistret%20-%20diagnoser.html

join_keys: [recnum]
relationships:
  - to: lpr_adm
    key: recnum
    cardinality: many_to_one

columns:
  - id: recnum
    name: recnum
    label: {da: "LPR-identnummer", en: "Contact identifier"}
    type: character
    role: join_key
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/LPR_DIAG%20-%20Landspatientregistret%20-%20diagnoser.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list"
  - id: c_diag
    name: c_diag
    label: {da: "Diagnosekode", en: "Diagnosis code"}
    type: character
    role: code
    key: true
    origin: dst
    code_system: icd10
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/LPR_DIAG%20-%20Landspatientregistret%20-%20diagnoser.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list"
  - id: c_diagtype
    name: c_diagtype
    label: {da: "Diagnosetype", en: "Diagnosis type"}
    type: character
    role: code
    key: true
    origin: dst
    code_system: diagtype
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/LPR_DIAG%20-%20Landspatientregistret%20-%20diagnoser.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list"
  - id: c_tildiag
    name: c_tildiag
    label: {da: "Tillægsdiagnose", en: "Supplementary diagnosis"}
    type: character
    role: code
    key: true
    origin: dst
    code_system: icd10
    coverage: {from: 1995, to: 2019}
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/LPR_DIAG%20-%20Landspatientregistret%20-%20diagnoser.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list"
  - id: c_diagmod
    name: c_diagmod
    label: {da: "Diagnosemodifikation", en: "Diagnosis modification"}
    type: character
    role: code
    origin: dst
    coverage: {from: 1977, to: 1994}
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/LPR_DIAG%20-%20Landspatientregistret%20-%20diagnoser.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list"
  - id: year
    name: year
    label: {da: null, en: "Register year"}
    type: integer
    role: date
    key: true
    origin: tooling
    added_by: parquet conversion
    provenance:
      source_type: server_verified
      verified_on: 2026-09-01
      verified_by: "Sara Schwartz"
      verified_against: "colnames() on the parquet"
    reader_note: >-
      Not a DST variable. It is the partition the yearly deliveries were written
      into, so filtering on it stops the other years being read at all. Use it to
      limit how much is read, not to decide when something happened: for that,
      use the register's own date column.
