# Mirror of mfr_barn_procedurer.yaml for the mother: one row per procedure/
# indication/add-on code attached to a pregnancy or birth contact/course
# element for the mother. Join to mfr_nyfoedte via DW_EK_Foedsel. Two small
# differences from the Barn_ version: no duplicate ProducerendeRegion_Kode
# column, and ProducerendeInstitution_Kode/IndberetningsSystem here include
# home-birth paper-form values explicitly (a mother, unlike a child on this
# table, can have a home-birth-reported procedure).

id: mfr_mor_procedurer
name: "Mor_Procedurer - MFR 2019+ satellite table"
scope: sds
family: mfr2019
reference_timing: event
one_row_per: event_from_person
description: >-
  One row per procedure, indication, or procedure add-on code for the
  mother, tied to a contact or course element from the start of pregnancy
  through 42 days after birth. Structurally the same idea as
  mfr_barn_procedurer, mirroring lpr_a_procregistrering.
source_url: https://sundhedsdatastyrelsen.dk/data-og-registre/nationale-sundhedsregistre/foedselsregisteret
coverage: {from: 2019, to: 2026}

join_keys: [DW_EK_Foedsel]
relationships:
  - to: mfr_nyfoedte
    key: DW_EK_Foedsel
    to_key: DW_EK_Foedsel
    cardinality: many_to_one
  - to: mfr_mor_kontakter
    key: DW_EK_Kontakt
    to_key: DW_EK_Kontakt
    cardinality: many_to_one
  - to: mfr_mor_forloeb
    key: DW_EK_Forloeb
    to_key: DW_EK_Forloeb
    cardinality: many_to_one

