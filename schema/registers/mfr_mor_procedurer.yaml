reader_note: >-
  A procedure attaches EITHER to a contact (AktionsDiagnose/StartDato_Kontakt/
  DW_EK_Kontakt populated) OR directly to a course element: the contact-level
  columns are blank instead. Same trap as mfr_barn_procedurer.yaml.
