# PSYK_PSYKIO - "saerlige psykiatriske oplysninger" (special psychiatric
# information): by the column names, how the patient was admitted from
# (c_indfra), the legal/voluntary basis of admission (c_indvilk), and
# where they were discharged to (c_udtil). DST's own dedicated page
# confirms the register title but gives no per-column labels at all
# ("Ingen label" throughout). Register id uses the t_psyk_ prefix,
# matching t_psyk_adm.yaml/t_psyk_diag.yaml's own established convention.
# Missed when t_psyk_adm/t_psyk_diag were first built; found by
# cross-checking DST's full order list (Bestillingsliste.xlsx) against the
# schema on 2026-09-12.

id: t_psyk_psykio
hide_from_overview: true
name: "PSYK_PSYKIO - Landspatientregistret psykiatri - saerlige psykiatrisk oplysninger"
family: lpr2_psychiatric
scope: dst
reference_timing: course
one_row_per: event_from_person
description: >-
  One row per psychiatric contact recording admission source, the legal
  basis for admission (e.g. voluntary vs. involuntary/committed), and
  discharge destination. Carries no pnr: join to t_psyk_adm on recnum to
  reach the person.
source_url: https://www.dst.dk/extranet/ForskningVariabellister/PSYK_PSYKIO%20-%20Landspatientregistret%20psykiatri%20-%20s%C3%A6rlige%20psykiatrisk%20oplysninger.html
coverage: {from: 1995, to: 2019}

join_keys: [recnum]
relationships:
  - to: t_psyk_adm
    key: recnum
    cardinality: many_to_one

columns:
  - id: recnum
    name: recnum
    label: {da: "LPR-identnummer", en: "Contact identifier"}
    type: character
    role: join_key
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/PSYK_PSYKIO%20-%20Landspatientregistret%20psykiatri%20-%20s%C3%A6rlige%20psykiatrisk%20oplysninger.html
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST's dedicated page for this register, confirmed by direct fetch on 2026-09-12."
  - id: c_indfra
    name: c_indfra
    label: {da: null, en: "Admitted from code"}
    type: character
    role: code
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/PSYK_PSYKIO%20-%20Landspatientregistret%20psykiatri%20-%20s%C3%A6rlige%20psykiatrisk%20oplysninger.html
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST's dedicated page: 'Ingen label', confirmed by direct fetch on 2026-09-12."
      type_inferred: true
    reader_note: "ind fra = admitted from, by the variable name - not confirmed by any DST label."
  - id: c_indvilk
    name: c_indvilk
    label: {da: null, en: "Admission condition/legal basis code"}
    type: character
    role: code
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/PSYK_PSYKIO%20-%20Landspatientregistret%20psykiatri%20-%20s%C3%A6rlige%20psykiatrisk%20oplysninger.html
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST's dedicated page: 'Ingen label', confirmed by direct fetch on 2026-09-12."
      type_inferred: true
    reader_note: >-
      ind vilkaar = admission condition/terms, by the variable name -
      plausibly the voluntary-vs-involuntary (frivillig/tvang) admission
      basis central to Danish psychiatric law, but this is not confirmed
      by any DST label or documentation found. Verify against real data
      and, if needed, the Psychiatric Act (Psykiatriloven) before using
      this column for anything involuntary-commitment related.
  - id: c_udtil
    name: c_udtil
    label: {da: null, en: "Discharged to code"}
    type: character
    role: code
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/PSYK_PSYKIO%20-%20Landspatientregistret%20psykiatri%20-%20s%C3%A6rlige%20psykiatrisk%20oplysninger.html
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST's dedicated page: 'Ingen label', confirmed by direct fetch on 2026-09-12."
      type_inferred: true
    reader_note: "ud til = discharged to, by the variable name - a different concept from t_psyk_udtilsgh.yaml's own hospital/department transfer destination, which is facility-coded rather than category-coded."

reader_note: >-
  DST's own dedicated page confirms this register's title but gives
  "Ingen label" for every column - no institutional definition of any
  code value was found for admission source, admission legal basis, or
  discharge destination. c_indvilk in particular looks like it could carry
  the voluntary/involuntary admission distinction that matters for
  Denmark's Psychiatric Act, but that reading is not confirmed anywhere:
  verify against real data before treating it as such.
