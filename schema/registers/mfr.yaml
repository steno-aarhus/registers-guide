# MFR - Det Medicinske Foedselsregister, as DST delivers it. Sundhedsdatastyrelsen
# owns the register and also publishes it in a different shape, split across
# MFR_MOR_* and MFR_BARN_* tables, so check which version your project has.
#
# DST publishes no data types, so every type here is read off the column name.

id: mfr
name: "Det Medicinske Foedselsregister"
scope: dst
reference_timing: event
description: >-
  One row per birth, carrying both the mother and the child. A mother appears
  once per birth, so the register is keyed on the child rather than the person.
source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
coverage: {from: 1997, to: 2018}

join_keys: [cpr_barn]
relationships:
  - to: bef
    key: pnr
    cardinality: many_to_one

