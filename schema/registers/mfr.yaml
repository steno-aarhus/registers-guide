# MFR - Levendefoedte, one of several datasets DST cuts from the Medicinske
# Foedselsregister. This is the MIDDLE of three eras with three different
# data models: 1973-1996 (paper forms; not a digital MFR table under any
# name, but NOT undocumented either - see below), 1997-2018 (this file,
# DST's wide "Levendefødte" table), and 2019+ (see mfr_nyfoedte.yaml, a full
# restructuring into a main table plus ten LPR3-style satellite tables -
# Barn_Forloeb/Kontakter/Diagnoser/Procedurer/Resultater and the same five
# for Mor, not the "MFR_MOR_*/MFR_BARN_*" split this comment used to guess
# at before the real 2019+ documentation was found on
# sundhedsdatastyrelsen.dk).
#
# Pre-1997 IS available at DST, just not under an "MFR" name: see
# ftbarn.yaml, ftforael.yaml and ftnaevn.yaml (Fertilitet - børn/forælder/
# Nævner), which cover 1973-2023 per DST's register overview. FTBARN
# explicitly incorporates MFR content (weight/length columns documented as
# matching MFR, plus its own MFR_OPLYSNING column). These are demography/
# fertility datasets (parity, birth spacing, fertility-rate denominators),
# not a clinical birth-event table like Nyfoedte.
#
# Checked 2026-09-09: our 91 columns match DST's "Levendefoedte" variable list
# name for name, so that is the DST dataset this file describes, not the whole
# register. Every MARKOER_* column below (accreta, kejsersnit, ruptur, and
# 17 more) is a flag backed by its own separate DST sub-cut, confirmed
# against DST's full 531-register order list (Bestillingsliste.xlsx) on
# 2026-09-12: MFRACCRE, MFRAKMPL, MFRANAES, MFRBLODM, MFRBRIST, MFRCARDI,
# MFRGKMPL, MFRHAEMO, MFRIGANG, MFRINFEK, MFRKJSNT, MFRMEDSG, MFRMISDA,
# MFRNVLAN, MFRRUPTU, MFRSMLIN, MFRULTRA, MFRVESTM and MFRYVEND (19 marker
# sub-cuts, see schema/families/mfr_markers.yaml) plus MFRDFOED
# (stillbirths, a fuller detail table rather than a marker, see
# mfrdfoed.yaml) and MFRHJMFO (home births, see mfrhjmfo.yaml) - all now
# built. The variable list gives only Aar, Variabel and Label, no Format or
# Laengde, and MFR does not appear in esundhed's documentation index (see
# schema/README.md, Types).

id: mfr
name: "MFR - Levendefoedte fra det medicinske foedselsregister"
scope: dst
reference_timing: status_period
one_row_per: event_from_person
description: >-
  One row per live birth, carrying both the mother and the child. A mother
  appears once per birth, so the register is keyed on the child rather than the
  person. DST cuts several other datasets from the same underlying register
  (stillbirths, pregnancy complications, home births and more); this is only
  the live-births one.
source_url: https://www.dst.dk/extranet/ForskningVariabellister/MFR%20-%20Levendef%C3%B8dte%20fra%20det%20medicinske%20f%C3%B8dselsregister.html
coverage: {from: 1997, to: 2018}

# DST marks MFR Luk: it is no longer delivered, and the coverage ends in
# 2018. DST's OWN register overview names no successor, because the
# successor is a Sundhedsdatastyrelsen (Forskerservice) delivery, not a DST
# one - the same pattern as lpr_a_kontakt. mfr_nyfoedte is the closest
# match, not a clean 1:1 replacement: it unifies live births AND stillbirths
# in one table, where this file (Levendefødte) only ever held live births
# (stillbirths were the separate MFRDFOED cut, see comment above).
deprecated: true
superseded_by: mfr_nyfoedte

join_keys: [cpr_barn]
relationships:
  - to: bef
    key: pnr
    cardinality: many_to_one

