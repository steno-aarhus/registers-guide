      nothing recorded. Convert those with na_if(rygerstatus_moder, "") before
      anything else: is.na("") is FALSE. This table starts in 1997, the year
      the nine categories were introduced. In 1991-1996 the Medical Birth
      Register recorded smoking only as smoker or non-smoker (Lindbo et al.
      2022, doi:10.2147/CLEP.S368826), and those years are not in this table.
