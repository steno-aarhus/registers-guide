      verified_on: 2026-09-30
      verified_against: "Sundhedsdatastyrelsen's documentation of Laegemiddelstatistikregisteret (DocumentationExtended?id=14, PDF export), matched to this DST column on name and label"
      type_source: "https://www.esundhed.dk/Dokumentation/DocumentationExtended?id=14, Format Lokale Koder, Laengde 2"
    reader_note: >-
      Sundhedsdatastyrelsen advises against selecting data on this field
      alone, because the types were not always used correctly (in 1994,
      for example, some prescriptions were reported as over-the-counter
      sales).
  - id: etid
    name: etid
    label: {da: "Ekspeditionstidspunkt", en: "Dispensing time"}
    type: numeric
    role: date
    origin: dst
    coverage: {from: 1997, to: 2025}
    provenance:
      source_url: https://www.esundhed.dk/Dokumentation/DocumentationExtended?id=14
      source_type: esundhed_kodeark
      verified_on: 2026-09-30
      verified_against: "Sundhedsdatastyrelsen's documentation of Laegemiddelstatistikregisteret (DocumentationExtended?id=14, PDF export), matched to this DST column on name and label"
      type_source: "https://www.esundhed.dk/Dokumentation/DocumentationExtended?id=14, Format Numerisk, Laengde 4"
    reader_note: >-
      Introduced October 1997. Only from March 2000 was it required to be
      the time the medicine was handed over; before that it is unknown
      which time was reported, and some pharmacies are suspected of still
