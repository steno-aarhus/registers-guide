# LMDB - the prescription register. Bootstrapped from DST's variable list.
# Only the subset the guide references is structured; the full list is larger.

id: lmdb
name: "Lægemiddeldatabasen (prescription register)"
family: null
scope: dst
description: >-
  One row per dispensed prescription, so the same person appears many times.
  Covers prescriptions dispensed at community pharmacies.
source_url: https://www.dst.dk/extranet/ForskningVariabellister/LMDB%20-%20L%C3%A6gemiddeldatabasen.html

update_cadence: annual
reference_timing: event
coverage:
  from: 1995-12
  to: 2025-12

deprecated: false
superseded_by: null
join_keys: [pnr]
relationships: []

columns:
  - id: pnr
    name: pnr
    label: {da: "CPR-nummer", en: "Personal identifier"}
    type: character
    role: join_key
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/LMDB%20-%20L%C3%A6gemiddeldatabasen.html
      source_type: server_verified
      verified_on: 2026-08-31
      verified_by: "Sara Schwartz"
      verified_against: "colnames() on the LMDB parquet"
      guide_page: register-reference.qmd
    reader_note: >-
      DST's variable list calls this `PNR12`. The column read through fastreg is
      `pnr`. Check `colnames()` on your own extract.

  - id: eksd
    name: eksd
    label: {da: "Ekspeditionsdato", en: "Dispensing date"}
    type: date
    role: date
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/LMDB%20-%20L%C3%A6gemiddeldatabasen.html
      source_type: dst_variable_list
      verified_on: 2026-08-31
      verified_against: "DST variable list LMDB"
      guide_page: register-reference.qmd
    reader_note: >-
      The date the prescription was collected at the pharmacy. Not the date it
      was prescribed, and not evidence that the medicine was taken.

  - id: atc
    name: atc
    label: {da: "ATC-kode detaljeret", en: "ATC code, full 7 characters"}
    type: character
    role: code
    origin: dst
    code_system: atc
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/LMDB%20-%20L%C3%A6gemiddeldatabasen.html
      source_type: dst_variable_list
      verified_on: 2026-08-31
      verified_against: "DST variable list LMDB"
      guide_page: 11d_medication.qmd

  - id: atc1
    name: atc1
    label: {da: "ATC-niveau 1", en: "ATC level 1 (1 character)"}
    type: character
    role: code
    origin: dst
    code_system: atc
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/LMDB%20-%20L%C3%A6gemiddeldatabasen.html
      source_type: dst_variable_list
      verified_on: 2026-08-31
      verified_against: "DST variable list LMDB"

  - id: atc2
    name: atc2
    label: {da: "ATC-niveau 2", en: "ATC level 2 (3 characters)"}
    type: character
    role: code
    origin: dst
    code_system: atc
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/LMDB%20-%20L%C3%A6gemiddeldatabasen.html
      source_type: server_verified
      verified_on: 2026-08-31
      verified_by: "Sara Schwartz"
      verified_against: "select(atc, atc1:atc4) on the LMDB parquet - cumulative form confirmed"
      guide_page: 11d_medication.qmd

  - id: atc3
    name: atc3
    label: {da: "ATC-niveau 3", en: "ATC level 3 (4 characters)"}
    type: character
    role: code
    origin: dst
    code_system: atc
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/LMDB%20-%20L%C3%A6gemiddeldatabasen.html
      source_type: server_verified
      verified_on: 2026-08-31
      verified_by: "Sara Schwartz"
      verified_against: "select(atc, atc1:atc4) on the LMDB parquet"

  - id: atc4
    name: atc4
    label: {da: "ATC-niveau 4", en: "ATC level 4 (5 characters)"}
    type: character
    role: code
    origin: dst
    code_system: atc
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/LMDB%20-%20L%C3%A6gemiddeldatabasen.html
      source_type: server_verified
      verified_on: 2026-08-31
      verified_by: "Sara Schwartz"
      verified_against: "select(atc, atc1:atc4) on the LMDB parquet"

  - id: vnr
    name: vnr
    label: {da: "Varenummer", en: "Item number (product key)"}
    type: character
    role: code
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/LMDB%20-%20L%C3%A6gemiddeldatabasen.html
      source_type: dst_variable_list
      verified_on: 2026-08-31
      verified_against: "DST variable list LMDB"
      guide_page: 11d_medication.qmd
    reader_note: >-
      The only reliable way to isolate one specific product. Two brands with the
      same active substance share an ATC code but have different item numbers.

  - id: indo
    name: indo
    label: {da: "Indikationskode", en: "Indication code"}
    type: character
    role: code
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/LMDB%20-%20L%C3%A6gemiddeldatabasen.html
      source_type: dst_variable_list
      verified_on: 2026-08-31
      verified_against: "DST variable list LMDB"
      guide_page: 11d_medication.qmd
    reader_note: >-
      Recorded only when the prescriber picks an indication from the drop-down.
      Typed as free text it is not carried over, so the column is often empty.

  - id: apk
    name: apk
    label: {da: "Antal pakninger", en: "Number of packages"}
    type: numeric
    role: value
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/LMDB%20-%20L%C3%A6gemiddeldatabasen.html
      source_type: dst_variable_list
      verified_on: 2026-08-31
      verified_against: "DST variable list LMDB"

  - id: packsize
    name: packsize
    label: {da: "Numerisk pakningsstørrelse", en: "Package size"}
    type: numeric
    role: value
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/LMDB%20-%20L%C3%A6gemiddeldatabasen.html
      source_type: dst_variable_list
      verified_on: 2026-08-31
      verified_against: "DST variable list LMDB"

  - id: strnum
    name: strnum
    label: {da: "Styrke, numerisk", en: "Strength, numeric"}
    type: numeric
    role: value
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/LMDB%20-%20L%C3%A6gemiddeldatabasen.html
      source_type: dst_variable_list
      verified_on: 2026-08-31
      verified_against: "DST variable list LMDB"

  - id: strunit
    name: strunit
    label: {da: "Enhed til numerisk styrke", en: "Unit for the numeric strength"}
    type: character
    role: value
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/LMDB%20-%20L%C3%A6gemiddeldatabasen.html
      source_type: dst_variable_list
      verified_on: 2026-08-31
      verified_against: "DST variable list LMDB"

  - id: aldr
    name: aldr
    label: {da: "Alder på udleveringstidspunkt", en: "Age at dispensing"}
    type: integer
    role: value
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/LMDB%20-%20L%C3%A6gemiddeldatabasen.html
      source_type: dst_variable_list
      verified_on: 2026-08-31
      verified_against: "DST variable list LMDB"

  - id: year
    name: year
    label: {da: null, en: "Dispensing year"}
    type: integer
    role: date
    provenance:
      source_type: guide_prose
      guide_page: register-reference.qmd
      verified_on: 2026-08-31
      verified_against: null
    reader_note: >-
      Not confirmed against DST's variable list. The LMDB parquet is partitioned
      by year, so this is very likely the partition column rather than a DST
      variable - the same situation as `aar` in BEF, which was confirmed to come
      from fastreg. Treat it as such until checked.
