      verified_against: "Sundhedsdatastyrelsen's documentation of Laegemiddelstatistikregisteret (DocumentationExtended?id=14, PDF export), matched to this DST column on name and label"
      type_source: "https://www.esundhed.dk/Dokumentation/DocumentationExtended?id=14, Format Numerisk, Laengde 3"
    reader_note: >-
      In 1994-1995 a few ages look like ranges (for example 0-3): a future
      CPR number was reported, giving a negative age, and those rows
      should be ignored. Where bald is filled, this is the parent's age,
      not the child's.
  - id: year
    name: year
    label: {da: null, en: "Dispensing year"}
    type: integer
