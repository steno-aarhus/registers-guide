# LMDB - the prescription register. Bootstrapped from DST's variable list.
# Only the subset the guide references is structured; the full list is larger.

id: lmdb
name: "Lægemiddeldatabasen (prescription register)"
family: null
scope: dst
description: >-
  One row per dispensed prescription, so the same person appears many times.
  Covers prescriptions dispensed at community pharmacies.
source_url: https://www.dst.dk/extranet/ForskningVariabellister/LMDB%20-%20L%C3%A6gemiddeldatabasen.html

update_cadence: annual
reference_timing: event
one_row_per: event_from_person
coverage:
  from: 1995-12
  to: 2025-12

deprecated: false
superseded_by: null
join_keys: [pnr]
relationships:
  - to: bef
    key: pnr
    cardinality: many_to_one

columns:
  - id: pnr
    name: pnr
    label: {da: "CPR-nummer", en: "Personal identifier"}
    type: character
    role: join_key
    key: true
    origin: dst
    coverage: {from: 1995-Q2, to: 2025-Q2}
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/LMDB%20-%20L%C3%A6gemiddeldatabasen.html
      source_type: unverified
      verified_on: 2026-08-31
      verified_against: null
      guide_page: register-reference.qmd
    reader_note: >-
      DST's variable list calls this column `PNR12`. Check whether your variable
      is named `pnr` or `pnr12`. Do not confuse this with the `pnr` documented on
      esundhed's page for this register (DocumentationExtended?id=14): that `pnr`
      is the pharmacy or manufacturer's production-unit number, length 10, not a
      person. Same name, unrelated variable, on the two pages that between them
      cover this register.


      Before 1996, a child's prescriptions were filed under the mother's `pnr`,
      not the child's own - community pharmacies only switched to issuing
      prescriptions under the child's own name from 1996 onward (Pottegård et
      al. 2017, doi:10.1093/ije/dyw213). Filtering this register by a child's
      own `pnr` for exposure before 1996 silently misses those rows: they are
      not absent, they are attributed to a different person entirely.

  - id: eksd
    name: eksd
    label: {da: "Ekspeditionsdato", en: "Dispensing date"}
    type: date
    role: date
    key: true
    origin: dst
    coverage: {from: 1995-Q2, to: 2025-Q2}
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/LMDB%20-%20L%C3%A6gemiddeldatabasen.html
      source_type: dst_variable_list
      verified_on: 2026-08-31
      verified_against: "DST variable list LMDB"
      type_source: "https://www.esundhed.dk/Dokumentation/DocumentationExtended?id=14, Format Dato, Laengde 4"
      guide_page: register-reference.qmd
    reader_note: >-
      The date the prescription was collected at the pharmacy. Not the date it
      was prescribed, and not evidence that the medicine was taken.

  - id: atc
    name: atc
    label: {da: "ATC-kode detaljeret", en: "ATC code, full 7 characters"}
    type: character
    role: code
    key: true
    origin: dst
    code_system: atc
    coverage: {from: 1995-Q2, to: 2025-Q2}
    provenance:
      source_url: https://www.esundhed.dk/Dokumentation/DocumentationExtended?id=14
      source_type: esundhed_kodeark
      verified_on: 2026-09-30
      verified_against: "Sundhedsdatastyrelsen's documentation of Laegemiddelstatistikregisteret (DocumentationExtended?id=14, PDF export), matched to this DST column on name and label"
      type_source: "https://www.esundhed.dk/Dokumentation/DocumentationExtended?id=14, Format Klassificerede koder, Laengde 8"
      guide_page: medication.qmd
    reader_note: >-
      The newest ATC code for the product is always attached, also to
      earlier years. A count made some years ago can therefore differ from
      a new one if a product's code has changed since.

