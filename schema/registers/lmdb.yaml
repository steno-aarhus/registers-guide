    reader_note: >-
      The price of one package at the time of pricing (tard): the purchase
      price (aip) plus the pharmacy margin plus VAT. It excludes the
      prescription fee, and the margin formula changes regularly.
  - id: bald
    name: bald
    label: {da: null, en: "Child's age (code)"}
    type: character
    role: code
    origin: dst
    coverage: {from: 1995, to: 2011}
    provenance:
      source_url: https://www.esundhed.dk/Dokumentation/DocumentationExtended?id=14
      source_type: esundhed_kodeark
      verified_on: 2026-09-30
      verified_against: "Sundhedsdatastyrelsen's documentation of Laegemiddelstatistikregisteret (DocumentationExtended?id=14, PDF export), matched to this DST column on name and label"
      type_inferred: true
    reader_note: >-
      Used until March 2011 when a medicine for someone under 18 was
      registered on a parent's or a substitute CPR number. When it is
      filled, pnr, sex and age belong to the parent. Children got their
      own health insurance card from 1 January 1996, but the change was
      only nearly complete by summer 1996, so before that children's use
      is undercounted and young women's (usually the mother's)
      overcounted.
