  - id: ejs
    name: ejs
    label: {da: "Fravalg af substitution", en: "Substitution opted out"}
    type: character
    role: code
    origin: dst
    coverage: {from: 1997, to: 2025}
    provenance:
      source_url: https://www.esundhed.dk/Dokumentation/DocumentationExtended?id=14
      source_type: esundhed_kodeark
      verified_on: 2026-09-30
      verified_against: "Sundhedsdatastyrelsen's documentation of Laegemiddelstatistikregisteret (DocumentationExtended?id=14, PDF export), matched to this DST column on name and label"
      type_inferred: true
    reader_note: >-
      The substitution rules changed in 1997 (in this register from
      October 1997) and were simplified in June 2001, so the meaning of an
      empty field differs across those dates.
  - id: eksp
    name: eksp
    label: {da: "Ekspeditionspris", en: "Total price of the dispensing"}
    type: numeric
    role: value
    origin: dst
    coverage: {from: 1995, to: 2025}
    provenance:
      source_url: https://www.esundhed.dk/Dokumentation/DocumentationExtended?id=14
      source_type: esundhed_kodeark
      verified_on: 2026-09-30
      verified_against: "Sundhedsdatastyrelsen's documentation of Laegemiddelstatistikregisteret (DocumentationExtended?id=14, PDF export), matched to this DST column on name and label"
      type_source: "https://www.esundhed.dk/Dokumentation/DocumentationExtended?id=14, Format Numerisk, Laengde 8"
    reader_note: >-
      Total price in kroner including VAT; for a prescription at a
      community pharmacy it is (aup + prescription fee) times the number
      of packages. Hospital pharmacies used internal settlement prices
      until 2011 and the last registered purchase price from 2011, so
      hospital data are not comparable across 2011, and turnover from
      community and hospital pharmacies cannot be compared at all.
  - id: ekst
