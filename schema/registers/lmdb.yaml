# LMDB - the prescription register. Bootstrapped from DST's variable list.
# Only the subset the guide references is structured; the full list is larger.

id: lmdb
name: "Lægemiddeldatabasen (prescription register)"
family: null
scope: dst
description: >-
  One row per dispensed prescription, so the same person appears many times.
  Covers prescriptions dispensed at community pharmacies.
source_url: https://www.dst.dk/extranet/ForskningVariabellister/LMDB%20-%20L%C3%A6gemiddeldatabasen.html

update_cadence: annual
reference_timing: event
coverage:
  from: 1995-12
  to: 2025-12

deprecated: false
superseded_by: null
join_keys: [pnr]
relationships: []

columns:
  - id: pnr
    name: pnr
    label: {da: "CPR-nummer", en: "Personal identifier"}
    type: character
    role: join_key
    key: true
    origin: dst
    coverage: {from: 1995-Q2, to: 2025-Q2}
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/LMDB%20-%20L%C3%A6gemiddeldatabasen.html
      source_type: server_verified
      verified_on: 2026-08-31
      verified_against: "a delivered column list - the name after conversion, not necessarily DST's raw name"
      guide_page: register-reference.qmd
    reader_note: >-
      DST's variable list calls this column `PNR12`. Check whether your variable
      is named `pnr` or `pnr12`.

  - id: eksd
    name: eksd
    label: {da: "Ekspeditionsdato", en: "Dispensing date"}
    type: date
    role: date
    key: true
    origin: dst
    coverage: {from: 1995-Q2, to: 2025-Q2}
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/LMDB%20-%20L%C3%A6gemiddeldatabasen.html
      source_type: dst_variable_list
      verified_on: 2026-08-31
      verified_against: "DST variable list LMDB"
      type_source: "https://www.esundhed.dk/Dokumentation/DocumentationExtended?id=14, Format Dato, Laengde 4"
      guide_page: register-reference.qmd
    reader_note: >-
      The date the prescription was collected at the pharmacy. Not the date it
      was prescribed, and not evidence that the medicine was taken.

