      Typed as free text it is not carried over, so the column is often empty.

  - id: apk
    name: apk
    label: {da: "Antal pakninger", en: "Number of packages"}
    type: numeric
    role: value
    key: true
    origin: dst
    coverage: {from: 1995-Q2, to: 2025-Q2}
    provenance:
      source_url: https://www.esundhed.dk/Dokumentation/DocumentationExtended?id=14
      source_type: esundhed_kodeark
      verified_on: 2026-09-30
      verified_against: "Sundhedsdatastyrelsen's documentation of Laegemiddelstatistikregisteret (DocumentationExtended?id=14, PDF export), matched to this DST column on name and label"
      type_source: "https://www.esundhed.dk/Dokumentation/DocumentationExtended?id=14, Format Numerisk, Laengde 8"
    reader_note: >-
      Hospital pharmacies can report decimals, everyone else whole
      numbers. Blank for hospital-pharmacy parenteral service products in
      ATC groups J01 and L01 from 2011. For dose-dispensed medicine (ekst
      DD) units are reported rather than packages, and before 2007 some of
      those units were wrongly read as whole packages.
