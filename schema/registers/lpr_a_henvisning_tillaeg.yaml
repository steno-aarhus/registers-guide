# LPR_A_HENVISNING_TILLAEG - addendum codes to a referral reason
# (henvisningsaarsag), registered on either a contact or a course. Missed
# when lpr_a_kontakt/diagnose/procregistrering were first built; found by
# cross-checking DST's full order list (Bestillingsliste.xlsx) against the
# schema on 2026-09-12.
#
# Sundhedsdatastyrelsen's own LPR3_F guidance describes this concept
# (section 3.10, "Henvisning_tillaeg") - as of that guidance's own writing
# (March 2022), it notes NO contacts had a reported referral reason yet, so
# the table was then entirely empty. Whether that has changed by any given
# project's delivery year is not something this schema can confirm; check
# actual row counts before relying on this table.

id: lpr_a_henvisning_tillaeg
hide_from_overview: true
name: "LPR_A_HENVISNING_TILLAEG - Landspatientregistret (LPR3) - Henvisning_tillaeg"
family: lpr3
scope: dst
reference_timing: event
one_row_per: event_from_person
description: >-
  One row per addendum code to a referral reason (henvisningsaarsag)
  registered on a contact or a course. Reporting a referral reason is
  generally voluntary in LPR3 (regions/municipalities may require it
  locally), so this table can be empty or near-empty depending on delivery
  year. No unique key: a row hangs on the contact or course it was
  registered on.
source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
coverage: {from: 2025, to: 2025}

join_keys: [DW_EK_FORLOEB, DW_EK_KONTAKT]
relationships:
  - to: lpr_a_forloeb
    key: DW_EK_FORLOEB
    to_key: dw_ek_forloeb
    cardinality: many_to_one
    provenance:
      source_type: inferred
      verified_on: 2026-09-12
  - to: lpr_a_kontakt
    key: DW_EK_KONTAKT
    to_key: dw_ek_kontakt
    cardinality: many_to_one
    provenance:
      source_type: inferred
      verified_on: 2026-09-12

columns:
  - id: dw_ek_forloeb
    name: DW_EK_FORLOEB
    label: {da: null, en: "Course identifier"}
    type: character
    role: join_key
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST order list (Bestillingsliste.xlsx): name only, no label. DST's own dedicated pages for sibling LPR_A_* tables explicitly say 'Ingen label' rather than simply omitting one."
      type_inferred: true
  - id: dw_ek_kontakt
    name: DW_EK_KONTAKT
    label: {da: null, en: "Contact identifier"}
    type: character
    role: join_key
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST order list: name only, no label."
      type_inferred: true
    reader_note: >-
      A referral reason can be registered on a course OR a contact
      (Sundhedsdatastyrelsen's LPR3_F guidance, section 3.10): a row here
      may have one of dw_ek_forloeb/dw_ek_kontakt populated and the other
      empty, not necessarily both.
  - id: henv_aarsag_till
    name: HENV_AARSAG_TILL
    label: {da: null, en: "Referral reason addendum code"}
    type: character
    role: code
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST order list: name only, no label."
      type_inferred: true
  - id: henv_aarsag_till_tekst
    name: HENV_AARSAG_TILL_TEKST
    label: {da: null, en: "Referral reason addendum, text"}
    type: character
    role: derived
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST order list: name only, no label."
      type_inferred: true
  - id: lprindberetningssystem
    name: LPRINDBERETNINGSSYSTEM
    label: {da: null, en: "Reporting system"}
    type: character
    role: code
    origin: dst
    code_system: lprindberetningssystem
    provenance:
      source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST order list: name only, no label."
      type_inferred: true

reader_note: >-
  Reporting the underlying referral reason at all is voluntary for both
  contacts and courses in LPR3 (Sundhedsdatastyrelsen's LPR3_F guidance,
  section 3.10), and as of that guidance's writing in March 2022 the
  guidance's own equivalent table had zero rows: no referral reasons had
  been reported anywhere yet. This addendum-code table can only ever be as
  populated as that voluntary base field is. That guidance documents
  LPR3_F's "henvisning_tillaeg" table specifically, a related but not
  confirmed-identical sibling of this LPR_A_* register.
