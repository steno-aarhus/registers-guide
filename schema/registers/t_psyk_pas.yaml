# PSYK_PAS - the psychiatric counterpart of lpr_pas.yaml: passive waiting
# time. DST's own dedicated page title confirms the concept ("oplysninger
# om passiv ventetid") but gives no per-column labels. Register id uses
# the t_psyk_ prefix, matching t_psyk_adm.yaml/t_psyk_diag.yaml's own
# established convention. Missed when t_psyk_adm/t_psyk_diag were first
# built; found by cross-checking DST's full order list
# (Bestillingsliste.xlsx) against the schema on 2026-09-12.

id: t_psyk_pas
hide_from_overview: true
name: "PSYK_PAS - Landspatientregistret psykiatri - oplysninger om passiv ventetid"
family: lpr2_psychiatric
scope: dst
reference_timing: course
one_row_per: expand_from_parent
description: >-
  One row per period of passive waiting time for a psychiatric contact,
  with a reason, its start/end dates, and which department/hospital the
  patient returned to when active treatment resumed. Carries no pnr: join
  to t_psyk_adm on recnum to reach the person. Structurally identical to
  lpr_pas.yaml, its somatic counterpart.
source_url: https://www.dst.dk/extranet/ForskningVariabellister/Datasaetlister/PSYK_PAS%20-%20Landspatientregistret%20psykiatri%20-%20oplysninger%20om%20passiv%20ventetid.html
coverage: {from: 1999, to: 2019}

join_keys: [recnum]
relationships:
  - to: t_psyk_adm
    key: recnum
    cardinality: many_to_one

columns:
  - id: recnum
    name: recnum
    label: {da: "LPR-identnummer", en: "Contact identifier"}
    type: character
    role: join_key
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/Datasaetlister/PSYK_PAS%20-%20Landspatientregistret%20psykiatri%20-%20oplysninger%20om%20passiv%20ventetid.html
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST's dedicated page for this register confirms the register-level title but gives no per-column labels; confirmed by direct fetch on 2026-09-12."
      type_inferred: true
  - id: c_passarsag
    name: c_passarsag
    label: {da: null, en: "Passive waiting time reason code"}
    type: character
    role: code
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST order list: name only, no label. Concept confirmed via the register-level title of DST's dedicated page for this table."
      type_inferred: true
  - id: d_passldto
    name: d_passldto
    label: {da: null, en: "Passive waiting time end date"}
    type: date
    role: date
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST order list: name only, no label."
      type_inferred: true
    reader_note: "Read as the END date, following the SLDTO=slut(end) convention confirmed on lpr_vente.yaml's/lpr_pas.yaml's matching column pairs."
  - id: d_passtdto
    name: d_passtdto
    label: {da: null, en: "Passive waiting time start date"}
    type: date
    role: date
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST order list: name only, no label."
      type_inferred: true
    reader_note: "Read as the START date under the same SLDTO/STDTO convention as d_passldto above."
  - id: c_tilbafd
    name: c_tilbafd
    label: {da: null, en: "Return department code"}
    type: character
    role: code
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST order list: name only, no label."
      type_inferred: true
  - id: c_tilbsgh
    name: c_tilbsgh
    label: {da: null, en: "Return hospital code"}
    type: character
    role: code
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST order list: name only, no label."
      type_inferred: true
  - id: d_tilbdto
    name: d_tilbdto
    label: {da: null, en: "Return date"}
    type: date
    role: date
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST order list: name only, no label."
      type_inferred: true

reader_note: >-
  DST's own page reports 15,041 observations across 9 variables for this
  table (fetched 2026-09-12) but does not give per-column labels or
  code-value definitions - the concept (passive waiting time, i.e. delay
  attributable to the patient rather than the hospital) is confirmed only
  at the register-title level. Do not add this table's periods to
  t_psyk_vente.yaml's general waiting-time data without checking whether
  the two are meant to be summed or are mutually exclusive measures.
