  - id: speciale
    name: speciale
    label:
      da: "Hentes fra SOR Speciale fra AnsvarligEnhed fra LPR-kontakten, hvis DRGkontakten er konstrueret anvendes speciale fra producent fra proceduren."
      en: "Specialty of the responsible unit (from SOR)"
    type: character
    role: code
    key: true
    origin: dst
    coverage: {from: 2021, to: 2025}
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/DRG_KONTAKTER%20-%20Landspatientregistret%20(LPR3)%20takster%20%E2%80%93%20DRG%20kontakter.html
      source_type: dst_variable_list
      verified_on: 2026-11-23
      verified_against: "DST variable list DRG_KONTAKTER: label and years. Meaning also checked against SDS, DRG-grupperet LPR3-data - Takstsystem 2025 - Dokumentation v1.0, Table 20."
      type_inferred: true
      guide_page: register-reference.qmd
    reader_note: >-
      SDS's documentation says the DRG-grouped data hold only somatic activity
      ("Kun somatisk aktivitet", section 3.4.1.2), where psychiatric activity
      is defined by the SOR specialty of the responsible unit being
      'psykiatri' or 'børne- og ungdomspsykiatri' (section 3.4.1.1). DST's
      register histories for the closed registers DRGPSYK_HEL and DRGPSYK_AMB
      give a different picture. The entries of 15 Jan 2024 say the registers
      were closed because tariffs for psychiatry are now included "sammen med
      takster for somatikken, i det nye DRG", and name DRG_KONTAKTER and
      DRG_SGHFORLOB as the new registers. The two statements are not
      reconciled here. Check the specialties in your own delivery before
      assuming that psychiatric contacts are present or absent.
