  - id: pris_drg
    name: pris_drg
    label:
      da: "DRG taksten for DRG-kontaktens DRG gruppe, jf. DRG-taksttabel"
      en: "DRG tariff of the contact's DRG group"
    type: numeric
    role: value
    key: true
    origin: dst
    coverage: {from: 2021, to: 2025}
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/DRG_KONTAKTER%20-%20Landspatientregistret%20(LPR3)%20takster%20%E2%80%93%20DRG%20kontakter.html
      source_type: dst_variable_list
      verified_on: 2026-11-23
      verified_against: "DST variable list DRG_KONTAKTER: label and years. Meaning also checked against SDS, DRG-grupperet LPR3-data - Takstsystem 2025 - Dokumentation v1.0, Table 25."
      type_inferred: true
      guide_page: register-reference.qmd
    reader_note: >-
      A contact is grouped and priced on its own, so this is the tariff of the
      contact's own DRG group. The hospital course the contact belongs to is
      grouped again as a whole and carries its own price in DRG_SGHFORLOB.
      SDS's documentation does not describe the course price as the sum of its
      contacts' prices, so adding contact prices and course prices counts the
      same activity twice. Use one level. SDS gives no currency for the price
      columns, and tariffs hold for one calendar year, so prices from
      different tariff-year files are not comparable. The long-stay price is a
      separate column, and `totalpris_drg` is the sum of the two (SDS: "Pris +
      Langliggerpris").
