# DRG_KONTAKTER - DST's DRG-grouped LPR3 data, one of two levels (DRG_KONTAKTER holds contacts,
# DRG_SGHFORLOB hospital courses). Built from DST's variable list for DRG_KONTAKTER
# (150 variables, 2021 to 2025) and Sundhedsdatastyrelsen's documentation
# "DRG-grupperet LPR3-data - Takstsystem 2025 - Dokumentation v1.0", which gives
# the meaning of the many variables whose DST label only says to see SDS.
#
# DST publishes no data types, so every type here is a reading of the column
# name (type_inferred). Years are tariff years, not activity years: see the
# register-level note and the note on aktivitetsaar.

id: drg_kontakter
name: "DRG_KONTAKTER - Landspatientregistret (LPR3) takster – DRG kontakter"
family: null
scope: dst
description: >-
  One row per DRG contact: an LPR3 contact, or a contact constructed from a
  procedure that has a course element but no contact, grouped into a DRG on
  its own. Each contact belongs to exactly one hospital course in
  DRG_SGHFORLOB, which it points to with drgsghforlob_id. Carries pnr.
source_url: https://www.dst.dk/extranet/ForskningVariabellister/DRG_KONTAKTER%20-%20Landspatientregistret%20(LPR3)%20takster%20%E2%80%93%20DRG%20kontakter.html

update_cadence: annual
reference_timing: status_period
one_row_per: event_from_person
coverage:
  from: 2021
  to: 2025

deprecated: false
superseded_by: null
join_keys: [id, drgsghforlob_id, pnr]

relationships:
  - to: drg_sghforlob
    key: drgsghforlob_id
    to_key: id
    cardinality: many_to_one
    provenance:
      source_type: dst_variable_list
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/DRG_KONTAKTER%20-%20Landspatientregistret%20(LPR3)%20takster%20%E2%80%93%20DRG%20kontakter.html
      verified_on: 2026-11-23
      verified_against: "DST variable list DRG_KONTAKTER: DRGSGHFORLOB_ID is labelled 'Reference til DRG-sygehusforløbstabel ID'. SDS Bilagstabel 2 gives the same reference, and SDS section 6.1.1 says a DRG contact belongs to one and only one hospital course."
      guide_page: register-reference.qmd
  - to: bef
    key: pnr
    to_key: pnr
    cardinality: many_to_one
    provenance:
      source_type: unverified
      verified_on: 2026-11-23
      verified_against: "Both registers name the person key PNR ('Personnummer' in DST's variable list). No DST page states the join to BEF, so this is the usual reading of the person key, not a documented relationship."
      guide_page: register-reference.qmd

reader_note: >-
  The year in the file name is the tariff year. DST: "DRG_KONTAKTER_år, hvor
  'år' angiver det år, som taksterne er baseret på: Takståret". Each yearly
  file holds contacts for that year and the two preceding activity years,
  given by `aktivitetsaar`: tariff system 2021 holds activity years 2019 to
  2021 and tariff system 2022 holds 2020 to 2022 (register history, 14 May
  2024). Stacking the yearly files repeats the same activity, so select by
  `aktivitetsaar` and compare prices only within one tariff year. SDS adds
  that tariffs hold for one calendar year, "men i uddata grupperes typisk
  flere aktivitetsår, så årene kan sammenlignes i samme takstsystem".

  There are two price levels. Contacts are grouped and priced on their own in
  this table, and the hospital courses they form are grouped again in
  DRG_SGHFORLOB with their own price. Use one level and do not add contact
  prices to course prices.

  SDS's documentation says the DRG-grouped data hold only somatic activity
  ("Kun somatisk aktivitet", section 3.4.1.2), where psychiatric activity is
  defined by the SOR specialty of the responsible unit being 'psykiatri' or
  'børne- og ungdomspsykiatri' (section 3.4.1.1). DST's register histories for
  the closed registers DRGPSYK_HEL and DRGPSYK_AMB give a different picture.
  The entries of 15 Jan 2024 say the registers were closed because tariffs for
  psychiatry are now included "sammen med takster for somatikken, i det nye
  DRG", and name DRG_KONTAKTER and DRG_SGHFORLOB as the new registers. The two
  statements are not reconciled here. Check the specialties in your own
  delivery before assuming that psychiatric contacts are present or absent.

  Corrections recorded in DST's register history. SOR codes in the unit
  columns were delivered non-pseudonymised from 22 Jun 2025, which changed
  their format. A new delivery with the original keys replaced 2022 to 2023 on
  31 Oct 2025, and a new delivery with all values of `sygehustype` was made on
  1 Oct 2025. The 2021 file was re-run with the original variable names on 31
  Oct 2025 and with a changed date format on 6 Feb 2026. The register history
  also names the variables `SORENHED` and `SORENHED_HEN`, which the current
  variable list does not contain. If you hold a copy of a file from before
  these dates, it may differ from the current one. DST's dataset list shows
  the 2021 file with 113 variables and 2022 and 2023 with 150, 2024 and 2025
  with 149. SDS's documentation describes tariff system 2025, and other tariff
  systems may differ.

