# SSSY - health insurance register, the newer half of the primary-care series.
# Takes over from SYSI.

id: sssy
name: "Sygesikring (6-cifret)"
scope: dst
reference_timing: event
description: >-
  The continuation of SYSI: fees settled for primary-care activity. Same shape,
  a few different columns. Both registers report 2005, so a study spanning the
  handover has to pick one source for that year or it will double-count.
source_url: https://www.dst.dk/extranet/ForskningVariabellister/SSSY%20-%20Sygesikring%20%286-cifret%29.html
coverage: {from: 2005, to: 2025}

join_keys: [pnr]

columns:
  - id: pnr
    name: pnr
    label: {da: "Personnummer", en: "Personal identifier"}
    type: character
    role: join_key
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/SSSY%20-%20Sygesikring%20%286-cifret%29.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list, cross-checked against colnames() on the parquet"
  - id: ydernr
    name: ydernr
    label: {da: "Ydernummer", en: "Provider number"}
    type: character
    role: identifier
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/SSSY%20-%20Sygesikring%20%286-cifret%29.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list, cross-checked against colnames() on the parquet"
    reader_note: >-
      Identifies the practice, not the person treating you. It changes when a
      practice changes hands, so it does not track a doctor over time.
  - id: speciale
    name: speciale
    label: {da: "6-cifret speciale", en: "Specialty, 6-digit"}
    type: character
    role: code
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/SSSY%20-%20Sygesikring%20%286-cifret%29.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list, cross-checked against colnames() on the parquet"
    reader_note: >-
      The 6-digit specialty code is what distinguishes a GP contact from a
      specialist one. There is no separate contact-type column: the specialty
      is the classification.
  - id: ydtyp
    name: ydtyp
    label: {da: "Ydertype", en: "Provider type"}
    type: character
    role: code
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/SSSY%20-%20Sygesikring%20%286-cifret%29.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list, cross-checked against colnames() on the parquet"
  - id: ydlant
    name: ydlant
    label: {da: "Antal ydelser under specialet", en: "Number of services under the specialty"}
    type: integer
    role: value
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/SSSY%20-%20Sygesikring%20%286-cifret%29.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list, cross-checked against colnames() on the parquet"
    reader_note: >-
      One row can cover several services, so counting rows undercounts
      activity. Sum this column instead.
  - id: ydltid
    name: ydltid
    label: {da: "Tidspunktskode for ydelsen", en: "Service timing code"}
    type: character
    role: code
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/SSSY%20-%20Sygesikring%20%286-cifret%29.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list, cross-checked against colnames() on the parquet"
  - id: ydersamt
    name: ydersamt
    label: {da: "Yders amt", en: "Provider's county"}
    type: character
    role: code
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/SSSY%20-%20Sygesikring%20%286-cifret%29.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list, cross-checked against colnames() on the parquet"
  - id: afrper
    name: afrper
    label: {da: "Afregningsperiode", en: "Settlement period"}
    type: character
    role: date
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/SSSY%20-%20Sygesikring%20%286-cifret%29.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list, cross-checked against colnames() on the parquet"
    reader_note: >-
      A settlement period, not a treatment date. It says when the fee was
      settled, which can fall in a later week or month than the contact.
  - id: bruhon
    name: bruhon
    label: {da: "Bruttohonorar til laege mv.", en: "Gross fee to the provider"}
    type: numeric
    role: value
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/SSSY%20-%20Sygesikring%20%286-cifret%29.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list, cross-checked against colnames() on the parquet"
  - id: honuge
    name: honuge
    label: {da: "Honoraruge", en: "Fee week"}
    type: character
    role: date
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/SSSY%20-%20Sygesikring%20%286-cifret%29.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list, cross-checked against colnames() on the parquet"
  - id: barnmak
    name: barnmak
    label: {da: "Barnemarkering", en: "Child marker"}
    type: character
    role: code
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/SSSY%20-%20Sygesikring%20%286-cifret%29.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list, cross-checked against colnames() on the parquet"
  - id: sikgrup
    name: sikgrup
    label: {da: "Sikringsgruppe", en: "Insurance group"}
    type: character
    role: code
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/SSSY%20-%20Sygesikring%20%286-cifret%29.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list, cross-checked against colnames() on the parquet"
    reader_note: >-
      Group 1 patients are listed with a GP and need a referral to see most
      specialists; group 2 patients may go directly but pay part of the fee.
      The two groups therefore generate different rows for the same need.
  - id: kontakt
    name: kontakt
    label: {da: "Kontakt", en: "Contact"}
    type: character
    role: value
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/SSSY%20-%20Sygesikring%20%286-cifret%29.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list, cross-checked against colnames() on the parquet"
    reader_note: >-
      Not in SYSI. Do not assume a comparable count of contacts before 2005.
  - id: patgrp
    name: patgrp
    label: {da: "Patientgruppe", en: "Patient group"}
    type: character
    role: code
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/SSSY%20-%20Sygesikring%20%286-cifret%29.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list, cross-checked against colnames() on the parquet"
  - id: koenimp
    name: koenimp
    label: {da: "Koen inkl. imputerede", en: "Sex, imputed values included"}
    type: integer
    role: code
    origin: dst
    code_system: koen
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/SSSY%20-%20Sygesikring%20%286-cifret%29.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list, cross-checked against colnames() on the parquet"
    reader_note: >-
      Imputed where the source was missing, so it is not identical to koen in
      BEF. Prefer BEF when you need sex as a study variable.
