# SSSY - health insurance register, the newer half of the primary-care series.
# Takes over from SYSI.

# The same register exists under two naming systems. DST delivers it as SYSI and
# SSSY with the column names below. Sundhedsdatastyrelsen documents its own
# version on esundhed.dk with entirely different names - `c_ynr` for the provider
# number, `v_cpr` for the person, `c_speciale` for the specialty - so their
# published Format and Laengde cannot be carried over to these columns without
# first confirming the mapping. See
# https://www.esundhed.dk/Dokumentation/DocumentationExtended?id=10

id: sssy
name: "Sygesikring (6-cifret)"
scope: dst
reference_timing: status_period
one_row_per: event_from_person
description: >-
  The continuation of SYSI: fees settled for primary-care activity. Same shape,
  a few different columns. Both registers report 2005, so a study spanning the
  handover has to pick one source for that year or it will double-count.
source_url: https://www.dst.dk/extranet/ForskningVariabellister/SSSY%20-%20Sygesikring%20%286-cifret%29.html
coverage: {from: 2005, to: 2025}

join_keys: [pnr]

relationships:
  - to: bef
    key: pnr
    cardinality: many_to_one

columns:
  - id: pnr
    name: pnr
    label: {da: "Personnummer", en: "Personal identifier"}
    type: character
    role: join_key
    coverage: {from: 2005, to: 2025}
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/SSSY%20-%20Sygesikring%20%286-cifret%29.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list"
  - id: ydernr
    name: ydernr
    label: {da: "Ydernummer", en: "Provider number"}
    type: character
    role: identifier
    coverage: {from: 2005, to: 2025}
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/SSSY%20-%20Sygesikring%20%286-cifret%29.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list"
    reader_note: >-
      A provider number, not a person. DST's variable list does not say what
      unit it identifies or whether it is stable when a practice changes hands,
      so do not use it to follow an individual clinician over time without
      checking that first.
  - id: speciale
    name: speciale
    label: {da: "6-cifret speciale", en: "Specialty, 6-digit"}
    type: character
    role: code
    coverage: {from: 2005, to: 2025}
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/da/Statistik/dokumentation/Times/moduldata-for-sociale-forhold--sundhedsvaesen--retsvaesen/speciale
      source_type: dst_documentation
      verified_on: 2026-09-30
      verified_against: "DST's documentation page for SPECIALE and the high-quality variable page (Sygesikring - Ydelser)"
    reader_note: >-
      Two codes in one. The first two digits are the provider's specialty
      (general practice, dentist and so on, the same as spec2); the last four
      are the type of service. DST publishes no value set for the full code:
      the service codes come from the collective agreements, and DST points to
      the historical fee schedules on okportalen.dk. Because the agreements
      change often, the same service can change code over time, so check a
      code's history before comparing years.
  - id: ydtyp
    name: ydtyp
    label: {da: "Ydertype", en: "Provider type"}
    type: character
    role: code
    coverage: {from: 2005, to: 2025}
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/SSSY%20-%20Sygesikring%20%286-cifret%29.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list"
  - id: ydlant
    name: ydlant
    label: {da: "Antal ydelser under specialet", en: "Number of services under the specialty"}
    type: numeric
    role: value
    coverage: {from: 2005, to: 2025}
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/SSSY%20-%20Sygesikring%20%286-cifret%29.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list"
    reader_note: >-
      One row can cover several services, so counting rows undercounts
      activity. Sum this column instead.
  - id: ydltid
    name: ydltid
    label: {da: "Tidspunktskode for ydelsen", en: "Service timing code"}
    type: character
    role: code
    coverage: {from: 2005, to: 2025}
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/SSSY%20-%20Sygesikring%20%286-cifret%29.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list"
  - id: ydersamt
    name: ydersamt
    label: {da: "Yders amt", en: "Provider's county"}
    type: character
    role: code
    coverage: {from: 2005, to: 2025}
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/SSSY%20-%20Sygesikring%20%286-cifret%29.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list"
  - id: afrper
    name: afrper
    label: {da: "Afregningsperiode", en: "Settlement period"}
    type: character
    role: date
    coverage: {from: 2005, to: 2025}
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/SSSY%20-%20Sygesikring%20%286-cifret%29.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list"
    reader_note: >-
      DST labels this "Afregningsperiode", a settlement period rather than a
      treatment date. Nothing in the variable list says how far settlement can
      lag the contact, so check the distribution against honuge before using it
      as a date.
  - id: bruhon
    name: bruhon
    label: {da: "Bruttohonorar til læge mv.", en: "Gross fee to the provider"}
    type: numeric
    role: value
    coverage: {from: 2005, to: 2025}
    origin: dst
    provenance:
      source_url: https://www.dst.dk/da/Statistik/dokumentation/Times/moduldata-for-sociale-forhold--sundhedsvaesen--retsvaesen/bruhon
      source_type: dst_documentation
      verified_on: 2026-09-30
      verified_against: "DST's documentation page for BRUHON"
    reader_note: >-
      The fee the provider received, which is broadly the public health
      insurance subsidy. The patient's own co-payment is NOT included, and
      group 2 patients and several specialties (dentists, for example) pay
      part of the fee themselves, so this is public expenditure, not the total
      cost. In whole kroner from 2005 (SYSI before 2005 is in øre). From 2005
      the general practitioners' basic and practice fees, paid per listed
      patient whether or not the patient attended, are spread over the people
      who did receive GP services. DST reports that this raised the average
      fee by about 10 percent from 2004 to 2005, and that the break cannot be
      removed by cleaning the pre-2005 data.
  - id: honuge
    name: honuge
    label: {da: "Honoraruge", en: "Fee week"}
    type: character
    role: date
    coverage: {from: 2005, to: 2025}
    origin: dst
    provenance:
      source_url: https://www.dst.dk/da/statistik/dokumentation/times/sygesikringsstatistik/honuge
      source_type: dst_documentation
      verified_on: 2026-09-30
      verified_against: "DST's documentation page for HONUGE"
    reader_note: >-
      The week the provider invoiced the region (before 2007, the county) for
      the service. It is a billing week, not the date of the contact.
  - id: barnmak
    name: barnmak
    label: {da: "Barnemarkering", en: "Child marker"}
    type: character
    role: code
    coverage: {from: 2005, to: 2025}
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/SSSY%20-%20Sygesikring%20%286-cifret%29.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list"
  - id: sikgrup
    name: sikgrup
    label: {da: "Sygesikringsgruppe", en: "Insurance group"}
    type: character
    role: code
    coverage: {from: 2005, to: 2025}
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/SSSY%20-%20Sygesikring%20%286-cifret%29.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list"
    reader_note: >-
      Group 1 patients need a referral from their GP to see a specialist,
      physiotherapist, chiropodist or psychologist, and pay nothing. Group 2
      patients may go directly to any GP or specialist, but pay the difference
      between the fee and the regional subsidy themselves. The two groups
      therefore leave different traces for the same clinical need, so group
      membership is a confounder in any analysis of specialist use. Source:
      borger.dk, "Sygesikring og sikringsgrupper".
  - id: kontakt
    name: kontakt
    label: {da: "Kontakt", en: "Contact"}
    type: numeric
    role: value
    coverage: {from: 2005, to: 2025}
    origin: dst
    provenance:
      source_url: https://www.dst.dk/da/Statistik/dokumentation/Times/moduldata-for-sociale-forhold--sundhedsvaesen--retsvaesen/kontakt
      source_type: dst_documentation
      verified_on: 2026-09-30
      verified_against: "DST's documentation page for KONTAKT"
    reader_note: >-
      0 if the service is not a contact, otherwise equal to ydlant. DST counts
      as contacts the services that involve direct contact between patient and
      provider: consultations (including phone and e-mail), home visits and
      the like. How contacts are defined has changed over time, and for
      physiotherapy and psychology DST calls the count uncertain, so read
      trends with that in mind. Not in SYSI; SYST has a contact count for
      1992-2005, but do not assume it is comparable across the 2005 boundary.
  - id: patgrp
    name: patgrp
    label: {da: "Patientgruppe", en: "Patient group"}
    type: character
    role: code
    coverage: {from: 2005, to: 2025}
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/SSSY%20-%20Sygesikring%20%286-cifret%29.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list"
  - id: koenimp
    name: koenimp
    label: {da: "Koen inkl. imputerede", en: "Sex, imputed values included"}
    type: character
    role: code
    coverage: {from: 2005, to: 2025}
    origin: dst
    code_system: koen
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/SSSY%20-%20Sygesikring%20%286-cifret%29.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list"
    reader_note: >-
      Imputed where the source was missing, so it is not identical to koen in
      BEF. Prefer BEF when you need sex as a study variable.
  - id: year
    name: year
    label: {da: null, en: "Register year"}
    type: integer
    role: date
    key: true
    origin: tooling
    added_by: parquet conversion
    provenance:
      source_type: unverified
      verified_on: 2026-09-01
      verified_against: null
    reader_note: >-
      Not a DST variable. It is the partition the yearly deliveries were written
      into, so filtering on it stops the other years being read at all. Use it to
      limit how much is read, not to decide when something happened: for that,
      use the register's own date column.
  - id: alderimp
    name: alderimp
    label: {da: "Alder ultimo inkl. imputerede", en: null}
    type: numeric
    role: value
    origin: dst
    coverage: {from: 2005, to: 2025}
    provenance:
      source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
      source_type: dst_variable_list
      verified_on: 2026-09-02
      verified_against: "DST order list (Bestillingsliste.xlsx): name, Danish label and period"
      type_inferred: true
  - id: behandlingsdato
    name: behandlingsdato
    label: {da: null, en: null}
    type: date
    role: date
    origin: dst
    coverage: {from: 2021, to: 2025}
    provenance:
      source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
      source_type: dst_variable_list
      verified_on: 2026-09-30
      verified_against: "DST order list and the SSSY variable list: both give 'Ingen label' and no documentation page"
      type_inferred: true
    reader_note: >-
      Only from 2021, and DST publishes neither a label nor a description for
      it. The name suggests a treatment date, but that is a reading of the name.
      Before 2021 the register has no contact date at all, only honuge and
      afrper, which are billing periods.
  - id: cprtjek
    name: cprtjek
    label: {da: "CPR-tjek", en: null}
    type: character
    role: code
    origin: dst
    coverage: {from: 2005, to: 2025}
    provenance:
      source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
      source_type: dst_variable_list
      verified_on: 2026-09-02
      verified_against: "DST order list (Bestillingsliste.xlsx): name, Danish label and period"
  - id: cprtype
    name: cprtype
    label: {da: "CPR-type", en: null}
    type: character
    role: code
    origin: dst
    coverage: {from: 2005, to: 2025}
    provenance:
      source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
      source_type: dst_variable_list
      verified_on: 2026-09-02
      verified_against: "DST order list (Bestillingsliste.xlsx): name, Danish label and period"
  - id: registreringstid
    name: registreringstid
    label: {da: null, en: null}
    type: character
    role: code
    origin: dst
    coverage: {from: 2021, to: 2025}
    provenance:
      source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
      source_type: dst_variable_list
      verified_on: 2026-09-02
      verified_against: "DST order list (Bestillingsliste.xlsx): name, Danish label and period"
      type_inferred: true
  - id: spec2
    name: spec2
    label: {da: "2-cifret speciale", en: "Specialty, 2-digit"}
    type: character
    role: code
    key: true
    origin: dst
    coverage: {from: 2005, to: 2025}
    provenance:
      source_url: https://www.dst.dk/da/Statistik/dokumentation/Times/moduldata-for-sociale-forhold--sundhedsvaesen--retsvaesen/spec2
      source_type: dst_documentation
      verified_on: 2026-09-30
      verified_against: "DST's documentation page for SPEC2, including its value set"
      type_inferred: true
    reader_note: >-
      The first two digits of speciale: the kind of provider (general
      practice, ear-nose-throat specialist, dentist, psychologist, laboratory
      and so on). This is the column to filter on when you want only general
      practice and practising specialists, because the register also covers
      dentists, physiotherapists, chiropractors and others. General practice is
      spread over several codes (daytime, evening and phone consultations have
      codes of their own), so take the list from DST's value set rather than
      picking a single code.
  - id: spec80
    name: spec80
    label: {da: null, en: null}
    type: character
    role: code
    origin: dst
    coverage: {from: 2021, to: 2025}
    provenance:
      source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
      source_type: dst_variable_list
      verified_on: 2026-09-02
      verified_against: "DST order list (Bestillingsliste.xlsx): name, Danish label and period"
      type_inferred: true
  - id: statpop
    name: statpop
    label: {da: null, en: null}
    type: character
    role: code
    origin: dst
    coverage: {from: 2021, to: 2025}
    provenance:
      source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
      source_type: dst_variable_list
      verified_on: 2026-09-02
      verified_against: "DST order list (Bestillingsliste.xlsx): name, Danish label and period"
      type_inferred: true
  - id: version
    name: version
    label: {da: "Version pr. referencetidspunkt for Moduldata", en: null}
    type: numeric
    role: date
    origin: dst
    coverage: {from: 2005, to: 2025}
    provenance:
      source_url: https://www.dst.dk/extranet/forskningvariabellister/Bestillingsliste.xlsx
      source_type: dst_variable_list
      verified_on: 2026-09-02
