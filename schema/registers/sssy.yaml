# SSSY - health insurance register, the newer half of the primary-care series.
# Takes over from SYSI.

# The same register exists under two naming systems. DST delivers it as SYSI and
# SSSY with the column names below. Sundhedsdatastyrelsen documents its own
# version on esundhed.dk with entirely different names - `c_ynr` for the provider
# number, `v_cpr` for the person, `c_speciale` for the specialty - so their
# published Format and Laengde cannot be carried over to these columns without
# first confirming the mapping. See
# https://www.esundhed.dk/Dokumentation/DocumentationExtended?id=10

id: sssy
name: "Sygesikring (6-cifret)"
scope: dst
reference_timing: event
description: >-
  The continuation of SYSI: fees settled for primary-care activity. Same shape,
  a few different columns. Both registers report 2005, so a study spanning the
  handover has to pick one source for that year or it will double-count.
source_url: https://www.dst.dk/extranet/ForskningVariabellister/SSSY%20-%20Sygesikring%20%286-cifret%29.html
coverage: {from: 2005, to: 2025}

join_keys: [pnr]

columns:
  - id: pnr
    name: pnr
    label: {da: "Personnummer", en: "Personal identifier"}
    type: character
    role: join_key
    coverage: {from: 2005, to: 2025}
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/SSSY%20-%20Sygesikring%20%286-cifret%29.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list"
  - id: ydernr
    name: ydernr
    label: {da: "Ydernummer", en: "Provider number"}
    type: character
    role: identifier
    coverage: {from: 2005, to: 2025}
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/SSSY%20-%20Sygesikring%20%286-cifret%29.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list"
    reader_note: >-
      A provider number, not a person. DST's variable list does not say what
      unit it identifies or whether it is stable when a practice changes hands,
      so do not use it to follow an individual clinician over time without
      checking that first.
  - id: speciale
    name: speciale
    label: {da: "6-cifret speciale", en: "Specialty, 6-digit"}
    type: character
    role: code
    coverage: {from: 2005, to: 2025}
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/SSSY%20-%20Sygesikring%20%286-cifret%29.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list"
    reader_note: >-
      The 6-digit specialty code is what distinguishes a GP contact from a
      specialist one. There is no separate contact-type column: the specialty
      is the classification.
  - id: ydtyp
    name: ydtyp
    label: {da: "Ydertype", en: "Provider type"}
    type: character
    role: code
    coverage: {from: 2005, to: 2025}
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/SSSY%20-%20Sygesikring%20%286-cifret%29.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list"
  - id: ydlant
    name: ydlant
    label: {da: "Antal ydelser under specialet", en: "Number of services under the specialty"}
    type: numeric
    role: value
    coverage: {from: 2005, to: 2025}
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/SSSY%20-%20Sygesikring%20%286-cifret%29.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list"
    reader_note: >-
      One row can cover several services, so counting rows undercounts
      activity. Sum this column instead.
  - id: ydltid
    name: ydltid
    label: {da: "Tidspunktskode for ydelsen", en: "Service timing code"}
    type: character
    role: code
    coverage: {from: 2005, to: 2025}
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/SSSY%20-%20Sygesikring%20%286-cifret%29.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list"
  - id: ydersamt
    name: ydersamt
    label: {da: "Yders amt", en: "Provider's county"}
    type: character
    role: code
    coverage: {from: 2005, to: 2025}
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/SSSY%20-%20Sygesikring%20%286-cifret%29.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list"
  - id: afrper
    name: afrper
    label: {da: "Afregningsperiode", en: "Settlement period"}
    type: character
    role: date
    coverage: {from: 2005, to: 2025}
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/SSSY%20-%20Sygesikring%20%286-cifret%29.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list"
    reader_note: >-
      DST labels this "Afregningsperiode", a settlement period rather than a
      treatment date. Nothing in the variable list says how far settlement can
      lag the contact, so check the distribution against honuge before using it
      as a date.
  - id: bruhon
    name: bruhon
    label: {da: "Bruttohonorar til laege mv.", en: "Gross fee to the provider"}
    type: numeric
    role: value
    coverage: {from: 2005, to: 2025}
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/SSSY%20-%20Sygesikring%20%286-cifret%29.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list"
  - id: honuge
    name: honuge
    label: {da: "Honoraruge", en: "Fee week"}
    type: character
    role: date
    coverage: {from: 2005, to: 2025}
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/SSSY%20-%20Sygesikring%20%286-cifret%29.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list"
  - id: barnmak
    name: barnmak
    label: {da: "Barnemarkering", en: "Child marker"}
    type: character
    role: code
    coverage: {from: 2005, to: 2025}
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/SSSY%20-%20Sygesikring%20%286-cifret%29.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list"
  - id: sikgrup
    name: sikgrup
    label: {da: "Sikringsgruppe", en: "Insurance group"}
    type: character
    role: code
    coverage: {from: 2005, to: 2025}
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/SSSY%20-%20Sygesikring%20%286-cifret%29.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list"
    reader_note: >-
      Group 1 patients need a referral from their GP to see a specialist,
      physiotherapist, chiropodist or psychologist, and pay nothing. Group 2
      patients may go directly to any GP or specialist, but pay the difference
      between the fee and the regional subsidy themselves. The two groups
      therefore leave different traces for the same clinical need, so group
      membership is a confounder in any analysis of specialist use. Source:
      borger.dk, "Sygesikring og sikringsgrupper".
  - id: kontakt
    name: kontakt
    label: {da: "Kontakt", en: "Contact"}
    type: numeric
    role: value
    coverage: {from: 2005, to: 2025}
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/SSSY%20-%20Sygesikring%20%286-cifret%29.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list"
    reader_note: >-
      Not in SYSI. Do not assume a comparable count of contacts before 2005.
  - id: patgrp
    name: patgrp
    label: {da: "Patientgruppe", en: "Patient group"}
    type: character
    role: code
    coverage: {from: 2005, to: 2025}
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/SSSY%20-%20Sygesikring%20%286-cifret%29.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list"
  - id: koenimp
    name: koenimp
    label: {da: "Koen inkl. imputerede", en: "Sex, imputed values included"}
    type: character
    role: code
    coverage: {from: 2005, to: 2025}
    origin: dst
    code_system: koen
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/SSSY%20-%20Sygesikring%20%286-cifret%29.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list"
    reader_note: >-
      Imputed where the source was missing, so it is not identical to koen in
      BEF. Prefer BEF when you need sex as a study variable.
  - id: year
    name: year
    label: {da: null, en: "Register year"}
    type: integer
    role: date
    key: true
    origin: tooling
    added_by: parquet conversion
    provenance:
      source_type: unverified
      verified_on: 2026-09-01
      verified_against: null
    reader_note: >-
      Not a DST variable. It is the partition the yearly deliveries were written
      into, so filtering on it stops the other years being read at all. Use it to
      limit how much is read, not to decide when something happened: for that,
      use the register's own date column.
  - id: alderimp
    name: alderimp
    label: {da: "Alder ultimo inkl. imputerede", en: null}
