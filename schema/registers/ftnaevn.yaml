# FTNAEVN - Fertilitet: Nævner ("nævner" = denominator). Third of the three
# "Fertilitet" datasets (with ftbarn, ftforael), 1973-2023. Structurally
# different from the other two: not a birth-event table at all, but a
# person-year panel (one row per person per year) giving exposure time in
# reproductive age - the DENOMINATOR side of a fertility rate, where ftbarn
# supplies the numerator (births). Same status-snapshot shape as bef.yaml,
# annual instead of quarterly.

id: ftnaevn
name: "FTNAEVN - Fertilitet: Nævner"
scope: dst
reference_timing: status
one_row_per: person_reference_date
description: >-
  One row per person per year, 1973-2023, giving that person's exposure
  time and status within reproductive age for that year - the denominator
  used to compute fertility rates (ANDEL: proportion of the year spent in
  fertile age). Not restricted to parents in ftbarn/ftforael: this is a
  broader population-exposure table, not a birth-event table.
source_url: https://www.dst.dk/extranet/ForskningVariabellister/FTNAEVN%20-%20Fertilitet%20-%20N%C3%A6vner.html
coverage: {from: 1973, to: 2023}

deprecated: false
superseded_by: null

join_keys: [PNR, AAR]
relationships:
  - to: bef
    key: PNR
    to_key: pnr
    cardinality: many_to_one
    provenance:
      source_type: inferred
      verified_on: 2026-09-12

columns:
  - id: pnr
    name: PNR
    label: {da: "Personnummer", en: null}
    type: character
    role: join_key
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/FTNAEVN%20-%20Fertilitet%20-%20N%C3%A6vner.html
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST variable list: name and Danish label only, no Format/Laengde."
      type_inferred: true
  - id: aar
    name: AAR
    label: {da: "Register-, eller tællingsår", en: null}
    type: numeric
    role: date
    key: true
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/FTNAEVN%20-%20Fertilitet%20-%20N%C3%A6vner.html
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST variable list."
      type_inferred: true
    reader_note: "Together with PNR this is the row's key: one row per person per year."
  - id: foed_dag
    name: FOED_DAG
    label: {da: "Fødselsdato", en: null}
    type: date
    role: date
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/FTNAEVN%20-%20Fertilitet%20-%20N%C3%A6vner.html
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST variable list."
      type_inferred: true
  - id: koen
    name: KOEN
    label: {da: "Køn", en: null}
    type: character
    role: code
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/FTNAEVN%20-%20Fertilitet%20-%20N%C3%A6vner.html
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST variable list."
      type_inferred: true
    reader_note: >-
      Not confirmed against either `koen` (DST's numeric 1/2/9) or `mfr_koen`
      (SDS's letter K/M/Ukendt) - see ftbarn.yaml's own KOEN column for the
      same unresolved question.
  - id: alder_start
    name: ALDER_START
    label: {da: null, en: null}
    type: numeric
    role: value
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/FTNAEVN%20-%20Fertilitet%20-%20N%C3%A6vner.html
      source_type: dst_variable_list
      verified_on: 2026-09-12
      verified_against: "DST variable list: no Danish label given beyond the variable name itself."
      type_inferred: true
    reader_note: "Age at the start of the reference year, by the variable name."
  - id: alder_slut
    name: ALDER_SLUT
