reader_note: >-
  Same thin-documentation situation as ftbarn.yaml and ftforael.yaml: DST's
  page gives short Danish labels for some columns and none at all for
  others (ALDER_START/SLUT, the ANTAL_BOERN/ANTAL_DAGE pairs, PRIMO_ULTIMO),
  with no value/code definitions anywhere. This register is the denominator
  half of a fertility-rate calculation, not a birth-event table: pairing it
  with ftbarn for numerator/denominator work means matching on PNR and the
  relevant year, not expecting a 1:1 row correspondence.
