# LPR_A_KONTAKT - LPR3 contacts. DST lists 52 columns, all without labels;
# only the subset the guide uses is structured here.

id: lpr_a_kontakt
name: "Landspatientregistret (LPR3) - kontaktoplysninger"
family: lpr3
scope: dst
reference_timing: course
coverage:
  from: 2017
  to: 2025
description: >-
  One row per hospital contact. Carries pnr, so the diagnosis and procedure
  tables reach the person through it. DST gives the coverage as 2017-2025: the
  table reaches back before the March 2019 LPR3 boundary because outpatient
  contacts already held in LPR2 were folded into it.
source_url: https://www.dst.dk/extranet/ForskningVariabellister/LPR_A_KONTAKT%20-%20Landspatientregistret%20%28LPR3%29%20-Kontaktoplysninger%20omkring%20de%20enkelte%20kontakter.html

join_keys: [dw_ek_kontakt]
relationships:
  - to: lpr_a_diagnose
    key: dw_ek_kontakt
    cardinality: one_to_many

columns:
  - id: dw_ek_kontakt
    name: dw_ek_kontakt
    label: {da: null, en: "Contact identifier"}
    type: character
    role: join_key
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/LPR_A_KONTAKT%20-%20Landspatientregistret%20%28LPR3%29%20-Kontaktoplysninger%20omkring%20de%20enkelte%20kontakter.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list (column name only - DST gives no label)"
    reader_note: >-
      The key the diagnosis and procedure tables join on.
  - id: dw_ek_forloeb
    name: dw_ek_forloeb
    label: {da: null, en: "Course identifier"}
    type: character
    role: code
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/LPR_A_KONTAKT%20-%20Landspatientregistret%20%28LPR3%29%20-Kontaktoplysninger%20omkring%20de%20enkelte%20kontakter.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list (column name only - DST gives no label)"
    reader_note: >-
      One level above the contact: a course of treatment can span several
      contacts, so joining on this is not the same as joining on the contact.
  - id: pnr
    name: pnr
    label: {da: null, en: "Personal identifier"}
    type: character
    role: identifier
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/LPR_A_KONTAKT%20-%20Landspatientregistret%20%28LPR3%29%20-Kontaktoplysninger%20omkring%20de%20enkelte%20kontakter.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list (column name only - DST gives no label)"
  - id: kont_starttidspunkt
    name: kont_starttidspunkt
    label: {da: null, en: "Contact start"}
    type: datetime
    role: date
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/LPR_A_KONTAKT%20-%20Landspatientregistret%20%28LPR3%29%20-Kontaktoplysninger%20omkring%20de%20enkelte%20kontakter.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list (column name only - DST gives no label)"
    reader_note: >-
      A datetime, not a date. as.Date() it before comparing with an index date.
  - id: kont_sluttidspunkt
    name: kont_sluttidspunkt
    label: {da: null, en: "Contact end"}
    type: datetime
    role: date
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/LPR_A_KONTAKT%20-%20Landspatientregistret%20%28LPR3%29%20-Kontaktoplysninger%20omkring%20de%20enkelte%20kontakter.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list (column name only - DST gives no label)"
  - id: kont_type
    name: kont_type
    label: {da: null, en: "Contact type"}
    type: character
    role: code
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/LPR_A_KONTAKT%20-%20Landspatientregistret%20%28LPR3%29%20-Kontaktoplysninger%20omkring%20de%20enkelte%20kontakter.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list (column name only - DST gives no label)"
  - id: lprindberetningssystem
    name: lprindberetningssystem
    label: {da: null, en: "Reporting system"}
    type: character
    role: code
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/LPR_A_KONTAKT%20-%20Landspatientregistret%20%28LPR3%29%20-Kontaktoplysninger%20omkring%20de%20enkelte%20kontakter.html
      source_type: dst_variable_list
      verified_on: 2026-09-01
      verified_against: "DST variable list (column name only - DST gives no label)"
    reader_note: >-
      Filter to "LPR3". The table reaches back to 2017, and the outpatient
      contacts from before March 2019 are also in LPR2, so combining the two
      without this filter counts the same contact twice. The column also
      separates the two delivery formats, LPR_F and LPR_A.
