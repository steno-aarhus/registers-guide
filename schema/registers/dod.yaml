# DOD - the death register. Bootstrapped from DST's variable list.

id: dod
name: "Døde i Danmark (deaths in Denmark)"
family: null
scope: dst
description: >-
  One row per deceased person. This is the register to use for date of death,
  and it covers the whole period on its own.
source_url: https://www.dst.dk/extranet/ForskningVariabellister/DOD%20-%20D%C3%B8de%20i%20Danmark.html

update_cadence: annual
reference_timing: event
coverage:
  from: 1970
  to: 2025

deprecated: false
superseded_by: null
join_keys: [pnr]
relationships: []

columns:
  - id: pnr
    name: pnr
    label: {da: "Personnummer", en: "Personal identifier"}
    type: character
    role: join_key
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/DOD%20-%20D%C3%B8de%20i%20Danmark.html
      source_type: dst_variable_list
      verified_on: 2026-08-31
      verified_against: "DST variable list DOD"
      guide_page: register-reference.qmd

  - id: doddato
    name: doddato
    label: {da: "Dato for dødsfald", en: "Date of death"}
    type: date
    role: date
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/DOD%20-%20D%C3%B8de%20i%20Danmark.html
      source_type: dst_variable_list
      verified_on: 2026-08-31
      verified_against: "DST variable list DOD"
      guide_page: register-reference.qmd
    reader_note: >-
      This is the column to censor on. Not `d_dodsdto`, which belongs to
      DODSAARS and stops in 2001.

  - id: alder_haend
    name: alder_haend
    label: {da: "Alder på hændelsestidspunkt", en: "Age at the time of death"}
    type: integer
    role: value
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/DOD%20-%20D%C3%B8de%20i%20Danmark.html
      source_type: dst_variable_list
      verified_on: 2026-08-31
      verified_against: "DST variable list DOD"

  - id: cprtjek
    name: cprtjek
    label: {da: "CPR-tjek", en: "CPR check"}
    type: character
    role: value
    origin: dst
    provenance:
      source_url: https://www.dst.dk/extranet/ForskningVariabellister/DOD%20-%20D%C3%B8de%20i%20Danmark.html
      source_type: dst_variable_list
      verified_on: 2026-08-31
      verified_against: "DST variable list DOD"

  - id: cprtype
