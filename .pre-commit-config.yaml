# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
ci:
  autofix_commit_msg: "chore: ✏️ automatic pre-commit hook fixes"
  autoupdate_commit_msg: "ci: 👷 update pre-commit CI version"

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  # Use the mirror since the main `typos` repo has tags for different
  # sub-packages, which confuses pre-commit when it tries to find the latest
  # version
  - repo: https://github.com/adhtruong/mirrors-typos
    rev: v1.48.0
    hooks:
      - id: typos
        args: [--config, .config/typos.toml, --force-exclude]

  # SLÅET FRA 2026-08-09. panache-cli v3.0.0 ødelægger indhold: den flader
  # punktlister ud, når de står lige før en :::-callout, og escaper
  # link-brackets (\[tekst\](side.qmd)), så linket renderer som rå tekst.
  # Begge dele er tavse i bygningen. v2.61.0 gjorde det ikke.
  # Pin ikke bare tilbage - pre-commit.ci's autoupdate bumper den til v3 igen.
  # Slå den til igen, når fejlen er rettet opstrøms; check-guide.R's
  # husregel-tjek fanger skaden, hvis den skulle slippe ind alligevel.
  # - repo: https://github.com/jolars/panache-pre-commit
  #   rev: v3.0.0
  #   hooks:
  #     - id: panache-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
        args: [--assume-in-merge]
