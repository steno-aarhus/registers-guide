# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
ci:
  autofix_commit_msg: "chore: ✏️ automatic pre-commit hook fixes"
  autoupdate_commit_msg: "ci: 👷 update pre-commit CI version"
  # check-guide kræver R, som ikke findes på pre-commit.ci. Den kører lokalt.
  skip: [check-guide]

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  # Use the mirror since the main `typos` repo has tags for different
  # sub-packages, which confuses pre-commit when it tries to find the latest
  # version
  - repo: https://github.com/adhtruong/mirrors-typos
    rev: v1.48.0
    hooks:
      - id: typos
        args: [--config, .config/typos.toml, --force-exclude]

  # MÅ IKKE AUTOUPDATES. panache-cli 3.3.0 ødelægger indhold: formateringen er
  # ikke idempotent, så anden kørsel trækker en :::-callout ind i den foregående
  # liste, og tredje kørsel flader hele blokken ud til løbende tekst. Den escaper
  # også link-brackets (\[tekst\](side.qmd)), så linket renderer som rå tekst.
  # Begge dele er tavse i bygningen. Bisectet 2026-08-09: 2.61.0, 3.0.0, 3.0.2, 3.1.0
  # og 3.2.0 er rene, 3.3.0 er ødelæggende.
  # Hook-repoet pinner CLI'en eksakt (rev v3.0.2 -> panache-cli==3.0.2), så DENNE
  # rev er sikker. Bumper pre-commit.ci den til v3.3.0, bliver den destruktiv.
  # Sker det, fanger check-guide.R's husregel-tjek skaden - kør `just check-guide
  # style` efter et bump, og rul reven tilbage hertil hvis den fejler.
  - repo: https://github.com/jolars/panache-pre-commit
    rev: v3.0.2
    hooks:
      - id: panache-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
        args: [--assume-in-merge]

  # SIDST med vilje: kører EFTER panache, så den fanger det, hvis formatteren
  # har ødelagt indhold (fladede lister, escapede link-brackets, indrykkede
  # :::-callouts). Tjekker også R-blokke og at interne .qmd-links peger på
  # filer, der findes - ingen af delene fanger Quarto-bygningen.
  # Tager ~2 sekunder. Springes over på pre-commit.ci (ingen R der), se `ci:`.
  - repo: local
    hooks:
      - id: check-guide
        name: check-guide (R-blokke, interne links, husregler)
        entry: Rscript tools/check-guide.R
        language: system
        pass_filenames: false
        files: '\.(qmd|yml)$'
