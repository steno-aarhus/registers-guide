# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
ci:
  autofix_commit_msg: "chore: ✏️ automatic pre-commit hook fixes"
  autoupdate_commit_msg: "ci: 👷 update pre-commit CI version"
  # check-guide kræver R, som ikke findes på pre-commit.ci. Den kører lokalt.
  skip: [check-guide]

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  # Use the mirror since the main `typos` repo has tags for different
  # sub-packages, which confuses pre-commit when it tries to find the latest
  # version
  - repo: https://github.com/adhtruong/mirrors-typos
    rev: v1.49.0
    hooks:
      - id: typos
        args: [--config, .config/typos.toml, --force-exclude]

  # panache-format er FJERNET HERFRA MED VILJE - tilføj den ikke igen.
  #
  # panache-cli 3.3.0 ødelægger indhold: formateringen er ikke idempotent, så
  # anden kørsel trækker en :::-callout ind i den foregående liste, og tredje
  # flader blokken ud til løbende tekst. Den escaper også link-brackets
  # (\[tekst\](side.qmd)), så linket renderer som rå tekst. Begge dele er tavse
  # i bygningen. Bisectet 2026-08-09: 2.61.0 til 3.2.0 er rene, 3.3.0 er ødelæggende.
  #
  # At pinne reven er IKKE nok: pre-commit.ci's autoupdate bumpede den fra
  # v3.0.2 til v3.3.0 den 2026-08-12 og kørte autofix direkte på main (commit
  # 9f09969), som ødelagde 24 sider på det live site uden at bygningen fejlede.
  # Så længe hooken står her, kan det gentage sig.
  #
  # Formatering køres i stedet manuelt og pinnet: `just format-md` (==3.0.2).
  # Sæt den tilbage, når fejlen er rettet opstrøms - se _ignore/TODO.md.

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
        args: [--assume-in-merge]
      # En ødelagt _quarto.yml vælter hele bygningen, og det opdages først i
      # Actions efter et push. Her fanges det på to sekunder.
      - id: check-yaml
      - id: check-toml
      # Standardgrænsen er 500 KB. Største billede i dag er 426 KB, så et nyt
      # skærmbillede over grænsen skal beskæres, ikke vinkes igennem. Gælder
      # kun NYE filer - de eksisterende røres ikke.
      - id: check-added-large-files

  # SIDST med vilje: kører EFTER panache, så den fanger det, hvis formatteren
  # har ødelagt indhold (fladede lister, escapede link-brackets, indrykkede
  # :::-callouts). Tjekker også R-blokke og at interne .qmd-links peger på
  # filer, der findes - ingen af delene fanger Quarto-bygningen.
  # Tager ~2 sekunder. Springes over på pre-commit.ci (ingen R der), se `ci:`.
  - repo: local
    hooks:
      - id: check-guide
        name: check-guide (R-blokke, interne links, husregler)
        entry: Rscript tools/check-guide.R
        language: system
        pass_filenames: false
        files: '\.(qmd|yml)$'
