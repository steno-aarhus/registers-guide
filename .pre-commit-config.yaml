# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
ci:
  # autofix is OFF deliberately. pre-commit.ci may RUN the hooks and report,
  # but it must not modify files and put them in a commit.
  #
  # On 2026-08-11 autoupdate bumped panache to 3.3.0, autofix then ran the new
  # version and committed the result (b2cddb4). 24 pages got escaped link
  # brackets and indented callouts, and it went live without the build failing.
  # Pinning the rev did not help: the rev is exactly what autoupdate changes.
  #
  # With autofix_prs: false the same situation gives a RED pull request that you
  # can simply not merge. Locally the hooks still modify files as before.
  autofix_prs: false
  autoupdate_commit_msg: "ci: 👷 update pre-commit CI version"
  # Weekly version bumps produced one breakage in six weeks. Quarterly is plenty
  # for a repo at this pace, and it makes each bump something you actually read.
  autoupdate_schedule: quarterly
  # check-guide needs R, which pre-commit.ci does not have. It runs locally.
  skip: [check-guide]

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  # Use the mirror since the main `typos` repo has tags for different
  # sub-packages, which confuses pre-commit when it tries to find the latest
  # version
  - repo: https://github.com/adhtruong/mirrors-typos
    rev: v1.49.0
    hooks:
      - id: typos
        args: [--config, .config/typos.toml, --force-exclude]

  # panache-format is REMOVED FROM HERE DELIBERATELY - do not add it back.
  #
  # panache-cli 3.3.0 destroys content: the formatting is not idempotent, so a
  # second run pulls a ::: callout into the preceding list, and a third flattens
  # the block into running text. It also escapes link brackets
  # (\[text\](page.qmd)), so the link renders as raw text. Both are silent in
  # the build. Bisected 2026-08-09: 2.61.0 through 3.2.0 are clean, 3.3.0 is not.
  #
  # Pinning the rev is NOT enough: pre-commit.ci autoupdate bumped it from
  # v3.0.2 to v3.3.0 on 2026-08-12 and ran autofix straight on main (commit
  # 9f09969), damaging 24 live pages without the build failing. As long as the
  # hook is listed here, that can happen again.
  #
  # Formatting is run manually and pinned instead: `just format-md` (==3.0.2).
  # Put it back when the bug is fixed upstream - see _ignore/TODO.md.

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
        args: [--assume-in-merge]
      # A broken _quarto.yml takes down the whole build, and you only find out
      # in Actions after a push. Here it is caught in two seconds.
      - id: check-yaml
      - id: check-toml
      # The default limit is 500 KB. The largest image today is 426 KB, so a new
      # screenshot above the limit should be cropped, not waved through. Applies
      # to NEW files only - existing ones are left alone.
      - id: check-added-large-files

  # LAST deliberately: runs AFTER any formatter, so it catches the case where
  # formatting has destroyed content (flattened lists, escaped link brackets,
  # indented ::: callouts). It also checks R blocks and that internal .qmd links
  # point at files that exist - the Quarto build catches neither.
  # Takes ~2 seconds. Skipped on pre-commit.ci (no R there), see `ci:`.
  - repo: local
    hooks:
      - id: check-guide
        name: check-guide (R blocks, internal links, house rules)
        entry: Rscript tools/check-guide.R
        language: system
        pass_filenames: false
        files: '\.(qmd|yml)$'
